  - id:                 "D-007"
    title:              "jobs table: text+CHECK status, open text kind (migration 020)"
    version_introduced: "0.1.0"
    category:           "enums"
    decision: |
      The `jobs` table lands as db/migrations/020_jobs.sql (016-019 already taken by
      fts/schema-fixes/rbac/schema-version). Status is a closed set enforced with text+CHECK
      (queued|running|succeeded|failed|canceled) — not a PG enum, which is not
      transaction-safe to evolve. `kind` is open text validated by the worker.
    rationale: |
      text+CHECK is transaction-safe to add/drop; the closed status lifecycle will
      never grow, while kinds will (ingest, reannotate, embed, ...).
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["db/migrations/020_jobs.sql"]
    claims:
      - claim_id:    "D-007.k1"
        claim_text:  "db/migrations/020_jobs.sql defines jobs.status as text with a closed CHECK constraint."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-007.k1.c1"
            description: "The jobs migration is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "db/migrations/020_jobs.sql"
            expect:
              present:   true
          - check_id:    "D-007.k1.c2"
