  - id:          "BL-181"
    title:       "surface_word_v1 shared word-boundary phrase profile"
    summary:     "Phrase search and occurrence counts need one versioned, offset-exact definition of words, adjacency, normalization, and overlap semantics."
    description: |
      Implemented by GitHub issue #44 as a pure standard-library domain module.
      `surface_word_v1` segments Unicode letters, digits, and underscore into
      source-addressable words, imports the existing length-preserving confusable
      fold, and returns exact half-open spans into the original text. A
      length-changing case fold falls back to exact-case comparison instead of
      risking a shifted citation.

      OD-1 keeps digits and underscore as word characters so BL-164 terms such as
      `shared_buffers` and `2024` remain addressable. OD-2 treats apostrophe and
      hyphen confusable variants as adjacency-preserving joiners while all other
      punctuation breaks a phrase. OD-3 counts every overlapping start position,
      matching the behavior of the future positional engine. KMP keeps matching
      linear in source words plus pattern words and emitted matches.

      This block defines domain semantics only. GraphQL, MCP, and webapp exposure
      belong to the dependent phrase-search and verified-count blocks (#45/#46).
