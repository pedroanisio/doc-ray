        quantity of another” — blue warmed toward green, red pushed toward orange.
    - box:
      - 68
      - 704
      - 658
      - 128
      style: body
      type: text
      text: 'The system''s power is that it separates three axes the eye tends to
        blur: how light or dark (tone), which colour family (scale), and which direction
        the family leans (hue). A designer who says “make it a deeper tone of the
        same scale” has asked for one change; one who says “make it darker blue” may
        receive three.'
