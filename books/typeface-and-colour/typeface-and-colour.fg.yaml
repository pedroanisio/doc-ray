      - 658
      - 74
      style: h2
      type: text
      text: The garment tints the face
    - box:
      - 68
      - 174
      - 658
      - 60
      style: lead
      type: text
      text: 'The most intimate application: whatever colour is worn near the face
        lends the face its complement.'
    - box:
      - 68
      - 248
      - 64
      - 2
      type: rect
      fill: rubric
    - box:
      - 68
      - 272
      - 658
      - 168
      style: body
      type: text
      text: The mechanism is the law of §2.3 with a human ground. “A delicate green
        is … favourable to all fair complexions which are deficient in rose” — because
        green's complement is rose, and the eye delivers it to the skin. “Yellow imparts
        violet to a fair skin,” and is therefore less kind; violet returns the favour,
        imparting “greenish-yellow”; while “blue imparts orange, which is susceptible
        of allying itself favourably … to the light flesh tints.” Every verdict is
        the same theorem with a different ground.
    - box:
      - 68
      - 480
      - 658
      - 130
      style: body
      type: text
      text: 'Chevreul''s millinery pages run the theorem through bonnets and trimmings
        with the patience of a test suite — and when a colour fails against a complexion,
        his remedy is an interposed neutral: hair, ribbon, or “wreaths or detached
        flowers” to break the juxtaposition. The modern name for that remedy is a
        border, a keyline, a breathing space.'
    - box:
      - 68
      - 630
      - 658
      - 60
      style: body
      type: text
      text: The plate opposite runs the four draperies against two grounds — abstracted
        to swatches, as befits a book and the dignity of readers.
