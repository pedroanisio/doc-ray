    complexity:   "S"
    priority:     "high"
    rationale:    "A process-local session is a failure domain, not useful state, when the application contract is entirely unary and durable state already lives behind GraphQL."
    acceptance_criteria:
      - "Every FastMCP server is constructed with stateless Streamable HTTP enabled."
      - "The SDK request manager dispatches through the stateless path and retains no session map entries."
      - "Live-request bearer resolution remains covered for rotation, anonymous calls, and stdio fallback."
      - "Deployment and public docs state that restarts/replicas need neither sticky routing nor a durable MCP session store."
      - "No claim of event replay or resumable server streams is introduced."
