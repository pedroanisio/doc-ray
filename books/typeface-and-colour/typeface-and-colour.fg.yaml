      type: text
      text: 'This is the safest harmony in the book — a monochrome. Its music is entirely
        rhythm: the intervals between tones. Keep them even (Chevreul specifies “equal
        and sufficiently numerous intervals”) and the scale reads as one calm material;
        skip unevenly and it reads as a mistake in the printing. It is the harmony
        of engravings, of washes, of interfaces in ‘dark mode’ — and its failure mode
        is not ugliness but sleep.'
