        attractions cancel pair by pair. Batchelder honours it — “no difficulty will
        be experienced in finding examples of shape balance in the work of all nations
        and periods” — and then teaches the escape from it, because measure balance
        offers “the same feeling of repose that is found in symmetry” without the
        stiffness.'
