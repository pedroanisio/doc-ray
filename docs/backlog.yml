  - id:          "BL-175"
    title:       "Term-frequency pre-flight treated every multiword phrase as unmeasurable"
    summary:     "A whitespace phrase such as 'design decision' was grouped with structurally unindexable compounds, so agents received unknown instead of useful bounded saturation evidence."
    description: |
      The lexeme rollup cannot provide an exact adjacency count without scanning
      the occurrence fact table or maintaining a phrase rollup. It can still
      provide a safe bound: a phrase cannot occur more often than its rarest
      component. Whitespace-separated phrases now fetch every de-duplicated
      component in the existing single statement and report the minimum count as
      `uses`, with `measurement: component_upper_bound` and all evidence in
      `parts`. Positive component counts leave `attested` null because they do
      not prove adjacency; a zero component proves lexeme-layer absence.

      Exact single lexemes report `measurement: exact`. Non-whitespace compounds
      such as `shared_buffers` and alphanumerics remain `unavailable`, preserving
      BL-164's no-fabricated-zero guarantee. Both GraphQL and MCP expose the
      provenance and direct callers to `full_text_search(mode="phrase")` for
      actual ordered matches.
    category:     "api"
    type:         "feature"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "A conservative upper bound is actionable for search planning, but only if its non-exact provenance and inability to prove adjacency travel with the number."
    acceptance_criteria:
      - "Whitespace phrases are distinguished from non-whitespace compounds using the production tokenizer's offsets."
      - "Phrase components ride the existing single rollup statement; no fact-table aggregate or N-query loop is added."
      - "Phrase uses/share/floodRisk derive from the rarest component and measurement explicitly says component_upper_bound."
      - "Positive phrase attestation stays unknown, zero-component absence is explicit, and notes direct callers to phrase-mode search."
      - "GraphQL, MCP, public references, architecture, changelog, release notes, and discovery measurements match the live contract."
    dependencies: ["BL-174"]
    references:
      - "src/doc_ray/domain/term_frequency.py"
      - "src/doc_ray/adapters/persistence_read_terms.py"
      - "src/doc_ray/entrypoints/api/structure_types.py"
      - "src/doc_ray/entrypoints/mcp/structure.py"
      - "src/doc_ray/tests/test_term_frequency.py"
      - "src/doc_ray/tests/test_term_frequency_db.py"
    owner:        "shared"
