[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-ray"
description = "Document ingestion, decomposition, and annotation pipeline."
requires-python = ">=3.10"
# version is single-sourced from doc_ray.__version__ (see [tool.setuptools.dynamic]);
# dependencies are single-sourced from requirements.txt. Never hard-code either here.
dynamic = ["version", "dependencies"]

# src/ layout: the importable package lives under src/. The frontend (webapp/)
# and standalone tools (scripts/) intentionally stay OUTSIDE src.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "doc_ray.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
# Make the pieces importable without an install:
#   src     -> the doc_ray package
#   .       -> webapp (frontend, kept outside src)
#   scripts -> the standalone text toolkit exercised by the suite
pythonpath = ["src", ".", "scripts", "src/doc_ray/tests"]
# Both suites: the top-level tests/ and the package's own src/doc_ray/tests/ (D-013).
# importlib mode lets the two trees share test-file basenames (e.g. test_sentences.py)
# without a collision; the tests dir on pythonpath keeps the src suite's `import _itdb`.
testpaths = ["tests", "src/doc_ray/tests"]
addopts = "-ra --import-mode=importlib"

# --------------------------------------------------------------------------
# Quality gates (engineering decisions D-011..D-013). .repo/ (vendored skills)
# and engineering/schema/ (vendored bundle) are deliberately out of scope.
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".repo", "engineering/schema", ".venv"]

[tool.ruff.lint]
# D = pydocstyle (full docstrings, D-011); ANN = type annotations; C90 = mccabe.
select = ["E", "F", "I", "UP", "B", "SIM", "D", "ANN", "C90"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests get the standard latitude: no API docstrings/annotations, and line-length
# (E501) + compact multi-statement setup (E702) are allowed in fixtures/assertions.
"**/tests/**" = ["D", "ANN", "E501", "E702"]
"tests/**" = ["D", "ANN", "E501", "E702"]
# Standalone scripts are procedural utilities: no docstrings/annotations and the
# mccabe complexity cap does not apply.
"scripts/**" = ["D", "ANN", "C901"]
# Report/document builders (e.g. the illustrated-companion layout program) are
# procedural utilities like scripts/, with long prose + coordinate literals
# (E501) and quick json open() calls (SIM115) that a context manager would only
# obscure.
"docs/reports/**" = ["D", "ANN", "C901", "E501", "SIM115"]
"webapp/**" = ["ANN"]
# The Engine ABC's `conn` is deliberately opaque: each backend (Postgres today,
# others later) has its own connection type, and Any is the correct contract
# for a parameter no shared code ever calls methods on directly.
"src/doc_ray/application/db_analyzer/engines/base.py" = ["ANN401"]

[tool.mypy]
strict = true
# Target the actual runtime (3.12). numpy>=2 ships PEP 695 `type` statements in its
# stubs; a 3.10 target refuses to parse them and aborts the whole run. 3.10 *source*
# compatibility is guarded independently by ruff (target-version = "py310").
python_version = "3.12"
files = ["src/doc_ray"]
# Strict typing targets the package surface; the test suite is excluded (standard
# practice) and vendored trees are out of scope.
exclude = "(^|/)(\\.repo|engineering/schema|\\.venv|tests)/"

[[tool.mypy.overrides]]
# Third-party libraries without bundled type stubs (incl. optional python-docx).
module = ["psycopg.*", "boto3.*", "botocore.*", "fitz.*", "pypdf.*", "spacy.*",
          "strawberry.*", "docx", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy is pulled in transitively via spaCy but never used directly by the package;
# skip analysing its large stubs.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["doc_ray"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
