    type:         "feature"
    status:       "ready"
    complexity:   "L"
    priority:     "medium"
    rationale:    "Three key-free public providers can resolve an identifier to authoritative bibliographic fields, but the value is only realisable if every field carries its source and disagreements stay visible — an unsourced enriched field is indistinguishable from a hallucination."
    acceptance_criteria:
      - "DOI, ISBN-13 and arXiv identifiers are extracted and validated (ISBN checksums, DOI shape) before any provider is called; an invalid candidate is recorded as rejected and never sent."
      - "Every enriched field carries a corroboration status and provider-level provenance; a value with neither fails manifest schema validation."
      - "Conflicting provider values are recorded as variants, excluded from the proposed filename, and never auto-resolved."
      - "Per-provider limiters are configured at or below published rates, and a second run over the same directory issues zero provider requests."
      - "A provider failure degrades one field set and never fails the file or the run; skipped providers are reported with their reason."
