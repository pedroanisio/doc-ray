# doc-ray — MCP overlay: expose the corpus to agentic AI over Streamable-HTTP MCP.
#
# Adds an `mcp` service (entrypoints/mcp.server:app) that front-ends the GraphQL
# API. It authenticates each caller with the SAME tokens/JWT as the API, then
# forwards that token to /graphql — so every tool result is exactly what the
# caller's principal may read under Postgres RLS. The MCP service holds NO
# database connection and is granted nothing the GraphQL API would not grant.
#
# Run (dev, layer on the base compose — API reached in-network at api:8000):
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml up -d \
#     postgres minio createbucket migrate api mcp
#
# Production (as-built): `make mcp-up`. This overlay declares only the `mcp`
# service, and its `depends_on: api` resolves in the BASE compose — so running
#   docker compose -f docker-compose.mcp.yml up -d
# alone fails with `service "mcp" depends on undefined service "api"`. The make
# target layers base + prod + ollama + this file with --env-file .env.prod, so
# `mcp` reaches the managed-stack API in-network at api:8000/graphql and binds
# loopback :8080. Verify afterwards with `make prod-check` (the `mcp` and
# `mcp_public` probes expect an HTTP 401 auth challenge, never a 200).
#
# Point an MCP client at  https://<host>/mcp  (dev: http://localhost:${MCP_PORT:-8080}/mcp).
# Streamable HTTP is stateless: no sticky routing or durable MCP session store is required.
# with an Authorization: Bearer <token> header (a DOCRAY_API_TOKENS entry or an
# access JWT). Terminate TLS at a reverse proxy before exposing beyond localhost.

services:
  mcp:
    build: .
    container_name: docray-mcp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
      # Front-ends the GraphQL API; no DB/S3 env — the MCP layer owns no pool and
      # reaches the corpus only through /graphql. Default is the in-network dev
      # address; in production set DOCRAY_MCP_API_URL=https://doc-ray.com/graphql.
      DOCRAY_API_URL: ${DOCRAY_MCP_API_URL:-http://api:8000/graphql}
      DOCRAY_MCP_TIMEOUT_SECONDS: ${DOCRAY_MCP_TIMEOUT_SECONDS:-30}
      # Auth mirrors the API so a token minted for /graphql works here verbatim.
      DOCRAY_API_TOKENS: ${DOCRAY_API_TOKENS:-}
      DOCRAY_API_JWT_SECRET: ${DOCRAY_API_JWT_SECRET:-}
      DOCRAY_API_JWT_ISSUER: ${DOCRAY_API_JWT_ISSUER:-doc-ray}
      DOCRAY_API_JWT_AUDIENCE: ${DOCRAY_API_JWT_AUDIENCE:-}
      # External agentic surface: require a token by default even if the API
      # allows anonymous. Set DOCRAY_MCP_ALLOW_ANONYMOUS=true only for local dev.
      DOCRAY_API_ALLOW_ANONYMOUS: ${DOCRAY_MCP_ALLOW_ANONYMOUS:-false}
      # Read-only by default. Set true to also register the reprocessing + curation
      # write tools; the API's write scope + per-document ACL still gate every call.
      DOCRAY_MCP_ENABLE_WRITE: ${DOCRAY_MCP_ENABLE_WRITE:-false}
      # Public host(s) to accept behind the tunnel — else the MCP SDK's
      # localhost-only DNS-rebind guard 421s "Invalid Host header: doc-ray.com".
      # Sourced from DOCRAY_PUBLIC_BASE_URL's host; add extras via DOCRAY_MCP_ALLOWED_HOSTS.
      DOCRAY_PUBLIC_BASE_URL: ${DOCRAY_PUBLIC_BASE_URL:-}
      DOCRAY_MCP_ALLOWED_HOSTS: ${DOCRAY_MCP_ALLOWED_HOSTS:-}
      # Ops Phase 3 (#18): per-principal request throttling (0 disables). In-process
      # per container; with N replicas the effective limit is N×. Never limits the
      # /health or /readyz probes.
      DOCRAY_MCP_RATE_LIMIT_REQUESTS: ${DOCRAY_MCP_RATE_LIMIT_REQUESTS:-120}
      DOCRAY_MCP_RATE_LIMIT_WINDOW_SECONDS: ${DOCRAY_MCP_RATE_LIMIT_WINDOW_SECONDS:-60}
    # Override the image ENTRYPOINT (the `ingest` CLI); `command:` alone would be
    # passed as args to ingest ("unrecognized arguments") instead of running uvicorn.
    entrypoint:
      ["uvicorn", "doc_ray.entrypoints.mcp.server:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${MCP_PORT:-8080}:8080"
    healthcheck:
      # Ops Phase 3 (#18): the unauthenticated /health liveness route — so a green
      # healthcheck means the ASGI app answers, not merely that the TCP port is open.
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
