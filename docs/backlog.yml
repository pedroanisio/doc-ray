  - id:          "BL-145"
    title:        "MCP layer is not self-teaching: no server instructions, no search coverage signal, opaque cursor rejections"
    summary:      "A user summarizing a novel through the MCP server hit a real learning curve: high-frequency search terms flooded one region and starved the rest, which read as MISSING CONTENT rather than a retrieval failure; a search_sentences cursor rejected by read_document_sentences cost a failed call; and the methodology (outline -> ranged read -> rare terms) lived only in the user's head. Fixed by making the server teach the model."
    description: |
      Grounded in Anthropic's "Writing effective tools for AI agents": tool
      descriptions, return shapes, and error messages are load-bearing, and the
      fix for "the agent queried badly" is a tool that steers it. P0 changes:
        - server.SERVER_INSTRUCTIONS, passed to FastMCP, teaching the
          retrieval-not-reading model and the recommended tool order once.
        - search_sentences now returns {hits, coverage, note}: coverage reports
          the hit count and ordinal span; note steers when the cap was reached
          ("a common term can flood one region — narrow it, or read by ordinal
          range"). BREAKING: the tool previously returned a bare list.
        - Any GraphQL error mentioning a cursor now carries a hint that cursors
          are per-tool and not interchangeable, naming from_ordinal/to_ordinal.
        - Thin tool docstrings (full_text_search, get_document, get_collection,
          entity_frequency, image_class_summary) expanded to teach their use.
      Drift protection: test_mcp_p0.py asserts every registered MCP tool carries
      a substantive (>=80 char) description and that every document_id tool
      validates locally before spending a round-trip, so new surface gets the
      same treatment.
    category:     "api"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "The reviewer's own conclusion was that most of the friction was theirs, not the tool's — which is precisely the friction a server can remove. Every item here moves a lesson out of the user's session and into the server's descriptions, where it is paid once. The drift guard keeps it true as the surface grows."
    acceptance_criteria:
      - "The server advertises instructions teaching the retrieval model and tool order."
      - "search_sentences returns a coverage signal and steers when the result may be flooded."
      - "A cursor error carries an actionable hint naming from_ordinal/to_ordinal."
      - "Every registered MCP tool has a substantive description (enforced by a test)."
    dependencies: ["BL-144"]
    references:
      - "src/doc_ray/entrypoints/mcp/server.py"
      - "src/doc_ray/entrypoints/mcp/corpus.py"
      - "src/doc_ray/tests/test_mcp_p0.py"
      - "docs/proposals/mcp-layer-improvements.md"
    owner:        "shared"
    source:       "User write-up of a full-novel summarization via MCP, 2026-07-24, analysed against MCP strategy research (Claude Opus 4.8 (1M context) via Claude Code)."
    tags:         ["api", "mcp", "agent-experience", "retrieval", "feature"]

  - id:          "BL-146"
    title:        "MCP reach and honesty gaps: no document map, raw NER type-splits, no token lever on the bulk readers"
    summary:      "P1 of the MCP improvement proposal. Random access by ordinal existed but nothing told an agent which ordinals to ask for; entity_frequency returned raw NER that splits one entity across types and spellings; and the bulk readers had no way to trade metadata for tokens. Closed with read_document_outline, entity_profiles, and response_format=concise."
    description: |
      Three additions, each grounded in a measurement rather than a guess:
        - read_document_outline / GraphQL documentOutline: addressable ordinal
          ranges from the ATX headings every extractor normalizes into the stored
          text, with `source` distinguishing real headings from the uniform grid
          used where detection found none. Measured: PDF heading detection finds
          723 headings in a technical book, 70 in Princess of Dune, 0 in Dune
          Messiah — an empty answer would fail the documents this exists for.
        - entity_profiles / GraphQL entityProfiles: one row per entity with the
          measured type spread and typeConsistency (dominant type's share of
          mentions — arithmetic, not a model score). Arrakis: 1421 mentions,
          consistency 0.36 across LOC/GPE/PERSON/NORP/ORG; 47 of the top 200
          corpus entities score below 0.9.
        - response_format concise/detailed on read_document_sentences and
          search_sentences. Measured 37% payload reduction (47,314 -> 29,876
          chars on a 200-sentence page); detailed stays the default so no caller
          changes. Citation handles survive in every mode.
      Two defects were found and fixed by verifying against the live corpus rather
      than fixtures: the heading level-trim collapsed Princess of Dune to a single
      entry spanning all 10,063 sentences, and document_outline reported "no
      sentences" for any document whose document_stats rollup had not been
      refreshed yet.
      Drift protection: test_mcp_p1.py fails the build if a tool embedding a
      GraphQL document is not exercised by the schema-contract guard, if a read
      tool is missing from the docs/mcp-service.md inventory, or if a tool
      offering response_format does not validate it. Enabling these immediately
      exposed four shipped visual tools covered by neither guard; both gaps closed.
    category:     "api"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "high"
    rationale:    "BL-145 made the server teach the retrieval model; this gives the agent the reach to act on it. The outline is the missing half of the random-access story, and the entity profiles stop the read surface from presenting contested ML output as settled fact — the reviewer had to reconcile Duncan Idaho by hand because the tool would not."
    acceptance_criteria:
      - "An agent can obtain ordinal ranges for any document and read them without guessing."
      - "The outline declares whether its structure is real or a grid, and never presents a grid as a table of contents."
      - "Entity rows carry the measured type spread and a consistency ratio, and state whether the canonical registry backs them."
      - "The bulk readers offer a measurably smaller payload without losing citation handles."
      - "New MCP surface is held to the schema-contract, documentation, and validation guards by tests."
    dependencies: ["BL-145"]
    references:
      - "src/doc_ray/domain/document_outline.py"
      - "src/doc_ray/domain/entity_profiles.py"
      - "src/doc_ray/adapters/persistence_read_structure.py"
      - "src/doc_ray/entrypoints/api/structure_query.py"
      - "src/doc_ray/entrypoints/mcp/structure.py"
      - "src/doc_ray/tests/test_mcp_p1.py"
      - "docs/proposals/mcp-layer-improvements.md"
    owner:        "shared"
    source:       "P1 of docs/proposals/mcp-layer-improvements.md, implemented test-first and verified against the live corpus (Claude Opus 4.8 (1M context) via Claude Code)."
    tags:         ["api", "mcp", "agent-experience", "retrieval", "ner", "feature"]

  - id:          "BL-147"
    title:        "entity_profiles was dead for every real caller: form_index never granted to docray_client"
    summary:      "BL-146's entity_profiles joins form_index -> canonical to report registry backing. The API and webapp run as docray_api, which inherits docray_client; migration 097 had added canonical to that role's SELECT allowlist but form_index was never added, so every entityProfiles/entity_profiles call raised InsufficientPrivilege in production while the whole test suite stayed green."
    description: |
      Root cause is the recurring one in this codebase: a read path verified as a
      privileged role. The DB integration tests seed and read as the owning role,
      and the live verification during BL-146 ran with `SET ROLE docray_batch`,
      which holds BYPASSRLS — neither exercises docray_client's SELECT allowlist.
      The behavioural tests could not have caught it either: entity_profiles
      returns early when reconcile() yields no profiles, so on an empty fixture
      the form_index query never executes at all.
      Fixed by migration 117 (grant-only, no schema-version change, mirroring
      migration 097's argument for canonical) and by a data-independent invariant
      test that asserts docray_client can SELECT every table the structure read
      path touches. The invariant is the durable part: it fails on the grant
      itself, so it does not depend on fixture data or on which role the test
      happens to run as.
    category:     "api"
    type:         "bug"
    status:       "done"
    complexity:   "XS"
    priority:     "high"
    rationale:    "A read surface that 500s for every real caller while the suite is green is the exact failure class that has bitten this project repeatedly (the jobs policy and the SECURITY DEFINER recursion both reached production the same way). The fix is one grant; the value is the invariant that makes the next one impossible to ship."
    acceptance_criteria:
      - "docray_client can SELECT every table the structure read path reads."
      - "A test asserts the grants directly, independent of fixture data."
      - "entityProfiles returns rows for a normal API caller."
    dependencies: ["BL-146"]
    references:
      - "db/migrations/117_form_index_client_read.sql"
      - "src/doc_ray/tests/test_read_structure_db.py"
      - "src/doc_ray/adapters/persistence_read_structure.py"
    owner:        "shared"
    source:       "Found in production review after BL-146 shipped (GitHub issue #15); fixed with a red-first invariant test (Claude Opus 4.8 (1M context) via Claude Code)."
    tags:         ["api", "rls", "grants", "bug", "mcp"]

  - id:          "BL-148"
    title:        "MCP evaluation harness: measure the tool surface instead of asserting it"
    summary:      "Every prior MCP-layer change claimed to help agents with no measurement (item 4's '37% payload reduction' was a character count of one synthetic page; items 5/6 had their premises falsified by hand, late). A reproducible offline harness now runs grounded retrieval tasks against a seeded, disposable fixture corpus and reports task success, tool-call count, and payload size, so a change to a tool description or return shape can be shown to help or hurt."
    description: |
      Programme-level application of PALS's Law: the outputs consumed here are
      model behaviours, unverified by default. The harness calls the real tool
      callables (corpus/structure/compose) and routes their GraphQL over an
      in-process Strawberry schema (no API server), so the true error-mapping path
      — including the cursor-steering hint — is exercised. Scripted mode is
      deterministic and CI-safe; agentic mode ships as a mode switch that fails
      with a typed EvalModeUnsupported (no model credentials provisioned here).
      Six grounded tasks (each from a real observed failure) plus seven coverage
      tasks exercise all 23 registered read tools; a drift guard fails the build if
      any read tool is exercised by no task. A committed baseline lives at
      docs/eval/mcp-baseline.json; scripts/eval_mcp.py --baseline exits non-zero on
      a regression beyond tolerance. Determinism required pinning fixture
      timestamps and using shard_count=1 for the corpus-map coverage task
      (sharding is hashtext(id) mod N over random per-seed uuids). No schema
      change, no version bump. CI gating is not enabled initially (operator's call).
    category:     "testing"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "Anthropic's 'Writing effective tools for AI agents' closes on tuning surfaces empirically, not by intuition. Without a harness every future change to this surface is unfalsifiable — the defect this closes. It is the ruler the remaining MCP items (8, 9, 10) are judged by, so it lands first of them."
    acceptance_criteria:
      - "scripts/eval_mcp.py --mode scripted runs end to end against the Docker test stack and prints a per-task table plus an aggregate."
      - "--json writes a machine-readable report; --baseline compares and exits non-zero on regression."
      - "All six FR-2 grounded tasks exist and each names the failure it guards; every registered read tool is exercised by at least one task (drift guard)."
      - "The harness seeds and destroys its own fixtures; two independent seed+run cycles produce identical metrics."
      - "A committed baseline exists at docs/eval/mcp-baseline.json, generated by an actual run."
    dependencies: []
    references:
