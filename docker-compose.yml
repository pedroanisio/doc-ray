services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    container_name: docray-postgres
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${POSTGRES_PASSWORD:-}" in
          ""|docray|change-me|change-me-docray)
            echo "Refusing to start Postgres with an unset/default POSTGRES_PASSWORD" >&2
            exit 64
            ;;
        esac
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}
      POSTGRES_DB: ${POSTGRES_DB:-docray}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations run automatically on first init (empty data dir only).
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docray} -d ${POSTGRES_DB:-docray}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: docray-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: create the bucket the ingester writes to.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-documents};
      echo 'bucket ready';
      "

  # On-demand ingester. Build once, then:
  #   docker compose run --rm ingester python -m doc_ray.entrypoints.cli /data/orwell1984.pdf
  ingester:
    profiles: ["ingest"]
    build: .
    container_name: docray-ingester
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src        # ingest package lives under src/ (src layout)
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
    volumes:
      - ./:/app:ro          # source + sample PDFs available under /data via /app
      - ./:/data:ro
    # Inherits the Dockerfile ENTRYPOINT (`python -m doc_ray.entrypoints.cli`).
    # Invoke with:  docker compose run --rm ingester /data/orwell1984.pdf

  # One-shot: apply any un-applied migrations to an existing volume (D-006).
  # Mirrors createbucket's "run to completion, then dependents proceed".
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
    entrypoint: ["python", "-m", "doc_ray.entrypoints.migrate"]

  # GraphQL API (D-001): reads + enqueue/upload mutations. http://localhost:${API_PORT:-8000}/graphql
  # Depends on minio being healthy so the upload path has its object store from the start.
  api:
    build: .
    container_name: docray-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
      DOCRAY_API_POOL_MIN_SIZE: ${DOCRAY_API_POOL_MIN_SIZE:-1}
      DOCRAY_API_POOL_MAX_SIZE: ${DOCRAY_API_POOL_MAX_SIZE:-10}
      DOCRAY_API_POOL_TIMEOUT: ${DOCRAY_API_POOL_TIMEOUT:-10}
      DOCRAY_API_TOKENS: ${DOCRAY_API_TOKENS:-}
      DOCRAY_API_ALLOW_ANONYMOUS: ${DOCRAY_API_ALLOW_ANONYMOUS:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    # /readyz is 503 unless BOTH Postgres and the object store answer, so a
    # misconfigured/unreachable MinIO shows up here as an `unhealthy` container
    # (docker ps / orchestrator) instead of a silent failure at the first upload.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    entrypoint:
      ["uvicorn", "doc_ray.entrypoints.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  # Flask corpus browser (webapp/): the reading UI plus the thin write path
  # (upload, seeding, backups) that it forwards to the api service.
  # http://localhost:${WEBAPP_PORT:-5001} — bound to 127.0.0.1 like postgres:
  # the UI has no login of its own and /backups can restore over the live
  # database, so it must not be reachable from other hosts by default.
  webapp:
    build: .
    container_name: docray-webapp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Started, not healthy: browsing needs only the database; upload/seeding
      # degrade gracefully while the api is still coming up.
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      # In-network endpoint, hard-coded on purpose (not ${DOCRAY_API_URL}): a
      # host-oriented .env value like http://localhost:8000/graphql would
      # dead-end inside the container — the same trap docker-compose.api.yml
      # documents for S3_ENDPOINT.
      DOCRAY_API_URL: http://api:8000/graphql
      DOCRAY_WEBAPP_SECRET_KEY: ${DOCRAY_WEBAPP_SECRET_KEY:-}
      DOCRAY_WEBAPP_API_TOKEN: ${DOCRAY_WEBAPP_API_TOKEN:-}
      DOCRAY_OPERATOR_HEALTH_TOKEN: ${DOCRAY_OPERATOR_HEALTH_TOKEN:-}
      DOCRAY_MAX_UPLOAD_MB: ${DOCRAY_MAX_UPLOAD_MB:-200}
      DOCRAY_WEBAPP_SEARCH_RATE_LIMIT_REQUESTS: ${DOCRAY_WEBAPP_SEARCH_RATE_LIMIT_REQUESTS:-60}
      DOCRAY_WEBAPP_SEARCH_RATE_LIMIT_WINDOW_SECONDS: ${DOCRAY_WEBAPP_SEARCH_RATE_LIMIT_WINDOW_SECONDS:-60}
      DOCRAY_WEBAPP_UPLOAD_RATE_LIMIT_REQUESTS: ${DOCRAY_WEBAPP_UPLOAD_RATE_LIMIT_REQUESTS:-10}
      DOCRAY_WEBAPP_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${DOCRAY_WEBAPP_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-60}
      DOCRAY_DB_ROLE: ${DOCRAY_DB_ROLE:-docray_client}
      DOCRAY_PRINCIPAL_ID: ${DOCRAY_PRINCIPAL_ID:-}
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-5001}:5001"
    # The index page queries Postgres, so this doubles as a DB-reachability
    # probe (same spirit as the api's /readyz check above).
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # `flask run`, NOT `python -m webapp.app`: the module path enables Flask
    # debug mode (Werkzeug debugger = remote code execution if ever exposed).
    entrypoint:
      ["flask", "--app", "webapp.app", "run", "--host", "0.0.0.0", "--port", "5001"]

  # One-shot: bootstrap a self-signed certificate into the shared certs volume
  # so the nginx front door below can start on a fresh checkout (createbucket
  # pattern). Skips itself when certs are already present, so real
  # certificates dropped into the volume are never overwritten.
  nginx-certgen:
    build: .
    volumes:
      - nginxcerts:/certs
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -s /certs/fullchain.pem ] && [ -s /certs/privkey.pem ]; then
          echo "certs present, leaving them untouched"
          exit 0
        fi
        openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
          -keyout /certs/privkey.pem -out /certs/fullchain.pem
        echo "generated self-signed certificate (CN=localhost)"

  # TLS front door: serves the webapp over HTTPS on ${NGINX_HTTPS_PORT:-443}
  # and 301-redirects plain HTTP on ${NGINX_HTTP_PORT:-80}. Binds all
  # interfaces — this is the one intentionally exposed entry point (the webapp
  # itself stays on 127.0.0.1). The webapp still has NO login of its own, so
  # do not expose this beyond a trusted network without adding auth here.
  nginx:
    image: nginx:1.27-alpine
    container_name: docray-nginx
    restart: unless-stopped
    depends_on:
      # Started (not healthy) is required, not merely tolerated: nginx resolves
      # the `webapp` upstream at config-load time and exits if the name is
      # unknown to compose DNS.
      webapp:
        condition: service_started
      nginx-certgen:
        condition: service_completed_successfully
    environment:
      # Substituted into client_max_body_size — keep in lockstep with the
      # webapp/API upload cap so nginx isn't the surprise 413 in the middle.
      NGINX_MAX_BODY: ${DOCRAY_MAX_UPLOAD_MB:-200}m
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - nginxcerts:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Background worker (D-005): claims jobs and runs the blocking work (extract/spaCy).
  # Scale out with: docker compose up --scale worker=3
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-3600}
      DOCRAY_RESOLVER_TIMEOUT_SECONDS: ${DOCRAY_RESOLVER_TIMEOUT_SECONDS:-60}
    entrypoint: ["python", "-m", "doc_ray.entrypoints.worker"]

  # Scheduled backup trigger + retention pruning. The worker performs the
  # actual archive creation; this service only enqueues backup jobs.
  backup-scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
      DOCRAY_BACKUP_SCHEDULE_SECONDS: ${DOCRAY_BACKUP_SCHEDULE_SECONDS:-86400}
      DOCRAY_BACKUP_RETENTION_COUNT: ${DOCRAY_BACKUP_RETENTION_COUNT:-7}
      DOCRAY_BACKUP_RETENTION_DAYS: ${DOCRAY_BACKUP_RETENTION_DAYS:-30}
    entrypoint: ["python", "-m", "doc_ray.entrypoints.backup_scheduler"]

  # Optional ops monitor: exits non-zero when db_health finds a warning/error.
  # Enable with: docker compose --profile ops up -d db-health-monitor
  db-health-monitor:
    profiles: ["ops"]
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
    entrypoint:
      [
        "python",
        "-m",
        "doc_ray.entrypoints.db_health",
        "--watch",
        "${DOCRAY_DB_HEALTH_INTERVAL_SECONDS:-300}",
      ]

volumes:
  pgdata:
  miniodata:
  nginxcerts:
