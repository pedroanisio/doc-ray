    rationale:    "The MCP server is live at doc-ray.com/mcp: without /health vs /readyz the compose healthcheck cannot tell 'process up' from 'can reach the API', a deploy cannot gate on readiness, a single runaway agent can hammer the GraphQL API through the MCP front door unbounded, and credential rotation is an improvisation. These are the operational basics every other service in the stack already has."
