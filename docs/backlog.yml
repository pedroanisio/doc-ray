    description: |
      `SpacyAnnotator._write` (adapters/annotation_spacy.py) now persists
      tokens, features, dependencies, entities, chunks, coreference, lexeme
      projections, and a matching `document_provenance` event in one
      transaction. The `annotated` provenance event records tool, version,
      language, per-layer counts, annotation ids, lexeme-occurrence counts, and
      replacement semantics.
