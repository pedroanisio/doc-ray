      - 190
      style: body
      type: text
      text: Once you have seen the pen inside the letter, classification stops being
        connoisseurship and becomes reading. The humanist and garalde faces keep the
        slanted pen's oblique axis and gentle contrast. The transitionals straighten
        the axis as the pointed pen and the engraver arrive. The didones push contrast
        to the rational extreme — hairlines against pillars. The slabs armour the
        serif for advertising; the grotesques remove it; the geometric sans redraws
        the skeleton with compass and rule; the humanist sans lets the pen back in
        without its serifs. And the monospace submits every letter to one width —
        the typewriter's discipline.
