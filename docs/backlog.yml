  - id:          "BL-162"
    title:        "MCP page-size clamp made visible; CLI ingest owes the document the default pipeline"
    summary:      "Verification of the operator report 'Stress-Testing the Librarian' (2026-07-26) confirmed two open defects. (1) The GraphQL MAX_PAGE_SIZE clamp (200) was silent end-to-end: MCP tools forwarded the raw requested limit and search_sentences computed coverage against it, so a clamped limit=500 request reported limit_reached: false — truncation dressed as an exhaustive result. Paging docstrings also said 'pass a row's cursor', inviting first-row-cursor paging whose n-1-row overlap masquerades as 'the cursor re-served page one' (the report's false O1 bug). (2) application.pipeline.ingest_paths — the CLI/operator bulk path — never enqueued DEFAULT_PIPELINE_CHAIN nor refreshed document_stats, producing the report's 'silent no-layer' state (real sentences, sentenceCount 0, zero annotation layers, no failed job), the same gap commit de12dfe closed for the Spaces loader."
    description: |
      MCP: a new entrypoints/mcp/shaping.py (D-015 split) owns response shaping —
      KWIC clipping, MAX_PAGE_SIZE (mirrored from the API context by a contract
      test, not an import), effective_limit, and _search_coverage. Every
      limit-taking read tool forwards effective_limit(limit); search_sentences
      computes coverage against the served limit and, when the request exceeded
      the cap, adds coverage.requested_limit plus a clamp note. All paginated
      tool docstrings now name the LAST row's cursor and document the 200
      maximum. Pipeline: ingest_paths refreshes document_stats and enqueues
      DEFAULT_PIPELINE_CHAIN per newly ingested document (duplicates and
      failures never chain — the Spaces-loader guard), with chain=None as the
      explicit opt-out; the queued head job is named in IngestResult.detail.
      No schema change, no version bump.
    category:     "api"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "The MCP contract promises truncation is never silent (BL-145/BL-146); a silently clamped limit that flips limit_reached to false breaks exactly that promise where it matters most — an agent deciding whether it has seen everything. And DEFAULT_PIPELINE_CHAIN's own docstring states the invariant the CLI path violated: it is 'the pipeline every ingest path owes a document'."
    acceptance_criteria:
      - "corpus.MAX_PAGE_SIZE equals the GraphQL context MAX_PAGE_SIZE (contract test)."
      - "search_sentences(limit>200) forwards 200, reports coverage.limit=200, coverage.requested_limit, limit_reached computed against the served limit, and a clamp note."
      - "Every limit-taking MCP read tool forwards effective_limit(limit); paginated docstrings name the last row's cursor."
      - "ingest_paths enqueues annotate with the chain remainder and refreshes document_stats for each new document; duplicates do not re-chain; chain=None disables."
    dependencies: ["BL-145", "BL-146"]
    references:
      - "src/doc_ray/entrypoints/mcp/shaping.py"
      - "src/doc_ray/entrypoints/mcp/corpus.py"
      - "src/doc_ray/application/pipeline.py"
      - "docs/mcp-service.md"
    owner:        "shared"
    source:       "Verification of the operator report 'Stress-Testing the Librarian' (Drive, 2026-07-26); implemented with strict TDD (Claude Fable 5 via Claude Code)."
    tags:         ["mcp", "api", "ingest", "agent-experience", "honesty", "bug"]

