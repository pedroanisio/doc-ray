          - check_id:    "D-010.k1.c3"
            description: "The API binds requests to the docray_api RLS role."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/security.py"
            pattern:     'docray_api'
            expect:
