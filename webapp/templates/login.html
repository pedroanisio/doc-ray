{% extends "base.html" %}
{% block title %}Login · doc-ray{% endblock %}
{% block body %}
<section class="page-head">
  <p class="eyebrow">Account</p>
  <h1>Login</h1>
</section>

<section class="auth-panel">
  {% if error %}<div class="errbox">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('login_submit') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      Email
      <input name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Login</button>
  </form>
  {% if registration_enabled %}
    <p class="muted"><a href="{{ url_for('register_form') }}">Create account</a></p>
  {% endif %}
</section>
{% endblock %}
