            description: "The migration runner module is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/migrate.py"
            expect:
              present:   true
          - check_id:    "D-006.k1.c2"
