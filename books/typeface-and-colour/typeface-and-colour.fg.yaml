    - box:
      - 68
      - 272
      - 658
      - 168
      style: body
      type: text
      text: 'Batchelder''s boldest move is to make balance computable, and his figure
        for it is a playground: two unequal spots “may be likened to a man and a boy
        on a ‘see-saw,’ the man weighing twice as much as the boy” — so “it would
        be necessary to give the boy two parts of the board and the man one.” The
        larger measure sits nearer the fulcrum, the smaller farther out, and their
        moments must agree; then “the point of balance of the measures shall coincide
        with the center of the frame,” for the eye seeks both at once.'
    - box:
      - 68
      - 462
      - 658
      - 128
      style: body
      type: text
      text: This is not a metaphor; it is a procedure, and the plate opposite performs
        it with real numbers. Two discs are weighed by their areas; the balance point
        is computed as any physicist would compute it; and the pair is then set so
        that this point falls on the frame's centre. The repose you feel looking at
        the result is arithmetic, felt.
    - box:
      - 68
      - 612
      - 658
      - 90
      style: body
      type: text
      text: 'Asymmetric layout — the whole modern art of it — is this steelyard worked
        at speed: a large image close to the axis, a small caption far from it, and
        the page at rest without a single centred element.'
