  - id:          "BL-063"
    title:        "Paginate the main document list and add filter arguments to the documents query"
    summary:      "The main document list and /search render unbounded/hard-capped results with no pager, and the documents GraphQL query takes no doc_type/status/source/date/tag filter arguments, even though keyset pagination (BL-009/D-008) already shipped for other fields."
    description: |
      documents.html's landing route has no LIMIT/OFFSET and no pager,
      unlike /lexemes (which already paginates with prev/next links) and the
      /doc/<id> sentence reader (which already paginates). /search hard-caps
      at LIMIT 100/80 with no pager. Separately, the documents GraphQL query
      itself (query.py) accepts only limit/after — no doc_type, status,
      source, or date-range filter, unlike lexemes/entities which already
      take filter arguments. This is narrower than it first appears: the
      keyset-cursor infrastructure, MAX_PAGE_SIZE clamp, and depth/complexity
      limiter already exist and are proven on other fields (BL-009, done) —
      this item is wiring that same infrastructure onto the two remaining
      unbounded surfaces and adding filter arguments, not building pagination
      from scratch.
    category:     "api"
    type:         "tech-debt"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "A growing corpus will make the main document list and search results unusable without a pager, and the documents query can't yet be filtered by the metadata fields (doc_type, status, tags) it already stores."
    acceptance_criteria:
      - "The main document list paginates using the same keyset-cursor pattern already used by lexemes/entities."
      - "/search results are paginated instead of hard-capped."
      - "The documents GraphQL query accepts filter arguments for at least doc_type, status, and tags."
    references:
      - "webapp/templates/documents.html"
      - "webapp/templates/lexemes.html"
      - "src/doc_ray/entrypoints/api/query.py"
      - "src/doc_ray/adapters/persistence_read.py"
    owner:        "shared"
    related_decisions:
      - "D-008"
    source:       "Session finding 2026-07-05: document-surface UX/data-management capability audit (parallel webapp-UI and GraphQL/persistence reviews against 9 claimed product gaps). Implemented 2026-07-05 in worktree doc-mgmt-lane: webapp/app.py's documents()/search() routes now page with LIMIT/OFFSET + a prev/next pager (webapp's own established convention, per lexemes()/document()'s sentence reader — not a keyset cursor, which is GraphQL-only infrastructure); the documents GraphQL query and persistence_read.list_documents gained doc_type/status/tags filter arguments (OR semantics across multiple tags)."
    tags:         ["api", "webapp", "pagination", "filtering"]

  - id:          "BL-064"
    title:        "Mutation resolvers never check per-document write ACL (any write token can mutate any document)"
    summary:      "Every GraphQL mutation calls only _require_write (a global read/write scope check); none consult document_acl for the specific document_id, and the jobs/backups tables have no RLS at all — so a principal scoped to one document can enqueue reannotate/delete/canonicalize/restore against any other document in the corpus."
    description: |
      Verified directly against the live tree: reannotate, delete_document,
      annotate_document, semantic_enrich_document, canonicalize_document,
      suggest_seeds, seed_approved, create_backup, restore_backup, and
      ingest_document (src/doc_ray/entrypoints/api/mutation.py) each call only
      `_require_write(ctx)`, which checks `"write" in ctx.principal.scopes` —
      a global capability, not a per-document grant. None of them call
      `docray_writable_documents()` or check `document_acl` for the
      `document_id` argument the caller supplies. Compounding this,
      `db/migrations/018_rbac.sql`'s RLS attachment loop (`docray_attach_rls`)
      covers documents and every document-scoped child table, but `jobs`
      (`db/migrations/032_api_role_runtime_grants.sql`:
      `GRANT SELECT, INSERT ON jobs TO docray_client` — no
      `ENABLE ROW LEVEL SECURITY`) and `backups`
      (`db/migrations/026_backups.sql`: `GRANT SELECT ON backups TO
      docray_client` — also no RLS) are granted to the client role directly,
      unfiltered. The worker that later processes an enqueued job runs on the
      superuser connection (RLS bypass by design, per D-010), so an
      out-of-scope enqueue is not just visible — it executes. Net effect: the
      `document_acl`/role infrastructure this repo already built (BL-012,
      BL-040) constrains direct reads through the RLS-scoped connection, but
      every write path and the entire `jobs`/`backups` surface currently
      ignores it — any token with global `write` scope is, in practice,
      equivalent to admin for every document.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "This is the concrete, present-day form of 'resource-level authorization on every object' being absent — not a hypothetical for a future multi-tenant deployment. It is independent of and does not require any SSO/tenant work below; it is fixable against the schema that exists today."
    acceptance_criteria:
      - "Every mutation that takes a document_id checks the caller's write grant on that specific document (via docray_writable_documents() or an equivalent query) before enqueuing, and fails closed (not found/forbidden) otherwise."
      - "jobs and backups gain RLS policies scoping SELECT/INSERT to the caller's document grants (jobs) or admin role (backups, corpus-wide by nature)."
      - "A regression test proves a write-scoped-but-non-admin principal cannot enqueue a job against a document outside their document_acl grants."
    related_decisions: ["D-010"]
    references:
      - "src/doc_ray/entrypoints/api/mutation.py"
      - "db/migrations/018_rbac.sql"
      - "db/migrations/032_api_role_runtime_grants.sql"
      - "db/migrations/026_backups.sql"
    owner:        "shared"
    source:       "Gap-analysis 2026-07-05 against a supplied enterprise-IAM checklist (Authentication/Provisioning/Session/Authorization/Audit), verified live against mutation.py, 018_rbac.sql, and the jobs/backups grant migrations. Completed 2026-07-05 (migrations 043/044, mutation.py _require_document_write/_require_admin, D-019) on branch fix/bl-064-mutation-document-acl."
    tags:         ["security", "rbac", "rls", "authorization", "bug"]

  - id:          "BL-065"
    title:        "Introduce a tenant model as the foundation for tenant-aware RBAC"
    summary:      "There is no tenant concept anywhere in the schema or code — principals, roles, and document_acl are all global/single-organization. Tenant-aware RBAC, SAML-per-tenant, SCIM-per-tenant, and tenant-admin-visible audit all require this primitive first."
    description: |
      Grepped the whole tree for "tenant": the only hits are a stray tag and
      a rationale sentence on BL-012 using the word loosely (single-tenant
      trust-boundary reasoning), not an actual multi-tenant model. `principals`
      (018_rbac.sql) has no `tenant_id`; neither do `documents`, `roles`, or
      `document_acl`. `docray_readable_documents()`/`docray_writable_documents()`
      compute a single global visible-set per principal with no tenant
      partitioning. Every downstream item in this gap-analysis batch that
      says "per enterprise tenant" or "tenant admin" (BL-067 SAML, BL-068
      SCIM, BL-073 ABAC's tenant-scoped rules, BL-075's tenant-admin audit
      view) is blocked on this not existing yet.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "XL"
    priority:     "high"
    rationale:    "Without a tenant primitive, 'tenant-aware RBAC as base' cannot be built — it would have to be retrofitted onto every table and RLS policy a second time. This is the single foundational decision the rest of the requested gap list depends on; sequencing it first avoids rework."
    acceptance_criteria:
      - "A tenants table exists; principals and documents carry a tenant_id."
      - "RLS policies partition by tenant_id before applying the existing document_acl/role checks (a principal in tenant A can never see tenant B's rows, independent of any ACL misconfiguration)."
      - "A migration plan exists for the current single-tenant data (assign it to one default tenant) with no data loss."
    dependencies: []
    related_decisions: ["D-010"]
    references:
      - "db/migrations/018_rbac.sql"
    owner:        "shared"
    source:       "Gap-analysis 2026-07-05 against a supplied enterprise-IAM checklist; verified absent by grep across the schema and application code. Completed 2026-07-12 with migration 061 adding tenants plus default-tenant backfill for principals/documents, tenant-partitioned docray_readable_documents()/docray_writable_documents(), auth-admin tenant create/resolve support, and cross-tenant RLS regression coverage (commit a3bf663)."
    tags:         ["security", "rbac", "multi-tenant", "foundational"]

  - id:          "BL-066"
    title:        "OIDC authentication as the default authenticator"
    summary:      "The API now has an OIDC-first authenticator: configured issuer/JWKS bearer JWTs validate before the static-token fallback, OIDC `sub` resolves through principals.external_subject, and an explicit policy switch can create a principal row on first login."
    description: |
      src/doc_ray/entrypoints/api/security.py implements exactly one
      Authenticator besides the test NoopAuthenticator: HeaderTokenAuthenticator,
      which maps a static opaque string (configured via DOCRAY_API_TOKENS) to
      a principal id and scopes. There is no OIDC client, no JWKS validation,
      no discovery-document handling anywhere in the tree (grepped: zero
      hits for oidc/OIDC/jwt outside of a doc-comment mentioning "OIDC sub"
      as a future external_subject value on the principals table). D-010's
      own decision text says "App-layer auth remains the federation slot
      (bearer/OIDC -> principal)" — i.e. this was a known, named gap left
      for later, not an oversight.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "high"
    rationale:    "OIDC is the named default in the request; it is also the only path to a real per-human identity (today every caller behind a shared bearer token is administratively indistinguishable from any other holder of that same string)."
    acceptance_criteria:
      - "An OIDCAuthenticator (or equivalent) validates a bearer JWT against the configured issuer's JWKS and resolves `sub`/claims to a principals row (creating one on first login if the tenant's policy allows, per BL-068)."
      - "HeaderTokenAuthenticator remains available but is no longer the default when an OIDC issuer is configured (see BL-069)."
      - "principals.external_subject (already a column, currently unused) is populated from the OIDC `sub` claim."
    dependencies: []
    related_decisions: ["D-010"]
    references:
      - "src/doc_ray/entrypoints/api/security.py"
      - "db/migrations/018_rbac.sql"
    owner:        "shared"
    source:       "Gap-analysis 2026-07-05 against a supplied enterprise-IAM checklist; verified against security.py and D-010's own decision text naming this as the deferred federation slot. Completed 2026-07-12 with OIDCAuthenticator, JWKS-backed JWT validation, PostgresOIDCPrincipalResolver over principals.external_subject, opt-in OIDC first-login principal creation via DOCRAY_API_OIDC_AUTO_CREATE_PRINCIPALS, OIDC-first create_app wiring, static-token fallback, and regression tests in test_api_oidc.py."
    tags:         ["security", "auth", "oidc", "federation"]

  - id:          "BL-067"
    title:        "SAML SSO for enterprise tenants"
    summary:      "Tenants can configure SAML IdP metadata/XML and post assertions to a tenant-scoped ACS route that resolves the same Principal model as OIDC."
    description: |
      Enterprise IdPs that don't speak OIDC (ADFS and older Azure AD/Okta
      configurations are the common case) need SAML. The implementation is
      tenant-configurable via tenant_saml_identity_providers: each tenant has
      its own IdP entity id, metadata URL/XML, service-provider entity id, and
      ACS settings. The /auth/saml/{tenant_id}/acs route validates issuer,
      tenant audience, and assertion validity windows, then maps NameID to the
      same principals.external_subject model as OIDC using
      saml:{tenant_id}:{NameID}. XMLDSIG verification remains fail-closed
      unless a tenant explicitly opts into unsigned assertions for local/test
      IdPs.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "medium"
    rationale:    "Named explicitly in the request as enterprise-tenant-scoped; priority is medium rather than high because no enterprise tenant exists yet to consume it (see BL-065's foundational status)."
    acceptance_criteria:
      - "A tenant can configure a SAML IdP (metadata URL or XML) and log its users in via SAML instead of OIDC."
      - "SAML assertions map to the same Principal/tenant_id model OIDC populates, so downstream RBAC/ABAC/audit code paths do not fork per protocol."
    dependencies: ["BL-065", "BL-066"]
    related_decisions: ["D-010"]
    references:
      - "src/doc_ray/entrypoints/api/security.py"
    owner:        "shared"
    source:       "Gap-analysis 2026-07-05 against a supplied enterprise-IAM checklist; verified absent by grep. Completed 2026-07-12 with migration 067 tenant_saml_identity_providers, metadata XML parsing, /auth/saml/{tenant_id}/acs, assertion issuer/audience/time checks, and PostgresSAMLPrincipalResolver mapping SAML NameID to principals.external_subject without forking downstream RBAC/ABAC/audit code."
    tags:         ["security", "auth", "saml", "enterprise"]

  - id:          "BL-068"
    title:        "SCIM provisioning, authoritative for managed users"
    summary:      "SCIM IdPs can now provision tenant-scoped users/groups through /scim/v2, and SCIM-managed principals are marked as externally managed."
    description: |
      The API exposes tenant-scoped SCIM 2.0 Users and Groups endpoints under
      /scim/v2/{tenant_id}, authenticated by DOCRAY_SCIM_TOKENS entries that
      bind each bearer token to exactly one tenant. SCIM users map onto the
      same principals table used by OIDC/RBAC with managed_by='scim',
      managed_source_id, active, tenant_id, and external_subject fields.
      SCIM groups are stored in scim_groups/scim_group_members. A database
      trigger rejects local principal_roles edits for SCIM-managed principals
      unless the sync path marks app.scim_sync=on, making IdP authority
      explicit instead of silently drifting.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "medium"
    rationale:    "Manual provisioning does not scale past one operator and cannot deprovision automatically when an enterprise tenant removes a user from their IdP — the exact gap SCIM closes."
    acceptance_criteria:
      - "A per-tenant SCIM 2.0 endpoint (Users, Groups) accepts create/update/deactivate requests from a tenant's IdP."
      - "principals gains a managed_by/source column; SCIM-sourced principals reject conflicting manual role edits (or surface them as drift), making SCIM the authoritative source for those rows."
      - "Deprovisioning via SCIM revokes document_acl grants and role assignments, not just disabling login."
    dependencies: ["BL-065", "BL-066"]
    related_decisions: ["D-010"]
    references:
      - "db/migrations/018_rbac.sql"
    owner:        "shared"
    source:       "Gap-analysis 2026-07-05 against a supplied enterprise-IAM checklist; verified absent by grep and by reading the only existing provisioning path (manual SQL / env var). Completed 2026-07-12 with migration 065 adding SCIM-managed principal columns/groups plus an authoritative role-edit trigger, DOCRAY_SCIM_TOKENS tenant-scoped bearer auth, /scim/v2/{tenant_id}/Users and /Groups create/update/deactivate routes, and deprovision cleanup for principal_roles/document_acl grants."
    tags:         ["security", "provisioning", "scim", "enterprise"]

  - id:          "BL-069"
    title:        "Demote static bearer tokens to an explicit local/break-glass fallback"
    summary:      "Once OIDC exists (BL-066), the current HeaderTokenAuthenticator (static, non-expiring, shared-secret tokens) should become an explicit, documented fallback for local/offline use — not remain the only or default authenticator."
    description: |
      Today HeaderTokenAuthenticator is the only real authenticator
      (app.py's create_app wires it unconditionally). It has no
      expiry, no rotation, and no per-token audit trail beyond the static
      DOCRAY_API_TOKENS mapping — acceptable for a single-operator/local
      deployment (as D-010 accepted explicitly) but wrong as the ongoing
      default once federated login exists. This item is intentionally small:
      it is a wiring/precedence and documentation change, not new auth logic.
    category:     "security"
    type:         "tech-debt"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "'Local login only if needed' (the request's own phrasing) implies static tokens stay available but stop being the implicit default once a real IdP is configured — otherwise the weaker path is always the one left enabled."
    acceptance_criteria:
      - "When an OIDC issuer is configured, HeaderTokenAuthenticator is only reachable via an explicit opt-in flag, documented as a break-glass/local-dev path."
      - ".env.example documents the precedence and the security tradeoff of leaving static tokens enabled alongside OIDC."
    dependencies: ["BL-066"]
    related_decisions: ["D-010"]
    references:
      - "src/doc_ray/entrypoints/api/security.py"
      - "src/doc_ray/entrypoints/api/app.py"
      - ".env.example"
    owner:        "shared"
    source:       "Implemented 2026-07-12: OIDCAuthenticator is selected when DOCRAY_API_OIDC_ISSUER and DOCRAY_API_OIDC_JWKS_JSON are configured; static DOCRAY_API_TOKENS are rejected unless DOCRAY_API_OIDC_ALLOW_STATIC_TOKEN_FALLBACK is explicitly enabled. .env.example documents the precedence and break-glass/local-dev tradeoff. Verified by src/doc_ray/tests/test_api_oidc.py."
    tags:         ["security", "auth", "tech-debt"]

  - id:          "BL-070"
    title:        "Webapp session: real per-user login with a secure HttpOnly cookie"
    summary:      "The webapp has no login at all today — DOCRAY_PRINCIPAL_ID is a single static server-side config value (the same identity for every browser hitting the process), not a per-user session. Flask sessions exist only as plumbing (CSRF token, operator-health gate), never as user identity."
    description: |
      `_apply_principal` (webapp/app.py) reads one process-wide
      `DOCRAY_PRINCIPAL_ID` from the environment and stamps it on every
      request's DB connection — every browser session hitting this webapp
      process is the same principal. There is no login page, no logout, and
      no identity cookie. (Since BL-103/BL-107 the app does set a
      SECRET_KEY and uses Flask `session[...]` — but only for the CSRF
      token and the operator-health access flag; nothing binds a session to
      a principal.) This is the webapp-side prerequisite for OIDC/SAML
      (BL-066/BL-067) to mean anything for actual browser users, since
      today nobody logs in as themselves.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "Every other item in this batch (tenant RBAC, ABAC, audit-by-actor) is meaningless for the webapp's actual human users until there is a real per-user identity in the browser, not one shared static config value."
    acceptance_criteria:
      - "A login flow (redirect to the configured OIDC/SAML IdP) establishes a signed, HttpOnly, Secure session cookie scoped to the authenticated principal."
      - "_apply_principal binds the session's principal_id instead of the static DOCRAY_PRINCIPAL_ID env var; the env var becomes a local-dev-only fallback (mirrors BL-069)."
      - "Session cookies are invalidated on logout and expire server-side, not just client-side."
    dependencies: ["BL-066"]
    related_decisions: ["D-010"]
    references:
      - "webapp/app.py"
    owner:        "shared"
    source:       "Gap-analysis 2026-07-05 against a supplied enterprise-IAM checklist; verified absent by grep across webapp/. Completed 2026-07-12 with /login OIDC/SAML IdP redirects, /auth/oidc/callback and /auth/saml/callback session establishment, an opaque Flask session id backed by a server-side expiring auth session store, /logout revocation, _apply_principal session-principal precedence over DOCRAY_PRINCIPAL_ID, secure HttpOnly SameSite cookies, and regression tests in tests/test_webapp.py."
    tags:         ["security", "webapp", "session", "auth"]

  - id:          "BL-071"
    title:        "Short-lived signed access JWTs for the GraphQL/REST API"
    summary:      "API tokens today (DOCRAY_API_TOKENS) are static opaque strings with no expiry and no signature — they are valid until an operator edits .env and restarts the API. There is no JWT issuance or verification anywhere in the tree."
    description: |
      Confirmed by reading config.py's `_parse_api_tokens` and
      security.py's `HeaderTokenAuthenticator`: a token is a dict key with an
      indefinite lifetime. Grepped for jwt/JWT across src/: zero hits. This
      item introduces short-lived (minutes-to-hours) signed access tokens
      issued after OIDC/SAML login (BL-066/BL-067) or by an internal
      token-exchange endpoint, verified statelessly by the API without a
      round-trip to the IdP on every request.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "A leaked static bearer token today is valid forever until manually rotated; short-lived JWTs bound the blast radius of a leaked credential to the token's lifetime."
    acceptance_criteria:
      - "The API issues/accepts signed JWTs with a short exp claim, verified via a local key/JWKS without a DB round-trip per request."
      - "HeaderTokenAuthenticator's static-token path remains for the break-glass case (BL-069); the two coexist without collision (distinguishable by format/prefix)."
    dependencies: []
    related_decisions: ["D-010"]
    references:
      - "src/doc_ray/config.py"
      - "src/doc_ray/entrypoints/api/security.py"
    owner:        "shared"
    source:       "Gap-analysis 2026-07-05 against a supplied enterprise-IAM checklist; verified absent by grep and by reading the current token model. Completed 2026-07-12 with stdlib HS256 access JWT issue/verify helpers, `/auth/token` exchange from an authenticated static credential, configurable issuer/audience/TTL, and HeaderTokenAuthenticator JWT/static-token coexistence tests."
    tags:         ["security", "auth", "jwt", "api"]

  - id:          "BL-072"
    title:        "Refresh-token rotation with reuse detection"
    summary:      "No refresh-token mechanism exists (follows directly from BL-071's absence of any JWT issuance). Long-lived API clients need a way to obtain new access tokens without re-running the full IdP login flow, without handing out a permanently valid credential."
    description: |
      Scoped as its own item (rather than folded into BL-071) because
      rotation has distinct, independently testable acceptance criteria —
      reuse detection and family revocation — that a plain "issue a JWT"
      implementation does not automatically get for free.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "Without rotation, a stolen refresh token is as dangerous as today's static bearer tokens — rotation-with-reuse-detection is what makes 'refresh tokens where needed' actually safer than the status quo rather than a same-risk rename of it."
    acceptance_criteria:
      - "Each refresh exchanges the presented token for a new access+refresh pair and invalidates the presented one (rotation)."
      - "Reusing an already-rotated refresh token revokes the entire token family and is logged (feeds BL-074's audit log)."
    dependencies: ["BL-071"]
    related_decisions: ["D-010"]
    references:
      - "src/doc_ray/entrypoints/api/security.py"
    owner:        "shared"
    source:       "Gap-analysis 2026-07-05 against a supplied enterprise-IAM checklist. Completed 2026-07-12 with access+refresh token issuance, `/auth/refresh` rotation, process-local refresh token family state, reuse detection that revokes the whole family and logs the event, configurable refresh-token TTL, and TDD coverage for rotation, replay, and expiry."
    tags:         ["security", "auth", "jwt", "refresh-token"]

  - id:          "BL-073"
    title:        "ABAC layer for sensitive and contextual authorization rules"
    summary:      "Authorization today is RBAC + per-document ACL only (roles: reader/curator/admin; document_acl grants). There is no attribute/context-based rule engine — no way to express 'only from this IP range', 'only during business hours', or 'documents tagged sensitive need an extra grant'."
    description: |
      018_rbac.sql's model is deliberately simple: a principal either holds
      a role-derived permission or a specific document_acl row. That is
      sufficient for coarse RBAC but cannot express contextual or
      attribute-based rules (network origin, time window, document
      sensitivity labels, request risk score) without new machinery layered
      on top — RLS policies as currently generated are static per-table
      templates, not a rule engine.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "medium"
    rationale:    "Named explicitly in the request ('ABAC for sensitive and contextual rules'); RBAC alone cannot express 'this document is sensitive, so requires elevated context' — that needs attributes on the resource and the request, not just a role on the principal."
    acceptance_criteria:
      - "A policy layer evaluates request/resource attributes (e.g. tenant, IP, time, a document sensitivity tag) in addition to RBAC, and can deny an otherwise-RBAC-permitted action."
      - "At least one real contextual rule ships as a worked example (e.g. a 'sensitive' document tag requiring an additional explicit grant beyond the owning document's normal ACL)."
    dependencies: ["BL-065"]
    related_decisions: ["D-010"]
    references:
      - "db/migrations/018_rbac.sql"
    owner:        "shared"
    source:       "Gap-analysis 2026-07-05 against a supplied enterprise-IAM checklist; verified against 018_rbac.sql's RBAC-only policy templates. Completed 2026-07-12 with a security-definer `docray_abac_document_write_allowed(uuid)` helper plus API enforcement: documents carrying `document_metadata.sensitivity=sensitive` deny otherwise-valid document writes unless the caller is admin or has an explicit `document_acl.permission='sensitive'` grant."
    tags:         ["security", "abac", "authorization"]

  - id:          "BL-074"
    title:        "Append-only security audit-event log distinct from document_provenance"
    summary:      "document_provenance (domain/pipeline history: ingest/annotate/canonicalize events) is not a security audit trail — it has no actor IP, no record of reads, and no coverage of auth events (login, token issuance, permission denials). No general-purpose, append-only access/action audit log exists."
    description: |
      Read src/doc_ray/domain/provenance.py and the document_provenance
      table: they record pipeline stage transitions (annotated, ingested,
      canonicalized...) with an actor label, which is provenance for the
      *data*, not an audit trail for *access*. There is no table or code path
      that records "principal X called mutation Y against target Z from IP W
      at time T", nor one for authentication events (successful/failed
      login, token issuance, permission-denied). BL-012/BL-040 added
      authentication and per-principal isolation but never added the
      corresponding audit trail of who did what.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "high"
    rationale:    "Without this, BL-064's exact bug class (a scoped principal reaching an out-of-grant document) would have been invisible after the fact — there is currently no way to answer 'who accessed/mutated what, from where, and when' for this system at all, tenant or no tenant."
    acceptance_criteria:
      - "Every authenticated mutation and every authentication event (success, failure, permission-denied) writes an append-only audit_events row: actor (principal_id/subject), action, target (resource type + id), timestamp, source IP."
      - "The table is insert-only at the application role level (no UPDATE/DELETE grant to docray_client), and superuser-only for any correction, so the log cannot be quietly edited by the same principals it records."
      - "GraphQL reads (at minimum for sensitive resources) are covered, not only writes — the request explicitly lists 'searchable by actor, action, target, time, IP', which reads as covering both."
    dependencies: []
    related_decisions: ["D-010"]
    references:
      - "src/doc_ray/domain/provenance.py"
      - "db/migrations/018_rbac.sql"
    owner:        "shared"
    source:       "Implemented 2026-07-12: db/migrations/062_security_audit_events.sql creates append-only audit_events with INSERT-only docray_client grants; security_audit.py writes actor/action/target/outcome/source_ip rows; auth token/refresh routes, document reads, and mutation success/denial paths emit audit events. Verified by src/doc_ray/tests/test_security_audit.py and src/doc_ray/tests/test_api_security_audit.py."
    tags:         ["security", "audit", "compliance"]

  - id:          "BL-075"
    title:        "Tenant-admin audit surface: search by actor/action/target/time/IP, exportable"
    summary:      "Once an audit-event log exists (BL-074), tenant admins need a way to see it: no audit UI/API surface exists today anywhere in the webapp or GraphQL schema (the closest thing, BL-038's operator-health page, is corpus/DB health, not an access-audit view)."
    description: |
      webapp/operator_health.py (BL-038) is the only admin-gated surface in
      the webapp today, and it reports corpus/database health metrics, not
      audit events — confirmed by reading its contents. This item is the
      read/search/export surface over BL-074's log: a filtered query
      (actor, action, target, time range, IP) and an export endpoint for
      enterprise customers who need to pull their own audit trail into
      their own tooling.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "An audit log nobody can search or export satisfies the letter of 'append-only audit events' but not 'visible to tenant admins' / 'searchable' / 'exportable for enterprise customers' — all three are explicit, separate requirements in the request."
    acceptance_criteria:
      - "A GraphQL query (or REST endpoint) filters audit_events by actor, action, target, time range, and source IP, admin-gated per tenant (a tenant admin sees only their own tenant's events)."
      - "A CSV/JSON export of a filtered audit result set is available, mirroring the existing backup-download proxy pattern (webapp never touches storage directly; the API streams it)."
    dependencies: ["BL-074", "BL-065"]
    related_decisions: ["D-010"]
    references:
      - "webapp/operator_health.py"
      - "webapp/app.py"
    owner:        "shared"
    source:       "Implemented 2026-07-12: db/migrations/063_audit_events_admin_read.sql grants tenant-admin SELECT over audit_events with RLS; GraphQL auditEvents and /audit/events/export filter by actor/action/target/time/source IP and export CSV/JSON via the API. Verified by src/doc_ray/tests/test_audit_surface.py and src/doc_ray/tests/test_api_audit_export.py."
    tags:         ["security", "audit", "webapp", "export"]

  - id:          "BL-076"
    title:        "Persist per-span page number and bounding box at extraction time (PDF)"
    summary:      "PyMuPDF extraction already computes per-span bounding-box and page geometry to reconstruct Markdown structure (extraction.py's _spans_of_line/_blocks_from_pages), then discards it — the Extracted dataclass returned to the ingest pipeline carries only full_text. No span, sentence, or occurrence knows what page or pixel position it came from, which blocks any feature that overlays annotations on the original document image. PDF-only: it is the one ingested format whose extractor computes this geometry at all — see BL-086/BL-087 for why docx/html/epub/pptx/svg each need a different plan, not this same one generalized."
    description: |
      Read src/doc_ray/adapters/extraction.py:186-236 and
      src/doc_ray/domain/pdf_layout.py:18-19: PyMuPDF's page.get_text("dict")
      already yields bbox (x0/x1 per span, y0/y1 per line via min/max of span
      boxes) plus a page index and page height. That geometry is consumed
      purely to classify heading/list/paragraph structure in to_markdown and
      then thrown away — extract_pdf_pymupdf's return type (the Extracted
      dataclass, extraction.py:53-65) has no field for it.

      This item extends PDF extraction to also return, for each contiguous
      run of extracted text, the page number and bounding rectangle it came
      from — without changing what text is extracted or how it is
      classified into Markdown. It is the foundational item for the
      PDF-first slice of the "overlay on the original document" feature:
      BL-077/BL-078 (schema + backfill), BL-079 (page rendering), BL-081
      (real pagination), and BL-082 (the overlay view) all need this data
      to exist before it can be persisted or displayed.

      Scope check against the actual corpus formats (confirmed live in
      extraction.py's _EXTRACTORS dispatch table): only .pdf, .txt/.md,
      .html/.htm, .epub, and .docx are ingestable today. .pptx and .svg
      have zero extraction code and aren't a dependency anywhere in the
      repo — they cannot be overlaid until format support is built first
      (BL-084, BL-085). Of the formats that ARE ingested, only PDF's
      extractor captures any geometry; extract_docx (extraction.py)
      is paragraph-text-only, and the HTML/EPUB path (extraction.py's
      _HTMLText/_html_to_text, :387-491) discards the DOM entirely, keeping
      only concatenated strings. Positional bbox extraction is therefore
      not a generalizable pattern across formats — it is a PDF-specific
      capability this item adds, deliberately scoped that way rather than
      implied to cover everything the corpus can ingest.
    category:     "extraction"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "This is the one true blocker for the PDF-first overlay slice: every downstream PDF item (BL-077..BL-079, BL-081, BL-082) needs page+bbox data that is already computed once per ingest and discarded today. Sequencing anything else first would mean re-deriving this same geometry or hand-waving the data it depends on."
    acceptance_criteria:
      - "extract_pdf_pymupdf (or a sibling function called alongside it) returns, per contiguous extracted-text run, its source page number and bounding-box rectangle, in addition to full_text."
      - "to_markdown's existing heading/list/paragraph classification is unchanged in output — this item only surfaces already-computed geometry to the caller, it does not alter what text is extracted or how it's structured."
      - "A unit test feeds a synthetic 2-page PDF through extraction and asserts distinct page numbers and non-overlapping bounding boxes for text originating on each page."
      - "No claim is made about docx/html/epub/pptx/svg — those are out of scope for this item by design (see BL-086/BL-087)."
    dependencies: []
    references:
      - "src/doc_ray/adapters/extraction.py"
      - "src/doc_ray/domain/pdf_layout.py"
    owner:        "shared"
    source:       "Feature request 2026-07-05: overlay POS/structural rendering on the original document, then corrected mid-design (the corpus also ingests docx/html and was asked to consider pptx/svg). Traced against extraction.py/pdf_layout.py, db/migrations/007_spans.sql, webapp/app.py, and a repo-wide grep for PDF-to-image and non-PDF rendering (get_pixmap/pdf2image/Pixmap/soffice/unoconv/docx2pdf/python-pptx/cairosvg: zero hits outside a PDF-only test fixture) to establish exactly what exists per format versus what each requires. Completed 2026-07-11 (Extracted.page_runs + domain.pdf_layout.page_runs_from_blocks; D-023) on branch fix/bl-097-delete-blob-leak."
    tags:         ["extraction", "pdf", "overlay", "bbox"]

  - id:          "BL-077"
    title:        "Schema: persist page number and bounding box on spans"
    summary:      "spans (db/migrations/007_spans.sql) stores only char_start/char_end into document_content.full_text — no page number, no coordinates. Once BL-076 makes that geometry available at extraction time, it needs a durable home so it survives past the ingest request that computed it."
    description: |
      db/migrations/007_spans.sql:10-18 defines spans as
      (id, document_id, char_start, char_end) — sentences and
      lexeme_occurrences were refactored to reference spans.id rather than
      keep their own offsets (docs/DATABASE.md:40). This item adds a
      durable home for BL-076's page/bbox output: either new columns
      directly on spans, or a new 1:1 child table (e.g.
      span_positions(span_id, page, x0, y0, x1, y1)) so the many read
      paths that only need char offsets aren't forced to carry overlay-only
      metadata. Evaluate both; a child table is the likely better fit since
      it keeps spans lean and makes "no position data yet" representable
      as "no row" rather than a set of nullable columns.
    category:     "persistence"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "Without a persisted column or table, BL-076's geometry lives only for the duration of one ingest request — gone the moment the job finishes — so nothing downstream (backfill, page rendering, the overlay view) has anything to read back."
    acceptance_criteria:
      - "A migration adds page + bounding-box storage (new spans columns or a new span_positions table) with a docs/DATABASE.md update describing the shape and the reasoning for whichever option is chosen."
      - "Ingestion (once BL-076 lands) writes this data for every span in newly-ingested documents."
      - "Existing spans are left without position data by this migration rather than backfilled — backfill is BL-078's job, not a schema migration's."
    dependencies: ["BL-076"]
    references:
      - "db/migrations/007_spans.sql"
      - "docs/DATABASE.md"
    owner:        "shared"
    source:       "Feature request 2026-07-05: overlay rendering on the original document; see BL-076. Completed 2026-07-12 with migration 049 adding nullable page/bbox fields on spans plus document_layout_runs for future span geometry derivation; ingest and re-extract now persist Extracted.page_runs and ensure_spans projects matching geometry onto sentence/token/entity/chunk spans. Existing spans remain null until BL-078 backfill."
    tags:         ["persistence", "schema", "overlay", "bbox"]

  - id:          "BL-078"
    title:        "Backfill page/bbox for already-ingested documents via re-extraction"
    summary:      "BL-076/BL-077 only populate page/bbox for documents ingested after they land. Every document already in the corpus has no position data until it is re-extracted from its original blob — a heavier operation than the existing reannotate job, which reruns spaCy over already-extracted text and never touches the original file."
    description: |
      src/doc_ray/application/jobs.py's handle_reannotate re-runs
      annotation over text that is already in document_content — it never
      re-reads the original PDF. Backfilling BL-077's columns for the
      existing corpus needs a distinct job kind (e.g. reextract) that
      re-fetches the original blob via documents.source_uri (the same
      store.get()-then-materialize pattern handle_ingest already uses),
      reruns extraction, and reconciles the result against existing
      sentence/span rows keyed by char offsets. Extraction is expected to
      be deterministic (same bytes in, same offsets out), but that must be
      verified rather than assumed before this writes over live data.
    category:     "ops"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "medium"
    rationale:    "Otherwise the overlay feature only works for documents uploaded after this ships. Every already-ingested document would silently have no overlay available, which is confusing without an explicit per-document signal that position data is (or isn't) present."
    acceptance_criteria:
      - "A reextract job kind re-runs extraction against the stored original blob and populates BL-077's page/bbox data without duplicating or shifting existing sentence/span rows."
      - "A bulk/CLI path can enqueue this against the whole existing corpus, not just one document at a time."
      - "Documents (or their spans) expose whether position data is present, so the reader can show 'no overlay available for this document yet' rather than silently rendering an empty overlay."
    dependencies: ["BL-076", "BL-077"]
    references:
      - "src/doc_ray/application/jobs.py"
    owner:        "shared"
