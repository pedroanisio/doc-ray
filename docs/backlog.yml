    type:         "tech-debt"
    status:       "done"
    complexity:   "M"
    priority:     "critical"
    rationale:    "The human-verification gate is the control that makes untrusted VLM output safe to use. A gate no operator can physically work is not a control; it is an unbounded queue that silently converts into permanent non-adoption."
