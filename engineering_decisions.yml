# =====================================================================
# doc-ray — engineering_decisions.yml  (v2 schema)
#
# System of record for architectural & operational decisions. Validated by
# the vendored SHACL/YAML toolchain under engineering/schema/:
#   python engineering/schema/scripts/validate_decisions.py engineering_decisions.yml
#   python engineering/schema/scripts/yml_to_rdf.py engineering_decisions.yml > /tmp/ed.ttl
#   pyshacl -s engineering/schema/statics/ttl/engineering_decisions_record_shacl.ttl \
#           -s engineering/schema/statics/ttl/engineering_decisions_consequences_shacl.ttl \
#           -s engineering/schema/statics/ttl/engineering_decisions_implementation_shacl.ttl \
#           -s engineering/schema/statics/ttl/engineering_decisions_config.ttl \
#           -d engineering/schema/statics/ttl/engineering_decisions_config.ttl -d /tmp/ed.ttl
#
# Lifecycle: D-001..D-010 capture the GraphQL-API + jobs architecture; D-011..D-016
# encode the mandated engineering standards. Claims already true in the tree are
# `populated`; not-yet-built ones are `pending` (checks written when the phase lands).
# =====================================================================

disclaimer: |
  No statement or premise not backed by a real logical definition or
  verifiable reference should be taken for granted.

source_schema:         "db/migrations"
# Matches the database's own SemVer (schema_version table / docray_schema_version(),
# introduced by migration 019; advanced to 1.3.0 by migration 024, to 1.4.0 by
# migration 029 for the backup catalogue, to 1.5.0 by migration 031 for
# principal LOGIN-role isolation, to 1.6.0 by migration 033 for API-role
# runtime grants, to 1.7.0 by migration 035 for scheduled backup retention and
# annotation-table autovacuum tuning, then to 1.8.0 by migration 037 for
# evaluation/drift artifacts). Kept in lockstep with doc_ray.__version__ by
# scripts/check_version_consistency.py.
source_schema_version: "1.8.0"
target_engine:         "PostgreSQL 16"
total_decisions:       16

decisions:

  # ===================== ARCHITECTURE (D-001..D-010) =====================

  - id:                 "D-001"
    title:              "Expose the store through a GraphQL (Strawberry) API"
    version_introduced: "0.1.0"
    category:           "extensibility"
    decision: |
      The programmatic surface over the document store is a GraphQL API built
      with Strawberry, living at src/doc_ray/entrypoints/api/. It is a driving
      adapter over the existing application/use-case layer — no SQL in resolvers.
    rationale: |
      The stored graph (document -> sentences -> tokens -> syntax/coref/meaning ->
      lexemes) is deeply nested; GraphQL lets clients select exactly the layers
      they need. Chosen over REST/gRPC for that fit and for OpenAPI-free schema.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/entrypoints/api/**/*.py", "requirements.txt"]
    claims:
      - claim_id:    "D-001.k1"
        claim_text:  "A Strawberry GraphQL schema is served from src/doc_ray/entrypoints/api/."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-001.k1.c1"
            description: "The GraphQL schema module is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/schema.py"
            expect:
              present:   true
          - check_id:    "D-001.k1.c2"
            description: "Strawberry is a declared runtime dependency."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "requirements.txt"
            pattern:     'strawberry-graphql'
            expect:
              present:   true

  - id:                 "D-002"
    title:              "Serve reads through a ReadRepository port + async adapter"
    version_introduced: "0.1.0"
    category:           "data-normalization"
    decision: |
      Read queries currently duplicated across webapp/app.py and adapters/export.py
      collapse into a single ReadRepository port (src/doc_ray/ports/repository.py)
      with an async adapter (adapters/persistence_read.py). GraphQL, the Flask
      browser, and export consume the same query definitions.
    rationale: |
      One query per shape kills SQL drift between the three read faces and gives
      the async API typed rows without re-deriving them.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/ports/repository.py", "src/doc_ray/adapters/persistence_read.py"]
    claims:
      - claim_id:    "D-002.k1"
        claim_text:  "Reads are served by a ReadRepository port + async adapter, not inline SQL in resolvers."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-002.k1.c1"
            description: "The async read adapter module is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/persistence_read.py"
            expect:
              present:   true
          - check_id:    "D-002.k1.c2"
            description: "The ReadRepository port is declared."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/ports/repository.py"
            pattern:     'class ReadRepository'
            expect:
              present:   true

  - id:                 "D-003"
    title:              "Preserve autocommit + statement-level lexeme collision-grow"
    version_introduced: "0.1.0"
    category:           "data-integrity"
    decision: |
      The persistence adapter connects with autocommit=True so get_or_create_lexeme
      can catch a UniqueViolation and grow the alias statement-by-statement. No
      refactor may wrap lexeme minting in a transaction (would poison it with
      InFailedSqlTransaction).
    rationale: |
      The collision-grow is load-bearing for lexeme identity; autocommit is the
      contract that makes it correct. This is the single biggest refactor trap.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/adapters/persistence.py"]
    claims:
      - claim_id:    "D-003.k1"
        claim_text:  "persistence.py connects autocommit=True and resolves lexeme uid collisions by growing the alias."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-003.k1.c1"
            description: "persistence.py opens the connection with autocommit=True."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/persistence.py"
            pattern:     'autocommit=True'
            expect:
              present:   true
          - check_id:    "D-003.k1.c2"
            description: "persistence.py catches UniqueViolation for the collision-grow loop."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/persistence.py"
            pattern:     'UniqueViolation'
            expect:
              present:   true

  - id:                 "D-004"
    title:              "Background jobs via a Postgres queue (FOR UPDATE SKIP LOCKED)"
    version_introduced: "0.1.0"
    category:           "operations"
    decision: |
      Asynchronous work (ingest, reannotate) is queued in a Postgres `jobs` table
      and claimed with SELECT ... FOR UPDATE SKIP LOCKED. No new infrastructure
      (no Redis/Celery). A Queue port keeps Redis/SQS swappable.
    rationale: |
      Postgres is already the system of record; a DB-backed queue gives durable
      at-least-once delivery and transactional enqueue with zero new moving parts.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/ports/queue.py", "src/doc_ray/adapters/queue_postgres.py"]
    claims:
      - claim_id:    "D-004.k1"
        claim_text:  "The queue adapter claims jobs with FOR UPDATE SKIP LOCKED."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-004.k1.c1"
            description: "The Postgres queue adapter claims with FOR UPDATE SKIP LOCKED."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/queue_postgres.py"
            pattern:     'FOR UPDATE SKIP LOCKED'
            expect:
              present:   true

  - id:                 "D-005"
    title:              "Sync worker for blocking work; async only for API reads"
    version_introduced: "0.1.0"
    category:           "runtime-quality"
    decision: |
      Blocking C-extension work (PDF extraction, spaCy) runs only in a synchronous
      worker process (src/doc_ray/entrypoints/worker.py). The GraphQL API is async
      and read-only in-request; all heavy writes are enqueued. Resolvers never
      import spacy/pymupdf/application.pipeline.
    rationale: |
      Keeps the event loop free; maps cleanly onto the RBAC trust boundary
      (worker = trusted superuser writer; API = docray_client reader).
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/entrypoints/worker.py", "src/doc_ray/entrypoints/api/**/*.py"]
    claims:
      - claim_id:    "D-005.k1"
        claim_text:  "A sync worker entrypoint exists and API resolvers never import the blocking pipeline."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-005.k1.c1"
            description: "The synchronous worker entrypoint is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/worker.py"
            expect:
              present:   true
          - check_id:    "D-005.k1.c2"
            description: "No API resolver module imports the blocking ingest pipeline."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api"
            pattern:     'application\.pipeline'
            expect:
              present:   false

  - id:                 "D-006"
    title:              "Runtime migration runner closes the init-only gap"
    version_introduced: "0.1.0"
    category:           "evolution"
    decision: |
      A runtime migration runner (src/doc_ray/adapters/migrate.py, entrypoint
      python -m doc_ray.entrypoints.migrate) applies db/migrations/NNN_*.sql not yet
      in schema_migrations, each in its own transaction under pg_advisory_lock. Runs
      as a one-shot compose service gating api/worker.
    rationale: |
      docker-entrypoint-initdb.d runs only on first init, so new migrations never
      reach existing volumes; the runner makes migrations reach running databases.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/adapters/migrate.py", "src/doc_ray/entrypoints/migrate.py"]
    claims:
      - claim_id:    "D-006.k1"
        claim_text:  "A runtime migration runner exists and guards concurrent runs with an advisory lock."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-006.k1.c1"
            description: "The migration runner module is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/migrate.py"
            expect:
              present:   true
          - check_id:    "D-006.k1.c2"
            description: "The runner takes a pg_advisory_lock to serialize concurrent boots."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/migrate.py"
            pattern:     'pg_advisory_lock'
            expect:
              present:   true

  - id:                 "D-007"
    title:              "jobs table: text+CHECK status, open text kind (migration 020)"
    version_introduced: "0.1.0"
    category:           "enums"
    decision: |
      The `jobs` table lands as db/migrations/020_jobs.sql (016-019 already taken by
      fts/schema-fixes/rbac/schema-version). Status is a closed set enforced with text+CHECK
      (queued|running|succeeded|failed|canceled) — not a PG enum, which is not
      transaction-safe to evolve. `kind` is open text validated by the worker.
    rationale: |
      text+CHECK is transaction-safe to add/drop; the closed status lifecycle will
      never grow, while kinds will (ingest, reannotate, embed, ...).
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["db/migrations/020_jobs.sql"]
    claims:
      - claim_id:    "D-007.k1"
        claim_text:  "db/migrations/020_jobs.sql defines jobs.status as text with a closed CHECK constraint."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-007.k1.c1"
            description: "The jobs migration is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "db/migrations/020_jobs.sql"
            expect:
              present:   true
          - check_id:    "D-007.k1.c2"
            description: "jobs.status is a closed text CHECK, not a pg enum."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "db/migrations/020_jobs.sql"
            pattern:     "CHECK \\(status IN"
            expect:
              present:   true

  - id:                 "D-008"
    title:              "GraphQL safety: depth + complexity limits, keyset pagination"
    version_introduced: "0.1.0"
    category:           "security"
    decision: |
      The GraphQL schema enforces query depth and complexity/cost limits, and every
      list field clamps its page size to MAX_PAGE_SIZE with offset paging (limit +
      offset, optionally document-scoped) so full result sets stay enumerable
      without unbounded slices. Relay keyset cursors remain a possible future
      upgrade if offset paging proves too weak at scale; they are not implemented.
    rationale: |
      The graph is deeply recursive (token.head.head..., constituent.parent...);
      without limits a single query can melt Postgres or return hundreds of MB.
      Clamped limit+offset shipped with the DevX surface and covers enumeration;
      cursors would only add stability under concurrent writes, which reads here
      (append-only corpus) rarely need.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/entrypoints/api/extensions/**/*.py"]
    claims:
      - claim_id:    "D-008.k1"
        claim_text:  "The schema installs a query-depth limiter and a token (complexity) limiter."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-008.k1.c1"
            description: "The schema installs a QueryDepthLimiter."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/schema.py"
            pattern:     'QueryDepthLimiter'
            expect:
              present:   true
          - check_id:    "D-008.k1.c2"
            description: "The schema installs a MaxTokensLimiter (complexity proxy)."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/schema.py"
            pattern:     'MaxTokensLimiter'
            expect:
              present:   true

  - id:                 "D-009"
    title:              "Pluggable extractor & analyzer registries"
    version_introduced: "0.1.0"
    category:           "extensibility"
    decision: |
      Document extractors are dispatched through a registry (_EXTRACTORS in
      adapters/extraction.py); a new file type is a new adapter + one registration.
      Analyzers follow the annotator port. The queue gets the same treatment via a
      Queue port so backends are swappable.
    rationale: |
      Open for extension, closed for modification: new capabilities arrive as new
      files, not edits to dispatch code.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/adapters/extraction.py", "src/doc_ray/ports/annotator.py"]
    claims:
      - claim_id:    "D-009.k1"
        claim_text:  "Extractors are dispatched through the _EXTRACTORS registry."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-009.k1.c1"
            description: "adapters/extraction.py defines the _EXTRACTORS registry."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/extraction.py"
            pattern:     '_EXTRACTORS'
            expect:
              present:   true

  - id:                 "D-010"
    title:              "Access control via Postgres RLS; API sets the principal"
    version_introduced: "0.1.0"
    category:           "security"
    decision: |
      Document-level authorization is enforced in the database via Row-Level
      Security (db/migrations/018_rbac.sql): principals/roles/permissions/document_acl.
      The trusted pipeline/worker uses the superuser role (bypasses RLS). The API
      authenticates inbound bearer/API-token requests to a principal, drops every
      HTTP request to the non-superuser docray_api role, and sets
      `app.principal_id` only for authenticated principals. Anonymous requests,
      when enabled for local/single-operator use, stay RLS-scoped with no
      principal id instead of remaining on the superuser connection. App-layer
      auth remains the federation slot (bearer/OIDC -> principal).
    rationale: |
      Enforcing authorization at the data layer is stronger than app-layer checks
      and cannot be bypassed by a new read path.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["db/migrations/018_rbac.sql", "src/doc_ray/entrypoints/api/security.py"]
    claims:
      - claim_id:    "D-010.k1"
        claim_text:  "Document-scoped tables enforce access with Postgres RLS; the API binds the principal."
        auditable:   true
        status:      "populated"
        declared_checks_count: 4
        checks:
          - check_id:    "D-010.k1.c1"
            description: "The RBAC/RLS migration is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "db/migrations/018_rbac.sql"
            expect:
              present:   true
          - check_id:    "D-010.k1.c2"
            description: "The RBAC migration enables Row-Level Security."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "db/migrations/018_rbac.sql"
            pattern:     'ROW LEVEL SECURITY'
            expect:
              present:   true
          - check_id:    "D-010.k1.c3"
            description: "The API binds requests to the docray_api RLS role."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/security.py"
            pattern:     'docray_api'
            expect:
              present:   true
          - check_id:    "D-010.k1.c4"
            description: "The API includes a real header-token authenticator."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/security.py"
