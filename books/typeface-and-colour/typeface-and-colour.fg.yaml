    - box:
      - 68
      - 272
      - 658
      - 150
      style: body
      type: text
      text: 'Measure the Trajan letters and a system appears. The round letters —
        O, Q, C, G, D — fill a square. H, A, N, T, U and V take about four-fifths
        of it. B, E, F, L, P, R and S take roughly half. M spreads slightly beyond
        the square, W well beyond it; I and J are strokes. Johnston devotes a chapter
        to these widths because getting them wrong is the fastest way to make capitals
        look cheap: even spacing cannot rescue uneven proportion.'
    - box:
      - 68
      - 462
      - 658
      - 128
      style: body
      type: text
      text: 'The temptation the system resists is equalisation. Signwriters and engineers
        recur, every few generations, to capitals of uniform width — they fit grids,
        they simplify layout — and every time, the eye reports the same verdict: the
        E looks fat, the M looks crushed, the O looks starved. The alphabet is a society
        of unequal citizens, and its justice is proportional.'
    - box:
      - 68
      - 612
      - 658
      - 80
      style: body
      type: text
      text: 'The plate opposite draws the widths as architecture: each skeleton letter
        standing in its own bay, measured against the square of the O.'
