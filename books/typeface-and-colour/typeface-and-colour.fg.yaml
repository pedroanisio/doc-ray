      - 150
      style: body
      type: text
      text: 'The third principle is the quietest, and the book you are holding has
        been arguing for it since page one. Johnston called it uniformity — the family
        likeness of letters. Chevreul called it harmony of scale and of hues — colours
        with pigment in common. Batchelder generalises: any composition holds together
        exactly in so far as its parts share something — a unit of measure, a family
        of shapes, a range of tones.'
    - box:
      - 68
      - 462
      - 658
      - 128
      style: body
      type: text
      text: 'His practical instrument is the common unit: designs governed by “a common
        unit of measure, the quarter-inch of the squared paper.” Set every dimension
        as a multiple of one module and measure harmony is manufactured, not hoped
        for — the ancestor, four decades early, of the baseline grid and the 8-point
        spacing system.'
    - box:
      - 68
      - 612
      - 658
      - 90
      style: body
      type: text
      text: 'The plate opposite turns the principle on this book itself: one of its
        own pages, weighed and measured by the system it has been teaching.'
