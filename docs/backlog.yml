  - id:          "BL-125"
    title:        "Original-overlay view mistakes a text-free PDF page for an un-reextracted document"
    summary:      "On a document with full page geometry, opening view=original on a page that contains no extractable text (cover art, full-page image, blank page) shows 'Original overlay is not available until this PDF is re-extracted' — the same message as a never-processed document — while the adjacent pages render their overlays fine. Reproduced live on doc 060e4aeb (Form Design Patterns): page 2 renders, pages 1 and 4 show the re-extract message; spans/document_layout_runs confirm those two pages simply have zero text runs."
    description: |
      Root cause (webapp/app.py, _pdf_original_overlay context builder): the
      document-level availability check is correct (no positioned pages at
      all -> re-extract message), but the subsequent per-page lookup reads
      max(page_width/page_height) FROM document_layout_runs for the current
      page and returns the SAME document-level re-extract message when no
      rows exist. Extraction only writes layout runs for pages that contain
      text runs, so any text-free page has no rows and no dimensions — an
      expected, permanent condition that re-extracting will never change
      (the operator's exact trap: the message sends them to a re-extract
      that cannot help).

      Fixed by treating page-level missing layout dimensions differently
      from document-level missing geometry: when the document has positioned
      pages but the requested page has no layout runs, the webapp renders the
      original page image with zero overlay boxes and an honest "No text
      detected on this page" state. The document-level re-extract message is
      still reserved for PDFs with no positioned pages at all.
    category:     "webapp"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "Every real-world PDF starts with a cover page, so the overlay feature's first impression on most documents is a false 'needs re-extraction' claim — and following that advice queues a pointless reextract job that changes nothing, eroding trust in the pipeline's own status reporting."
    acceptance_criteria:
      - "view=original on a text-free page of a document with geometry renders the page image with no overlay boxes and a 'no text on this page' notice — not the re-extract message."
      - "The re-extract message appears only when the document has no positioned pages at all."
      - "A regression test covers a document whose page 1 has no layout runs but whose page 2 does (the reproduced shape of doc 060e4aeb)."
    dependencies: []
    references:
      - "webapp/app.py"
      - "webapp/templates/document.html"
      - "src/doc_ray/application/reextract.py"
    owner:        "shared"
    source:       "Operator bug report 2026-07-12 with the correct hypothesis (empty page treated as not-processed); verified live: doc 060e4aeb pages 1/4 have zero spans/layout runs while pages 2-8 render overlays. Completed 2026-07-12 with a webapp overlay model that renders text-free pages as image-only overlays plus regression coverage in tests/test_webapp.py."
    tags:         ["webapp", "overlay", "pdf", "bug"]

  - id:          "BL-126"
    title:        "Persist per-page dimensions for every PDF page so a text-free page is a representable fact"
    summary:      "Extraction and re-extraction emit document_layout_runs rows only for pages that contain text runs; a cover page, full-page image, or blank page produces no row at all. Downstream consumers therefore face a three-way ambiguity — page is empty vs page unknown vs document never extracted — collapsed into one absent-row signal. BL-125 patched the webapp symptom (the false 're-extract this PDF' message on doc 060e4aeb's cover page); this removes the ambiguity at the source."
    description: |
      Root cause of the BL-125 incident: domain.pdf_layout.page_runs_from_blocks
      derives runs from text blocks, so pages without text contribute nothing
      to Extracted.page_runs, and persistence writes no document_layout_runs
      row for them — even though PyMuPDF knows every page's dimensions
      regardless of text content. "Empty page" is currently expressible only
      as the absence of data.

      Fix shape: at extract/reextract time, persist page coverage for every
      page of the PDF — width/height from the page objects plus an explicit
      has-text signal. Either dimension-only document_layout_runs rows
      (ordinal row with no text, text_run_count derivable) or a small
      document_pages(document_id, page_number, width, height, text_run_count)
      table aligned with documents.page_count. Existing corpus documents gain
      coverage through the existing reextract job (BL-078 machinery), no new
      backfill mechanism needed.
    category:     "persistence"
    type:         "tech-debt"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "Nearly every real PDF starts with a text-free cover page, so the ambiguity sits on the first page of most documents. BL-125's display fix works around it in one consumer; every future consumer of page geometry (real-page pagination BL-081 sees only text-bearing pages today, PPTX/SVG overlays BL-087) inherits the same trap until absence stops doubling as three different facts."
    acceptance_criteria:
      - "After extract or reextract, every page of a PDF has queryable dimensions, including pages with no extractable text."
      - "'No text on this page' is distinguishable from 'no geometry data for this document' by query alone (explicit has-text/text_run_count signal)."
      - "The BL-125 webapp fallback simplifies to the single authoritative per-page lookup (no image-natural-size or neighbor-page inference)."
      - "Existing documents gain full page coverage via the standard reextract job; a regression test uses the reproduced shape (text-free page 1, positioned page 2)."
    dependencies: []
    references:
      - "db/migrations/069_document_pages.sql"
      - "src/doc_ray/domain/pdf_layout.py"
      - "src/doc_ray/adapters/persistence.py"
      - "src/doc_ray/application/reextract.py"
      - "webapp/app.py"
    owner:        "shared"
    source:       "Operator request 2026-07-12: file the root-cause fix behind the BL-125 empty-page overlay bug (doc 060e4aeb, pages 1/4 without layout runs). Completed 2026-07-12 with document_pages, PyMuPDF page_metrics, ingest/reextract persistence, webapp authoritative page lookup, truncate classification, and isolated Docker validation."
    tags:         ["persistence", "extraction", "pdf", "overlay", "tech-debt"]

  - id:          "BL-127"
    title:        "GraphQL lexeme reads leak hidden-document vocabulary to anonymous callers"
    summary:      "The GraphQL documents/sentences/entities surfaces correctly run through RLS, but lexemes were treated as global vocabulary. Anonymous callers with no readable documents could still enumerate corpus-derived lemmas, POS tags, and languages through lexemes/lexeme(uid:), with uses=0 after occurrence rows were filtered."
    description: |
      `lexeme_occurrences` is document-scoped through annotations and RLS, but
      `lexemes` was explicitly granted as global vocabulary and the read adapter
      used a left join for the corpus-wide lexeme list. That made vocabulary
      itself visible even when the caller could not see any owning document.

      Fix shape: GraphQL lexeme reads should return only lexemes with at least
      one RLS-visible occurrence. Anonymous callers with no readable documents
      receive an empty lexeme list and `lexeme(uid:) == null`; authenticated or
      admin callers still see vocabulary for documents they can read.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "Vocabulary can reveal sensitive names, topics, domain terms, entities, or languages from otherwise hidden documents. Returning `uses=0` still confirms the hidden term exists in the corpus."
    acceptance_criteria:
      - "Anonymous GraphQL callers with no RLS-visible documents cannot enumerate lexemes derived only from hidden documents."
      - "`lexeme(uid:)` returns null when the lexeme has no RLS-visible occurrence for the caller."
      - "A principal with read visibility still sees the lexeme and its visible occurrence count."
      - "A regression test exercises the real API RLS role/principal path rather than a superuser test connection."
    dependencies: []
    references:
      - "src/doc_ray/adapters/persistence_read.py"
      - "src/doc_ray/entrypoints/api/query.py"
      - "src/doc_ray/tests/test_api_lexeme_rls.py"
      - "webapp/app.py"
      - "tests/test_read_surface_parity.py"
      - "tests/test_webapp.py"
    owner:        "shared"
    source:       "Operator security finding 2026-07-12: anonymous GraphQL saw lexemes while RLS hid documents/entities/sentences. Completed 2026-07-12 by requiring RLS-visible lexeme_occurrences for lexeme list/detail reads and the webapp lexeme index, with isolated Docker red/green coverage."
    tags:         ["security", "graphql", "rls", "lexemes", "metadata-leak"]

