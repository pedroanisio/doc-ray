      Implemented by GitHub issue #46 as the verified-count half of the phrase
      architecture. The existing single-indexed-lexeme tier is unchanged.
      Multi-word terms reuse phrase search's shared parameterized AND-of-words
      candidate clause; one-profile-word compounds such as `shared_buffers`
      reuse the existing single-pattern match clause. One UNION ALL statement
      fetches at most 2,001 Sentence ids/texts per term for the whole batch.

      Pure domain verification calls `phrase_profile.find_occurrences` on every
      candidate. The flat GraphQL/MCP result names `profile: surface_word_v1`,
      keeps `sentenceHits` as candidate evidence, and adds
      `occurrenceSentences` plus overlap-aware `occurrences`. Attestation and
      flood risk derive from verified sentences, so word-internal candidates do
      not become claims. A candidate-cap hit makes all three counts floors and
      always yields a high/incomplete verdict; a capped verified zero leaves
      attestation unknown rather than claiming absence from incomplete work.

      GraphQL, MCP selection, tool descriptions, server instructions, API/MCP
      references, architecture, usage examples, changelog, release notes, and
      migration/configuration guidance expose the same contract. No database,
      index, token, model, configuration, webapp, or SDK change is required.
