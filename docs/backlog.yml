      - "webapp/templates/base.html"
    owner:        "shared"
    source:       "Session finding 2026-07-04: webapp UX/UI audit (finding L4)."
    tags:         ["tooltips", "consistency", "accessibility", "ux"]

  - id:          "BL-037"
    title:        "Accessibility: part-of-speech is conveyed by color alone"
    summary:      "The reader encodes POS solely as underline color; color-blind users cannot distinguish parts of speech (WCAG 1.4.1)."
    description: |
      In the reader a word's part of speech is signalled only by the color of
      its underline (document.html:41: `.w { color:inherit; border-bottom:2px
      solid var(--c) }`, with `--c` set per POS class). There is no secondary,
      non-color cue and POS is absent from the hover tooltip (lemma only), so a
      color-blind reader cannot tell a NOUN from a VERB — failing WCAG 2.1 SC
      1.4.1 (Use of Color). Add a redundant encoding (POS in the tooltip, an
      underline-style variation, or an opt-in POS-label mode). The POS legend and
      pill color-coding elsewhere share the issue.
    category:     "webapp"
    type:         "bug"
    status:       "parked"
    complexity:   "S"
    priority:     "medium"
    rationale:    "POS — the reader's primary annotation — is inaccessible to color-blind users because hue is its only encoding (WCAG 1.4.1)."
    acceptance_criteria:
      - "A word's part of speech is distinguishable without relying on color (e.g. exposed in the tooltip or via a non-color cue)."
      - "The reader remains usable under a grayscale / color-blind simulation."
    references:
      - "webapp/templates/document.html"
      - "webapp/templates/base.html"
    owner:        "shared"
    source:       "Session finding 2026-07-04: webapp UX/UI audit — 2nd-pass refinement (accessibility gap the first pass missed)."
    tags:         ["accessibility", "reader", "wcag", "annotation"]
