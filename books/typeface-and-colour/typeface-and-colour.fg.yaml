      - 140
      - 658
      - 60
      style: h2
      type: text
      text: Simultaneous contrast
    - box:
      - 68
      - 224
      - 658
      - 250
      style:
        class: quote
        font_size: 24
        line_height: 1.5
      type: text
      text: '“All the phenomena I have observed seem to depend upon a very simple
        law: when two contiguous colours are seen at the same time, they appear as
        dissimilar as possible, both with regard to their optical composition and
        their depth of tone.”'
    - box:
      - 68
      - 486
      - 658
      - 14
      style: attr
      type: text
      text: 'M. E. CHEVREUL, 1839 — PART I, CH. II: THE LAW AND ITS FORMULA'
    - box:
      - 68
      - 516
      - 64
      - 2
      type: rect
      fill: rubric
    - box:
      - 68
      - 546
      - 658
      - 170
      style: body
      type: text
      text: 'The discovery began as a complaint. Weavers at the Gobelins manufactory
        reported that Chevreul''s black yarns looked feeble next to blue — and his
        chemistry found nothing wrong with the dye. The defect was in the neighbourhood:
        beside blue, any grey or black borrows blue''s complement and warms toward
        orange. The dye was innocent; the juxtaposition was guilty.'
    - box:
      - 68
      - 740
      - 658
      - 170
      style: body
      type: text
      text: 'The law has two blades. Contrast of tone: beside a dark, a colour looks
        lighter; beside a light, darker. Contrast of colour: each neighbour tints
        the other with its own complement — red pushes its neighbours toward green,
        blue pushes them toward orange. No colour on any page is ever seen alone;
        the ground is always a co-author. The next plate lets you catch the law in
        the act.'
