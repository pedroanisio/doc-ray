      - 412
      - 658
      - 150
      style: body
      type: text
      text: Everything else serves those two. A piece of lettering that has readableness,
        beauty and character “has the essential virtues of good lettering” — and each
        of those three virtues, he found, rests on three qualities. The resulting
        table of nine is the most compact instrument of typographic criticism ever
        written, and it applies unchanged to a website, a wayfinding system, or a
        book.
    - box:
      - 68
      - 582
      - 658
      - 130
      style: body
      type: text
      text: Note the deliberate order. Readableness is “the only sound basis for a
        practical theory of lettering”; beauty is admitted second; character — the
        personal, the expressive — comes last, as “the product of a particular hand
        & tool at work in a particular craft.” Style is earned, not applied. The table
        may be used, he says, “as a test of the qualities of any piece of lettering
        — whether Manuscript, Printing, or Engraving.”
    - box:
      - 68
      - 742
      - 658
      - 60
      style: body
      type: text
      text: The next three pages take the virtues in turn, each with its own demonstrations.
