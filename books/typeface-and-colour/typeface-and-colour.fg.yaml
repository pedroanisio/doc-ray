    - box:
      - 68
      - 122
      - 658
      - 74
      style: h2
      type: text
      text: Planting by the law
    - box:
      - 68
      - 174
      - 658
      - 60
      style: lead
      type: text
      text: Horticulture had colour advice for centuries — “in a vague and general
        manner.” Chevreul replaces it with prescriptions.
    - box:
      - 68
      - 248
      - 64
      - 2
      type: rect
      fill: rubric
    - box:
      - 68
      - 272
      - 658
      - 150
      style: body
      type: text
      text: 'Once the law is stated, “the grouping of flowers will present no difficulty,
        since it will only be a simple conclusion from facts.” The prescriptions follow
        like theorems. Complementary masses first: “blue flowers and orange flowers,
        yellow flowers and violet flowers.” Red needs no partner planted for it, since
        “rose or red flowers contrast with their own leaves” — the rose bed carries
        its complement on its stems.'
    - box:
      - 68
      - 462
      - 658
      - 150
      style: body
      type: text
      text: 'Then the separations, which are the same lesson as plate 33''s warning
        about neighbouring scales: “we must separate pink flowers from those that
        are either scarlet or crimson; orange flowers from orange-yellow flowers;
        blue flowers from violet-blue flowers.” Near-likeness reads as error in a
        border exactly as it does in a palette. And to the objection that green foliage
        drowns the whole exercise, his answer is the plate opposite: the leaves are
        not the enemy of the contrast but its ground.'
