  # ==================== FULL-CODEBASE GAP ANALYSIS (2026-07-10) ====================

  - id:          "BL-094"
    title:        "Backup download route is completely unauthenticated and bypasses RLS"
    summary:      "GET /backups/{id}/download (entrypoints/api/app.py) has no Authenticator/principal check at all and runs on the raw superuser pool connection (never calls apply_principal), so it also bypasses the backups RLS policy BL-064/migration 043 just added — any network-reachable caller can download a full corpus backup archive (DB dump + every original document blob) knowing only a backup id."
    description: |
      Confirmed live: `download_backup` (entrypoints/api/app.py:147-173) is a
      plain `@app.get` route that never calls `request.app.state.authenticator`
      or any `_require_admin`/scope check — unlike every GraphQL mutation,
      including `createBackup`/`restoreBackup` which both call `_require_admin`
      (mutation.py:207/220, BL-064/D-019). It also queries via
      `pool.connection()` directly rather than through `_get_context`'s
      `apply_principal` (app.py:52-56), so the connection never runs
      `SET ROLE docray_api` — the SELECT against `backups` executes as the
      pool's configured role, which docker-compose/`.env.example` set to the
      `docray` superuser/table-owner (RLS-bypassing by design, D-010). This
      means the route is unauthenticated at the HTTP layer *and* unscoped at
      the RLS layer that migration 043 just restricted `backups` SELECT to
      `docray_is_admin()`. Confirmed by the route's own test,
      `test_api_backup_download.py::test_download_serves_available_archive_and_404s`,
      which calls `client.get(f"/backups/{backup_id}/download")` with no auth
      header at all and asserts HTTP 200 — the test proves the current
      behavior is exactly this, not a hypothetical. `webapp/app.py`'s proxy
      route inherits the same gap (it forwards to this URL with no added auth).
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "critical"
    rationale:    "This is the same class of bug BL-064 just fixed (a write/read path that ignores the access-control model entirely) except worse: BL-064 required a stolen write-scoped token; this requires no credential of any kind, just network reachability and a backup id (which is itself visible to any admin-panel viewer or guessable as a ULID sequence). It silently undoes migration 043's RLS intent for the one table that RLS was supposed to lock down as admin-only."
    acceptance_criteria:
      - "download_backup requires an authenticated principal and calls _require_admin (or equivalent) before querying backups, returning 401/403 for anonymous or non-admin callers."
      - "The backups lookup runs through a principal-bound connection (apply_principal / SET ROLE docray_api) so RLS is actually enforced, not bypassed via the raw pool."
      - "A regression test proves an anonymous or non-admin caller gets 401/403, not the archive bytes; the existing 200/404 cases in test_api_backup_download.py continue to pass for an admin principal."
    dependencies: []
    related_decisions: ["D-019"]
    references:
      - "src/doc_ray/entrypoints/api/app.py"
      - "src/doc_ray/tests/test_api_backup_download.py"
      - "src/doc_ray/entrypoints/api/mutation.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (object-storage subsystem audit), re-verified directly against app.py and the route's own test given severity. Completed 2026-07-11 (download_backup now authenticates + calls docray_is_admin() through apply_principal; webapp proxy forwards the API token and propagates 401/403/404) on branch fix/bl-064-mutation-document-acl, commit 846237c."
    tags:         ["security", "critical", "rls", "authorization", "bug"]

  - id:          "BL-095"
    title:        "Duplicate re-upload silently downgrades a document's stored Content-Type"
    summary:      "ingestDocument always calls store.put(key, data, \"application/octet-stream\") before the worker's dedupe check runs; a document already in the corpus that gets re-uploaded has its correctly-typed blob (set on first ingest) irreversibly overwritten with a generic octet-stream content-type."
    description: |
      Confirmed live: mutation.py's ingestDocument path uploads with a
      hardcoded "application/octet-stream" content-type before the job queue
      even runs; the worker's ingest handler short-circuits on a sha256 match
      and returns "duplicate" without ever re-uploading with the correct
      type (which is only set on a first, successful, non-duplicate ingest).
      Net effect: every re-upload of an already-ingested document permanently
      degrades its stored Content-Type header for all future downloads/serves
      of that blob, and nothing restores it — a second re-upload just repeats
      the same overwrite.
    category:     "persistence"
    type:         "bug"
    status:       "done"
    complexity:   "XS"
    priority:     "low"
    rationale:    "A silent, irreversible metadata degradation on a common user action (re-uploading a file you're not sure was already ingested) that nothing currently detects or reports."
    acceptance_criteria:
      - "A duplicate upload either skips the store.put entirely (detecting the sha256 match before upload) or re-uploads with the correct, format-derived content-type instead of a hardcoded octet-stream default."
      - "A regression test re-uploads an already-ingested document and asserts its stored content-type is unchanged."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/mutation.py"
      - "src/doc_ray/application/jobs.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (object-storage subsystem audit). Completed 2026-07-12 by deriving the pre-worker upload PUT Content-Type from the extractor-owned extension mapping instead of hardcoded application/octet-stream, with a duplicate re-upload regression proving an existing text/plain object is not downgraded."
    tags:         ["persistence", "storage", "bug"]

  - id:          "BL-096"
    title:        "No read-side integrity verification despite content_sha256 being threaded for exactly that purpose"
    summary:      "docs/DATABASE.md documents content_sha256 as providing dedupe + integrity, but no code path ever re-checks a fetched blob's hash against it — a silently corrupted, truncated, or wrong-object read (bit rot, MinIO bug, race) is ingested or restored as if correct."
    description: |
      Confirmed live: the ingest handler fetches the blob back via
      `store.get()` and recomputes a hash only for the dedupe lookup, never
      comparing it to the `sha256` value already threaded through the job
      payload. Backup creation and restore-from-archive likewise never
      verify a hash on any blob read. The `content_sha256` column's
      documented "integrity" purpose is therefore aspirational, not enforced.
    category:     "persistence"
    type:         "tech-debt"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "Content-addressing without a read-side integrity check only gets you dedupe, not the corruption-detection half of the design DATABASE.md already claims exists."
    acceptance_criteria:
      - "Every blob read used for ingest verification, backup, or restore recomputes sha256 and raises/fails the job on a mismatch instead of proceeding silently."
      - "A test injects a corrupted blob (wrong bytes at the same key) and asserts the affected job fails cleanly rather than succeeding."
    dependencies: []
    references:
      - "src/doc_ray/application/jobs.py"
      - "src/doc_ray/application/backup.py"
      - "docs/DATABASE.md"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (object-storage subsystem audit). Completed 2026-07-12 with shared read-side SHA-256 verification for ingest upload replay, original-document downloads/page rendering, backup blob reads, and restore archive blob members; corrupt-blob regressions cover API, worker, backup, and restore paths."
    tags:         ["persistence", "storage", "integrity", "tech-debt"]

  - id:          "BL-097"
    title:        "deleteDocument never deletes the document's blob — permanent storage leak"
    summary:      "handle_delete only issues DELETE FROM documents; a repo-wide grep for store.delete( shows exactly one call site in all of src/doc_ray (backup.py, pruning old backup archives) — no code path ever deletes a document's own storage_key, so every deleteDocument mutation leaks the original bytes forever."
    description: |
      Confirmed live: `handle_delete` (application/jobs.py) deletes the
      `documents` row (cascading to its layers per FK) but never calls
      `ObjectStore.delete()` for the document's own blob. The only
      `store.delete(` call site anywhere in `src/doc_ray` is
      `application/backup.py:355`, used solely to prune old backup archive
      objects — not document blobs. This is distinct from BL-059 (which is
      about adding lifecycle states like archive/soft-delete/restore at the
      product level); this is a lower-level adapter omission that would
      still leak storage even once BL-059 lands, unless BL-059's
      implementation happens to also fix this.
    category:     "persistence"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "Unbounded storage growth on the one operation (delete) a user would reasonably expect to free space, plus a real data-erasure gap for anyone deleting a document for compliance/privacy reasons who now believes the bytes are gone."
    acceptance_criteria:
      - "handle_delete calls store.delete() for the document's storage_key after (or as part of) the DB delete."
      - "A regression test deletes a document and asserts its blob is no longer present in the object store."
    dependencies: []
    references:
      - "src/doc_ray/application/jobs.py"
      - "src/doc_ray/application/backup.py"
      - "src/doc_ray/adapters/object_store.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (object-storage subsystem audit)."
    tags:         ["persistence", "storage", "bug", "data-erasure"]

  - id:          "BL-098"
    title:        "ingestDocument has no upload size cap — unbounded memory buffering"
    summary:      "mutation.py's ingestDocument does data = await upload.read() with no size limit anywhere in Config or the resolver, so an arbitrarily large upload buffers entirely in API process memory before any validation runs."
    description: |
      Confirmed live: the ingest resolver reads the full upload body into
      memory with no configured ceiling (grepped Config for any
      max-upload/max-body setting — none exists). A single large file (or a
      client that simply keeps streaming) can exhaust API process memory
      before the extension/content checks in extraction.py ever run.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "An unauthenticated-by-default (DOCRAY_API_ALLOW_ANONYMOUS defaults true) or write-scoped caller can trivially exhaust API memory with one request; this is a live DoS vector, not a hypothetical one."
    acceptance_criteria:
      - "ingestDocument enforces a configurable maximum upload size, rejecting oversized uploads with a clean error before buffering the full body."
      - "The default cap is documented in .env.example alongside the other DOCRAY_API_* settings."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/mutation.py"
      - "src/doc_ray/config.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (object-storage subsystem audit). Completed 2026-07-11 (ingestDocument now reads uploads in bounded chunks via Config.max_upload_bytes/DOCRAY_MAX_UPLOAD_MB — the same knob the webapp's Flask route already enforced — rejecting an oversized upload before the full body is ever buffered) on branch fix/bl-064-mutation-document-acl."
    tags:         ["security", "dos", "bug"]

  - id:          "BL-099"
    title:        "No encryption enforcement for object storage, at rest or in transit"
    summary:      "Config.s3_endpoint freely accepts http:// with no warning/refusal, and ObjectStore.put/get never set SSE (server-side-encryption) headers — nothing in the codebase enforces or even encourages TLS-in-transit or at-rest encryption for stored document blobs."
    description: |
      Confirmed live: `Config.s3_endpoint` (config.py) has no scheme
      validation (contrast with BL-041's now-fixed refusal of default DB
      passwords — no equivalent guard exists here), and
      `ObjectStore.put`/`get` (object_store.py) never pass
      `ServerSideEncryption`/SSE-related parameters to the underlying client
      calls. For a corpus that may contain sensitive source documents, this
      is a real gap in the storage hardening this repo has otherwise been
      actively closing (BL-039/040/041).
    category:     "security"
    type:         "tech-debt"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "Matches the same hardening bar already applied to Postgres (BL-041's default-credential refusal, BL-039's pinned image) — object storage is the other half of where document bytes live and currently has none of that scrutiny."
    acceptance_criteria:
      - "ObjectStore refuses (or at minimum warns loudly on) a plaintext http:// endpoint outside of an explicit local-dev opt-in."
      - "Server-side encryption is requested on put() where the backing store supports it, documented as a config option otherwise."
    dependencies: []
    references:
      - "src/doc_ray/adapters/object_store.py"
      - "src/doc_ray/config.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (object-storage subsystem audit). Completed 2026-07-12 with plaintext S3 endpoint RuntimeWarning unless explicitly opted into local insecure mode, plus configurable S3 ServerSideEncryption/SSEKMSKeyId headers on object writes and documented env knobs."
    tags:         ["security", "storage", "encryption", "tech-debt"]

  - id:          "BL-100"
    title:        "Worker detects crashed jobs but not hung ones — no execution timeout"
    summary:      "_start_heartbeat keeps a job's heartbeat alive for as long as the handler runs regardless of progress, and reap_stale only reclaims jobs whose heartbeat has gone stale (a dead worker process) — a handler stuck in an infinite loop, a DB deadlock, or a hanging external call (e.g. ClaudeResolver.resolve with no explicit timeout) heartbeats forever and is never reclaimed."
    description: |
      Confirmed live: `application/jobs.py`'s `_start_heartbeat` spins a
      daemon thread on a fixed interval independent of the handler's actual
      progress; `adapters/queue_postgres.py`'s `reap_stale` only reclaims
      jobs whose heartbeat timestamp has gone stale, i.e. it detects a dead
      *process*, not a live-but-stuck handler. `adapters/resolver_claude.py`
      opens an `anthropic.Anthropic()` client with no explicit request
      timeout. With the default single-`worker`-replica topology
      (docker-compose.yml), one hung job blocks the entire queue
      indefinitely — including every future scheduled backup (see BL-102's
      related starvation scenario).
    category:     "ops"
    type:         "bug"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "The retry/backoff/max-attempts machinery (BL-010/011, already done) only helps once a handler *returns* an exception — it does nothing for a handler that never returns at all."
    acceptance_criteria:
      - "Each job kind has a configurable maximum execution duration; exceeding it fails the job (subject to the existing retry/backoff policy) instead of holding the queue slot forever."
      - "ClaudeResolver.resolve and any other external-call handler sets an explicit request timeout."
    dependencies: []
    references:
      - "src/doc_ray/application/jobs.py"
      - "src/doc_ray/adapters/queue_postgres.py"
      - "src/doc_ray/adapters/resolver_claude.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (worker/job-queue subsystem audit). Completed 2026-07-12 with per-kind configurable worker execution timeouts (`WORKER_JOB_TIMEOUT_SECONDS` / `WORKER_JOB_TIMEOUT_<KIND>_SECONDS`) enforced by the synchronous worker dispatch path, explicit Anthropic resolver request timeouts (`DOCRAY_RESOLVER_TIMEOUT_SECONDS`), compose pass-through for the worker timeout knobs, and regression tests covering handler timeout retry/backoff plus resolver SDK timeout construction."
    tags:         ["ops", "reliability", "bug"]

  - id:          "BL-101"
    title:        "Worker's outer poll loop has no resilience to a dropped DB connection"
    summary:      "worker.py opens one plain psycopg connection for the life of the process with no reconnect logic; queue.reap_stale and queue.claim execute outside any try/except in the outer loop (only handler exceptions are caught), so a transient Postgres blip during the reaper scan or claim query crashes the whole worker process instead of being retried on the next poll."
    description: |
      Confirmed live: `adapters/persistence.py`'s `db.connect` opens a
      single long-lived `psycopg.connect` with no reconnect wrapper.
      `worker.py`'s outer loop calls `queue.reap_stale` and `queue.claim`
      unguarded; `application/jobs.py`'s `except Exception as exc` only
      wraps the handler dispatch itself (jobs.py's inner call), not these
      outer-loop calls. A restart, network partition, or connection reset
      hitting the reaper or claim query therefore raises unhandled and kills
      the process — requiring an external process supervisor (Docker
      restart policy) to notice and recover, with the same reap-and-resume
      cost as a full crash.
    category:     "ops"
    type:         "bug"
    status:       "done"
    complexity:   "S"
