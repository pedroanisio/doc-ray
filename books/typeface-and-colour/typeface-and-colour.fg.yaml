      - 582
      - 658
      - 130
      style: body
      type: text
      text: Note the deliberate order. Readableness is “the only sound basis for a
        practical theory of lettering”; beauty is admitted second; character — the
        personal, the expressive — comes last, as “the product of a particular hand
        & tool at work in a particular craft.” Style is earned, not applied. The table
        may be used, he says, “as a test of the qualities of any piece of lettering
        — whether Manuscript, Printing, or Engraving.”
