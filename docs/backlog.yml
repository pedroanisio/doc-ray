  - id:          "BL-195"
    title:        "The caption grounding gate never opens: no proposal scores above 80% against a 0.8 auto-commit threshold"
    summary:      "Grounding scores across the review queue top out in the 60-80% band and 43% fall below 20%, while the auto-commit threshold is 0.8 — so no caption can ever commit automatically and every proposal is routed to a human. Only 31 of 6,122 captions are committed."
    description: |
      Measured 2026-07-29, grounding_score distribution for status='review':
        0-20%   2,525
        20-40%  1,953
        40-60%  1,005
        60-80%    377
        80-100%     0

      With AUTO_COMMIT_THRESHOLD at 0.8 the commit path is unreachable by
      construction. Corpus-wide only 31 captions are 'committed' against 5,851 in
      'review' and 231 'rejected'.

      Two hypotheses, and they lead to opposite work, so the calibration question
      must be answered before any queue-clearing effort is spent:
        (a) the captions really are poorly grounded, and the generator or its
            prompt is the defect;
        (b) the grounding scorer is miscalibrated and a 70%-scored caption is in
            fact accurate, in which case the threshold is the defect.

      Both backends are represented — qwen3-vl:32b-instruct (3,714) and
      nemotron-nano-12b-v2-vl (2,408) — and both produce the same low band, so
      this is not an artefact of the retired local Ollama path.
    category:     "nlp"
    type:         "bug"
    status:       "done"
    complexity:   "M"
    priority:     "critical"
    rationale:    "A verification gate whose pass condition is unreachable does not verify anything; it defers everything. Until the scorer is shown to be calibrated, neither the queue size nor the caption quality can be interpreted."
    acceptance_criteria:
      - "A sample of at least 30 captions is scored by hand across the 0-20, 20-40, 40-60 and 60-80 bands, and agreement between human judgement and grounding_score is reported."
      - "The result explicitly attributes the low band to generator quality, scorer calibration, or both, with the evidence for the attribution."
      - "If the scorer is miscalibrated, the threshold or the metric is corrected and the existing rows are re-scored rather than re-generated."
