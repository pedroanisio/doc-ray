    summary:      "D-013 requires >=90% coverage; the package sits at ~57%, with the gap in orchestration/adapter layers."
    description: |
      Measured coverage across both suites (with a live DB) is ~57% vs the
      fail_under=90 gate (D-013). The domain layer is already 96–100%. The gap is
      concentrated in: application/ (pipeline, reannotate, reextract — 0%),
      entrypoints/ (cli, migrate — 0%), adapters/ (export, object_store partial;
      persistence partial), and ports/ (Protocols show 0% but are pure interface
      bodies — exclude via coverage `exclude_also` for `...`/Protocol, or add a
      smoke-import test). Most non-domain modules need DB+spaCy integration tests.
      A 2026-07-04 re-check attempt could not confirm the current percentage: a
      full `pytest --cov=doc_ray` run against the shared checkout timed out
      (DB-dependent tests appear to block waiting on a database connection) —
      the 57% figure is not re-verified and may be stale in either direction.

      RESOLVED 2026-07-04 (commit 1bd4e69): a fresh, worker-stopped, clean-cache
      run measured 87.2% (not 57% — the earlier figure was stale). Closed with
      ~54 new tests, no production-code changes: guard clauses and branch pairs
      in the job dispatcher (application/jobs.py, previously 70%), the
      createBackup/restoreBackup/suggestSeeds/decideSeeds GraphQL mutations and
      the jobs()/fullTextSearch queries, the backup engine's failure path and
      private-helper edge cases (85% -> 97%), and the frontier resolver's
      SELECT-at-threshold commit path, which had zero direct coverage (89% ->
      97%). Verified stable at 91.09% across repeated clean-cache reruns; 575
      passed, 0 failed, 1 skipped (PyMuPDF not installed). `ports/` Protocols
      were not specially excluded — normal test writing reached them.
