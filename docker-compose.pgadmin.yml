# pgAdmin — LOCAL-ONLY Postgres admin GUI.
#
# Bound to 127.0.0.1 so it is NEVER reachable from the public interface. Reach it
# by tunnelling to the loopback port — e.g. VS Code Remote's port forwarding, or
#   ssh -L 5050:127.0.0.1:5050 user@<host>
# then open http://localhost:5050 on your workstation.
#
# Standalone overlay — run only pgAdmin (it connects OUT to a Postgres you
# configure; it does not need the base stack):
#   docker compose -f docker-compose.pgadmin.yml up -d pgadmin
#
# Requires PGADMIN_EMAIL and PGADMIN_PASSWORD in .env (see .env.example). Point it
# at the managed cluster using the details from docs/production-setup.md
# (host, port 25060, database docray, sslmode=require) — prefer a least-privilege
# role over doadmin. Never publish port 5050; the tunnel is the only access path.

services:
  pgadmin:
    image: dpage/pgadmin4:latest   # pin a digest for reproducibility if desired
    container_name: docray-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD to a non-default secret in .env}
      PGADMIN_LISTEN_PORT: "80"
      # Defense-in-depth even behind the tunnel: keep the login (server mode),
      # harden the session cookie, and disable the outbound upgrade-check ping.
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      # LOOPBACK ONLY — never 0.0.0.0. Access is exclusively via an SSH/VS Code tunnel.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Optional: pre-register the doc-ray server so you don't add it by hand.
      # Copy pgadmin/servers.example.json to pgadmin/servers.json, set the host,
      # then uncomment the next line (pgAdmin auto-imports it on first start):
      # - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/misc/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgadmin-data:
