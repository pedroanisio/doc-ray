{% extends "base.html" %}
{% block title %}Create account · doc·ray{% endblock %}
{% block body %}
<section class="page-head">
  <p class="eyebrow">Account</p>
  <h1>Create your account</h1>
  <p class="lede">Set up an account to upload documents, run the pipeline, and curate entities.</p>
</section>

<section class="auth-panel">
  {% if error %}<div class="errbox">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('register_submit') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      Name
      <input name="display_name" autocomplete="name">
    </label>
    <label>
      Email
      <input name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="new-password" minlength="12" required>
      <span class="hint">At least 12 characters.</span>
    </label>
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Sign in</a>.</p>
</section>
{% endblock %}
