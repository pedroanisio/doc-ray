      the overlay is blank or what to do. Detect the zero-annotation case and show
      a 'not annotated yet' state (queued/absent), optionally linking to how
      annotation runs.
    category:     "webapp"
    type:         "feature"
    status:       "parked"
    complexity:   "S"
    priority:     "low"
    rationale:    "A blank annotation overlay looks broken; the manual explains this but the screen does not."
    acceptance_criteria:
      - "An unannotated document reader states that annotation has not run."
      - "The state distinguishes 'queued' from 'absent' where that information is available."
    references:
      - "webapp/templates/document.html"
    owner:        "shared"
    source:       "Session finding 2026-07-04: webapp UX/UI audit (finding L1)."
