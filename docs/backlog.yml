  # ============ POSTGRES/RDBMS DOMAIN GAP ANALYSIS (2026-07-05) =============
  # A session first learned PostgreSQL/RDBMS administration and relational-
  # modeling practice from doc-ray's own ingested corpus (an EDB "PostgreSQL
  # Essentials v16" course + Clean Code Principles and Patterns ch.9), then
  # audited doc-ray's actual Postgres usage against that material. No defects
  # were found in schema/query/transaction layers (fully parameterized SQL,
  # sound RLS design, well-built FOR UPDATE SKIP LOCKED job queue). The gaps
  # below cluster in deployment/operational posture. BL-039/BL-046 also close
  # out GitHub issues #2 and #3, which a stale `.agent-tasks` entry
  # (task-1783203910276-5a81, blocked since 2026-07-04, its blocker having
  # long since completed) had been intended to carry but never did.

  - id:          "BL-039"
    title:        "Pin the Postgres image to stop collation-version drift (GH#2)"
    summary:      "pgvector/pgvector:pg16 is a floating tag; a rebuilt base image already caused a live collation-version mismatch warning on this deployment."
    description: |
      docker-compose.yml and docker-compose.api.yml pin `pgvector/pgvector:pg16`
      with no digest. GitHub issue #2 documents Postgres logging, on this exact
      deployment: `WARNING: database "postgres" has a collation version
      mismatch (2.41 vs 2.36)` after a routine `docker compose up` pulled a
      rebuilt image with a newer glibc/collation library against the existing
      `pgdata` volume. Collation-version mismatches mean any collation-
      dependent index or ORDER BY can silently return incorrect
      ordering/results until `ALTER DATABASE ... REFRESH COLLATION VERSION` +
      a REINDEX of affected indexes. Root cause and remediation options are
      already written up in the GitHub issue; this item exists to make sure
      the fix actually lands (a prior attempt to backlog this, tracked in
      `.agent-tasks/registry.json` task-1783203910276-5a81, stalled blocked
      and was never revisited).
    category:     "ops"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "The mismatch is already actively logging on this deployment, not hypothetical; every image rebuild risks worsening drift or silent collation-dependent query-result corruption."
    acceptance_criteria:
      - "Either the Postgres image is pinned to an immutable digest, or ALTER DATABASE ... REFRESH COLLATION VERSION + a targeted REINDEX is run and documented as the accepted remediation."
      - "The chosen approach is documented so future `docker compose pull`s don't silently reintroduce the warning."
    references:
      - "docker-compose.yml"
      - "docker-compose.api.yml"
      - "GitHub issue #2"
    owner:        "shared"
    source:       "GitHub issue #2 (open); confirmed via this session's Postgres/RDBMS domain gap-analysis, grounded in the ingested EDB PostgreSQL 16 administration course. Completed 2026-07-05 by pinning pgvector/pgvector:pg16 to immutable index digest sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2 in both Compose files, with a regression guard in tests/test_compose_security.py."
    tags:         ["postgres", "collation", "docker", "upgrade"]

  - id:          "BL-040"
    title:        "GraphQL API authentication is a documented no-op"
    summary:      "The API used to run every anonymous request unfiltered on the superuser connection; it now authenticates bearer/API tokens and scopes anonymous access through RLS."
    description: |
      Before this item, entrypoints/api/security.py's NoopAuthenticator
      returned Principal(principal_id=None) and apply_principal was a no-op, so
      HTTP/GraphQL requests stayed on the trusted superuser role and bypassed
      RLS by design. That meant the database-enforced RBAC this repo had
      otherwise carefully built enforced nothing against an external caller.
      This item is distinct from BL-012 (hostile *direct-SQL* clients
      impersonating a principal via the session GUC): it covers the
      HTTP/GraphQL layer authenticating callers and ensuring anonymous access is
      no longer a superuser bypass.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "high"
    rationale:    "Authorization without authentication enforces nothing (the EDB course's own AAA model requires both); if the API is ever reachable beyond one trusted operator, every document becomes readable/writable by any caller."
    acceptance_criteria:
      - "A real Authenticator resolves inbound requests to a Principal with a non-null principal_id for authenticated callers."
      - "Unauthenticated requests either fail closed or are clearly scoped to a documented anonymous-read policy, not the superuser bypass."
      - "The single-operator/localhost-only default, if kept, is written down explicitly as an accepted decision rather than left implicit."
    related_decisions: ["D-010"]
    references:
      - "src/doc_ray/entrypoints/api/security.py"
      - "src/doc_ray/config.py"
      - "src/doc_ray/tests/test_api_app.py"
      - "db/migrations/018_rbac.sql"
    owner:        "shared"
    source:       "This session's Postgres/RDBMS domain gap-analysis (EDB PostgreSQL 16 course's Database Security / AAA module), verified directly against security.py. Completed 2026-07-05 with HeaderTokenAuthenticator, DOCRAY_API_TOKENS, fail-closed anonymous option, and apply_principal always dropping HTTP requests to docray_api before resolver execution."
    tags:         ["security", "auth", "rls", "graphql"]

  - id:          "BL-041"
    title:        "Postgres port published on all interfaces with default credentials"
    summary:      "docker-compose publishes 5432 without a host-IP prefix (binds 0.0.0.0), and this deployment's .env still uses the documented default password."
    description: |
      docker-compose.yml/docker-compose.api.yml publish
      "${POSTGRES_PORT:-5432}:5432" with no host-IP prefix, which Docker binds
      to 0.0.0.0 (verified live on this host: `docker port docray-postgres`
      shows 0.0.0.0:5455). `.env.example` ships POSTGRES_PASSWORD=docray, and
      this exact deployment's `.env` still uses that default (verified
      without printing the value). Any host that can reach this machine's
      Postgres port can attempt a login with a password documented in this
      repository. This is the EDB course's own "General Recommendations -
      Database Server" checklist inverted: a postmaster port reachable
      without a firewall, and default credentials left unrotated.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "XS"
    priority:     "high"
    rationale:    "Both conditions (network-reachable port + default password) hold simultaneously on a real, currently-running deployment, not hypothetically."
    acceptance_criteria:
      - "The Postgres port is bound to 127.0.0.1 by default in compose (or documented as intentionally external, with a firewall requirement called out)."
      - "Startup fails closed (or warns loudly) if POSTGRES_PASSWORD is unset or equal to the documented default."
    references:
      - "docker-compose.yml"
      - "docker-compose.api.yml"
      - ".env.example"
    owner:        "shared"
    source:       "This session's Postgres/RDBMS domain gap-analysis; verified live against the running docray-postgres container and .env. Completed 2026-07-05 by binding Postgres ports to 127.0.0.1, requiring POSTGRES_PASSWORD, refusing the historical default/placeholder values at container startup, and removing the documented default password from .env.example."
    tags:         ["security", "postgres", "docker", "credentials"]

  - id:          "BL-042"
    title:        "No scheduled backups, retention policy, or PITR/WAL archiving"
    summary:      "The custom backup/restore engine works and is tested, but only runs on-demand; there is no cadence, no pruning of old archives, and no point-in-time recovery."
    description: |
      application/backup.py's snapshot/restore mechanism is deliberately
      app-native (not pg_dump) and its restore correctness is tested
      (src/doc_ray/tests/test_backup.py::test_restore_is_point_in_time_rewind
      et al.) — this item is a scheduling/retention gap, not a correctness
      defect. No cron/scheduled compose service triggers createBackup; the
      `backups` table (026_backups.sql) is already indexed on created_at,
      ready for a retention/prune job, but nothing prunes it. No
      archive_mode/archive_command or WAL archiving exists anywhere
      (consistent with the lack of any custom postgresql.conf), so there is
      no way to recover to a point in time between two manual snapshots.
    category:     "ops"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
