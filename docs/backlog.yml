      - "src/doc_ray/application/mcp_eval.py"
      - "src/doc_ray/application/mcp_eval_tasks.py"
      - "src/doc_ray/application/mcp_eval_fixtures.py"
      - "src/doc_ray/domain/mcp_eval_scoring.py"
      - "docs/mcp-evaluation.md"
      - "docs/eval/mcp-baseline.json"
