  - id:          "BL-114"
    title:        "CI and the Docker build bypass the committed uv.lock; no hash verification"
    summary:      "A 473KB uv.lock is committed at the repo root but is never referenced — Dockerfile runs pip install -r requirements.txt and ci.yml runs pip install -r requirements.txt -r requirements-dev.txt, plain pip against glob-pinned versions (e.g. psycopg[binary]==3.2.*, boto3==1.34.*), not uv sync/uv pip sync against the lockfile, and neither install command uses --require-hashes or per-package --hash entries."
    description: |
      Confirmed live: `uv.lock` exists and is committed, but
      `Dockerfile`'s install step and `ci.yml`'s two `pip install` calls
      both target `requirements.txt`/`requirements-dev.txt` directly with
      plain `pip`, not `uv`. The glob pins in `requirements.txt` (e.g.
      `pymupdf==1.*`, `anthropic==0.113.*`) are looser than the lockfile's
      exact resolution, and nothing enforces the lockfile's pins at install
      time in either CI or the shipped image — a patch release on any
      pinned line (including a compromised one, e.g. a PyPI account
      takeover) is pulled in on the next build. No `--hash=sha256:...`
      entries or `--require-hashes` flag exist anywhere, so package
      integrity is never verified at install time either.
      Completed 2026-07-11 (Dockerfile deps stage runs `uv sync --locked
      --no-install-project --no-dev` into /usr/local via a digest-pinned uv
      binary — the build fails on lock drift; both ci.yml jobs install the
      same way plus an explicit `uv lock --check` drift-gate step;
      requirements-dev.txt stays the source for dev tooling; new
      tests/test_uv_lock_sync.py enforces lock consistency and the
      no-plain-pip invariant in both surfaces, with self-tests proving the
      checker can fail; D-024) on branch feat/bl-111-112-114-supply-chain.
    category:     "tooling"
    type:         "tech-debt"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "A committed lockfile that nothing actually installs from is decorative — it creates a false impression of reproducibility while CI and production both float on requirements.txt's looser glob pins."
    acceptance_criteria:
      - "CI and the Dockerfile install from uv.lock (via uv sync/uv pip sync --locked or equivalent) rather than plain pip against requirements.txt, or requirements.txt is regenerated with --require-hashes-compatible exact pins and hash verification is enabled."
      - "A CI check fails if requirements.txt and uv.lock drift out of sync."
    dependencies: []
    references:
      - "uv.lock"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (dependency/supply-chain subsystem audit)."
    tags:         ["tooling", "supply-chain", "tech-debt"]

  - id:          "BL-115"
    title:        "No structured logging anywhere in src/doc_ray — worker and GraphQL failures produce no durable trace"
    summary:      "Grepped import logging/logging.basicConfig/structlog/getLogger across src/doc_ray — zero hits; all output is print(). The worker's job-failure handler (application/jobs.py) records only queue.fail(conn, job.id, error=repr(exc), ...) with no logging call and no traceback — a crash during a real ingest produces no output anywhere outside a jobs.error DB column an operator would have to think to query; GraphQL resolver exceptions are likewise never logged server-side, only serialized into the client-facing errors array."
    description: |
      Confirmed live: no logger configuration exists in `src/doc_ray/` at
      all (`entrypoints/migrate.py`, `application/db_health.py`, and 30+
      other call sites use bare `print()`). `application/jobs.py`'s
      exception handler (`except Exception as exc: ... queue.fail(conn,
      job.id, error=repr(exc), ...)`) has no `logging` call — `repr(exc)`
      captures only the exception class and message, no traceback, no
      file/line. `worker.py`'s outer loop (see BL-101) has no logging or
      exception handling of its own either. `entrypoints/api/schema.py`
      registers no `process_errors`/extension override, so a resolver
      exception is only visible in the client's response, never on the
      server's own output. This is distinct from BL-023/038/055, which are
      all DB/corpus-health-specific monitoring, not general application
      logging.
    category:     "ops"
    type:         "tech-debt"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "An ingest pipeline that silently swallows its own failures (no log line, no traceback, nothing an operator would see without proactively querying the jobs table) makes production incidents undiagnosable after the fact — this is the single highest-leverage observability gap since it affects every other failure mode in the system."
    acceptance_criteria:
      - "A process-wide logger is configured for the API and worker processes (structured, with level/format control via env)."
      - "Worker job failures log the full exception with traceback and job/document context, not just repr(exc) in the DB column."
      - "GraphQL resolver exceptions are logged server-side in addition to being returned to the client."
    dependencies: []
    references:
      - "src/doc_ray/application/jobs.py"
      - "src/doc_ray/entrypoints/worker.py"
      - "src/doc_ray/entrypoints/api/schema.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (observability subsystem audit). Completed 2026-07-11 (new doc_ray.logging_setup.configure_logging(), called from worker.main and api.app.create_app; jobs.py logs full traceback + job context on handler failure; confirmed Strawberry's default process_errors already logs to strawberry.execution, so the GraphQL criterion needed only the root-logger configuration, not new resolver code; D-022) on branch fix/bl-097-delete-blob-leak."
    tags:         ["ops", "observability", "logging", "tech-debt"]

