  - id:          "BL-025"
    title:        "Lexeme/token projection invariant"
    summary:      "Define whether lexeme_occurrences is a materialized projection over tokens or an independent primary fact, then enforce parity."
    description: |
      The spaCy writer stores token-level lexeme links (`tokens.lexeme_uid`)
      and also writes `lexeme_occurrences` via a separate COPY
      (adapters/annotation_spacy.py, grep-confirmed 2026-07-04); no parity test
      exists between them, so lexical counts can drift. Either keep
      lexeme_occurrences as a materialized projection and add parity tests
      against tokens.lexeme_uid, or migrate it to a view once browser/API
      compatibility allows.
