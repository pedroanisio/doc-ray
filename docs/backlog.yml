    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (webapp security subsystem audit). Completed 2026-07-11 (new extraction.is_supported_extension() checked in ingestDocument before ObjectStore is even constructed; D-021) on branch fix/bl-097-delete-blob-leak."
