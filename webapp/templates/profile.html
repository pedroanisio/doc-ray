{% extends "base.html" %}
{% block title %}Profile · doc-ray{% endblock %}
{% block body %}
<section class="page-head">
  <p class="eyebrow">Account</p>
  <h1>Profile</h1>
</section>

<section class="auth-panel">
  <dl class="kv">
    <dt>Subject</dt>
    <dd>{{ auth_session.subject }}</dd>
    <dt>Principal</dt>
    <dd><code>{{ auth_session.principal_id }}</code></dd>
    <dt>Expires</dt>
    <dd>{{ auth_session.expires_at }}</dd>
  </dl>
</section>
{% endblock %}
