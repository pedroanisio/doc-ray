  - id:                 "D-019"
    title:              "Per-document write ACL on mutations; RLS on jobs/backups"
    version_introduced: "1.10.0"
    category:           "security"
    decision: |
      Every mutation that takes a document_id (reannotate, deleteDocument,
      annotateDocument, semanticEnrichDocument, canonicalizeDocument,
      suggestSeeds, seedApproved) now calls _require_document_write, which
      checks the caller's document_id against docray_writable_documents()
      before enqueuing — not just the global "write" scope _require_write
      already checked. createBackup/restoreBackup (corpus-wide, no single
      document to scope against) call _require_admin instead, checking
      docray_is_admin(). Migration 043 backs both with real RLS: jobs
      (document-scoped reads/writes follow the caller's existing
      docray_readable_documents()/docray_writable_documents() grants;
      document_id IS NULL jobs require admin) and backups (admin-only SELECT,
      corpus-wide by nature) — previously granted to docray_client/docray_api
      directly with no RLS at all. decideSeeds and ingestDocument are
      unchanged: decideSeeds's underlying seed_suggestion UPDATE is already
      RLS-scoped (migration 032); ingestDocument creates a new document, so
      there is no existing document_id to check a grant against.
    rationale: |
      Verified directly against the live tree: every mutation resolver called
      only _require_write, a global capability check with no per-document
      scope, while jobs/backups had no RLS to backstop that gap either. Any
      token with global write scope was, in practice, equivalent to admin for
      every document in the corpus — the document_acl/RLS infrastructure
      D-010/BL-012/BL-040 built constrained direct reads but not writes
      through the job queue. Checking in the resolver (not just relying on
      the new RLS policies) turns a raw Postgres policy-violation error into
      a clean, fail-closed PermissionError before the write is attempted;
      RLS remains the backstop if a future resolver forgets the check.
    decision_status:    "accepted"
    decision_date:      "2026-07-05"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "db/migrations/043_jobs_backups_rls.sql"
      - "db/migrations/044_schema_version_1_10_0.sql"
      - "src/doc_ray/entrypoints/api/mutation.py"
    claims:
      - claim_id:    "D-019.k1"
        claim_text:  "jobs and backups enable Row-Level Security (migration 043)."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-019.k1.c1"
            description: "Migration 043 enables RLS on both tables."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "db/migrations/043_jobs_backups_rls.sql"
            pattern:     "ALTER TABLE (jobs|backups) ENABLE ROW LEVEL SECURITY"
            expect:
              present:   true

      - claim_id:    "D-019.k2"
        claim_text:  "Document-scoped mutations check a per-document write grant before enqueuing, not just global write scope."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-019.k2.c1"
            description: "mutation.py defines and uses _require_document_write."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/mutation.py"
            pattern:     "_require_document_write"
            expect:
              present:   true

      - claim_id:    "D-019.k3"
        claim_text:  "A regression test proves a write-scoped-but-non-admin principal cannot enqueue a job against a document outside their document_acl grants."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-019.k3.c1"
            description: "The regression test passes."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_mutations.py::test_reannotate_rejects_write_scope_without_document_grant -q"
            expect:
              exit:      0

  - id:                 "D-020"
    title:              "Worker reconnects on dropped DB connections; GraphQL id args are format-validated and write batches are bounded"
    version_introduced: "1.10.0"
    category:           "security"
    decision: |
      Three independent hardening fixes from the 2026-07-10 full-codebase gap
      analysis, landed together: (1) entrypoints/worker.py's outer poll loop
      now wraps the connect+claim+dispatch cycle in a retry loop that catches
      psycopg.OperationalError, backs off (WORKER_RECONNECT_BACKOFF_SECONDS,
      default 2s), and reconnects, instead of letting a dropped connection
      crash the process (BL-101). (2) entrypoints/api/query.py's document/job/
      search_sentences/lexemes/entities/entity_frequency/jobs/seedSuggestions/
      unresolvedMentions/resolutionReview resolvers now validate any uuid-
      shaped id argument via a shared _clean_uuid() before querying — a
      malformed id reads as "not found" / an empty page, never a forwarded
      psycopg.errors.InvalidTextRepresentation (BL-110). ulid-typed columns
      (jobs.id) turned out not to share this bug: a domain's CHECK constraint
      only fires on an explicit cast, not on a `=` comparison, which resolves
      through the base type's operators — verified directly against a live
      Postgres rather than assumed. (3) suggestSeeds's limit argument is now
      clamped through the same ctx.page_size() bound every read resolver
      uses, and decideSeeds's approveIds/rejectIds arrays are rejected
      outright (not silently truncated) past context.MAX_BATCH_IDS (500) —
      silently dropping ids from a write batch would mean some of the
      caller's approve/reject decisions never happened (BL-109).
    rationale: |
      Each fix closes a distinct fail-open path a live audit confirmed rather
      than assumed: (1) an unhandled connection error previously took down
      the whole worker process on a transient Postgres blip, turning a
      recoverable network hiccup into a full outage requiring manual restart.
      (2) uuid-typed columns (unlike the ulid domain, confirmed by direct
      testing against Postgres) raise a raw input-syntax error on a malformed
      comparison value, and Strawberry's default error handling forwards
      str(exc) verbatim — the same class of information leak BL-110 was
      opened to close, now closed consistently across every resolver that
      takes an id-shaped argument, not just the one originally flagged. (3)
      every read resolver already had a page_size()-style cap; the two write
      mutations taking unbounded arguments were the gap BL-009/BL-063 didn't
      cover, and a silent truncation would be worse than a clean rejection
      because it fails without telling the caller which decisions landed.
    decision_status:    "accepted"
    decision_date:      "2026-07-11"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "src/doc_ray/entrypoints/worker.py"
      - "src/doc_ray/entrypoints/api/query.py"
      - "src/doc_ray/entrypoints/api/mutation.py"
      - "src/doc_ray/entrypoints/api/context.py"
    claims:
      - claim_id:    "D-020.k1"
        claim_text:  "The worker's outer poll loop catches psycopg.OperationalError, backs off, and reconnects rather than crashing the process."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-020.k1.c1"
            description: "A regression test simulates a dropped connection mid-loop and asserts the worker recovers without process exit."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_jobs_worker.py::test_worker_loop_recovers_from_dropped_connection -q"
            expect:
              exit:      0

      - claim_id:    "D-020.k2"
        claim_text:  "Every query resolver taking a uuid-shaped id argument validates it before querying, so a malformed id never forwards a raw Postgres exception."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-020.k2.c1"
            description: "query.py defines and uses a shared _clean_uuid() helper across every id-shaped resolver argument."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/query.py"
            pattern:     "_clean_uuid"
            expect:
              present:   true

      - claim_id:    "D-020.k3"
        claim_text:  "suggestSeeds.limit is clamped through page_size(); decideSeeds's approveIds/rejectIds are rejected, not truncated, past MAX_BATCH_IDS."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-020.k3.c1"
            description: "The regression tests for both bounds pass."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_mutations.py -k 'suggest_seeds_clamps or decide_seeds_rejects' -q"
            expect:
              exit:      0

  - id:                 "D-021"
    title:              "Webapp response-security headers, upload-extension allowlisting, header-based operator token"
    version_introduced: "1.10.0"
    category:           "security"
    decision: |
      Three findings, landed together: (1) webapp/security_headers.py's
      apply_security_headers, wired via app.after_request, sets
      Content-Security-Policy (default-src 'self'; 'unsafe-inline' scoped to
      script-src/style-src only, since the templates carry pre-existing
      inline <script>/style= that a larger refactor would be needed to
      eliminate), X-Frame-Options: DENY, X-Content-Type-Options: nosniff, and
      Referrer-Policy: strict-origin-when-cross-origin on every response
      (BL-104). (2) entrypoints/api/mutation.py's ingestDocument now calls
      the new adapters.extraction.is_supported_extension(ext) — the same
      _EXTRACTORS allowlist extract() dispatches on — before constructing
      ObjectStore or calling store.put, so an unrecognized/spoofed extension
      is rejected before the blob is ever persisted, not after (BL-106). (3)
      webapp/operator_health.py's require_operator_health accepts the
      X-Operator-Token header standalone; a query-string ?token= bootstrap
      link is still accepted but now sets a signed session flag
      (operator_health_ok, via Flask's already-signed session cookie) so
      later requests in that browser session authenticate from the cookie —
      operator_health.html's internal link no longer embeds the token in an
      href at all.
    rationale: |
      (1) No CSP/frame/sniffing/referrer headers existed at all; Talisman
      was flagged as absent but installing a new dependency for four header
      assignments was unnecessary (CLAUDE.md: no unnecessary dependencies) —
      a plain after_request hook is the "or equivalent" the backlog item
      itself named. (2) The extension is attacker-supplied and previously
      reached store.put with zero validation; extraction.py's own format
      check only ran later, during the worker's ingest job, by which point
      the blob already existed in the object store. (3) A token traveling
      via URL query string lands in access logs, proxy logs, and browser
      history on every single request; the header path already existed for
      API-style callers, this closes the gap for the browser-navigated
      operator health page specifically, where every internal link was
      re-embedding the token in its href.
    decision_status:    "accepted"
    decision_date:      "2026-07-11"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "webapp/security_headers.py"
      - "webapp/app.py"
      - "src/doc_ray/adapters/extraction.py"
      - "src/doc_ray/entrypoints/api/mutation.py"
      - "webapp/operator_health.py"
      - "webapp/templates/operator_health.html"
    claims:
      - claim_id:    "D-021.k1"
        claim_text:  "Every webapp response carries CSP/X-Frame-Options/X-Content-Type-Options/Referrer-Policy headers."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-021.k1.c1"
            description: "The regression test on a representative route passes."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest tests/test_webapp.py::test_responses_carry_security_headers -q"
            expect:
              exit:      0

      - claim_id:    "D-021.k2"
        claim_text:  "ingestDocument rejects an unsupported upload extension before the blob reaches the object store."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-021.k2.c1"
            description: "The regression test asserts ObjectStore.put is never called for an unsupported extension."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_mutations.py::test_ingest_document_rejects_unsupported_extension_before_storing_blob -q"
            expect:
              exit:      0

      - claim_id:    "D-021.k3"
        claim_text:  "The operator health token is accepted via header, and a query-string bootstrap no longer requires the token in subsequent internal links."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-021.k3.c1"
            description: "The header-token, session-bootstrap, and no-token-in-links regression tests pass."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest tests/test_webapp.py -k 'operator_health_accepts_header or operator_health_query_bootstrap or operator_health_page_links' -q"
            expect:
              exit:      0

  - id:                 "D-022"
    title:              "Process-wide structured logging for the worker and API"
    version_introduced: "1.10.0"
    category:           "observability"
    decision: |
      New doc_ray.logging_setup.configure_logging() installs one formatted
      handler on the root logger (level via DOCRAY_LOG_LEVEL, format via
      DOCRAY_LOG_FORMAT, default INFO / "%(asctime)s %(levelname)s %(name)s
      %(message)s"), idempotent across repeated calls. entrypoints.worker's
      main() and entrypoints.api.app's create_app() both call it at process
      startup. application/jobs.py's run_once now logs a handler failure's
      full traceback plus job id/kind/document_id via logging.getLogger
      ("doc_ray.jobs").error(..., exc_info=exc), in addition to the existing
      repr(exc) written to the jobs.error column. worker.py also logs a
      warning (with traceback) on the BL-101 reconnect path. GraphQL resolver
      exceptions needed no code change: Strawberry's default process_errors
      already logs to logging.getLogger("strawberry.execution") — the gap was
      that nothing configured logging at all, so that call fell through to
      Python's unconfigured "handler of last resort".
    rationale: |
      grep import logging/logging.basicConfig/structlog/getLogger across
      src/doc_ray returned zero hits before this — all output was print(), and
      a worker crash during a real ingest produced no trace anywhere an
      operator would find without already knowing to query the jobs.error
      column. Confirmed the GraphQL logging gap was specifically the missing
      root-logger configuration, not missing integration: Strawberry's
      StrawberryLogger already calls logging.getLogger("strawberry.execution")
      .error(...) on every resolver exception (verified by reading
      strawberry.utils.logging's source directly), so build_schema() only had
      to not break that default, not reimplement it.
    decision_status:    "accepted"
    decision_date:      "2026-07-11"
