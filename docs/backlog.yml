  - id:          "BL-086"
    title:        "Overlay strategy for non-paginated formats (docx/html/epub): highlight in a rendered view of the original markup"
    summary:      "docx/html/epub are ingested for text today but capture zero positional data (extract_docx is paragraph-text-only; the HTML/EPUB path discards the DOM entirely) and, unlike PDF, have no fixed 'page' to rasterize — pagination in these formats is a rendering-time artifact of viewport/page-size, not a property of the file. BL-076..BL-082's render-a-page-then-draw-bbox-boxes approach does not apply to them; they need a fundamentally different mechanism."
    description: |
      Confirmed live: extract_docx (extraction.py) does
      "\n".join(p.text for p in document.paragraphs) — no run/paragraph
      position, no page. HTML/EPUB extraction (_HTMLText/_html_to_text,
      extraction.py) only appends string parts at tag boundaries —
      the DOM itself is not retained, and HTML has no page concept at all
      (it reflows to viewport width).

      The natural approach for these formats is not "render an image and
      draw boxes on top" but "render the original markup itself (an actual
      docx-to-HTML or the original HTML/EPUB content) and highlight text
      ranges in place" — much closer to what document.html's reader
      already does for reconstructed text (wrapping matched ranges in
      highlight spans) than to PDF's image-plus-bbox model. For docx this
      likely means rendering to HTML (python-docx exposes paragraph/run
      structure that can be walked into HTML) rather than to an image;
      for html/epub it means preserving and re-serving the original DOM
      (which today's extractor throws away) instead of only the
      flattened text.
    category:     "webapp"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "low"
    rationale:    "Without this, docx/html/epub documents (a real, currently-ingestable slice of the corpus) would either be silently excluded from 'overlay on the original document' or wrongly forced through the PDF-shaped plan, which has no page/bbox data to draw from for these formats at all."
    acceptance_criteria:
      - "docx/html/epub extraction is extended to retain enough structure (DOM or run/paragraph position) to re-render the original markup, not just its flattened text — a prerequisite this item must add, since today's extractors discard it."
      - "A reading mode renders that reconstructed original markup with POS/entity highlights applied in place (DOM range wrapping), reusing the same highlight vocabulary as the PDF overlay (BL-082) and the existing text reader."
      - "This does not require or depend on BL-076..BL-082's page/bbox machinery — it is a parallel path for formats that have no fixed page."
    dependencies: []
    references:
