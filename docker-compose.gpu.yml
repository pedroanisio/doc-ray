# GPU overlay for the heavy `worker` pool — transformer NLP + sentence embedding.
#
# Reserves the host NVIDIA GPU via CDI (nvidia.com/gpu) for the `worker`
# service so both on-device workloads use the GPU instead of CPU:
#   * annotate      — spaCy's en_core_web_trf transformer (annotation_spacy calls
#                     spacy.prefer_gpu()); fr/pt stay on CNN models, no GPU needed.
#   * semantic_embed — the all-mpnet-base-v2 sentence encoder (sentence-transformers
#                     auto-selects CUDA when the container can see the GPU; override
#                     with DOCRAY_SEMANTIC_DEVICE). Routed here off the fast pool.
#   * visual_embed  — the open_clip dual encoder for Tier-2 image/text vectors;
#                     bounded by DOCRAY_VISION_BATCH_SIZE and routed off fast.
#
# `scripts/deploy_env.py` applies this overlay automatically when a GPU is usable;
# use it via `make up` rather than hand-passing -f flags. On an 8 GB card the two
# workloads must not co-reside — pick one heavy GPU consumer at a time (see below).
#
# Deploy (scale sized to VRAM — torch+cupy hold ~6 GB per trf worker at peak,
# so an 8 GB card fits exactly ONE; two OOM):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#     up -d --scale worker=1 worker
#
# Requirements: nvidia-container-toolkit CDI specs present in /etc/cdi and an
# NVIDIA driver at least matching the torch CUDA build (CUDA 13.x). Verify with
#   docker run --rm --device nvidia.com/gpu=all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi -L
#
# CPU-only hosts must NOT apply this overlay — the base compose already runs the
# worker on CPU (spacy.prefer_gpu() is a no-op there).
services:
  worker:
    environment:
      # 8 GB consumer cards fit ONE model worker: torch/open_clip and cupy
      # (thinc tagger/parser/ner) each hold a growing device pool. Run a single
      # GPU worker (scale=1) — two OOM. Keep the non-GPU worker-fast pool for
      # light jobs only.
      # expandable_segments curbs allocator fragmentation across docs of
      # varying length (the OOM hint torch itself prints).
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities: ["gpu"]
              device_ids:
                - nvidia.com/gpu=all
