  # ============================= EXTRACTION =============================

  - id:          "BL-001"
    title:        "OCR pass for image-only PDFs"
    summary:      "Scanned/image-only PDFs extract to zero characters; add OCR before text extraction."
    description: |
      At least one fixture ("Verified Coverage of the FrontierMath Ramsey
      Book-Graph…") extracts to 0 characters — it is image-only, so it yields no
      sentences and no annotations. Route such documents through an OCR stage
      (e.g. Tesseract / ocrmypdf) ahead of the text extractor, recorded via the
      existing `extractor` provenance field.
    category:     "extraction"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "A whole class of input (scanned PDFs) is silently unprocessable today — 0 chars, no error."
    acceptance_criteria:
      - "An image-only fixture produces non-empty text and downstream sentences."
      - "OCR backend is opt-in and stamped in the document's extractor provenance."
