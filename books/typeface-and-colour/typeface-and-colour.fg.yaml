      style: body
      type: text
      text: Everything else serves those two. A piece of lettering that has readableness,
        beauty and character “has the essential virtues of good lettering” — and each
        of those three virtues, he found, rests on three qualities. The resulting
        table of nine is the most compact instrument of typographic criticism ever
        written, and it applies unchanged to a website, a wayfinding system, or a
        book.
    - box:
