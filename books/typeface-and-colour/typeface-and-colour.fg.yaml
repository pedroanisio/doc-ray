      text: 'Everything on a page pulls at the eye: the darker, the larger, the more
        eccentric, the harder. Batchelder''s definition makes balance a physical affair
        — not a look but an equilibrium. A composition is balanced when its attractions
        oppose one another so completely that the eye comes to rest; it is unbalanced
        when some pull goes unanswered.'
    - box:
      - 68
      - 422
      - 658
      - 128
      style: body
      type: text
      text: 'Tone balance is the first case: “the result of a selection and arrangement
        of contrasts in such way that each part of a design may keep its proper place
        without being unduly emphasized at the expense of other parts.” Black is the
        heaviest material on a white page; a little of it outweighs a great deal of
        grey.'
