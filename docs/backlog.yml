  - id:          "BL-187"
    title:       "Restore index-backed sentence-text search under row-level security"
    summary:     "RLS made the trigram index on sentences.text unreachable; candidate selection moves behind a BYPASSRLS SECURITY DEFINER helper."
    description: |
      Production, 2026-07-28: an ordinary one-word sentence search took 3,774 ms
      to return a single page of 200 rows, reading all 1,966,114 sentences
      (1,277 MB). Every query class in the #47 phrase-retrieval evaluation
      planned a sequential scan of `sentences`.

      `sentences.text` has carried a `gin_trgm_ops` index since migration 002
      (380 MB in production, valid, correct opclass). Migration 018 added the
      RLS `p_read` policy. PostgreSQL will not evaluate a non-leakproof qual
      ahead of a security qual, and both pattern operators are non-leakproof
      (`textlike`, `texticlike`): matching before the permission check could
      disclose that an unreadable document contains the search term. The planner
      therefore refused the index, and kept refusing under `enable_seqscan =
      off`, returning the sequential scan with the disable penalty because no
      alternative existed. The index was dead for every RLS-subject caller for
      more than a hundred migrations with nothing reporting it.

      Migration 148 adds `docray_readable_sentence_ids`: SECURITY DEFINER, owned
      by the BYPASSRLS batch writer (migration 114's invariant), pinned
      search_path, applying `docray_readable_documents()` explicitly in its body.
      RLS leaves the planner's way and the index is reachable again.

      Fixed arity of four scalar patterns, because only separate scalar ILIKE
      terms reach the index — `ILIKE ALL (array)` and an `unnest` form were both
      measured falling back to a scan. Unused slots take '%', which matches
      everything and yields no trigram. `adapters/sentence_search_sql.py` decides
      eligibility: confusable OR-plans and fold-matched terms keep the previous
      predicate, because reducing an OR to one branch would drop true matches
      rather than widen the superset, and a single-word term keeps its
      punctuation because match_plan treats %, _ and \ as data.

      The guarantee moves from the database into reviewed code, so the security
      behaviour is asserted: SECURITY DEFINER changes current_user but not the
      role GUC or session_user, so docray_effective_actor() still resolves the
      caller's principal. Cross-principal isolation, the admin path, and the
      definer-is-never-the-caller rule each have a test.

      Terms under three characters ('of', 'it') still scan; pg_trgm cannot
      extract a trigram from them. That is inherent and already the cheap case,
      because a non-selective predicate fills the candidate cap immediately.
    category:     "persistence"
    type:         "bug"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "A dead index on the primary retrieval surface is a user-facing regression that also blocks the #48 decision: the measured cost was blamed on the verification substrate a positional engine would replace, when it belonged to candidate generation."
    acceptance_criteria:
      - "The helper is SECURITY DEFINER, owned by a BYPASSRLS role, with a pinned search_path."
      - "It returns only sentences from documents the CALLER may read; a stranger sees nothing and an admin sees the tenant."
      - "The definer's own identity is never used as the caller's."
      - "Under RLS the trigram index is unavailable even with enable_seqscan off; in the definer context it is reachable."
      - "Padding slots with '%' does not prevent index use; sub-trigram terms are documented as scanning."
      - "A wildcard in a single-word term stays literal data, so searching 'quxscan%' does not match plain 'quxscan'."
      - "term_frequency's bounded scan routes through the helper and keeps one statement for the whole batch."
      - "Landing checklist green; version lockstep advanced to 1.54.0."
    dependencies: []
    references:
      - "db/migrations/148_readable_sentence_ids.sql"
      - "db/migrations/149_schema_version_1_54_0.sql"
      - "src/doc_ray/adapters/sentence_search_sql.py"
      - "src/doc_ray/adapters/persistence_read_terms.py"
      - "src/doc_ray/tests/test_sentence_search_definer_db.py"
      - "src/doc_ray/tests/test_sentence_search_index_usage_db.py"
      - "src/doc_ray/tests/test_indexable_patterns.py"
      - "docs/nlp_architecture.md"
    owner:        "shared"
    source:       "Measured during GitHub issue #47 (P8 evaluation); strict-TDD fix by Claude Opus 5 via Claude Code."
    tags:         ["retrieval", "postgres", "rls", "index", "performance", "security"]

  - id:          "BL-188"
    title:       "Route both sentence-search surfaces through the indexed candidate helper"
    summary:     "Completeness gating lets the keyset-paginated search paths use docray_readable_sentence_ids without moving a page."
    description: |
      BL-187 restored index-backed candidate selection but routed only
      `term_frequency`, whose bounded scan is a count and can accept an
      arbitrary capped subset. `search_sentences` and `search_phrase_sentences`
      were left on the old predicate because they order by (document title,
      sentence ordinal, id) with keyset pagination, and
      `docray_readable_sentence_ids` applies its LIMIT before any ordering:
      capping an unordered set and sorting the survivors returns a different
      page than sorting the whole match set and taking the first one.

      Resolved by completeness gating. The probe asks the helper for `cap + 1`
      rows. At or under the cap the helper enumerated the complete match set,
      the cap never bit, and ordering that set outside is identical to ordering
      the table — so the page is exact and the index did the work. Past the cap
      the set was truncated, and the query falls back to the pre-existing
      predicate unchanged.

      This puts the index where the measurement said the cost was. D-035
      records that the rare phrase is the expensive class — the scan must read
      the whole relation to prove few rows match (`Model Context Protocol`:
      1,974,077 rows removed by filter, 5,167 ms, to return 358) — and those
      are exactly the queries whose complete match set fits under a cap. The
      non-selective classes that truncate are already the cheap case (`of it`:
      54 ms p50), because the candidate cap fills immediately and LIMIT stops
      the scan.

      The helper's patterns are a superset of the original predicate: it splits
      a multi-word term into words and drops those that are short, confusable
      or fold-matched. The original predicate therefore stays in the outer
      query — load-bearing on the substring path, which has no verifier — and
      the restriction is applied as `s.id = ANY(...)`. Plain equality is
      leakproof where the pattern operators are not, so the primary key stays
      reachable to an ordinary RLS-subject caller: the definer helper pays for
      the one thing RLS forbids and hands back something the normal query can
      index by itself.

      An empty probe falls back rather than restricting to nothing. Empty is
      ambiguous — "no sentence matches" or "this connection resolves no
      readable documents" — and the second is what an RLS-exempt caller
      produces, one the old predicate showed every row. Restricting on it would
      turn "may read everything" into "may read nothing", silently and only for
      indexable terms.
    category:     "persistence"
    type:         "bug"       
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "The two paths BL-187 deferred are the ones the #47 evaluation actually measured, so the gate recorded for #48 stays priced against an unindexed candidate scan until they are routed."
    acceptance_criteria:
      - "A probe asks the helper for cap + 1 rows, and a result at or under the cap is treated as the complete match set."
      - "A routed page returns the same rows in the same order as the pre-existing predicate, across page boundaries and at page sizes that do not divide the result."
      - "A truncated probe, an unusable term, and an empty probe all fall back to the pre-existing predicate."
      - "The original predicate is re-applied outside the helper, so the superset never widens a substring answer."
      - "An id-restricted page reaches an index under plain RLS, with no definer involved."
      - "A stranger still sees nothing and an RLS-exempt caller still sees what it always saw, through both match modes."
      - "Landing checklist green; no schema change, so the version stays 1.54.0."
    dependencies: ["BL-187"]
    references:
      - "src/doc_ray/adapters/sentence_search_sql.py"
      - "src/doc_ray/adapters/persistence_sentence_search.py"
      - "src/doc_ray/tests/test_sentence_search_routing.py"
      - "src/doc_ray/tests/test_sentence_search_paging_db.py"
      - "src/doc_ray/tests/test_sentence_search_index_usage_db.py"
      - "src/doc_ray/tests/test_sentence_search_matching_db.py"
    owner:        "shared"
    source:       "GitHub issue #51 'Not covered'; strict-TDD implementation by Claude Opus 5 via Claude Code."
    tags:         ["retrieval", "postgres", "rls", "index", "pagination", "performance"]

  - id:          "BL-189"
    title:        "Intake preparation: pre-ingestion quality gate and manifest"
    summary:      "Nothing tells an operator whether a directory of documents is ingestible without ingesting it: encrypted PDFs, image-only scans with no text layer, spoofed extensions, and already-ingested duplicates are all discovered by the worker, after the blob is stored."
    description: |
      A `docray-prep scan` CLI walks a staging directory and writes an intake
      manifest: one record per file with a quality verdict (`ok` / `degraded` /
      `reject`) and coded reasons. No network, no writes, no database unless
      `--check-corpus` is passed — in which case the same SHA-256 the ingest
      core dedupes on answers "already in the corpus" before a byte is uploaded.
      The extension gate calls `extraction.is_supported_extension` so the tool
      and the worker cannot disagree about what ingests.
