  - id:          "BL-106"
    title:        "Upload extension is client-controlled and unchecked before the blob is stored"
    summary:      "mutation.py derives the stored object's extension straight from the attacker-supplied filename and persists the blob to the object store before extraction.py's format-allowlist check ever runs; the webapp's accept= attribute is a client-side-only hint with no server-side enforcement ahead of storage."
    description: |
      Confirmed live: the extension used to build the storage key in
      `mutation.py`'s ingest path comes directly from the uploaded
      filename, with the actual format/extension allowlist only enforced
      later in `extraction.py` when the worker picks up the job — meaning
      an arbitrary file with a spoofed or unexpected extension is written
      to the object store first, and only rejected (as an unrecognized
      format, leaving an untyped orphaned blob per BL-097) afterward.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "Storing first and validating later means a rejected upload still leaves attacker-controlled bytes with an attacker-chosen name/extension sitting in the object store, and widens the surface BL-088's zip/XML hardening is trying to close (an extension mismatch could route a crafted file through the wrong parser)."
    acceptance_criteria:
      - "The upload extension/format is validated against the same allowlist extraction.py uses before the blob is uploaded to the object store, not after."
      - "A test uploads a file with an unrecognized/spoofed extension and asserts no blob is persisted."
    dependencies: []
    references:
