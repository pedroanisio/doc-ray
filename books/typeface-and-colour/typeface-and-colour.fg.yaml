      type: text
      text: 'Two failures bound the principle. Repetition without change is monotony
        — the eye stops listening. Change without repetition is incident — the eye
        has nothing to learn. And rhythm cannot govern alone: “rhythm may enter into
        any arrangement; but rhythm without balance is a step toward ‘mob rule.’”
        Movement, in a composition as in a republic, wants a constitution.'
    - box:
      - 68
      - 612
      - 658
      - 80
      style: body
      type: text
      text: 'The plate opposite drums the three cases: monotone, measured progression,
        and noise — the same marks in each.'
