      - 54
      style: cap
      type: text
      text: 'Chevreul''s borders, drawn as beds on their ground of leaves — an author''s
        construction from his prescriptions. The green is not noise: it is the field
        that lets red bloom unpartnered, and the red bar marks the association he
        orders broken up.'
    - box:
