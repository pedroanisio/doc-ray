      style: body
      type: text
      text: 'Within the Latin tradition, the Roman capital reached its monumental
        form about two thousand years ago and has never been displaced. Johnston,
        writing in 1906, gave the reason plainly: since their full development, “the
        Roman Capitals have held the supreme place among letters for readableness
        and beauty.” They are the best forms for the grandest inscriptions, and the
        penman is told to study a fine monumental model — the Trajan Column inscription
        above all — and embody its virtues in his own hand.'
    - box:
      - 68
      - 462
      - 658
      - 168
      style: body
      type: text
      text: What followed was not replacement but adaptation. Scribes writing quickly
        rounded the capitals into uncials; smaller, faster hands became half-uncials;
        Charlemagne's schools regularised the minuscule; and when the first Italian
        printers needed models for their type, they did what designers still do —
        they went back. “The Italian type-founders of the fifteenth century sought
        out fine examples of old writing as models, and for their capitals studied
        the monumental Roman inscriptions.” Our lowercase is formalised handwriting;
        our capitals are architecture.
    - box:
      - 68
      - 672
      - 658
      - 100
      style: body
      type: text
      text: The lineage matters practically, not sentimentally. It explains why letters
        have the parts they have — why strokes swell and taper, why serifs finish
        a stem, why an italic slopes. Each is the fossil of a tool.
    - box:
      - 68
      - 905
      - 658
      - 88
      style:
        class: quote
        font_size: 19
        line_height: 1.45
      type: text
      text: “We have an excellent precedent in the Italian scribes who went back 300
        years for a model and gave us the Roman small-letter as a result.”
    - box:
      - 68
      - 1005
      - 658
      - 14
      style: attr
      type: text
      text: EDWARD JOHNSTON, WRITING & ILLUMINATING, & LETTERING (1906), PREFACE
