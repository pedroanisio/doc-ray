  - id:          "BL-057"
    title:        "Document collections: manual and rule-based smart collections"
    summary:      "There is no concept of grouping documents into collections anywhere in the schema, domain, or webapp — only per-document tags exist, and those aren't filterable."
    description: |
      Grepping for "collection" as a document-grouping concept across schema,
      migrations, and domain code returns nothing (only Python's own stdlib
      collections module). Needs a new first-class domain concept: manual
      collections a user curates explicitly, and smart/auto collections that
      match documents against a stored rule (metadata field, tag, doc_type,
      source, project, date range, or inferred topic) and update as new
      documents match. Smart-collection rule evaluation should reuse the same
      filter-predicate logic as BL-063 rather than inventing a second query
      language.
    category:     "webapp"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "medium"
    rationale:    "Without collections, the only way to group related documents today is per-document tags with no browse-by-tag UI — there is no unit of organization above a single document."
    acceptance_criteria:
      - "A user can create a manual collection and add/remove documents from it."
      - "A smart collection is defined by a stored rule and automatically includes matching documents, present and future."
      - "Collections are visible and navigable from the webapp document surface."
    dependencies:
      - "BL-063"
    references:
      - "db/migrations"
      - "webapp/templates/documents.html"
      - "src/doc_ray/entrypoints/api/query.py"
    owner:        "shared"
    source:       "Session finding 2026-07-05: document-surface UX/data-management capability audit (parallel webapp-UI and GraphQL/persistence reviews against 9 claimed product gaps). Completed 2026-07-12 with migrations 047/048 for manual and smart document collections, dynamic smart rules over doc_type/status/tags, and webapp collection list/detail/create/add/remove workflows."
    tags:         ["webapp", "api", "persistence", "organization", "collections"]

  - id:          "BL-058"
    title:        "Editable document metadata (rename, description, tags) with an audit log"
    summary:      "No GraphQL mutation or webapp route can rename a document or edit its title, description, or tags after ingestion — metadata is write-once at upload time."
    description: |
      All 11 mutations in src/doc_ray/entrypoints/api/mutation.py were
      enumerated (reannotate, delete_document, annotate_document,
      semantic_enrich_document, canonicalize_document, suggest_seeds,
      decide_seeds, seed_approved, create_backup, restore_backup,
      ingest_document) — none renames or edits a document's title,
      description, or tags post-ingestion; ingest_document only accepts a
      title at upload time. The tags/document_tags tables (migration
      004_normalize_4nf.sql) already model tags as normalized data and
      Document.tags is a real read field, but nothing ever writes to them
      after ingest. This is the sharpest gap found in the audit: an operator
      or user who spots a wrong title, a missing tag, or a typo has no path
      to fix it. Any new mutation here must write to a document-metadata
      change-history table (distinct from the existing document_provenance
      ingestion-event log and the resolution_review/canonical_merge
      entity-resolution audit trail, which cover different concerns) so every
      edit is attributable and reversible.
    category:     "api"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "This is the foundational gap: lifecycle states, bulk actions, AI-suggested refinements, and operator correction (BL-059/BL-060/BL-061/BL-062) all need a mutation surface to write to, and none currently exists."
    acceptance_criteria:
      - "A mutation exists to update a document's title, description, and tags after ingestion."
      - "Every metadata edit is recorded in a change-history table with who/when/before/after."
      - "The webapp exposes a form to make these edits and see the edit history."
    references:
      - "src/doc_ray/entrypoints/api/mutation.py"
      - "db/migrations/004_normalize_4nf.sql"
      - "src/doc_ray/adapters/persistence.py"
    owner:        "shared"
    related_decisions:
      - "D-001"
      - "D-010"
    source:       "Session finding 2026-07-05: document-surface UX/data-management capability audit (parallel webapp-UI and GraphQL/persistence reviews against 9 claimed product gaps). Implemented 2026-07-10 in worktree doc-mgmt-lane: migration 045 adds documents.description + the document_metadata_history table (RLS-scoped like document_provenance); persistence.update_document_metadata applies the edit and records one history row per changed field via the new update_metadata job kind (D-004/D-005's job-queue write pattern, matching every mutation but decide_seeds); updateDocumentMetadata enqueues it, documentMetadataHistory reads it back; the document page gained an inline edit form and a change-history card. Schema bumped to 1.11.0 (migration 046) — renumbered from the branch's original 043/044 during merge to resolve a numbering collision with BL-064's own 043/044, which landed on main first."
    tags:         ["api", "webapp", "metadata", "audit-log"]

  - id:          "BL-059"
    title:        "Document lifecycle states beyond ingestion status (archive, soft-delete, restore)"
    summary:      "documents.status only ever takes pending/extracted/failed (an ingestion-pipeline state); delete_document is a hard cascade with no per-document undo."
    description: |
      db/migrations/001_init.sql defines documents.status with values
      pending|extracted|failed, set only by the ingestion pipeline
      (src/doc_ray/... pipeline.py). handle_delete (src/doc_ray/application/
      jobs.py) performs a hard cascading DELETE; KIND_RESTORE only restores a
      whole-corpus backup archive (src/doc_ray/application/backup.py), not a
      single document. There is no draft/reviewed/archived state, and no
      per-document soft-delete-then-restore path — an accidental delete
      today is unrecoverable short of a full corpus restore. This needs new
      lifecycle states layered on top of (not replacing) the existing
      ingestion status, a soft-delete flag or archived_at timestamp, and a
      restore path scoped to one document. State transitions should log to
      the same change-history mechanism introduced by BL-058.
    category:     "persistence"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "high"
    rationale:    "Hard-delete-only with no per-document restore is a real operational risk: the only recovery path today is a full-corpus backup restore, which is disproportionate for a single accidental delete."
    acceptance_criteria:
      - "documents supports at least one lifecycle state beyond ingestion status (e.g. archived) distinct from pending/extracted/failed."
      - "A deleted document can be restored individually, without restoring the whole corpus from backup."
      - "Every lifecycle-state transition is recorded in the BL-058 change-history table."
    dependencies:
      - "BL-058"
    references:
      - "db/migrations/001_init.sql"
      - "src/doc_ray/application/jobs.py"
      - "src/doc_ray/application/backup.py"
    owner:        "shared"
    related_decisions:
      - "D-007"
      - "D-010"
    source:       "Session finding 2026-07-05: document-surface UX/data-management capability audit (parallel webapp-UI and GraphQL/persistence reviews against 9 claimed product gaps). Implemented 2026-07-12 with migrations 051/053 adding document lifecycle columns and lifecycle_state history support, migration 052 bumping schema/package version to 1.14.0, soft-delete semantics for delete jobs, archive/restore job handlers, and GraphQL lifecycle fields plus archiveDocument/restoreDocument mutations."
    tags:         ["persistence", "api", "lifecycle", "soft-delete", "restore"]

  - id:          "BL-060"
    title:        "Bulk actions for documents (tag, archive, move, delete)"
    summary:      "Bulk approve/reject exists for KB seed suggestions (decide_seeds), but every document-affecting mutation takes exactly one document_id — there is no bulk tag, archive, or delete for documents."
    description: |
      seeding.html's per-row checkboxes and decide_seeds' approve_ids/
      reject_ids lists (mutation.py) are the only bulk pattern in the
      codebase, and they operate on seed_suggestion rows, not documents.
      delete_document, reannotate, annotate_document, canonicalize_document,
      and the metadata-edit mutation from BL-058 all take a single
      document_id. Organizing more than a handful of documents one at a time
      does not scale. Needs bulk variants (or a shared batch wrapper) for
      tag, archive (BL-059), and delete, plus a multi-select UI pattern on
      the document list matching the one already proven on seeding.html.
    category:     "api"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "Without bulk actions, correcting or organizing metadata across a corpus means repeating the same single-document mutation once per document — the seeding screen already proves the checkbox+bulk-button pattern works in this webapp."
    acceptance_criteria:
      - "A document list supports multi-select via checkboxes, matching the existing seeding.html pattern."
      - "At least bulk-tag and bulk-archive operations are available from the selection."
      - "Each bulk operation records one change-history entry per affected document (BL-058)."
    dependencies:
      - "BL-058"
      - "BL-059"
    references:
      - "webapp/templates/seeding.html"
      - "src/doc_ray/entrypoints/api/mutation.py"
