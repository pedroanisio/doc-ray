      - "python-pptx is added as an explicit, version-pinned dependency, guarded the same optional-import way extract_docx guards python-docx."
      - "doc_type='pptx' is recorded and the upload form/route accepts .pptx end-to-end, from webapp upload through job processing to a queryable document row."
