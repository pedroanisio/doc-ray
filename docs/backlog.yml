  - id:          "BL-176"
    title:       "MCP clients were bound to an in-memory transport session lost on restart"
    summary:     "FastMCP used its stateful default even though every doc-ray capability is unary and externally authorized, so a valid next request could 404 after a restart or on another replica."
    description: |
      `build_server` now sets `stateless_http=True`. The SDK creates a fresh
      transport for every request, does not issue or look up process-local MCP
      session ids, and treats each request as initialized. Initialization and
      later calls can therefore land on different processes without sticky
      routing or a shared session store.

      This is safe for the live surface: tools, resources, and prompts retain no
      conversation/task state and delegate durable work to independently
      authorized GraphQL/Postgres operations. Bearer tokens are still resolved
      from the live request, so credential rotation and per-request RLS identity
      remain correct. Event replay/resumable server streams are not advertised
      and no current capability depends on them.
