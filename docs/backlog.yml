  # ============================= SECURITY ===============================

  - id:          "BL-012"
    title:        "Per-principal LOGIN roles for hostile-direct-SQL isolation"
    summary:      "Current RLS trusts the app tier to set app.principal_id; a hostile docray_client could impersonate."
    description: |
      The webapp enforces RLS by SET ROLE docray_client + set_config('app.principal_id').
      This is safe only while the DB client is a trusted application tier: the
      principal comes from a server-side session GUC, never user input. A hostile
      actor with direct SQL access as docray_client could set an arbitrary
      app.principal_id and impersonate any principal. Closing this requires
      per-principal LOGIN roles (or an equivalent DB-enforced identity), so the
      principal is authenticated by the database rather than asserted by the client.
      (docray superuser intentionally bypasses RLS as the trusted batch writer and
      must NOT be switched to docray_client.)
    category:     "security"
    type:         "feature"
    status:       "parked"
    complexity:   "L"
    priority:     "medium"
    rationale:    "The session-GUC principal is only a trust-boundary assumption; direct-SQL access breaks tenant isolation."
    acceptance_criteria:
      - "Principal identity is authenticated by the database, not asserted by the client connection."
      - "A docray_client-level actor cannot impersonate another principal by setting a GUC."
      - "The trusted batch-writer (superuser) path is unchanged."
    related_decisions: ["D-010"]
    references:
      - "engineering_decisions.yml — D-010 (RLS; API sets the principal)"
      - "db/migrations/018_rbac.sql"
      - "webapp/app.py"
    owner:        "shared"
    source:       "Session RLS operational notes — trust boundary of the app-tier-asserted principal."
    tags:         ["rls", "rbac", "multi-tenant", "trust-boundary"]

