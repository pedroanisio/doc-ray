      style: body
      type: text
      text: 'The manuscript tradition is a complete theory of accent colour. One hue,
        reserved for structure — headings, initials, emphasis — never for the text
        itself; used sparingly enough that its every appearance is information. “Italics
        — either in black or red — go best with Roman characters,” Johnston adds:
        the accent may be a colour or a voice, but it is one accent. This book''s
        red follows the rule it describes.'
