  - id:          "BL-166"
    title:       "search_sentences broke its own literal-substring promise; an empty semantic ranking was returned as a finding"
    summary:     "Reviewer evidence: `Hick's` returned a confident zero (the corpus stores `Hick’s`) and the note called that scan exhaustive; `Hick` returned `thick`/`thickness`, which the reviewer read as lemma normalization and then as proof that search_sentences had two matching semantics under one name. Separately, semantic_search_sentences scoped to an unembedded document returned `{\"result\": []}`, recorded as 'no semantically similar sentences in this book'."
    description: |
      Two retrieval tools, one failure mode: a bounded, technically-true result
      presented in a shape the caller can only read as a fact about the corpus.

      (1) `search_sentences` — the promise was not kept. The tool description
      says "keyword-in-context search"; `domain/term_frequency.py` documents the
      actual rule (case-insensitive literal substring) where a caller never
      looks; the zero-hit note states it only AFTER the wasted call. Three
      implementation gaps under that:

        a. `%` and `_` were forwarded to Postgres as LIKE wildcards, so
           `shared_buffers` also matched `sharedXbuffers` — on exactly the term
           class BL-164 redirects to this tool ("its literal-substring match
           handles this term directly; use it to find out").
        b. No typographic folding. PDF/EPUB extraction preserves `’`, `“”`,
           en/em dashes; a caller types the ASCII forms. `Hick's law` therefore
           returned 0 hits against a book that uses the phrase throughout — and
           BL-164's `coverage.exhaustive` then certified that zero as a complete
           scan, which is a false negative wearing a completeness badge.
        c. `_split_kwic` used `str.partition` (case-SENSITIVE) to window a match
           found by `ILIKE` (case-INSENSITIVE), so a legitimate hit could return
           an empty `hit` with the whole sentence in `pre`.

      The reviewer's own diagnosis — "two matching semantics under one name,
      lemma corpus-wide and substring when scoped" — is refuted: there is one
      predicate and `document_id` only adds a `WHERE`. `thick` matched because it
      contains `hick`. But the misdiagnosis was reachable only because the
      description never stated the retrieval model, so it is treated as the
      report of a real defect in the description, not as a fact about matching.

      The webapp's keyword route carried its own copy of the same SQL and the
      same `partition` split, so both surfaces were wrong in the same three ways
      independently — the drift the shared read adapter exists to prevent.

      (2) `semantic_search_sentences` — the ranking applies NO similarity floor
      (`ORDER BY vector <=> query LIMIT n`), so zero rows cannot mean "nothing
      was similar"; it can only mean nothing in scope was embedded. Embedding is
      opt-in per document (`embed_document_sentences` is worker-only and never
      auto-chained) and a model cutover leaves prior-model vectors invisible
      behind the `e.model` filter, so an unembedded scope is the normal case.
      Returning `[]` made the fabricated reading the natural one — and the same
      ambiguity was baked into the eval fixture, whose comment recorded "returns
      an empty result ... counts as reachable".

      Fix. One matching rule in `domain/search_terms.py` (escape LIKE
      metacharacters; fold `'`/`’`, `-`/`–`/`—`, `"`/`“`/`”`; case- and
      fold-aware KWIC that reports the DOCUMENT's spelling), rendered to SQL by
      `adapters/sentence_search_sql.py` and used by both the read adapter and the
      webapp route. The fold is 1:1 and length-preserving so citation offsets
      stay exact, and a term with no confusables still expands to exactly one
      pattern, so the `gin_trgm_ops` index is used as before; ≥3 confusables
      exceed the 16-pattern ceiling and fall back to a `translate()`-folded
      column (correct, index-degraded, rare). The tool description now leads with
      the retrieval model, and `test_mcp_p0.py` fails the build if it stops doing
      so. Semantic search fails typed (`not_found`) naming the document to embed
      — at the AGENT boundary only: the `BriefingReader` port still receives an
      empty page, because `_probe_semantic` already distinguishes `no_vectors`
      from `unavailable` and reports a sharper gap than the error would.
      Statement timeouts classify as a typed `timeout` with a narrow-the-scope
      hint instead of a bare `upstream_error` (the corpus-wide latency itself is
      BL-167).

      Worth recording: both non-agent surfaces already handled this correctly —
      the port with its four-state probe, the webapp by falling back to keyword
      results with a notice. Only the agent surface returned the bare `[]`.

      Side effect: `test_mcp_eval::test_full_scripted_run_passes_every_task`, one
      of BL-165's five host-run failures, now passes. Its semantic step is
      declared `expect_error=True` — the fixture document has no vectors, so a
      typed failure is the expected outcome on every host, and the generic
      `no_unexpected_tool_error` short-circuit was firing on the `unsupported`
      half of the outcome the task's own assertion documents as correct.
    category:     "api"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "PALS's LAW applied to retrieval again (cf. BL-164): both defects produced confident, actionable, WRONG negative claims about corpus content — the exact output an agent quotes into a deliverable. A completeness signal (coverage.exhaustive) attached to a matcher that silently under-matched is worse than no signal, because it converts a query bug into evidence of absence."
    acceptance_criteria:
      - "A term typed with ' matches text stored with ’ (and -/–/— , \"/“/”), in both the API/MCP read path and the webapp keyword route."
      - "% and _ in a term are matched literally, never as LIKE wildcards."
      - "A KWIC window for a case-insensitive hit is populated and quotes the document's spelling, not the caller's."
      - "A term with no confusable characters still produces exactly one ILIKE pattern (trigram index preserved)."
      - "search_sentences' own description states the substring rule and that scoped and corpus-wide matching are identical; a build gate enforces it."
      - "semantic_search_sentences never returns [] — an unembedded scope fails typed, naming embed_document_sentences, and briefing_pack degrades to lexical instead of failing."
      - "A Postgres statement timeout surfaces as kind 'timeout' with a narrowing hint, not upstream_error."
    dependencies: []
    references:
      - "src/doc_ray/domain/search_terms.py"
      - "src/doc_ray/adapters/sentence_search_sql.py"
      - "src/doc_ray/adapters/persistence_read.py"
      - "src/doc_ray/entrypoints/mcp/semantic.py"
      - "src/doc_ray/entrypoints/mcp/corpus.py"
      - "webapp/search_web.py"
      - "src/doc_ray/tests/test_search_terms.py"
      - "src/doc_ray/tests/test_sentence_search_matching_db.py"
      - "src/doc_ray/tests/test_mcp_semantic_absence.py"
      - "docs/mcp-service.md"
    owner:        "shared"
    source:       "Field report from an agent that used 10 of 62 MCP tools over ~15 calls to build a corpus-grounded deliverable (2026-07-27). Root-caused and fixed the same session (Claude Opus 5 via Claude Code): the substring/lemma claim was refuted against persistence_read.search_sentences, and the escaping, folding and KWIC defects were found while verifying it."
    tags:         ["mcp", "retrieval", "false-negative", "grounding", "search", "semantic"]

  - id:          "BL-167"
    title:       "Corpus-wide semantic_search_sentences exhausts the API statement timeout"
    summary:     "A reviewer's corpus-wide semantic_search_sentences call hit the API pool's statement_timeout (DOCRAY_API_STATEMENT_TIMEOUT_MS, default 15s) against the production corpus; the same query scoped with document_id returned. BL-166 typed the failure ('timeout' + a narrow-the-scope hint) but did not measure or fix the cost."
    description: |
      Reported, not reproduced here: the timeout needs the production corpus's
      embedding volume and RLS shape, which a throwaway test database does not
      have. What is known from the code:

        - `persistence_semantic_read.semantic_search_sentences` sets
          `hnsw.iterative_scan = 'relaxed_order'` precisely because HNSW returns
          its candidate set BEFORE the RLS and `e.model` filters apply, so a
          plain top-N can under-return for a non-admin principal.
        - Iterative scan trades that correctness for an unbounded-until-satisfied
          scan: the more rows the filters reject, the further it walks. Unscoped,
          there is no `document_id` predicate to cut the candidate space.
        - `hnsw.max_scan_tuples` / `hnsw.scan_mem_multiplier` are not set, so the
          scan runs on pgvector defaults.

      Any fix must be measured, not guessed: an `EXPLAIN (ANALYZE, BUFFERS)` of
      the unscoped query on the production corpus, per principal shape (admin vs
      RLS-scoped), before choosing between an explicit `max_scan_tuples` bound, a
      per-query timeout below the pool default, or a partial/model-scoped index.
      Bounding the scan changes what the tool returns, so the honesty question
      travels with the perf question: a truncated ranking must say so in the
      payload, exactly as `search_sentences` says `limit_reached`.
    category:     "persistence"
    type:         "bug"
    status:       "ready"
    complexity:   "M"
    priority:     "medium"
    rationale:    "A capability that times out at its default scope is a capability agents stop reaching for. Typing the error (BL-166) keeps the caller from concluding the server is broken, but it does not give them the corpus-wide semantic search the tool advertises."
    acceptance_criteria:
      - "A corpus-wide semantic_search_sentences call at default limit completes within the API statement timeout on the production corpus, for both an admin and an RLS-scoped principal, with EXPLAIN (ANALYZE, BUFFERS) output recorded in the item."
      - "If the fix bounds the scan, a truncated ranking is declared in the payload — never returned as if complete."
      - "The RLS under-return that hnsw.iterative_scan exists to prevent does not regress: a scoped principal still gets a full page when one is available."
    dependencies: ["BL-166"]
    references:
      - "src/doc_ray/adapters/persistence_semantic_read.py"
      - "src/doc_ray/entrypoints/api/semantic_query.py"
      - "src/doc_ray/config.py"
      - "docs/runbook-corpus-embeddings.md"
    owner:        "shared"
    source:       "Same 2026-07-27 field report as BL-166: the reviewer's corpus-wide semantic call timed out while the document-scoped call returned. Not reproduced against a test database — the code-level reasoning above is from persistence_semantic_read.py, and the measurement is the first acceptance criterion."
    tags:         ["semantic", "performance", "pgvector", "hnsw", "rls"]

  - id:          "BL-168"
    title:       "The arXiv source adapter shipped reachable only from a shell"
    summary:     "1.48.2 added the DocumentSource port and its arXiv adapter, but `ingest_refs` had exactly one caller — `entrypoints/cli.py`. `ingestDocument` took `file: Upload!` with no reference argument, the webapp upload form was a file input only, and MCP had no ingest tool at all. A capability nobody but an operator with SSH could use was documented in the public release note as something readers could do."
    description: |
      Root cause. The adapter work stopped at the application layer. Nothing
      structurally prevented the surfaces from being wired — they simply were
      not, and no gate caught it: D-034 surface parity compares GraphQL root
      fields against webapp coverage, so a capability with NO GraphQL field is
      invisible to it. The parity gate can prove "every API field has a human
      surface"; it cannot prove "every capability has an API field".

      Fix. `ingestDocument` now takes exactly one of `file` (multipart upload)
      or `ref`. Resolution against the source registry happens at the API, so an
      unclaimable reference is a caller error rather than a queued job that could
      only fail; the fetch happens in the worker (`job_handlers_ingest.py`), so
      no request is held open on a remote download. The webapp upload form gains
      a reference field beside the file picker and posts a plain JSON mutation
      for that route (no file part to map). MCP gains `ingest_document(ref,
      title?, pipeline=True)` — an agent has no file transport, so a reference is
      its only route into the corpus. Title precedence is caller > source >
      extractor.

      Not fixed here (deliberate): the parity gate still cannot see a
      capability that has no GraphQL field. Detecting that class of gap needs a
      different invariant than field-to-surface parity, and defining it is an
      operator call.
    category:     "api"
    type:         "bug"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "Shipping an intake path that only its author can invoke is indistinguishable, from a user's seat, from not shipping it — and the release note claimed otherwise, which is worse than silence."
    acceptance_criteria:
      - "ingestDocument accepts a ref and rejects a call carrying both a file and a ref, or neither, naming both options in the message."
      - "A reference no source adapter claims is rejected by the mutation; no job is enqueued."
      - "A blank/whitespace ref alongside a file is treated as an absent field, not a second intake route (browsers post empty text inputs)."
      - "The worker resolves and fetches the reference, records source_url provenance, and applies caller > source > extractor title precedence."
      - "The webapp upload form offers the reference field and its file input is no longer `required`, so the reference route is reachable in a browser."
      - "MCP registers ingest_document behind DOCRAY_MCP_ENABLE_WRITE, and it is covered by the schema-contract, server-registry, and service-doc gates."
      - "The upload route is unchanged: the BL-106 extension allowlist still rejects an unsupported type before the blob is stored."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/mutation_ingest.py"
      - "src/doc_ray/application/job_handlers_ingest.py"
      - "src/doc_ray/entrypoints/mcp/mutations.py"
      - "webapp/corpus_web.py"
      - "webapp/templates/upload.html"
      - "src/doc_ray/tests/test_api_ingest.py"
      - "src/doc_ray/tests/test_jobs_worker_ingest_ref.py"
      - "src/doc_ray/tests/test_mcp_mutations_ingest.py"
    owner:        "shared"
    source:       "Found 2026-07-27 (Claude Opus 5 via Claude Code) answering 'is all the UI/UX in place to operate those features?' after the 1.48.2 release: ingest_refs had one caller, and D-034 passed because the capability had no GraphQL field to be checked against."
    tags:         ["ingest", "arxiv", "graphql", "mcp", "webapp", "surface-parity"]

  - id:          "BL-169"
    title:       "A failed document told operators to act without telling them what was wrong"
    summary:     "`documents.error` holds the actionable half of an ingest failure ('no extractable text — scanned/image-only file? OCR required before ingest'). The webapp loaded it via `SELECT * FROM documents` and never rendered it, showing only a status pill whose tooltip said 'needs operator attention before retrying'. The admin console had a status filter whose options — ready / processing / failed — included two values no document has ever carried, against an exact-match query."
    description: |
      Root cause, both halves.

      (1) `webapp/templates/document.html` rendered `terms.status_pill(doc.status)`
      and nothing else. The error text was in scope the whole time. An operator
      was told to act and had to reach psql to learn what the action was.

      (2) `admin-console/src/pages/DocumentsPage.tsx` offered `ready` and
      `processing`. `application/pipeline.py` writes only `extracted` and
      `failed`, and `documents(status:)` is an exact match
      (`persistence_read.py`), so those two options could only ever render
      "No documents match" — a filter that looks like an empty corpus rather
      than a wrong query. The console also never requested `Document.error`.

      Fix. The reader renders the recorded reason for a failed document, plus
      why re-ingesting the same bytes cannot help (content-addressed dedup
      recognises the identical copy and reports the same failure). A failure with
      no recorded reason says so rather than rendering an empty box. The console
      filters on the values that exist and shows the reason under the badge.
    category:     "webapp"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "An instruction to act, with the cause withheld, is worse than no message: it costs the operator a database session to recover information the page already had in hand."
    acceptance_criteria:
      - "A failed document's page renders its recorded error and the reason re-ingesting identical bytes cannot help."
      - "A failed document with a null error renders an explicit 'no reason was recorded' notice, not an empty box."
      - "A healthy document renders no failure notice at all."
      - "The admin console's status options are exactly the values the corpus stores (extracted, failed) and the selected value reaches the query."
      - "The console requests Document.error and renders it for failed rows only."
    dependencies: []
    references:
      - "webapp/templates/document.html"
      - "admin-console/src/pages/DocumentsPage.tsx"
      - "admin-console/src/api/documents.ts"
      - "admin-console/src/pages/DocumentsPage.test.tsx"
      - "tests/test_webapp.py"
    owner:        "shared"
    source:       "Found 2026-07-27 (Claude Opus 5 via Claude Code) auditing whether the 1.48.2 failed-vs-duplicate change was operable from any UI; the 17 failed documents in production were all the same scanned-PDF cause, visible only through psql."
    tags:         ["webapp", "admin-console", "operability", "error-reporting"]

