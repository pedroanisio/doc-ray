# doc-ray — PRODUCTION overlay for MANAGED services (DO Managed Postgres + Spaces).
#
# WHY THIS EXISTS: the base docker-compose.yml runs Postgres + MinIO as
# containers AND hardcodes, in every app service's `environment:`,
#   DATABASE_URL=...@postgres:5432   S3_ENDPOINT=http://minio:9000
# which OVERRIDE .env — so just setting DATABASE_URL in .env does not reach the
# containers. Each app service also `depends_on: postgres/minio`, so naming only
# the app services still drags the local database + object store up.
#
# This overlay:
#   1. repoints every app service at the managed cluster + Spaces (values flow
#      from .env via the x-managed-env anchor), and
#   2. severs their depends_on, and
#   3. gates the local infra (postgres, minio, createbucket) behind the
#      `local-infra` profile — never enabled in prod — so even a bare `up`
#      cannot start them. Overlays can override a service but not delete it;
#      a never-enabled profile is how you keep one out of the default set.
#
# Because (2) removes every remaining dependency on the gated services, the
# project stays valid with them absent. A bare
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# is therefore safe, but prefer the ergonomic Makefile targets:
#   make prod-migrate   # apply the schema to the managed cluster (one-shot)
#   make prod-up        # migrate, then start api + workers + backup-scheduler
#   make gpu-up         # GPU annotate workers on an H200 box (adds the gpu overlay)
# Add `webapp` / `nginx` to the up list only if you serve the browser UI / TLS here.
#
# Requires in .env: DATABASE_URL (managed cluster, ?sslmode=require) and the
# S3_* Spaces settings. Keep a POSTGRES_PASSWORD=<any-value> line in .env too:
# the base compose hardcodes ${POSTGRES_PASSWORD} in every service's connection
# string, and Compose interpolates the WHOLE base file at load (before merge) —
# so the var must resolve even though the local postgres container never starts
# here. The value is otherwise unused in managed prod.
#
# Local login/register works here without any extra overlay: the auth / SMTP /
# public-base-URL / lockout / rate-limit pass-throughs live in the base compose
# (api + webapp), so they flow from .env in prod too. Set the real values there
# (DOCRAY_AUTH_*, DOCRAY_SMTP_*, DOCRAY_PUBLIC_BASE_URL, DOCRAY_API_JWT_SECRET).

x-managed-env: &managed-env
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the managed Postgres cluster (append ?sslmode=require)}
  S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT to your Spaces endpoint (https://<region>.digitaloceanspaces.com)}

services:
  # --- App services: repoint at managed, drop the local-infra dependencies. ---
  migrate:
    depends_on: !reset {}
    environment: *managed-env

  api:
    depends_on: !reset {}
    environment: *managed-env
    # Base binds 0.0.0.0:8000 for local-dev convenience; in prod that publishes
    # raw, TLS-less GraphQL on the public IP. Reachable intra-network as
    # http://api:8000 (webapp) and externally only via nginx, so drop the public
    # bind to loopback (host curl/ops still works over the SSH tunnel).
    # !override REPLACES the base ports list — a plain merge would APPEND and
    # leave the 0.0.0.0 bind in place alongside it.
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # uvicorn is production-grade; run a small worker pool for concurrency. Each
    # worker holds its own pool (≤ DOCRAY_API_POOL_MAX_SIZE); 2×10 stays well
    # under the managed cluster's ~97 backends.
    entrypoint:
      ["uvicorn", "doc_ray.entrypoints.api.app:app",
       "--host", "0.0.0.0", "--port", "8000", "--workers", "${DOCRAY_API_WORKERS:-2}"]

  worker:
    depends_on: !reset {}
    environment: *managed-env

  worker-fast:
    depends_on: !reset {}
    environment: *managed-env

  backup-scheduler:
    depends_on: !reset {}
    environment: *managed-env

  webapp:
    depends_on: !reset {}
    # Per-user RLS on the webapp's direct DB reads needs the docray_api role:
    # docray_current_principal() honours the per-session app.principal_id ONLY for
    # docray_api, so the base default (docray_client) silently yields an empty
    # corpus once browser auth is on. Default it to docray_api here (overridable)
    # rather than depend on an .env line surviving every recreate; the webapp also
    # refuses to boot on a mismatch (see webapp/app.py _assert_db_role_...).
    environment:
      <<: *managed-env
      DOCRAY_DB_ROLE: ${DOCRAY_DB_ROLE:-docray_api}
    # Production WSGI server. Base runs `flask run` (Werkzeug dev server,
    # "do not use in production"); gunicorn with gthread workers suits the
    # webapp's blocking I/O (DB reads + HTTP to the api). --timeout 120 so large
    # uploads (DOCRAY_MAX_UPLOAD_MB) are not cut off. Requires
    # DOCRAY_WEBAPP_SECRET_KEY to be set — otherwise each worker signs session/
    # CSRF cookies with its own random key and requests fail across workers.
    #
    # WORKERS DEFAULT TO 1: the browser auth session store
    # (webapp.auth_session.InMemoryAuthSessionStore) is PROCESS-LOCAL, so a login
    # handled by one worker is invisible to the others — every request has a
    # ~(n-1)/n chance of "webapp authentication required". Concurrency comes from
    # --threads, which share the process (and the store). Raising
    # DOCRAY_WEBAPP_WORKERS>1 REQUIRES first swapping in a shared (DB-backed)
    # session store; see the store's class docstring.
    entrypoint:
      ["gunicorn", "webapp.app:app", "--bind", "0.0.0.0:5001",
       "--workers", "${DOCRAY_WEBAPP_WORKERS:-1}", "--threads", "8",
       "--worker-class", "gthread", "--timeout", "120",
       "--access-logfile", "-", "--error-logfile", "-"]

  # Opt-in ops monitor (base keeps it on the `ops` profile). Repoint it and drop
  # its local-postgres dependency, so `--profile ops` works against managed too —
  # otherwise enabling that profile in prod fails with "depends on undefined
  # service postgres" once postgres is gated out below.
  db-health-monitor:
    depends_on: !reset {}
    environment: *managed-env

  # --- Local infra: replaced by the managed cluster + Spaces. Parked on the
  #     `local-infra` profile (never enabled in prod) so a bare `up` skips them. ---
  postgres:
    profiles: ["local-infra"]

  minio:
    profiles: ["local-infra"]

  createbucket:
    profiles: ["local-infra"]
