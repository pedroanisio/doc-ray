  - id:                 "D-008"
    title:              "GraphQL safety: depth + complexity limits, keyset pagination"
    version_introduced: "0.1.0"
    category:           "security"
    decision: |
      The GraphQL schema enforces query depth and complexity/cost limits, and every
      list field clamps its page size to MAX_PAGE_SIZE with offset paging (limit +
      offset, optionally document-scoped) so full result sets stay enumerable
      without unbounded slices. Relay keyset cursors remain a possible future
      upgrade if offset paging proves too weak at scale; they are not implemented.
    rationale: |
      The graph is deeply recursive (token.head.head..., constituent.parent...);
      without limits a single query can melt Postgres or return hundreds of MB.
      Clamped limit+offset shipped with the DevX surface and covers enumeration;
      cursors would only add stability under concurrent writes, which reads here
      (append-only corpus) rarely need.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/entrypoints/api/extensions/**/*.py"]
    claims:
      - claim_id:    "D-008.k1"
        claim_text:  "The schema installs a query-depth limiter and a token (complexity) limiter."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-008.k1.c1"
            description: "The schema installs a QueryDepthLimiter."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/schema.py"
            pattern:     'QueryDepthLimiter'
            expect:
              present:   true
          - check_id:    "D-008.k1.c2"
            description: "The schema installs a MaxTokensLimiter (complexity proxy)."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/schema.py"
            pattern:     'MaxTokensLimiter'
            expect:
              present:   true

  - id:                 "D-009"
    title:              "Pluggable extractor & analyzer registries"
    version_introduced: "0.1.0"
    category:           "extensibility"
    decision: |
      Document extractors are dispatched through a registry (_EXTRACTORS in
      adapters/extraction.py); a new file type is a new adapter + one registration.
      Analyzers follow the annotator port. The queue gets the same treatment via a
      Queue port so backends are swappable.
    rationale: |
      Open for extension, closed for modification: new capabilities arrive as new
      files, not edits to dispatch code.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/adapters/extraction.py", "src/doc_ray/ports/annotator.py"]
    claims:
      - claim_id:    "D-009.k1"
