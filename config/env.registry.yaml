variables:
- key: DOCRAY_API_ALLOW_ANONYMOUS
  group: auth
  description: When true, unauthenticated API requests run as an anonymous, RLS-scoped principal instead
    of being rejected. Turn off to require a token on every request.
  default: 'true'
  secret: false
  scope: app
  prod: 'false'
- key: DOCRAY_API_JWT_AUDIENCE
  group: auth
  description: Expected `aud` claim on locally issued API JWTs. Empty disables audience checking.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_API_JWT_ISSUER
  group: auth
  description: '`iss` claim stamped on, and verified for, locally issued API JWTs.'
  default: doc-ray
  secret: false
  scope: app
- key: DOCRAY_API_JWT_SECRET
  group: auth
  description: Locally issued API JWTs (BL-071/BL-072). Set DOCRAY_API_JWT_SECRET to enable /auth/token
    exchange from a valid static credential. Access tokens are short-lived; refresh tokens allow rotation
    without reusing the static secret.
  default: null
  secret: true
  scope: app
- key: DOCRAY_API_JWT_TTL_SECONDS
  group: auth
  description: Lifetime of a locally issued API access token, in seconds.
  default: '900'
  secret: false
  scope: app
- key: DOCRAY_API_OIDC_ALLOW_STATIC_TOKEN_FALLBACK
  group: auth
  description: When true, the API still accepts static DOCRAY_API_TOKENS after OIDC is configured. Keep
    false in production so OIDC is the only path.
  default: 'false'
  secret: false
  scope: app
- key: DOCRAY_API_OIDC_AUDIENCE
  group: auth
  description: Expected `aud` claim on OIDC access tokens presented to the API.
  default: null
  secret: false
  scope: app
- key: DOCRAY_API_OIDC_AUTO_CREATE_PRINCIPALS
  group: auth
  description: When true, a valid OIDC token for an unknown subject provisions a new principal on first
    use instead of being rejected.
  default: 'false'
  secret: false
  scope: app
- key: DOCRAY_API_OIDC_ISSUER
  group: auth
  description: OIDC issuer URL the API trusts; its discovery document supplies the signing keys.
  default: null
  secret: false
  scope: app
- key: DOCRAY_API_OIDC_JWKS_JSON
  group: auth
  description: Inline JWKS (JSON) overriding OIDC discovery — for airgapped or pinned-key deployments.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_API_REFRESH_TOKEN_TTL_SECONDS
  group: auth
  description: Lifetime of an API refresh token, in seconds. Refresh tokens rotate access tokens without
    reusing the static secret.
  default: '86400'
  secret: false
  scope: app
- key: DOCRAY_API_TOKENS
  group: auth
  description: Leave empty for local anonymous access scoped by database RLS.
  default: null
  secret: true
  scope: app
- key: DOCRAY_AUTH_EMAIL_VERIFICATION_TTL_SECONDS
  group: auth
  description: How long an email-verification link stays valid, in seconds.
  default: '86400'
  secret: false
  scope: app
- key: DOCRAY_AUTH_EXPOSE_VERIFICATION_TOKEN
  group: auth
  description: 'TEST/dev only: when true, the registration response returns the raw verification token
    instead of only emailing it. Never enable in production.'
  default: 'false'
  secret: false
  scope: app
- key: DOCRAY_AUTH_LOCAL_ENABLED
  group: auth
  description: Local self-service registration/login. Admin principals remain seed/operator-managed; registered
    users receive the reader role and must verify email before login. Keep verification-token exposure
    false outside tests/local diagnostics; production should deliver the token by email.
  default: 'false'
  secret: false
  scope: app
- key: DOCRAY_AUTH_LOCKOUT_SECONDS
  group: auth
  description: How long an account is locked after too many failed logins, in seconds.
  default: '900'
  secret: false
  scope: app
- key: DOCRAY_AUTH_MAX_FAILED_LOGINS
  group: auth
  description: Failed-login attempts allowed before the account is locked for DOCRAY_AUTH_LOCKOUT_SECONDS.
  default: '10'
  secret: false
  scope: app
- key: DOCRAY_AUTH_REGISTRATION_ENABLED
  group: auth
  description: When true, the webapp exposes self-service local account registration. Requires DOCRAY_AUTH_LOCAL_ENABLED.
  default: 'false'
  secret: false
  scope: app
- key: DOCRAY_PRINCIPAL_ID
  group: auth
  description: Principal id stamped on every webapp DB request to enable row-level security. Unset means
    superuser passthrough — local/dev only.
  default: null
  secret: false
  scope: app
- key: DOCRAY_SCIM_TOKENS
  group: auth
  description: IdP is syncing principals/groups into /scim/v2/{tenant_id}.
  default: null
  secret: true
  scope: app
- key: DOCRAY_WEBAPP_OIDC_AUDIENCE
  group: auth
  description: Expected `aud` claim on OIDC tokens accepted by the webapp login flow.
  default: null
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_OIDC_AUTHORIZATION_URL
  group: auth
  description: OIDC browser login. Configure authorization + token endpoints, client id, and JWKS/issuer
    values. The API OIDC issuer/audience/JWKS settings are reused when the webapp-specific variants are
    unset.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_OIDC_CLIENT_ID
  group: auth
  description: OAuth2/OIDC client id the webapp uses for the Authorization Code login flow.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_OIDC_CLIENT_SECRET
  group: auth
  description: OAuth2/OIDC client secret paired with DOCRAY_WEBAPP_OIDC_CLIENT_ID.
  default: ''
  secret: true
  scope: app
- key: DOCRAY_WEBAPP_OIDC_ISSUER
  group: auth
  description: OIDC issuer URL for the webapp login flow; supplies discovery + signing keys.
  default: null
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_OIDC_JWKS_JSON
  group: auth
  description: Inline JWKS (JSON) overriding OIDC discovery for the webapp login flow.
  default: null
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_OIDC_SCOPE
  group: auth
  description: Space-separated OAuth scopes the webapp requests at login.
  default: openid email profile
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_OIDC_TOKEN_URL
  group: auth
  description: OIDC token endpoint; set to override the value from issuer discovery.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_REQUIRE_AUTH
  group: auth
  description: When true, the webapp requires a signed-in session for corpus pages (login-gated deployment).
  default: 'false'
  secret: false
  scope: app
  prod: 'true'
- key: DOCRAY_WEBAPP_SAML_ALLOW_UNSIGNED_ASSERTIONS
  group: auth
  description: When true, the webapp accepts unsigned SAML assertions. Insecure — dev/testing only.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_SAML_IDP_ENTITY_ID
  group: auth
  description: Entity ID of the SAML identity provider the webapp federates with.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_SAML_SP_ENTITY_ID
  group: auth
  description: This service's SAML service-provider entity ID, as registered with the IdP.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_SAML_SSO_URL
  group: auth
  description: IdP single-sign-on redirect URL the webapp sends SAML AuthnRequests to.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_SAML_TENANT_ID
  group: auth
  description: Tenant the SAML IdP config binds to, so assertions map to the right tenant's principals.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_SECRET_KEY
  group: auth
  description: Signs the session cookie carrying each session's CSRF token (BL-103). Unset falls back
    to a random key generated at process start (dev-only — every session is invalidated on restart); set
    explicitly for a real deployment.
  default: null
  secret: true
  scope: app
  required_in_prod: true
- key: DOCRAY_WEBAPP_SESSION_COOKIE_SECURE
  group: auth
  description: When true, the webapp session cookie is marked Secure (HTTPS-only). Keep true in production.
  default: 'true'
  secret: false
  scope: app
  prod: 'true'
- key: DOCRAY_WEBAPP_SESSION_TTL_SECONDS
  group: auth
  description: Webapp login session lifetime, in seconds.
  default: '28800'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_SESSION_STORE
  group: auth
  description: Where webapp login sessions live. 'postgres' persists them in the web_auth_sessions
    table so a restart or a second replica does not log everyone out; 'memory' keeps them
    in-process (single instance, lost on restart). Compose defaults to 'postgres'.
  default: memory
  secret: false
  scope: app
  prod: postgres
- key: DOCRAY_BACKUP_ENABLED
  group: backup
  description: Master switch for the in-app backup subsystem — the scheduler, the backup/restore job
    kinds, the archive download route, and the admin backup UI. Off (the default) means no backup job
    is ever enqueued or executed and corpus durability is the managed database layer's responsibility.
    Note that the in-app archive was the only thing that captured object-store blobs; managed-database
    backups cover the database only.
  default: 'false'
  secret: false
  scope: app
- key: DOCRAY_BACKUP_RETENTION_COUNT
  group: backup
  description: Newest N backup archives always kept by the retention pruner.
  default: '7'
  secret: false
  scope: app
- key: DOCRAY_BACKUP_RETENTION_DAYS
  group: backup
  description: Archives older than this many days are pruned, beyond the always-kept newest N.
  default: '30'
  secret: false
  scope: app
- key: DOCRAY_BACKUP_SCHEDULE_SECONDS
  group: backup
  description: Interval between automatic backup runs by the backup-scheduler, in seconds.
  default: '86400'
  secret: false
  scope: app
- key: DOCRAY_BILLING_ENFORCEMENT_ENABLED
  group: billing
  description: Leave disabled locally; production enables this after Stripe webhooks are live.
  default: 'false'
  secret: false
  scope: app
- key: DOCRAY_STRIPE_API_BASE
  group: billing
  description: Stripe API base URL; override to point at a mock/sandbox in tests.
  default: https://api.stripe.com/v1
  secret: false
  scope: app
- key: ADMIN_CONSOLE_PORT
  group: billing
  description: Loopback host port the admin-console compose service publishes (127.0.0.1 only; public
    access is via the Cloudflare Tunnel). Consumed by docker-compose, not read by application code.
  default: '8080'
  secret: false
  scope: compose
- key: ADMIN_API_UPSTREAM
  group: billing
  description: In-network URL the admin-console nginx proxies GraphQL calls to. Consumed by docker-compose
    (admin-console project), not read by application code.
  default: http://api:8000
  secret: false
  scope: compose
- key: ADMIN_WEBAPP_UPSTREAM
  group: billing
  description: In-network URL the admin-console nginx proxies webapp links to. Consumed by docker-compose
    (admin-console project), not read by application code.
  default: http://webapp:5001
  secret: false
  scope: compose
- key: DOCRAY_NETWORK
  group: billing
  description: Name of the main stack's external docker network that the admin-console compose project
    attaches to (compose project name + `_default`). Consumed by docker-compose, not read by application
    code.
  default: doc-ray_default
  secret: false
  scope: compose
- key: DOCRAY_STRIPE_CANCEL_URL
  group: billing
  description: URL Stripe redirects to when Checkout is cancelled.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_STRIPE_PORTAL_RETURN_URL
  group: billing
  description: URL the Stripe billing portal returns the customer to.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_STRIPE_PRICE_ID
  group: billing
  description: Stripe Price id offered at Checkout for the subscription.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_STRIPE_SECRET_KEY
  group: billing
  description: Stripe secret API key for Checkout/Portal/webhook calls.
  default: ''
  secret: true
  scope: app
- key: DOCRAY_STRIPE_SUCCESS_URL
  group: billing
  description: URL Stripe redirects to after a successful Checkout.
  default: ''
  secret: false
  scope: app
  prod: https://admin.doc-ray.com/billing?checkout=success
- key: DOCRAY_STRIPE_WEBHOOK_SECRET
  group: billing
  description: Signing secret used to verify inbound Stripe webhook events.
  default: ''
  secret: true
  scope: app
- key: DATABASE_URL
  group: database
  description: Postgres connection string for the corpus database. Local dev points at the compose stack;
    production points at the managed cluster (set in .env.prod only).
  default: postgresql://docray:docray@localhost:5432/docray
  secret: true
  scope: app
  required_in_prod: true
- key: POSTGRES_DB
  group: database
  description: Database name the compose postgres service creates on first boot. Consumed by docker-compose,
    not read by application code.
  default: docray
  secret: false
  scope: compose
- key: POSTGRES_PASSWORD
  group: database
  description: Superuser password for the compose postgres service. The container entrypoint refuses to
    start with an unset or default value ("docray"/"change-me"), so this placeholder forces operators
    to pick a real secret. Consumed by docker-compose, not read by application code.
  default: change-me
  secret: true
  scope: compose
- key: POSTGRES_PORT
  group: database
  description: Loopback host port the compose postgres service publishes (127.0.0.1 only). Consumed by
    docker-compose, not read by application code.
  default: '5432'
  secret: false
  scope: compose
- key: POSTGRES_USER
  group: database
  description: Superuser role name for the compose postgres service. Consumed by docker-compose, not
    read by application code.
  default: docray
  secret: false
  scope: compose
- key: DOCRAY_API_POOL_MAX_SIZE
  group: database
  description: Maximum size of the API's Postgres connection pool.
  default: '10'
  secret: false
  scope: app
- key: DOCRAY_API_POOL_MIN_SIZE
  group: database
  description: Minimum number of connections the API keeps open in its Postgres pool.
  default: '1'
  secret: false
  scope: app
- key: DOCRAY_API_POOL_TIMEOUT
  group: database
  description: Seconds a request waits for a free pooled connection before erroring.
  default: '10.0'
  secret: false
  scope: app
- key: DOCRAY_API_STATEMENT_TIMEOUT_MS
  group: database
  description: Postgres statement_timeout (ms) applied to every pooled connection, so one unbounded query
    (e.g. a corpus-wide aggregation) fails fast instead of monopolizing a backend indefinitely.
  default: '15000'
  secret: false
  scope: app
- key: DOCRAY_DB_ROLE
  group: database
  description: Non-superuser Postgres role the API/webapp connect as, so per-principal row-level security
    applies. The webapp refuses to boot on a mismatch.
  default: docray_client
  secret: false
  scope: app
  prod: docray_api
- key: DOCRAY_SMTP_CHECK_TO
  group: email
  description: Recipient for the prod-check SMTP delivery test; falls back to DOCRAY_SMTP_FROM.
  default: null
  secret: false
  scope: app
- key: DOCRAY_SMTP_FROM
  group: email
  description: From address on verification and notification email (e.g. noreply@doc-ray.com).
  default: null
  secret: false
  scope: app
  prod: noreply@doc-ray.com
- key: DOCRAY_SMTP_HOST
  group: email
  description: SMTP relay hostname for outbound mail.
  default: null
  secret: false
  scope: app
  prod: mail.smtp2go.com
- key: DOCRAY_SMTP_PASSWORD
  group: email
  description: SMTP relay password.
  default: null
  secret: true
  scope: app
- key: DOCRAY_SMTP_PORT
  group: email
  description: 'SMTP relay port. Note: DigitalOcean blocks 25/465/587; production uses 2525 on SMTP2GO.'
  default: '587'
  secret: false
  scope: app
  prod: '2525'
- key: DOCRAY_SMTP_SSL
  group: email
  description: Use implicit TLS for SMTP (true for port 465). Mutually exclusive with STARTTLS.
  default: null
  secret: false
  scope: app
- key: DOCRAY_SMTP_STARTTLS
  group: email
  description: When true, upgrade the SMTP connection with STARTTLS.
  default: 'true'
  secret: false
  scope: app
  prod: 'true'
- key: DOCRAY_SMTP_TIMEOUT_SECONDS
  group: email
  description: SMTP connection/operation timeout, in seconds.
  default: '10'
  secret: false
  scope: app
- key: DOCRAY_SMTP_USERNAME
  group: email
  description: SMTP relay username.
  default: null
  secret: false
  scope: app
- key: DOCRAY_EXTRACT_MAX_UNCOMPRESSED_MB
  group: extraction
  description: 'Zip-bomb guard: cap on total uncompressed bytes when extracting EPUB/DOCX (both are zip
    containers). Empty uses the built-in limit.'
  default: ''
  secret: false
  scope: app
- key: DOCRAY_PDF_HEADING_BOLD_MAX_WORDS
  group: extraction
  description: A bold body-size line is treated as a heading only if it has at most this many words.
  default: '10'
  secret: false
  scope: app
- key: DOCRAY_PDF_HEADING_L1_RATIO
  group: extraction
  description: Font-size ratio (vs body text) at or above which a PDF line is promoted to a level-1 heading.
  default: '1.5'
  secret: false
  scope: app
- key: DOCRAY_PDF_HEADING_L2_RATIO
  group: extraction
  description: Font-size ratio threshold for a level-2 PDF heading.
  default: '1.25'
  secret: false
  scope: app
- key: DOCRAY_PDF_HEADING_L3_RATIO
  group: extraction
  description: Font-size ratio threshold for a level-3 PDF heading.
  default: '1.1'
  secret: false
  scope: app
- key: DOCRAY_PDF_MATH_BACKEND
  group: extraction
  description: Optional PDF math-extraction backend. Set to `external` to route formula regions through
    DOCRAY_PDF_MATH_BACKEND_CMD.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_PDF_MATH_BACKEND_CMD
  group: extraction
  description: Command line for the external PDF math-extraction backend, when DOCRAY_PDF_MATH_BACKEND
    selects an external tool.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_PDF_MATH_BACKEND_TIMEOUT
  group: extraction
  description: Timeout in seconds for the external PDF math-extraction backend command.
  default: '120'
  secret: false
  scope: app
- key: DOCRAY_PDF_OCR
  group: extraction
  description: When set (1/true/yes/on), run OCR on image-only PDF pages that extract to zero text.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_PDF_OCR_LANGUAGE
  group: extraction
  description: Tesseract language pack used when OCR runs on image-only PDF pages.
  default: eng
  secret: false
  scope: app
- key: DOCRAY_SPACY_FALLBACK_POLICY
  group: extraction
  description: 'How the annotate job reacts when the configured spaCy model is unavailable: `fail` (default)
    aborts; other values fall back.'
  default: fail
  secret: false
  scope: app
- key: DOCRAY_MCP_ALLOWED_HOSTS
  group: mcp
  description: Comma-separated Host header allow-list for the MCP server's DNS-rebind guard. Set to the
    public hostname or the SDK answers 421.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_MCP_ENABLE_WRITE
  group: mcp
  description: When true, the MCP server exposes write tools; default is read-only.
  default: 'false'
  secret: false
  scope: app
- key: DOCRAY_MCP_RATE_LIMIT_REQUESTS
  group: mcp
  description: Max MCP requests per principal (token fingerprint, else client IP) within the window;
    a generous default that only catches runaway loops. 0 disables throttling. In-process per
    container — with N replicas the effective limit is N×. Never applies to /health or /readyz.
  default: '120'
  secret: false
  scope: app
- key: DOCRAY_MCP_RATE_LIMIT_WINDOW_SECONDS
  group: mcp
  description: Fixed-window length in seconds for DOCRAY_MCP_RATE_LIMIT_REQUESTS. 0 disables throttling.
  default: '60'
  secret: false
  scope: app
- key: DOCRAY_MCP_RESOURCE
  group: mcp
  description: OAuth protected-resource identifier the MCP server advertises to connecting agents.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_MCP_RESOURCE_METADATA_URL
  group: mcp
  description: URL of the MCP OAuth protected-resource metadata document.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_MCP_TIMEOUT_SECONDS
  group: mcp
  description: 'Per-request GraphQL timeout (seconds) for the MCP tools:'
  default: '30'
  secret: false
  scope: app
- key: AWS_ACCESS_KEY_ID
  group: object-store
  description: Standard AWS SDK access-key fallback, read when S3_ACCESS_KEY is unset (boto default chain).
  default: null
  secret: false
  scope: app
- key: AWS_SECRET_ACCESS_KEY
  group: object-store
  description: Standard AWS SDK secret-key fallback, read when S3_SECRET_KEY is unset.
  default: null
  secret: true
  scope: app
- key: DOCRAY_SOURCE_BUCKET
  group: object-store
  description: Bucket the on-demand source ingester scans for new documents.
  default: doc-ray-dev
  secret: false
  scope: app
- key: DOCRAY_SOURCE_ENDPOINT
  group: object-store
  description: Object-store endpoint the on-demand source ingester reads uploads from.
  default: null
  secret: false
  scope: app
- key: DOCRAY_SOURCE_REGION
  group: object-store
  description: Region of the source-ingest bucket.
  default: sfo3
  secret: false
  scope: app
- key: DOCRAY_SOURCE_STATE
  group: object-store
  description: Local path where the source ingester records which objects it has already processed.
  default: .ingest-state/doc-ray-dev.json
  secret: false
  scope: app
- key: S3_ACCESS_KEY
  group: object-store
  description: Object-store access key (MinIO locally, Spaces in production).
  default: minioadmin
  secret: true
  scope: app
  required_in_prod: true
- key: S3_ALLOW_INSECURE_ENDPOINT
  group: object-store
  description: Local MinIO uses plaintext HTTP. Keep this unset/0 for non-local object stores.
  default: 'false'
  secret: false
  scope: app
  prod: '0'
- key: S3_BUCKET
  group: object-store
  description: Bucket holding content-addressed original document bytes and backup archives.
  default: documents
  secret: false
  scope: app
  prod: doc-ray-prd
  required_in_prod: true
- key: S3_ENDPOINT
  group: object-store
  description: Object-store endpoint URL (MinIO locally, DigitalOcean Spaces in production).
  default: http://localhost:9000
  secret: false
  scope: app
  prod: https://nyc3.digitaloceanspaces.com
  required_in_prod: true
- key: S3_REGION
  group: object-store
  description: Object-store region (e.g. us-east-1 for MinIO, nyc3 for the production Spaces bucket).
  default: us-east-1
  secret: false
  scope: app
  prod: nyc3
- key: S3_SECRET_KEY
  group: object-store
  description: Object-store secret key paired with S3_ACCESS_KEY.
  default: minioadmin
  secret: true
  scope: app
  required_in_prod: true
- key: S3_SERVER_SIDE_ENCRYPTION
  group: object-store
  description: Server-side-encryption mode sent on object PUTs (e.g. AES256, aws:kms). Empty disables
    it.
  default: ''
  secret: false
  scope: app
- key: S3_SSE_KMS_KEY_ID
  group: object-store
  description: KMS key id used when S3_SERVER_SIDE_ENCRYPTION is aws:kms.
  default: ''
  secret: false
  scope: app
- key: SPACES_KEY
  group: object-store
  description: DigitalOcean Spaces access key for the source-ingest tooling (scripts/ingest_from_spaces.py).
  default: null
  secret: true
  scope: app
- key: SPACES_SECRET
  group: object-store
  description: DigitalOcean Spaces secret paired with SPACES_KEY, used by the source-ingest tooling.
  default: null
  secret: true
  scope: app
- key: DOCRAY_API_DEBUG
  group: observability
  description: GraphQL introspection + the interactive GraphiQL IDE are disabled unless this is set —
    an anonymous caller (the default above) should not be able to enumerate the schema, including admin-only
    mutation shapes, for free reconnaissance. Set true only for local development.
  default: 'false'
  secret: false
  scope: app
- key: DOCRAY_LOG_FORMAT
  group: observability
  description: Log output format; empty selects the default. Set to `json` for structured logs.
  default: ''
  secret: false
  scope: app
- key: DOCRAY_LOG_LEVEL
  group: observability
  description: 'Log level for the worker and API processes (doc_ray.logging_setup): DEBUG/INFO/WARNING/ERROR.'
  default: INFO
  secret: false
  scope: app
- key: DOCRAY_MIGRATIONS_DIR
  group: ops
  description: Overrides the migration directory the runner/entrypoints.migrate reads from (defaults to
    the packaged db/migrations); mainly a test/packaging hook.
  default: null
  secret: false
  scope: app
- key: DOCRAY_TEST_ALLOW_LIVE_DB
  group: ops
  description: Explicit local override for DB-backed integration tests pointed at a non-test database.
    Leave disabled; prefer scripts/test-in-docker.sh for validation.
  default: null
  secret: false
  scope: app
- key: DOCRAY_VISUAL_OUT
  group: ops
  description: Output directory for scripts/visual_check.py screenshots (defaults under the gitignored
    _ephemeral/).
  default: null
  secret: false
  scope: app
- key: ANTHROPIC_API_KEY
  group: resolver
  description: Anthropic API key, used when the entity resolver is pointed at a Claude model instead of
    local Ollama.
  default: null
  secret: true
  scope: app
- key: API_MAX_DEPTH
  group: resolver
  description: 'Query-safety caps (schema.py) — max GraphQL query nesting depth and max token/complexity
    count. Defaults: 12 and 2000.'
  default: '12'
  secret: false
  scope: app
- key: API_MAX_TOKENS
  group: resolver
  description: Max output tokens requested from the resolver model per call.
  default: '2000'
  secret: false
  scope: app
- key: DOCRAY_OLLAMA_HOST
  group: resolver
  description: Base URL of the Ollama server the entity resolver calls (in-network on the GPU in production).
  default: http://localhost:11434
  secret: false
  scope: app
  prod: http://ollama:11434
- key: DOCRAY_OLLAMA_MODEL
  group: resolver
  description: Ollama model tag used for entity resolution.
  default: qwen2.5
  secret: false
  scope: app
  prod: qwen2.5:14b-instruct
- key: DOCRAY_RESOLVER_BACKEND
  group: resolver
  description: 'Selects the entity-resolver backend: `anthropic` (default) or `ollama`.'
  default: anthropic
  secret: false
  scope: app
  prod: ollama
- key: DOCRAY_RESOLVER_MODEL
  group: resolver
  description: Model identifier the entity-canonicalization resolver uses.
  default: null
  secret: false
  scope: app
- key: DOCRAY_RESOLVER_TIMEOUT_SECONDS
  group: resolver
  description: Per-call timeout for the resolver model, in seconds. Compose pins 60 for both worker
    lanes; code fallbacks differ per backend (Claude 60, Ollama 120) when unset.
  default: '60'
  secret: false
  scope: app
- key: OLLAMA_HOST
  group: resolver
  description: Ollama server URL read by ancillary tooling; mirrors DOCRAY_OLLAMA_HOST.
  default: http://localhost:11434
  secret: false
  scope: app
  prod: http://ollama:11434
- key: CAPTION_CONCURRENCY
  group: vision
  description: Parallel workers for the visual-captioning pass.
  default: '64'
  secret: false
  scope: app
- key: CAPTION_LIMIT
  group: vision
  description: Cap on images captioned per run (0 = no limit).
  default: '0'
  secret: false
  scope: app
- key: CAPTION_OCR
  group: vision
  description: When 1, run OCR alongside captioning on document images.
  default: '0'
  secret: false
  scope: app
- key: CLASSIFY_CONCURRENCY
  group: vision
  description: Classification fan-out (scripts/prism_classify.py).
  default: '48'
  secret: false
  scope: app
- key: DOCRAY_SEMANTIC_MODEL
  group: nlp
  description: sentence-transformers model for NLP Layer 20 learned sentence embeddings; must be 768-dim to match the embedding column.
  default: sentence-transformers/all-mpnet-base-v2
  secret: false
  scope: app
- key: DOCRAY_SEMANTIC_DEVICE
  group: nlp
  description: 'device for the Layer 20 sentence encoder: auto (default) lets sentence-transformers pick CUDA when the worker container can see a GPU, else CPU; set cpu/cuda/cuda:N/mps to force one (e.g. cpu when an 8 GB card is held by trf annotation).'
  default: auto
  secret: false
  scope: app
- key: DOCRAY_VISION_MODEL
  group: vision
  description: open_clip Tier-2 model architecture for the cross-modal image/sentence encoder.
  default: ViT-L-14
  secret: false
  scope: app
- key: DOCRAY_VISION_PRETRAINED
  group: vision
  description: open_clip pretrained-weights tag for the Tier-2 cross-modal image/sentence encoder.
  default: openai
  secret: false
  scope: app
- key: DOCRAY_VLM_BACKEND
  group: vision
  description: Vision-language-model backend for the queue-free Prism operator scripts.
  default: null
  secret: false
  scope: app
- key: DOCRAY_VLM_ENDPOINT
  group: vision
  description: scripts/prism_caption.py + prism_classify.py drive an OpenAI-compatible vLLM endpoint (NOT
    Ollama) to saturate the GPU at image granularity.
  default: http://localhost:8011/v1
  secret: false
  scope: app
- key: DOCRAY_VLM_IMAGE_MAX_PX
  group: vision
  description: Longest-edge pixel cap applied to images before sending them to the vision-language model.
  default: '1024'
  secret: false
  scope: app
- key: DOCRAY_VLM_MODEL
  group: vision
  description: Tier-3 grounded-caption VLM served via Ollama, and the Ollama host. Use an *Instruct* vision
    model (no hidden reasoning) so the token budget produces the description; qwen3-vl:32b-instruct is
    the most capable that fits a single H200.
  default: qwen3-vl-8b
  secret: false
  scope: app
- key: DOCRAY_VLM_NUM_PREDICT
  group: vision
  description: 'Max tokens the VLM generates per caption (backend default: 768 ollama / 400 vLLM).'
  default: '768'
  secret: false
  scope: app
- key: DOCRAY_VLM_OCR_LANGUAGE
  group: vision
  description: Tesseract language for OCR-of-crop grounding evidence (Tier-3). The caption is grounded
    against page text PLUS this OCR of the crop; it is never shown to the VLM.
  default: eng
  secret: false
  scope: app
- key: DOCRAY_VLM_TEMPERATURE
  group: vision
  description: Sampling temperature for the vision-language model.
  default: '0.1'
  secret: false
  scope: app
- key: PRISM_GALLERY_PORT
  group: vision
  description: Loopback port for the scripts/prism_gallery.py review UI.
  default: '8013'
  secret: false
  scope: app
- key: PRISM_WORK_DIR
  group: vision
  description: Scratch directory for the Prism visual pipeline's intermediate artifacts.
  default: null
  secret: false
  scope: app
- key: DOCRAY_API_URL
  group: webapp
  description: GraphQL endpoint the webapp posts mutations to (entrypoints.api service URL).
  default: http://localhost:8000/graphql
  secret: false
  scope: app
  prod: http://api:8000/graphql
- key: DOCRAY_MAX_UPLOAD_MB
  group: webapp
  description: Caps upload size in MB before it's fully buffered for hashing — enforced by both the webapp's
    Flask route and the GraphQL ingestDocument mutation (BL-098).
  default: '200'
  secret: false
  scope: app
- key: DOCRAY_OPERATOR_HEALTH_TOKEN
  group: webapp
  description: Bearer token required to view /operator/health; unset hides the page (404).
  default: null
  secret: true
  scope: app
- key: DOCRAY_PUBLIC_BASE_URL
  group: webapp
  description: Absolute base URL used in emailed verification links (required for the API surface; the
    webapp falls back to the request host when unset).
  default: ''
  secret: false
  scope: app
  prod: https://doc-ray.com
- key: DOCRAY_WEBAPP_API_TOKEN
  group: webapp
  description: Token the webapp presents to the API for its thin write path (uploads, seeding), distinct
    from its read-only DB connection.
  default: null
  secret: true
  scope: app
- key: DOCRAY_WEBAPP_LOGIN_RATE_LIMIT_REQUESTS
  group: webapp
  description: Max unauthenticated login requests per client within the window.
  default: '10'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_LOGIN_RATE_LIMIT_WINDOW_SECONDS
  group: webapp
  description: Rolling window (seconds) for the login rate limit.
  default: '300'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_REGISTER_RATE_LIMIT_REQUESTS
  group: webapp
  description: Max unauthenticated registration requests per client within the window.
  default: '5'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_REGISTER_RATE_LIMIT_WINDOW_SECONDS
  group: webapp
  description: Rolling window (seconds) for the registration rate limit.
  default: '3600'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_RESEND_RATE_LIMIT_REQUESTS
  group: webapp
  description: Max unauthenticated verification-email resend requests per client within the window.
  default: '5'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_RESEND_RATE_LIMIT_WINDOW_SECONDS
  group: webapp
  description: Rolling window (seconds) for the verification-email resend rate limit.
  default: '3600'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_SEARCH_RATE_LIMIT_REQUESTS
  group: webapp
  description: Max unauthenticated search requests per client within the window.
  default: '60'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_SEARCH_RATE_LIMIT_WINDOW_SECONDS
  group: webapp
  description: Rolling window (seconds) for the search rate limit.
  default: '60'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_UPLOAD_RATE_LIMIT_REQUESTS
  group: webapp
  description: Max unauthenticated upload requests per client within the window.
  default: '10'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_UPLOAD_RATE_LIMIT_WINDOW_SECONDS
  group: webapp
  description: Rolling window (seconds) for the upload rate limit.
  default: '60'
  secret: false
  scope: app
- key: PORT
  group: webapp
  description: Flask port when the webapp runs as `python -m webapp.app`.
  default: '5001'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_HEARTBEAT_RECLAIM_ELIGIBLE_SECONDS
  group: worker
  description: 'Heartbeat age (seconds) past which the job page stops trusting a running job''s progress
    numbers and warns instead (the backend already considers such a heartbeat reclaimable). Mirrors WORKER_CLAIM_TIMEOUT_SECONDS''
    default; deliberately tighter than DOCRAY_WEBAPP_STALLED_AFTER_SECONDS. Default: 120.'
  default: '120'
  secret: false
  scope: app
- key: DOCRAY_WEBAPP_STALLED_AFTER_SECONDS
  group: worker
  description: 'A running job whose heartbeat is older than this (seconds) renders as "Stalled (worker
    lost)" and stops blocking the reprocess buttons. Keep well above WORKER_CLAIM_TIMEOUT_SECONDS to avoid
    flapping. Default: 300.'
  default: '300'
  secret: false
  scope: app
- key: FULL_PASS_WATCHDOG
  group: worker
  description: Seconds the full-pass orchestrator waits for progress before treating a stage as stalled.
  default: '900'
  secret: false
  scope: app
- key: FULL_PASS_WORKERS
  group: worker
  description: Worker count for a full re-processing pass; the orchestrator uses more (16) during the
    extract phase and fewer (4) otherwise.
  default: null
  secret: false
  scope: app
- key: WORKER_CLAIM_TIMEOUT_SECONDS
  group: worker
  description: How long a worker holds a claimed job before it is considered abandoned and reclaimable.
  default: '120'
  secret: false
  scope: app
- key: WORKER_HEARTBEAT_SECONDS
  group: worker
  description: Interval at which a running worker updates its job heartbeat.
  default: '15'
  secret: false
  scope: app
- key: WORKER_JOB_TIMEOUT_SECONDS
  group: worker
  description: 'use WORKER_JOB_TIMEOUT_<KIND>_SECONDS, e.g. WORKER_JOB_TIMEOUT_BACKUP_SECONDS. Defaults:
    3600 for any kind, 60 for Claude resolver HTTP calls.'
  default: '3600.0'
  secret: false
  scope: app
- key: WORKER_POLL_SECONDS
  group: worker
  description: Seconds a worker waits between job-claim attempts when the queue is empty.
  default: '5'
  secret: false
  scope: app
- key: WORKER_REAP_SECONDS
  group: worker
  description: 'Janitor cadence: stale jobs are reaped on this timer even while every worker is busy inside
    a long handler (recovery otherwise waits for a free slot).'
  default: '30'
  secret: false
  scope: app
- key: WORKER_RECONNECT_BACKOFF_SECONDS
  group: worker
  description: 'Backoff before reconnecting after a dropped DB connection (BL-101), so a transient blip
    doesn''t crash the worker process. Default: 2.'
  default: '2'
  secret: false
  scope: app
