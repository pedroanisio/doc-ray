    - box:
      - 152
      - 828
      - 574
      - 54
      style: cap
      type: text
      text: 'Johnston''s margin canon for the opening: inner 1½, top 2, outer 3, foot
        4 — “proportions … common in early MSS.” The two inner margins combine to
        equal one outer: the opening, not the page, is the unit.'
    - box:
      - 68
      - 908
      - 658
      - 120
      style: body
      type: text
      text: The canon encodes three observations. Readers hold books by the foot margin,
        so it is widest. The two pages of an opening read as one sheet with two columns,
        so the gutter halves. And text placed at the geometric centre appears to sag,
        so the top tightens. None of this expired with parchment — a screen's safe-areas
        rediscover it clause by clause.
