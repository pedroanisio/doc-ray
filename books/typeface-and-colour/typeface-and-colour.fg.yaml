      style: body
      type: text
      text: Write the skeleton letters with a formal pen and, as Johnston observed,
        the result “looks incomplete and unfinished; and it is obvious that the thin
        strokes, at least, require marked terminals or serifs.” The serif enters the
        alphabet as a necessity of craft — the pen's way of beginning and ending cleanly
        — and only later hardens into a stylistic marker.
    - box:
      - 68
      - 444
      - 658
      - 128
      style: body
      type: text
      text: 'His rule for the finest work is exact: “serifs are treated as the actual
        finishing and shaping of the ends of the stems and branches, rather than as
        added parts.” A good serif belongs to its stem the way a capital belongs to
        its column. And note the corollary: “serifs of some sort are practically essential
        to the proper characterisation of an alphabet” — even the sans serif is a
        decision about serifs.'
    - box:
      - 68
      - 592
      - 658
      - 96
      style: body
      type: text
      text: 'The plate opposite is a taxonomy of endings: five ways to conclude the
        same stem, from the pen''s own triangular head to the abrupt stop of the grotesque.
        Each one implies a whole alphabet around it.'
