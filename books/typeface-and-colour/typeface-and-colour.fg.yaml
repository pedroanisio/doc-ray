      - 248
      - 64
      - 2
      type: rect
      fill: rubric
    - box:
      - 68
      - 272
      - 658
      - 150
      style: body
      type: text
      text: 'Chevreul treats the interior exactly as he treats the page: as figure
        and ground at scale. The dominant surface — the hangings — sets the scale;
        everything laid against it either agrees by analogy or answers by contrast.
        His rule for the border is the palette recipe of §2.11, sixty years early:
        “harmony of contrast is the most suitable to papers of a uniform pure colour
        … consequently we recommend for the dominant colour of the border the complementary
        of that of the hangings.”'
    - box:
      - 68
      - 462
      - 658
      - 130
      style: body
      type: text
      text: 'And his warning against busy pattern is a whole modern debate settled
        in a clause: “patterns for hangings must recommend themselves more by opposite
        colours than by minute finish in the details.” The eye reads a wall at wall
        distance. Detail invisible at that distance is not richness; it is mud.'
    - box:
      - 68
      - 612
      - 658
      - 84
      style: body
      type: text
      text: The plate opposite draws a wall elevation twice — once assorted by the
        law, once by accumulation — with the same inventory of parts.
