#           -d engineering/schema/statics/ttl/engineering_decisions_config.ttl -d /tmp/ed.ttl
#
# Lifecycle: D-001..D-010 capture the GraphQL-API + jobs architecture; D-011..D-016
# encode the mandated engineering standards. Claims already true in the tree are
# `populated`; not-yet-built ones are `pending` (checks written when the phase lands).
# =====================================================================

disclaimer: |
  No statement or premise not backed by a real logical definition or
  verifiable reference should be taken for granted.

source_schema:         "db/migrations"
# Matches the database's own SemVer (schema_version table / docray_schema_version(),
# introduced by migration 019; advanced to 1.3.0 by migration 024, to 1.4.0 by
# migration 029 for the backup catalogue, to 1.5.0 by migration 031 for
# principal LOGIN-role isolation, to 1.6.0 by migration 033 for API-role
# runtime grants, to 1.7.0 by migration 035 for scheduled backup retention and
# annotation-table autovacuum tuning, to 1.8.0 by migration 037 for
# evaluation/drift artifacts, to 1.9.0 by migration 039 for the
# entity_mention/chunk surface denormalization, then to 1.10.0 by migration
# 044 for jobs/backups RLS, to 1.11.0 by migration 046 for editable
# document metadata + change history (BL-058, migration 045), to
# 1.12.0 by migration 048 for document collections (BL-057, migration 047),
# then to 1.13.0 by migration 050 for span page geometry (BL-077,
# migration 049), then to 1.14.0 by migration 052 for document lifecycle
# state and per-document soft delete/restore (BL-059, migrations 051/053),
# then to 1.15.0 by migration 056 for verified document metadata suggestions
# (BL-061, migration 055), then to 1.16.0 by migration 058 for admin job
# cancellation (BL-102, migration 057), then to 1.17.0 by migration 060
# for first-class async job progress (BL-123, migration 059), then to 1.18.0
# by migration 066 for tenant/OIDC/SCIM auth surfaces (migrations 061-065),
# then to 1.19.0 by migration 068 for tenant SAML IdP configuration
# (migration 067), then to 1.20.0 by migration 070 for per-page PDF geometry
# persistence (migration 069), then to 1.21.0 by migration 071 for the
# release containing operator visibility, worker lifecycle logging, and
# finer-grained annotation progress, then to 1.22.0 by migration 073 for
# deploy-safe job drain release (jobs.drain_requested_at, migration 072),
# then to 1.27.0 by migration 086 for tenant-catalogue read access required
# by tenant-scoped Stripe billing status (migration 085), then advancing across
# migrations 087-134 to 1.48.0 — notably the Substrate·Lens·Projection entity
# fabric: 1.45.0 genre classification (127), 1.46.0 projection engine (129),
# 1.47.0 allusion edges (131), 1.48.0 hyper-context rollups (133).
# Kept in lockstep with doc_ray.__version__
# by scripts/check_version_consistency.py.
source_schema_version: "1.53.1"
target_engine:         "PostgreSQL 16"
total_decisions:       33

decisions:

  # ===================== ARCHITECTURE (D-001..D-010) =====================

  - id:                 "D-001"
    title:              "Expose the store through a GraphQL (Strawberry) API"
    version_introduced: "0.1.0"
    category:           "extensibility"
    decision: |
      The programmatic surface over the document store is a GraphQL API built
      with Strawberry, living at src/doc_ray/entrypoints/api/. It is a driving
      adapter over the existing application/use-case layer — no SQL in resolvers.
    rationale: |
      The stored graph (document -> sentences -> tokens -> syntax/coref/meaning ->
      lexemes) is deeply nested; GraphQL lets clients select exactly the layers
      they need. Chosen over REST/gRPC for that fit and for OpenAPI-free schema.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/entrypoints/api/**/*.py", "requirements.txt"]
    claims:
      - claim_id:    "D-001.k1"
        claim_text:  "A Strawberry GraphQL schema is served from src/doc_ray/entrypoints/api/."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-001.k1.c1"
            description: "The GraphQL schema module is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api/schema.py"
            expect:
              present:   true
          - check_id:    "D-001.k1.c2"
            description: "Strawberry is a declared runtime dependency."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "requirements.txt"
            pattern:     'strawberry-graphql'
            expect:
              present:   true

  - id:                 "D-002"
    title:              "Serve reads through a ReadRepository port + async adapter"
    version_introduced: "0.1.0"
    category:           "data-normalization"
    decision: |
      Read queries currently duplicated across webapp/app.py and adapters/export.py
      collapse into a single ReadRepository port (src/doc_ray/ports/repository.py)
      with an async adapter (adapters/persistence_read.py). GraphQL, the Flask
      browser, and export consume the same query definitions.
    rationale: |
      One query per shape kills SQL drift between the three read faces and gives
      the async API typed rows without re-deriving them.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/ports/repository.py", "src/doc_ray/adapters/persistence_read.py"]
    claims:
      - claim_id:    "D-002.k1"
        claim_text:  "Reads are served by a ReadRepository port + async adapter, not inline SQL in resolvers."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-002.k1.c1"
            description: "The async read adapter module is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/persistence_read.py"
            expect:
              present:   true
          - check_id:    "D-002.k1.c2"
            description: "The ReadRepository port is declared."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/ports/repository.py"
            pattern:     'class ReadRepository'
            expect:
              present:   true

  - id:                 "D-003"
    title:              "Preserve autocommit + statement-level lexeme collision-grow"
    version_introduced: "0.1.0"
    category:           "data-integrity"
    decision: |
      The persistence adapter connects with autocommit=True so get_or_create_lexeme
      can catch a UniqueViolation and grow the alias statement-by-statement. No
      refactor may wrap lexeme minting in a transaction (would poison it with
      InFailedSqlTransaction).
    rationale: |
      The collision-grow is load-bearing for lexeme identity; autocommit is the
      contract that makes it correct. This is the single biggest refactor trap.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/adapters/persistence.py"]
    claims:
      - claim_id:    "D-003.k1"
        claim_text:  "persistence.py connects autocommit=True and resolves lexeme uid collisions by growing the alias."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-003.k1.c1"
            description: "persistence.py opens the connection with autocommit=True."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/persistence.py"
            pattern:     'autocommit=True'
            expect:
              present:   true
          - check_id:    "D-003.k1.c2"
            description: "persistence.py catches UniqueViolation for the collision-grow loop."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/persistence.py"
            pattern:     'UniqueViolation'
            expect:
              present:   true

  - id:                 "D-004"
    title:              "Background jobs via a Postgres queue (FOR UPDATE SKIP LOCKED)"
    version_introduced: "0.1.0"
    category:           "operations"
    decision: |
      Asynchronous work (ingest, reannotate) is queued in a Postgres `jobs` table
      and claimed with SELECT ... FOR UPDATE SKIP LOCKED. No new infrastructure
      (no Redis/Celery). A Queue port keeps Redis/SQS swappable.
    rationale: |
      Postgres is already the system of record; a DB-backed queue gives durable
      at-least-once delivery and transactional enqueue with zero new moving parts.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/ports/queue.py", "src/doc_ray/adapters/queue_postgres.py"]
    claims:
      - claim_id:    "D-004.k1"
        claim_text:  "The queue adapter claims jobs with FOR UPDATE SKIP LOCKED."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-004.k1.c1"
            description: "The Postgres queue adapter claims with FOR UPDATE SKIP LOCKED."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/queue_postgres.py"
            pattern:     'FOR UPDATE SKIP LOCKED'
            expect:
              present:   true
      - claim_id:    "D-004.k2"
        claim_text:  "The queue is trusted infrastructure: the async API enqueue runs the job INSERT as the trusted writer docray_batch (not the request's RLS role), because authorization happens at the API mutation boundary and a document-less ingest job could never satisfy a document-keyed jobs INSERT policy (BL-141). jobs RLS governs read visibility only; there is no user-facing INSERT policy."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-004.k2.c1"
            description: "enqueue_async elevates to the trusted batch writer for the INSERT."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/adapters/queue_postgres.py"
            pattern:     'SET LOCAL ROLE'
            expect:
              present:   true

  - id:                 "D-005"
    title:              "Sync worker for blocking work; async only for API reads"
    version_introduced: "0.1.0"
    category:           "runtime-quality"
    decision: |
      Blocking C-extension work (PDF extraction, spaCy) runs only in a synchronous
      worker process (src/doc_ray/entrypoints/worker.py). The GraphQL API is async
      and read-only in-request; all heavy writes are enqueued. Resolvers never
      import spacy/pymupdf/application.pipeline.
    rationale: |
      Keeps the event loop free; maps cleanly onto the RBAC trust boundary
      (worker = trusted superuser writer; API = docray_client reader).
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/entrypoints/worker.py", "src/doc_ray/entrypoints/api/**/*.py"]
    claims:
      - claim_id:    "D-005.k1"
        claim_text:  "A sync worker entrypoint exists and API resolvers never import the blocking pipeline."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-005.k1.c1"
            description: "The synchronous worker entrypoint is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/worker.py"
            expect:
              present:   true
          - check_id:    "D-005.k1.c2"
            description: "No API resolver module imports the blocking ingest pipeline."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        "src/doc_ray/entrypoints/api"
            pattern:     'application\.pipeline'
            expect:
              present:   false

  - id:                 "D-006"
    title:              "Runtime migration runner closes the init-only gap"
    version_introduced: "0.1.0"
    category:           "evolution"
    decision: |
      A runtime migration runner (src/doc_ray/adapters/migrate.py, entrypoint
      python -m doc_ray.entrypoints.migrate) applies db/migrations/NNN_*.sql not yet
      in schema_migrations, each in its own transaction under pg_advisory_lock. Runs
      as a one-shot compose service gating api/worker.
    rationale: |
      docker-entrypoint-initdb.d runs only on first init, so new migrations never
      reach existing volumes; the runner makes migrations reach running databases.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/adapters/migrate.py", "src/doc_ray/entrypoints/migrate.py"]
    claims:
      - claim_id:    "D-006.k1"
        claim_text:  "A runtime migration runner exists and guards concurrent runs with an advisory lock."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
