{% extends "base.html" %}
{% block title %}Register · doc-ray{% endblock %}
{% block body %}
<section class="page-head">
  <p class="eyebrow">Account</p>
  <h1>Register</h1>
</section>

<section class="auth-panel">
  {% if error %}<div class="errbox">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('register_submit') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      Name
      <input name="display_name" autocomplete="name">
    </label>
    <label>
      Email
      <input name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="new-password" minlength="12" required>
    </label>
    <button type="submit">Register</button>
  </form>
</section>
{% endblock %}
