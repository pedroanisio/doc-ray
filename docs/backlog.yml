  - id:          "BL-088"
    title:        "Harden zip/XML parsing against decompression-bomb and entity-expansion attacks"
    summary:      "DOCX and EPUB are already zip+XML containers parsed via stdlib zipfile/ElementTree with no decompressed-size cap and no entity-expansion hardening (extraction.py:445-491 reads zip members and calls ET.fromstring with neither guard). This is a live gap today, not a hypothetical one introduced by adding PPTX/SVG — but PPTX (also zip+XML) and SVG (raw XML) would otherwise replicate the same unguarded pattern a third and fourth time."
    description: |
      Confirmed live: `_epub_spine`/`extract_epub` (extraction.py:445-491)
      call `zf.read(...)` and `ET.fromstring(...)` with no cap on
      decompressed size and no defusedxml/entity-resolution hardening
      anywhere in the file. Stdlib ElementTree does not fetch external
      entities but is vulnerable to internal-entity expansion
      (billion-laughs/quadratic blowup) — a small uploaded file can expand
      to exhaust memory/CPU before any exception is raised, which no
      amount of "catch the exception and mark the job failed" handling
      downstream can prevent (the existing ingest failure-recording
      contract only helps once an exception is actually raised — a
      resource-exhaustion attack doesn't necessarily raise one in time).

      This item adds, once, at a shared layer: (a) a decompressed-size cap
      enforced while reading zip members (docx/epub/pptx all use
      zipfile), and (b) a hardened XML parse path (defusedxml, or
      manually disabling entity resolution) reused by epub/svg/pptx's XML
      parsing. Landing this once, shared, is deliberately sequenced before
      BL-089/BL-090 so the two new format extractors are built on the
      hardened primitive rather than copying today's unguarded EPUB
      pattern a second and third time.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "This is a real, currently-exploitable gap against formats already accepted from untrusted uploads (docx, epub) — not a future-state risk being pre-empted. Fixing it once, shared, before adding two more zip/XML-based formats (pptx, svg) is cheaper and safer than fixing it four times or not at all."
    acceptance_criteria:
      - "Reading any zip member (docx, epub, and later pptx) enforces a maximum decompressed size, rejecting the file with a clear error rather than reading an unbounded amount into memory."
      - "XML parsing (epub's OPF/spine documents, and later svg/pptx's XML parts) uses a hardened parser (e.g. defusedxml) or explicitly disables entity resolution, verified by a test that a billion-laughs-style fixture is rejected rather than expanded."
      - "Existing docx/epub extraction behavior is unchanged for well-formed, non-malicious input — this is a guard, not a rewrite of the extraction logic."
    dependencies: []
    references:
      - "src/doc_ray/adapters/extraction.py"
    owner:        "shared"
    source:       "Feature request 2026-07-05: design production-ready ingestion for pptx/svg and audit docx/html/epub; verified live that EPUB's zip/XML parsing has no decompression-bomb or entity-expansion guard today, and that this would otherwise be copied into two new formats rather than fixed. Completed 2026-07-11 (extraction.py's ET now aliases defusedxml.ElementTree instead of stdlib; a shared _check_zip_bomb_bounds helper, configurable via DOCRAY_EXTRACT_MAX_UNCOMPRESSED_MB, runs before extract_epub/extract_docx read any zip member — both reusable as-is once BL-089/BL-090 add pptx/svg) on branch fix/bl-064-mutation-document-acl."
    tags:         ["security", "extraction", "hardening", "zip-bomb", "xxe"]

  - id:          "BL-089"
    title:        "Extraction support for PPTX: text and structure from slide/placeholder data"
    summary:      "PPTX extraction is now structure-aware: extraction.py registers .pptx with python-pptx, emits Markdown headings/lists from placeholder type and paragraph level, preserves speaker notes, and records doc_type='pptx' with the PowerPoint content type."
    description: |
      python-pptx exposes, per slide, shapes with a placeholder type
      (title/body/content/etc.) and, per paragraph within a text frame, a
      `.level` attribute for bullet/indent depth. This lets a PPTX
      extractor emit "# "/"## " for title placeholders and "- " for
      bulleted paragraphs directly from that explicit structure — the
      same Markdown vocabulary pdf_layout.py already produces from PDF's
      font-size/bold heuristic ("#"*level + " ", "- "), but derived from
      real structure instead of inference. One slide is the natural
      page-equivalent (relevant later for BL-087's overlay work, not
      required by this item).

      Register the new extractor in extraction.py's _EXTRACTORS dispatch
      table (mirroring extract_docx's optional-import guard for an
      uninstalled library), record doc_type='pptx' and the appropriate
      content_type, and confirm the webapp upload path accepts .pptx
      end-to-end (form, job, resulting document row) rather than only
      wiring the extraction function in isolation.
    category:     "extraction"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "Named directly in the request ('document can also be ... pptx'), confirmed absent (no code, no dependency) rather than merely unverified, and a natural extension of the same structural-Markdown approach the reader now depends on for PDF."
    acceptance_criteria:
      - "A .pptx upload extracts slide text (title, body/content placeholders, and speaker notes if present) into full_text, structured as Markdown headings/lists from placeholder type and paragraph level rather than flat concatenated text."
      - "python-pptx is added as an explicit, version-pinned dependency, guarded the same optional-import way extract_docx guards python-docx."
      - "doc_type='pptx' is recorded and the upload form/route accepts .pptx end-to-end, from webapp upload through job processing to a queryable document row."
      - "Builds on BL-088's hardened zip/XML parsing rather than a fresh unguarded zipfile.ZipFile/parser call."
