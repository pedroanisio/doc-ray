  - id:          "BL-158"
    title:        "SLP Block D: projection engine — lens-scoped entity identity without lossy merges"
    summary:      "Identity was global and unparameterised (one canonical registry per tenant), so fiction and non-fiction could not coexist without either merging unrelated fictional entities or fragmenting real ones. Added project(mention, lens) as a derived, refreshable interpretation: a pure resolver, four additive tables, a refresh job, and GraphQL + MCP surfaces. Consumes Block C (#6) genre policy and Block B (#5) lenses; unblocks Blocks E (#9) and F (#10)."
    description: |
      domain.projection.project (pure, stdlib-only, exhaustively unit-tested) encodes
      the law: the global lens forces GLOBAL; a scope lens applies genre_policy per
      type; then local-first lookup -> global fallback -> explicit unresolved (never a
      silent drop). Migration 129 (RLS+FORCE, all additive) adds entity_projection
      (one row per mention x projecting lens; scope, nullable canonical_id, review
      status; batch-owned, SELECT-only to the API), lens_local_entity (stable registry
      minting one canonical per (lens, surface, type) so a rebuild is byte-identical),
      entity_projection_review (human confirm/reject keyed by the stable span, so a
      decision survives re-annotation; re-applied by the refresh), and lens_entity_stats
      (the per-lens rollup lensEntities reads, D-024). document_collections.projects
      designates a projecting lens (FR-2 cost control, bounded per document).
      KIND_REFRESH_PROJECTION refreshes one document (chained after
      canonicalize/reannotate/apply_corrections) or rebuilds the corpus. Every machine
      projection is proposed (PALS's Law). GraphQL: entityProjection/lensEntities (read),
      confirmProjection/rejectProjection/setLensProjects (write); MCP mirrors the reads
      and the two review writes (gated on DOCRAY_MCP_ENABLE_WRITE). Schema SemVer ->
      1.46.0 (migration 130). The substrate is never mutated (invariants 1-2).
    category:     "api"
    type:         "feature"
    status:       "done"
    complexity:   "XL"
    priority:     "medium"
    rationale:    "This is the heart of the SLP architecture: it makes lens-scoped identity real, applying the genre policy Block C defined and the lenses Block B established, so a 10k-document corpus of fiction and non-fiction shares real-world identities while keeping fictional ones local — with no lossy merge, because a projection is derived and rebuildable where a merge is destructive."
    acceptance_criteria:
      - "entity_projection exists with RLS, FORCE, batch-only writes, and the documented indexes; project() is pure and deterministic."
      - "Fiction isolation: the same fictional surface in two lenses resolves to different canonical_ids; non-fiction sharing: the same real surface shares one."
      - "Reproducibility: truncating and rebuilding the projection yields byte-identical rows; the substrate (entity_mention, canonical) is provably unmutated."
      - "Global fallback: an unmatched mention resolves globally or is explicitly unresolved, never dropped; embedding/model links land status='proposed'."
      - "Re-annotating a document leaves projections consistent (cascade + rebuild), and a human review re-applies by stable span; no live aggregate over entity_projection on a read path (D-024)."
      - "Capability exposed consistently across GraphQL and MCP with agent-facing docstrings and examples."
    dependencies: ["BL-157"]
    references:
      - "docs/proposals/entity-fabric-substrate-lens-projection.md"
      - "db/migrations/129_entity_projection.sql"
      - "src/doc_ray/domain/projection.py"
      - "src/doc_ray/application/projection.py"
      - "src/doc_ray/adapters/projection_store.py"
      - "src/doc_ray/entrypoints/api/projection_query.py"
      - "src/doc_ray/entrypoints/api/projection_mutation.py"
    owner:        "shared"
    source:       "GitHub issue #8 (SLP Block D, epic entity-fabric); implemented with strict TDD (Claude Opus 4.8 via Claude Code)."
    tags:         ["slp", "entity-fabric", "projection", "lens", "resolution", "feature"]

  - id:          "BL-159"
    title:        "SLP Block E: allusion edges — typed cross-lens links that never assert identity"
    summary:      "After Block D (#8) a novel's Paris and the real Paris are distinct entities with no relationship between them; the only primitive to connect them would be a merge, which invariant 2 forbids. Added entity_allusion — a typed, directional cross-lens edge (alludes_to/depicts/references/adapted_from/inspired_by) with a review status — plus a pure domain, GraphQL + MCP surfaces, and an optional deterministic proposer. An edge is not an identity and is never transitive."
    description: |
      entity_allusion (migration 131, additive) links (from_canonical_id, from_lens_id)
      -> (to_canonical_id, to_lens_id) with a typed relation, confidence, method, a
      proposed/confirmed/rejected status, reviewer, rationale, and an evidence document.
      UNIQUE makes proposal idempotent; a CHECK forbids a self-edge within one lens. It is
      a curation table the API writes directly (docray_client) — not a derived fact table.
      RLS is cross-lens: an edge is visible only when the caller can read BOTH endpoint
      lenses (global is public; a scope lens needs a readable member doc) AND the evidence
      document, so it never reveals an entity in an unreadable lens; the write policy is
      FOR INSERT/UPDATE only (never FOR ALL, which would leak reads). domain.allusions is
      pure (vocabulary, self-edge/validation, is_identity_claim()->False, no transitive
      closure). Recording an edge changes nothing about projection/resolution/canonical
      (checksum-proven). GraphQL: allusions (bidirectional read), proposeAllusion /
      confirmAllusion / rejectAllusion (guarded+audited writes). MCP mirrors them (writes
      gated), docstrings warning against identity/transitive misuse. Optional
      KIND_PROPOSE_ALLUSIONS deterministically proposes alludes_to edges where a
      work-local entity's surface matches a KB-linked global entity (proposed only).
      Schema SemVer -> 1.47.0 (migration 132).
    category:     "api"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "medium"
    rationale:    "The 'hyper-context' axis of the mandate needs the honest representation of a cross-scope relationship: an edge, not an equality. Recording the novel's Paris -> real Paris as identity would corrupt both; as a typed edge it preserves both and makes the connection queryable, and it is only expressible once projections (Block D) exist. Unblocks Block F (#10) hyper-context rollups alongside Block D."
    acceptance_criteria:
      - "entity_allusion exists with RLS, FORCE, the UNIQUE and both CHECKs; self-edge and bad edge_type rejected by the database."
      - "An edge changes nothing about resolution: a before/after checksum on entity_projection and canonical proves it."
      - "Bidirectional query returns correct direction semantics; duplicate proposal is idempotent."
      - "RLS: a caller who can read only one of the two lenses sees no edge (asymmetry test); machine-proposed edges land proposed."
      - "Transitivity is deliberately absent and documented; capability exposed consistently across GraphQL and MCP with agent-facing docstrings and examples."
    dependencies: ["BL-158"]
    references:
      - "docs/proposals/entity-fabric-substrate-lens-projection.md"
      - "db/migrations/131_allusion_edges.sql"
      - "src/doc_ray/domain/allusions.py"
      - "src/doc_ray/adapters/allusion_store.py"
      - "src/doc_ray/entrypoints/api/allusion_mutation.py"
    owner:        "shared"
    source:       "GitHub issue #9 (SLP Block E, epic entity-fabric); implemented with strict TDD (Claude Opus 4.8 via Claude Code)."
    tags:         ["slp", "entity-fabric", "allusion", "lens", "hyper-context", "feature"]

  - id:          "BL-160"
    title:        "SLP Block F: hyper-context rollups + relationship discovery over the projected graph"
    summary:      "After Blocks B-D the corpus knew who each mention is within a lens but had no aggregate view of a lens's entity landscape and no entity-to-entity relationship traversal; computing either live violates D-024 at 10k documents. Added two precomputed rollups (lens_entity_rollup, lens_entity_relation), a pure domain (NPMI strength + bounded cycle-safe N-hop), a refresh job, and GraphQL + MCP reads. Supersedes lens_entity_stats. Completes the entity-fabric programme (Blocks A-F)."
    description: |
      lens_entity_rollup (migration 133) is a lens's significant entities with
      mention/document volume, observed type_profile + type_consistency (reusing
      entity_profiles.dominant_type_share) and first_seen_ordinal; it supersedes the thin
      Block-D lens_entity_stats (dropped) and backs lensEntities. lens_entity_relation is
      undirected sentence-level co-occurrence pairs (stored once, from < to) with an NPMI
      strength (Bouma 2009), normalized by marginal frequencies so a ubiquitous entity is
      not related to everything. domain.lens_rollups is pure: the cited NPMI formula,
      significance ranking, and a bounded cycle-safe N-hop BFS (hard cap 3, over-cap
      rejected — no unbounded walk). KIND_REFRESH_LENS_ROLLUP refreshes a lens (chained
      strictly after the projection refresh it aggregates) or the whole corpus; idempotent
      and reproducible. GraphQL: lensEntities (enriched, minMentions), entityRelations,
      relatedEntities (hop-cap rejection). MCP mirrors all three, docstrings stating these
      are precomputed rollups (refreshed_at staleness) and strength is a co-occurrence
      measure not a real-relationship claim. Reads are D-024-clean; RLS scopes by lens
      visibility. Degrades gracefully without Block E. Narrative summaries (FR-2) deferred
      to BL-161. Schema SemVer -> 1.48.0 (migration 134).
    category:     "api"
    type:         "feature"
    status:       "done"
    complexity:   "XL"
    priority:     "medium"
    rationale:    "PURPOSE.md names relationship discovery as a product goal and the mandate names hyper-context as one of four axes; a library that cannot answer 'who are the significant figures and how do they relate' is just a search index. The answer must be precomputed (D-024) and honest (a co-occurrence strength is structural, never a claimed real relationship; a summary would be model output requiring review). This block ships the deterministic, testable half and defers model summaries."
    acceptance_criteria:
      - "Both rollup tables exist with RLS, FORCE, batch-only writes, and the documented indexes; reads are D-024-clean (no live fact-table aggregate)."
      - "The NPMI strength is documented, cited (Bouma 2009), and unit-tested incl. edge cases (ubiquitous entity, single occurrence)."
      - "Rollups are reproducible: full rebuild == incremental refresh (byte-identical), and idempotent."
      - "relatedEntities respects the hop cap and rejects a larger request rather than clamping; traversal terminates on a cyclic graph (cyclic fixture)."
      - "Undirected pairs are stored once (from < to) and queried from both directions; refreshed_at is exposed on every rollup read."
      - "Degrades correctly without Block E (intra-lens only); capability exposed consistently across GraphQL and MCP with agent-facing docstrings."
    dependencies: ["BL-158"]
    references:
      - "docs/proposals/entity-fabric-substrate-lens-projection.md"
      - "db/migrations/133_lens_rollups.sql"
      - "src/doc_ray/domain/lens_rollups.py"
      - "src/doc_ray/adapters/lens_rollup_store.py"
      - "src/doc_ray/entrypoints/api/lens_rollup_query.py"
    owner:        "shared"
    source:       "GitHub issue #10 (SLP Block F, epic entity-fabric); implemented with strict TDD (Claude Opus 4.8 via Claude Code)."
    tags:         ["slp", "entity-fabric", "hyper-context", "rollup", "relationship", "feature"]

  - id:          "BL-161"
    title:        "SLP Block F follow-up: per-lens narrative summaries (model output, review-gated)"
    summary:      "Block F (#10) shipped the deterministic hyper-context rollups and deferred FR-2 narrative summaries (a per-lens generated overview) to keep the model dependency and review workflow on their own verification gate (issue #10, decision D-3). This item tracks that follow-up: a lens_summary table (proposed/confirmed/rejected) with citable evidence handles, a generator, and a review path — summaries ship as PROPOSALS, never auto-confirmed (PALS's Law)."
    description: |
      Deferred from Block F (#10) per its recorded decision D-3. Scope: a lens_summary
      table (lens_id, scope_key, summary text, model text, confidence real, status
      CHECK proposed/confirmed/rejected, evidence jsonb citing concrete mention/sentence
      handles, created_at); a generator that produces a proposed summary from the Block F
      rollups + evidence; GraphQL lensSummary(lensId) always exposing status + evidence;
      MCP lens_summary; and the record-then-review workflow. The review workflow is
