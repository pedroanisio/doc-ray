  - id:          "BL-009"
    title:        "GraphQL safety: depth/complexity limits + keyset pagination"
    summary:      "Enforce query depth/complexity caps and keyset pagination on the GraphQL surface."
    description: |
      D-008 commits to query depth + complexity limits and keyset pagination to
      protect the GraphQL API from abusive queries. The depth/complexity half
      shipped: `build_schema()` (entrypoints/api/schema.py) wires Strawberry's
      `QueryDepthLimiter` (default 12, override via `API_MAX_DEPTH`) and
      `MaxTokensLimiter` (default 2000, override via `API_MAX_TOKENS`) — both
      grep-verified present as of 2026-07-04. The pagination half has not: every
      list resolver in entrypoints/api/query.py (documents, sentences, lexemes,
      entity_frequency, jobs) still takes `limit`/`offset`, not a cursor. Keyset
      pagination, plus BL-017's new nested list fields, remain open.
    category:     "security"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "An unbounded GraphQL surface is a denial-of-service and data-exfiltration risk."
    acceptance_criteria:
