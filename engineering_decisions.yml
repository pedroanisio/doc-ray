  - id:                 "D-025"
    title:              "Read paths never aggregate large fact tables live; derive read-model rollups refreshed at the pipeline boundary"
    version_introduced: "1.33.0"
    category:           "performance"
    decision: |
      Every read surface — the Flask webapp, the GraphQL resolvers, the MCP
      server, and the read-only persistence adapters they delegate to — is
      forbidden from computing an aggregate (count / count(distinct) / GROUP BY /
      string_agg / sum) over a large append-mostly fact table on the request
      path. The flagged fact tables are lexeme_occurrences (~17.5M), spans
      (~29M), tokens (~25M), entity_mention (~1.1M), chunk (~5.7M), embedding,
      and sentences (~870k). Those aggregates are derived into read-model rollup
      tables — document_stats (per-document: n_sentences, n_lexeme_occurrences,
      n_tokens, pos_counts, top_verbs), corpus_stats (per-tenant distinct
      lexemes and sentence denominator), lexeme_stats (per-tenant lexeme usage), entity_frequency_stats
      (per-tenant entity frequency) — refreshed by the trusted batch writer at
      the pipeline job boundary (annotate / reannotate / ingest via
      docray_refresh_stats_for_document, debounced for tenant-wide recomputes),
      never at read time. The rollup carries its own RLS grain: document-scoped
      rollups inherit the document_id read policy (exact per principal),
      tenant-scoped rollups carry a tenant_id policy (never one global row, which
      would leak vocabulary/entity magnitude across tenants). Read paths query
      the rollup in O(result). scripts/check_read_path_aggregates.py enforces the
      rule as a landing gate; a small reasoned allowlist covers queries that are
      genuinely bounded to a single key (O(result)).
    rationale: |
      Four separate read pages were measured serving 16-37 s against a 300-400 ms
      budget, all from the same defect: live aggregation over lexeme_occurrences
      (and joins to spans) on every request — the corpus band (18.7 s), the
      Lexicon (37 s), the reader POS/verb sidebar (1.2 s), and the original-page
      overlay (0.5-1.7 s), plus the GraphQL twins (list_lexemes, entityFrequency)
      and per-document count(*) subqueries over sentences/tokens. Confirmed live
      with EXPLAIN ANALYZE as docray_api + admin; the reads drop to 1.5-12 ms off
      the rollups. Materialized views were rejected: PostgreSQL 16 has no
      incremental refresh (a per-document annotation would trigger a full-corpus
      recompute) and matviews cannot carry RLS policies (they would query with
      owner privileges and leak across tenants). Fact-table triggers were
      rejected: the pipeline COPYs millions of rows per document, so per-row
      trigger overhead would wreck ingest throughput — refresh belongs at the job
      boundary, not the row boundary. Two related offenders are tracked
      separately because they belong to other layers, not the rollup pattern:
      the GraphQL Lexeme.occurrences N+1 (needs request batching / a DataLoader,
      but the field takes per-call pagination args so it is not a trivial by-key
      loader) and searchSentences' leading-wildcard ILIKE scan (needs a trigram /
      FTS index). The static gate has a known blind spot for SQL assembled from
      module-constant fragments (e.g. the shared _ENTITY_FROM), covered by the
      audit + code review.
    decision_status:    "accepted"
    decision_date:      "2026-07-16"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "scripts/check_read_path_aggregates.py"
      - "db/migrations/095_corpus_stats.sql"
      - "db/migrations/098_reader_stats.sql"
      - "db/migrations/100_read_model_token_entity.sql"
      - "db/migrations/146_corpus_stats_sentence_denominator.sql"
      - "scripts/prod_check.py"
      - "src/doc_ray/adapters/persistence_read.py"
      - "webapp/corpus_web.py"
    claims:
      - claim_id:    "D-025.k1"
        claim_text:  "No read-surface module aggregates a large fact table live (outside the reasoned allowlist)."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-025.k1.c1"
            description: "The read-path aggregate gate passes."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "python scripts/check_read_path_aggregates.py"
            expect:
              exit:      0

  - id:                 "D-026"
    title:              "Document ownership is the corpus read boundary; tenant stays the organization axis"
    version_introduced: "1.34.0"
    category:           "security"
    decision: |
      A document's read boundary is its owner. docray_readable_documents()
      resolves to exactly three branches — tenant admin, explicit document_acl
      grantee, and documents.owner_principal_id = the calling principal — and
      docray_writable_documents() carries the same owner branch, so owning a
      document implies curating it. No role, by itself, confers corpus-wide
      read: holding the 'read' permission makes a principal eligible to read
      documents, never entitled to all of them. owner_principal_id IS NULL
      means UNOWNED, not public — admin-only, and reserved as the seam for a
      future organization corpus. Ownership is resolved at the API boundary
      (ingestDocument stamps the request principal into the job payload) and
      never derived in the worker, which has no request principal by the time
      it runs. Operator CLI ingest deliberately produces unowned documents.
      Deployment-specific ownership data stays out of versioned migrations:
      scripts/assign_document_owner.py performs the move by login email.
    rationale: |
      doc-ray runs open registration on the public internet, so a newly
      registered user must land on a clean, private corpus. Migration 076
      violated that: its role-permission branch granted every principal
      carrying the 'read' action — i.e. every user, since 'reader' is the
      default signup role — the whole tenant corpus minus documents tagged
      sensitivity=sensitive. With one tenant, zero document_acl rows and zero
      sensitivity tags in production, the predicate narrowed nothing and three
      self-registered accounts could read all 192 operator-ingested documents.
      076 itself described the branch as a stopgap for a granting flow that was
      never built; ownership is that flow. Per-user TENANTS were rejected as
      the isolation mechanism precisely because organizations are a stated
      future direction: if tenant_id came to mean "one user", introducing orgs
      would require re-parenting every principal and document. Keeping tenant_id
      as the organization axis and owner_principal_id as the user axis makes the
      org corpus an additive change (unowned/org-flagged rows become visible to
      org members) rather than a migration of the whole corpus. ON DELETE SET
      NULL releases a deleted account's documents to unowned rather than
      cascading the corpus away with the account.
    decision_status:    "accepted"
    decision_date:      "2026-07-23"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "db/migrations/102_document_ownership.sql"
      - "src/doc_ray/adapters/persistence.py"
      - "src/doc_ray/application/pipeline.py"
      - "src/doc_ray/entrypoints/api/mutation.py"
      - "scripts/assign_document_owner.py"
    claims:
      - claim_id:    "D-026.k1"
        claim_text:  "A registered reader sees neither another user's documents nor unowned ones."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-026.k1.c1"
            description: "The per-owner RLS isolation suite passes against the live schema."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_document_ownership.py"
            expect:
              exit:      0
      - claim_id:    "D-026.k2"
        claim_text:  "No migration after 102 reintroduces a corpus-wide role-read branch."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-026.k2.c1"
            description: "The anti-regression guard over db/migrations passes."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_reader_visibility.py"
            expect:
              exit:      0

  - id:                 "D-027"
    title:              "Token write scope is derived from RBAC permissions; `member` is the registered-user role"
    version_introduced: "1.35.0"
    category:           "security"
    decision: |
      A local login's coarse API token scopes are computed from the principal's
      own RBAC permission actions (application/local_auth.scopes_for_actions):
      every authenticated principal gets `read`, and a principal holding any of
      annotate/delete/redact/admin also gets `write`. No role-name allowlist
      appears in the code path. `member` (read + annotate + delete) is the
      default role for self-service registration and the role every
      self-registered human holds; `reader` remains genuinely read-only for
      SCIM/OIDC-provisioned and admin-CLI-provisioned accounts. The email
      verification auto-login mints the same derived scopes as `login`.
      The `write` scope is a coarse gate on whether a principal may mutate
      ANYTHING; it never decides WHICH rows — that stays with
      docray_writable_documents() per document.
    rationale: |
      Migration 102 made ownership the read boundary, which surfaced a blocking
      defect: `reader` (the signup default) carries only `read`, and every local
      login hard-coded scopes={"read"}, so _require_write_audited refused every
      mutation. A self-registered user on an open-registration SaaS could never
      ingest, so per-owner isolation gave new accounts a permanently EMPTY
      corpus — correct isolation, unusable product. Widening `reader` in place
      was rejected: SCIM provisioning and the admin CLI both assign it to create
      look-but-don't-touch accounts, so widening it would have silently promoted
      every already-provisioned principal. Deriving scope from permissions
      rather than matching role names was chosen so that re-granting a role, or
      adding a future role that carries `annotate`, needs no code change, and so
      admins receive `write` without a special case. Promoting existing users is
      scoped to principals holding a LOCAL credential: an OIDC/SCIM-provisioned
      reader was given that role on purpose. Granting members annotate/delete is
      safe because no read or write policy consults those permission rows — only
      docray_is_admin() reads the permission tables — so a member's reach is
      exactly what they own or were granted.
    decision_status:    "accepted"
    decision_date:      "2026-07-23"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "db/migrations/104_member_role.sql"
      - "src/doc_ray/application/local_auth.py"
      - "src/doc_ray/adapters/local_auth_postgres.py"
      - "webapp/auth_web.py"
    claims:
      - claim_id:    "D-027.k1"
        claim_text:  "A member may mutate; a reader may not; neither can reach another principal's documents."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-027.k1.c1"
            description: "Scope derivation covers member, reader, admin, and the verification auto-login."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_local_auth.py"
            expect:
              exit:      0
          - check_id:    "D-027.k1.c2"
            description: "The member role's write power stays bounded by ownership."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_document_ownership.py"
            expect:
              exit:      0

  - id:                 "D-028"
    title:              "RLS is enforced by the database (FORCE) with an explicit BYPASSRLS batch writer"
    version_introduced: "1.36.0"
    category:           "security"
    decision: |
      Every RLS-enabled table is FORCE ROW LEVEL SECURITY, so the table owner
      (the application user `docray`) is subject to its own policies. The trusted
      batch writer — the worker and CLIs, which annotate and roll up across every
      tenant with no request principal — holds its exemption as an explicit role
      attribute: a NOLOGIN `docray_batch` role carrying BYPASSRLS, assumed by
      adapters/persistence.connect() via SET ROLE. The API/webapp request path is
      unchanged (SET ROLE docray_api + app.principal_id). The deployment must
      connect as a NON-superuser, because a superuser bypasses RLS regardless of
      FORCE; the RLS test models this with a dedicated NOSUPERUSER probe role
      rather than the test database's own superuser.
    rationale: |
      Before this, RLS was ENABLEd but never FORCEd, and both the API and webapp
      connect as `docray`, which owns the corpus tables. Postgres exempts a table
      owner from its own policies unless the table is forced, so any code path
      that failed to SET ROLE read the corpus with NO policy applied — the leak
      was one missing SET ROLE away, independent of whether the policy itself was
      correct (BL-138). A batch-writer policy BRANCH was implemented and rejected
      on three findings: (1) the write predicate id IN (SELECT ... FROM documents)
      is unsatisfiable for a new row, so INSERT is inexpressible as a policy;
      (2) INSERT ... RETURNING re-applies the SELECT policy to a row absent from
      the policy subquery's snapshot; (3) the permissive SELECT policy needed to
      fix (2) OR-combines into the read path and defeats the semi-join pullup
      migration 018 documents as load-bearing on lexeme_occurrences (~17.5M),
      spans (~29M) and tokens (~25M). A BYPASSRLS role attribute expresses
      "trusted writer" exactly, at no read-path cost. BYPASSRLS requires a
      superuser to grant, which the managed migration runner is not, so the
      migration RAISES rather than force RLS without a working writer — a
      half-applied state would stop every ingest job — leaving the operator one
      superuser statement (ALTER ROLE docray_batch BYPASSRLS) to run.
    decision_status:    "accepted"
    decision_date:      "2026-07-23"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "db/migrations/106_force_rls.sql"
      - "src/doc_ray/adapters/persistence.py"
    claims:
      - claim_id:    "D-028.k1"
        claim_text:  "Every RLS-enabled table is forced, and a non-superuser app role with no principal reads nothing."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-028.k1.c1"
            description: "The forced-RLS suite passes against the live schema."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_forced_rls.py"
            expect:
              exit:      0

  - id:                 "D-029"
    title:              "Document sharing is owner-scoped, DB-enforced, and by tenant-scoped email"
    version_introduced: "1.37.0"
    category:           "security"
    decision: |
      An owner (or tenant admin) may grant another principal read/annotate on a
      document via shareDocument, and revoke it via revokeDocumentShare. The
      grant is written to document_acl under the caller's own RLS connection.
      document_acl is FORCE ROW LEVEL SECURITY (migration 108): its INSERT/DELETE
      policies require docray_can_share_document (owner or admin, tenant-scoped)
      and cap the grantable permission at read/annotate — admin/redact are never
      shareable, delete is excluded. The mutation layer (_require_document_share)
      is a clean-error convenience; the policy is authoritative. Sharing targets a
      colleague by login email through the tenant-scoped SECURITY DEFINER helpers
      docray_principal_by_email / docray_email_for_principal, so the API role
      (docray_client) never gains SELECT on principal_credentials and email
      lookups cannot cross tenants. The admin CLI (auth_admin) assumes docray_batch
      (BYPASSRLS) so its arbitrary-permission grant_document is unaffected by the
      new forced RLS. Every grant/revoke is audited.
    rationale: |
      Per-owner isolation (D-026) gave each user a private corpus but left them no
      way to collaborate: only the admin CLI wrote document_acl. Sharing is the
      other half. It had to be enforced by the database, not just the mutation
      layer, because granting docray_client the INSERT it needs would otherwise
      let any principal forge a grant on any document; the FORCE RLS policy makes
      that impossible even if the resolver is wrong. Owner-or-admin (not merely
      "writable") is required so an annotate-grantee cannot re-share a document
      lent to them. Capping the shareable permissions at read/annotate stops
      sharing from becoming a privilege-escalation path to admin/redact. Email
      resolution goes through SECURITY DEFINER helpers rather than a table grant
      because principal_credentials has no RLS and holds password hashes — a
      direct grant or join would leak credentials and cross-tenant emails. The
      admin CLI moves to docray_batch for the same reason adapters/persistence
      does (D-028): it is a trusted cross-principal writer with no request
      principal, and forced document_acl RLS would otherwise block it.
    decision_status:    "accepted"
    decision_date:      "2026-07-23"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "db/migrations/108_document_sharing.sql"
      - "src/doc_ray/entrypoints/api/mutation_sharing.py"
      - "src/doc_ray/entrypoints/api/mutation_guards.py"
      - "src/doc_ray/entrypoints/api/query.py"
      - "src/doc_ray/adapters/auth_admin_postgres.py"
      - "webapp/sharing_web.py"
    claims:
      - claim_id:    "D-029.k1"
        claim_text:  "An owner can share read/annotate by email and revoke it; a non-owner cannot; admin/redact are not shareable."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-029.k1.c1"
            description: "The document_acl RLS sharing suite passes against the live schema."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_document_sharing.py"
            expect:
              exit:      0
          - check_id:    "D-029.k1.c2"
            description: "The GraphQL sharing mutations enforce owner-or-admin and reject admin/redact."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_mutations_sharing.py"
            expect:
              exit:      0

  - id:                 "D-030"
    title:              "MCP may expose writes, off by default, gated on the API's write scope and per-document ACL"
    version_introduced: "1.37.0"
    category:           "security"
    decision: |
      The MCP server may register write tools — the reprocessing mutations
      (reannotate, reextractDocument, annotateDocument, semanticEnrichDocument,
      canonicalizeDocument, suggestSeeds, suggestDocumentMetadata) and the
      curation mutations (updateDocumentMetadata, bulkTagDocuments, decideSeeds,
      decideDocumentMetadataSuggestions, seedApproved) — but only when
      DOCRAY_MCP_ENABLE_WRITE is true. The default surface is read-only: with the
      flag off the write tools are not registered at all, so they never appear in
      tools/list. The MCP layer does NOT re-implement authorization: each write
      tool forwards the caller's bearer token to the existing GraphQL mutation,
      whose guards remain authoritative — _require_write_audited (authenticated
      principal + write scope + billing entitlement, audited) and
      _require_document_write (per-document document_acl grant, D-026/D-029). A
      caller lacking scope or grant receives the API's permission-denied, mapped
      to a typed permission_denied ToolCallError. Only reversible verbs are
      exposed: destructive/admin mutations (delete, archive, restore, backup,
      restore_backup, cancel_job, reextractDocuments) and ingestDocument (a
      multipart upload) are deliberately not registered on MCP. Enqueued jobs are
      polled with the get_job read tool. Every hand-written MCP GraphQL document
      is validated against the live schema by a contract test.
    rationale: |
      The mutations, their write-scope check, per-document ACL, billing gate, and
      audit trail already existed at the GraphQL layer and are exercised by the
      webapp's write path; exposing them to agents is a surface question, not a
      new-security-primitive question, so the API stays the single authorization
      authority and MCP forwards into it (mirroring webapp/graphql_client.py).
      Off-by-default with conditional registration — rather than
      register-then-authorize — means a deployment that has not opted in is
      provably read-only: the guarantee holds by absence of the tools, not merely
      by a runtime check that could regress. Restricting the set to reversible
      reprocessing/curation verbs bounds the blast radius of an LLM agent acting
      on unverified reasoning (PALS's Law): every exposed write enqueues a
      re-runnable job or a curation decision, never an irreversible delete. The
      schema-contract test prevents the hand-written operation strings from
      drifting from the resolvers as the schema evolves.
    decision_status:    "accepted"
    decision_date:      "2026-07-23"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "src/doc_ray/entrypoints/mcp/mutations.py"
      - "src/doc_ray/entrypoints/mcp/server.py"
      - "src/doc_ray/entrypoints/mcp/corpus.py"
      - "src/doc_ray/config.py"
    claims:
      - claim_id:    "D-030.k1"
        claim_text:  "Write tools are registered only when writes are enabled; the default MCP surface is read-only."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-030.k1.c1"
            description: "The server registers no write tool by default and adds them only when enable_write is set."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_mcp_server.py"
            expect:
              exit:      0
      - claim_id:    "D-030.k2"
        claim_text:  "Every MCP read/write GraphQL document validates against the live API schema, and writes without scope map to permission_denied."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-030.k2.c1"
            description: "The schema-contract test validates every MCP document against the API schema."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_mcp_schema_contract.py"
            expect:
              exit:      0
          - check_id:    "D-030.k2.c2"
            description: "The write tools forward mutations and map the API's permission-denied to a typed error."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_mcp_mutations.py"
            expect:
              exit:      0

  - id:                 "D-031"
    title:              "Organization corpus: opt-in tenant-wide visibility, the safe inverse of the 076 leak"
    version_introduced: "1.38.0"
    category:           "security"
    decision: |
      documents.visibility (private | org) is the third read scope, alongside
      per-owner (D-026) and per-principal ACL sharing (D-029). It defaults to
      private. An owner or tenant admin publishes a document to the whole tenant
      by setting visibility='org', which adds an org-read branch to
      docray_readable_documents(): a document with visibility='org' is readable
      by every principal whose tenant_id matches — the tenant IS the organization
      boundary, so org visibility never crosses tenants. The column's only write
      path is docray_set_document_visibility, a SECURITY DEFINER function that
      re-checks owner-or-admin authority (docray_can_share_document) in the
      database; docray_client gets EXECUTE on it and no UPDATE grant on documents,
      so an annotate-grantee cannot publish a document lent to them. The
      setDocumentVisibility GraphQL mutation is the owner-or-admin-guarded,
      audited caller; visibility is exposed on the Document type.
    rationale: |
      Per-owner isolation left no way to share a document with a whole team; the
      ACL path (D-029) is person-by-person. Organizations need a document that is
      broadly readable within the org, which is exactly the case the migration-102
      NULL-ownership seam was reserved for. An explicit visibility column was
      chosen over overloading NULL ownership because NULL conflates "shared with
      the org" with "nobody has claimed it" — the honest model names the intent.
      Critically, this is the SAFE inverse of the 076 corpus-wide leak that began
      this work: 076 was default-visible minus exceptions; org visibility is
      default-private plus a deliberate opt-in, and the branch is gated on
      visibility='org' rather than on the read permission, so it is structurally
      incapable of the 076 failure (the anti-regression guard confirms no
      migration reintroduces the role-read shape). Routing the write through a
      SECURITY DEFINER owner-or-admin function rather than a column UPDATE grant
      keeps the annotate-grantee escalation closed at the database, consistent
      with D-028/D-029 — the mutation layer is convenience, the function is the
      boundary.
    decision_status:    "accepted"
    decision_date:      "2026-07-23"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "db/migrations/110_org_corpus.sql"
      - "src/doc_ray/entrypoints/api/mutation_sharing.py"
      - "src/doc_ray/entrypoints/api/document_types.py"
      - "webapp/sharing_web.py"
    claims:
      - claim_id:    "D-031.k1"
        claim_text:  "An org-visible document is readable across the tenant but never across tenants, and only an owner/admin can publish it."
        auditable:   true
        status:      "populated"
        declared_checks_count: 1
        checks:
          - check_id:    "D-031.k1.c1"
            description: "The organization-corpus RLS suite passes against the live schema."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_org_corpus.py"
            expect:
              exit:      0

  - id:                 "D-032"
    title:              "OAuth issues `write` bounded by the consenting user's RBAC, never the client's request"
    version_introduced: "1.38.0"
    category:           "security"
    decision: |
      The OAuth 2.1 Authorization Server may issue the `write` scope, not only
      `read`: SUPPORTED_SCOPES is ("read", "write"). On the interactive
      authorization_code grant, the granted scope is NOT the client's requested
      scope — it is the consenting principal's own RBAC capability, intersected
      with SUPPORTED_SCOPES. OAuthServerService.issue_code takes principal_scopes
      and binds the code to _bound_scope(principal_scopes); webapp/oauth_web.py
      derives those scopes with LocalAuthService.scopes_for_principal (the same
      scopes_for_actions derivation login uses, D-027), and the consent screen
      shows what will actually be granted. A `member`/admin connector therefore
      obtains `write`; a `reader` stays read-only however the client's request is
      framed. client_credentials keeps its provisioned client.scope (no RBAC
      context). `write` remains only the coarse "may mutate anything" gate; which
      rows a token may write stays with _require_document_write / document_acl.
    rationale: |
      Exposing the MCP write tools (D-030) is inert for external agents while the
      AS only mints `read` — every mutation 401s on _require_write_audited's scope
      check before ownership is ever consulted, so an OAuth-connected assistant
      cannot rename a title even for documents its user owns. Adding `write` to
      SUPPORTED_SCOPES alone would over-grant: a client requesting write, or an AS
      that echoes the request, would hand write to a `reader`. Binding the grant
      to the user's RBAC rather than the client's request keeps least privilege
      where it belongs — the human who consents can grant no more than they
      themselves hold — and reuses the D-027 permission→scope derivation so a new
      write-carrying role needs no change here. Deriving at consent time (not
      storing scopes on the session) means the token reflects current RBAC, and a
      principal we cannot resolve degrades to read-only (never fail-open). The
      row-level document_acl gate is unchanged, so a wrongly-broad scope still
      cannot write a document the principal does not own.
    decision_status:    "accepted"
    decision_date:      "2026-07-24"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "src/doc_ray/application/oauth_server.py"
      - "src/doc_ray/application/local_auth.py"
      - "webapp/oauth_web.py"
    claims:
      - claim_id:    "D-032.k1"
        claim_text:  "OAuth grants write only to a principal whose RBAC carries it; a reader stays read-only even when write is requested."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-032.k1.c1"
            description: "The OAuth server bounds the issued scope by the principal's RBAC capability."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_oauth_server.py"
            expect:
              exit:      0
          - check_id:    "D-032.k1.c2"
            description: "The authorize flow derives RBAC scopes and shows/grants them on consent."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_oauth_web.py"
            expect:
              exit:      0

  - id:                 "D-033"
    title:              "In-app corpus backup is a feature toggle, off by default; durability moves to the managed database layer"
    version_introduced: "1.42.0"
    category:           "operations"
    decision: |
      The in-app backup subsystem — the backup-scheduler service, the backup and
      restore job kinds, the archive download route, and the backup UI in both
      the webapp and the admin console — is gated behind a single flag,
      DOCRAY_BACKUP_ENABLED, which defaults to false. Production runs with it
      off; corpus database durability is provided by the managed PostgreSQL
      layer's own automated backups and PITR.

      The flag is enforced at every point that could start or continue backup
      work, each reading domain.jobs.BACKUP_JOB_KINDS rather than naming the
      kinds again: the scheduler exits 0 without enqueueing or pruning; the
      createBackup/restoreBackup mutations refuse before the admin check, so a
      disabled deployment answers "the feature is off" instead of the misleading
      "you are not an admin"; the /backups/<id>/download route 404s before
      touching auth or the database; the webapp's four backup routes 404 and its
      nav entry is hidden under the same flag; the admin console reads the new
      Query.backupEnabled capability field to hide its nav entry and to explain
      itself on a deep link. The worker does not merely decline to claim a
      disabled kind — it claims and cancels it, so rows enqueued before the
      switch was thrown drain out instead of sitting queued forever.

      restore is gated together with backup. Splitting them would leave a
      destructive whole-corpus verb live in a deployment that can no longer
      produce anything for it to consume.
    rationale: |
      The subsystem had never once succeeded in production. At the time of this
      decision the backups table held 27 failed rows, 2 stuck in 'creating', and
      zero 'available'; the backups/ prefix in the production bucket was empty.
      The failures were of two kinds: an S3 EntityTooLarge, because
      application.backup builds the whole tar.gz in memory and
      adapters.object_store.put issues a single PutObject (the corpus archive
      had outgrown the 5 GiB single-PUT ceiling), and a JobExecutionTimeout,
      because building that archive exceeded the 3600s per-job limit.

      The operational cost was not confined to backups. backup was claimable by
      the general worker pool — the only pool that runs annotate — so a backup
      attempt occupied that slot for a full hour before timing out. On
      2026-07-25 a user-visible annotate job sat queued for 39 minutes behind
      one, which is the same starvation shape the worker-fast lane was
      introduced to fix, on a kind that lane never excluded.

      A toggle rather than deletion: the code is a working design for
      self-hosted deployments that have no managed database under them, and
      removing it would also delete the only mechanism that ever captured
      object-store blobs. Keeping it behind a default-off flag preserves that
      option without letting a subsystem with a 0% success rate hold a worker
      slot. Default off (rather than on with a production override) follows the
      D-030 precedent for capability flags and means a fresh deployment does not
      inherit the failure.

      KNOWN GAP, accepted with this decision: managed-database backups cover the
      database only. The in-app archive was the only thing that captured the
      content-addressed original document bytes in object storage, and the
      production bucket does not have versioning enabled. With the flag off,
      those originals have a single copy and no point-in-time recovery. This is
      a deliberate, documented reduction in coverage, not an oversight; closing
      it requires object-store versioning or a separate blob backup, tracked in
      the backlog.
    decision_status:    "accepted"
    decision_date:      "2026-07-25"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "src/doc_ray/config.py"
      - "src/doc_ray/domain/jobs.py"
      - "src/doc_ray/application/jobs.py"
      - "src/doc_ray/entrypoints/worker.py"
      - "src/doc_ray/entrypoints/backup_scheduler.py"
      - "src/doc_ray/entrypoints/api/mutation_guards.py"
      - "src/doc_ray/entrypoints/api/query.py"
      - "src/doc_ray/entrypoints/api/downloads.py"
      - "webapp/admin_web.py"
      - "admin-console/src/api/useBackupEnabled.ts"
      - "config/env.registry.yaml"
    claims:
      - claim_id:    "D-033.k1"
        claim_text:  "With DOCRAY_BACKUP_ENABLED off, no backup work is enqueued or executed at any entry point, and a pre-existing queued backup row is canceled rather than run."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-033.k1.c1"
            description: "The toggle holds at config, worker dispatch, scheduler, mutation guard, and capability field, in both positions."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest src/doc_ray/tests/test_backup_toggle.py"
            expect:
              exit:      0
          - check_id:    "D-033.k1.c2"
            description: "The webapp's backup routes 404 and its nav entry is hidden when the flag is off."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest tests/test_webapp_backup_toggle.py"
            expect:
              exit:      0

  - id:                 "D-034"
    title:              "A GraphQL capability ships with a webapp surface or a reasoned exception"
    version_introduced: "1.43.0"
    category:           "code-quality"
    decision: |
      Every Query and Mutation root field is statically classified as either
      present in the Flask webapp's GraphQL documents or listed in the explicit
      API-only exception ledger with a non-empty reason. The offline checker
      walks Strawberry-decorated methods in Query/Mutation and their mixins,
      applies Strawberry's default snake_case-to-camelCase mapping, and scans
      webapp Python source for the wire field. A stale ledger entry, empty reason,
      parse failure, or new unbound field is a violation.

      `scripts/check_surface_parity.py --strict` is a hard landing gate in both
      `make check-static` and `make check`. Report mode remains available for
      audits and exits zero while printing all findings. The ledger may name a
      bounded direct-SQL browser path or the separate admin console as the human
      surface, but must say so explicitly. This gate covers GraphQL-to-webapp
      reachability only; MCP/CLI parity and read-model signature parity remain
      separate concerns.
    rationale: |
      Epic #23 found many tested GraphQL capabilities with no browser caller.
      Unit tests proved that each resolver worked but could not prove that a
      person could reach it. A deterministic static ledger makes that product
      boundary reviewable: adding a resolver now forces an intentional choice to
      bind it for people or document why it is operational/agent-only. AST
      inspection was chosen over importing the schema so this gate stays fast,
      stdlib-only, offline, and usable before application dependencies or a
      database are available. Hard-gate promotion was selected because report-
      only output would recreate the same ignorable-drift failure the epic fixes.
    decision_status:    "accepted"
    decision_date:      "2026-07-25"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:
      - "scripts/check_surface_parity.py"
      - "webapp/**/*.py"
      - "src/doc_ray/entrypoints/api/**/*.py"
      - "Makefile"
    claims:
      - claim_id:    "D-034.k1"
        claim_text:  "Every GraphQL root field has a webapp binding or a current, non-empty exception reason."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-034.k1.c1"
            description: "The strict static parity inventory is clean."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "python scripts/check_surface_parity.py --strict"
            expect:
              exit:      0
          - check_id:    "D-034.k1.c2"
            description: "Fixture regressions prove new fields and malformed ledger entries fail."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest tests/test_surface_parity_guard.py"
            expect:
              exit:      0
