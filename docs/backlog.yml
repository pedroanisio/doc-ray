  - id:          "BL-144"
    title:        "MCP tests are order-dependent: a lazy mcp streamable_http import inside an httpx-patched test dies on annotation eval"
    summary:      "CORRECTED DIAGNOSIS: not an SDK breakage. test_mcp_corpus.py passes 30/30 in isolation. The MCP tool tests monkeypatch httpx.AsyncClient to a stub callable; if the mcp SDK streamable_http module is imported lazily *during* such a test, its module-level annotation evaluates <lambda> | None and raises TypeError. Purely an ordering/isolation defect, so the suite passed alone and failed after the webapp suite. Fixed by importing the transport eagerly in conftest, before any test can patch httpx."
    description: |
      Observed 2026-07-24 in the canonical Docker test runner: 25 of the MCP
      client tests fail identically with a SDK-level TypeError in
      streamable_http.py, including tests that never touch document listing
      (auth-header, error-mapping, kwic). The prod MCP server container runs, so
      the fault is in the client/test import path under the pinned mcp==1.28.*.
      Fix: pin mcp to a version whose streamable_http imports cleanly (or address
      the httpx/typing incompatibility), then re-run test_mcp_corpus.py.
    category:     "tooling"
    type:         "bug"
    status:       "done"
    complexity:   "S"
