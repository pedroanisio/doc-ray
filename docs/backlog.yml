  - id:          "BL-121"
    title:        "GraphQL Job type omits the queue timing the jobs table already stores"
    summary:      "The jobs table records created_at, run_after, started_at, finished_at, heartbeat_at, attempts, and max_attempts, but the GraphQL Job type exposes only id/kind/status/documentId/error/result/cursor — an API client cannot compute queue wait, job latency, or retry count, and cannot build a pipeline timeline. The webapp's pipeline panel sidesteps the gap by reading Postgres directly, making API consumers second-class for exactly the data an operator most wants when a job looks stuck."
    description: |
      Confirmed live 2026-07-12: information_schema lists 16 columns on
      jobs, including created_at/started_at/finished_at/attempts;
      entrypoints/api/types.py's Job type maps none of them in from_row.
      The fix is additive field exposure — nullable createdAt/startedAt/
      finishedAt (started/finished are null until the transition happens)
      plus attempts/maxAttempts — with no schema or queue change, since
      the columns already exist and every job read path already selects
      full rows. Non-breaking for existing clients (new nullable fields).
    category:     "api"
    type:         "tech-debt"
    status:       "done"
    complexity:   "XS"
    priority:     "medium"
    rationale:    "Surfaced 2026-07-12 while watching reextract backfill jobs ride out worker restarts: status alone cannot distinguish 'queued for two seconds' from 'queued behind a 1703-page sibling for ten minutes', and attempts is invisible even though stale-heartbeat reclaims actively increment it."
    acceptance_criteria:
      - "Job exposes createdAt, startedAt, finishedAt (nullable datetimes) and attempts/maxAttempts, mapped in from_row from the existing queue columns."
      - "jobs(documentId:) and job(id) both return the new fields; a regression test asserts a finished job carries all three timestamps and a queued one carries only createdAt."
      - "Existing clients are unaffected (fields are additive and nullable)."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/types.py"
      - "db/migrations/020_jobs.sql"
    owner:        "shared"
    source:       "Operator request 2026-07-12 (this session): asked whether an endpoint reports pipeline history/events; gap confirmed against information_schema vs types.py. Completed 2026-07-12 by exposing Job timing and attempt fields in GraphQL with regression coverage (commit e1e1765)."
    tags:         ["api", "jobs", "observability", "tech-debt"]

  - id:          "BL-122"
    title:        "Push-based pipeline progress: subscriptions, webhooks, or SSE instead of poll-only"
    summary:      "Every pipeline surface is poll-only by design (D-004/D-005: mutations enqueue and return a job; clients poll job(id); the webapp meta-refreshes every 3s while anything is queued or running). No GraphQL subscription, webhook registration, or SSE endpoint exists anywhere — an API consumer driving ingestion (an AI agent, a CI pipeline) must busy-poll to learn a job finished."
    description: |
      Confirmed live 2026-07-12: the Strawberry schema registers no
      subscription type, and a repo-wide grep for webhook/callback/SSE
      surfaces nothing. Three candidate mechanisms with genuinely
      different trade-offs, which is why this is parked pending an
      operator decision rather than ready:

      (a) GraphQL subscriptions (Strawberry supports them over
      websockets) — most natural for the existing API, but adds a
      websocket leg to the uvicorn deployment and needs a bridge from
      job-status transitions (Postgres LISTEN/NOTIFY fits, since every
      transition already goes through queue_postgres).
      (b) Outbound webhooks — best for unattended automations, but adds
      callback-URL registration, delivery/retry semantics, and an SSRF
      surface that would need the same hardening posture as BL-088/BL-094.
      (c) Server-sent events — the smallest server-push option, one-way,
      proxy-friendly (the nginx front door would need buffering off for
      the SSE location).

      Whichever lands should treat the jobs table as the single source of
      truth (NOTIFY on status transition, no parallel event store), and
      delivery must respect the same principal scoping as job reads
      (BL-064's document_acl model). Synergy: BL-117's correlation ids
      would ride the same events; BL-121's timestamps make the payloads
      useful.

      DECIDED 2026-07-12 (operator): EventSource/SSE — option (c). The
      stream should also carry BL-123's within-job progress updates, not
      only status transitions, so one EventSource covers both "the job
      moved state" and "the job is 60% through extraction". Unparked to
      ready on that decision; nginx config gains proxy_buffering off for
      the SSE location when this lands.
    category:     "api"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "Originally parked because the mechanism pick (subscriptions vs webhooks vs SSE) was the operator's call; the operator picked EventSource/SSE on 2026-07-12 and named async progress a first-class requirement, which resolves the design question and raises the priority."
    acceptance_criteria:
      - "An API consumer can receive job status transitions (queued -> running -> succeeded/failed, including reclaim/retry) for a document or job without polling, via the chosen mechanism."
      - "Event delivery respects the same principal/document scoping as job reads — no cross-tenant/cross-grant leakage of job events."
      - "The jobs table remains the source of truth: events are emitted from status transitions (e.g. LISTEN/NOTIFY), not a second event store."
      - "docs/architecture.md and the API docs describe the mechanism and its deployment implications (websocket leg, webhook retries, or SSE buffering at the nginx front door)."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/schema.py"
      - "src/doc_ray/adapters/queue_postgres.py"
      - "docs/architecture.md"
    owner:        "shared"
    source:       "Operator request 2026-07-12 (this session), same investigation as BL-121: no push mechanism exists; poll-only confirmed against schema.py and a repo-wide webhook/SSE grep. Completed 2026-07-12 with an RLS-filtered EventSource/SSE job event stream, Postgres NOTIFY transition events, nginx buffering config, and docs (commit 0179632)."
    tags:         ["api", "jobs", "events", "subscriptions", "webhooks", "feature"]

  - id:          "BL-123"
    title:        "First-class async job progress: within-job progress reporting from worker handlers, surfaced live"
    summary:      "A running job is opaque today: the jobs row flips queued -> running -> succeeded/failed with nothing in between, so a 1703-page PDF extraction and a 3-sentence text ingest look identical while running — the webapp panel can only show a spinner and API consumers can only poll a status that never changes mid-job. Operators cannot distinguish 'working through page 900 of 1703' from 'hung' (BL-100's timeout gap is the failure-side twin of this visibility gap)."
    description: |
      Requirement named by the operator 2026-07-12: ingestion, processing,
      and extraction need a first-class async progress indicator.

      Shape: the jobs table gains progress fields (progress_current,
      progress_total, progress_stage text), written by long-running worker
      handlers at natural batch boundaries — extraction per page,
      annotation per sentence batch, semantic enrichment per layer,
      backup per table, reextract per page — piggybacking on the existing
      heartbeat write cadence so progress costs no extra round-trips
      (queue_postgres already touches the row via heartbeat_at while a
      job runs). Surfaces, in order: GraphQL Job exposes
      progressCurrent/progressTotal/progressStage alongside BL-121's
      timestamps; the webapp pipeline panel renders a real progress bar
      with stage text during its existing refresh cycle; BL-122's
      EventSource stream pushes progress events live so both the webapp
      and unattended API consumers can drop polling entirely.

      Sequencing note: the same queue plumbing (application/jobs.py,
      ports/queue.py, adapters/queue_postgres.py) is being modified by
      BL-102 (job cancellation) at the time of writing — land this after
      BL-102 merges to avoid painful conflicts; cancellation checks and
      progress writes will likely share the same handler checkpoint
      pattern, so landing second can reuse it.
    category:     "ops"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "Operator requirement (2026-07-12). Status-transition events alone (BL-122) cannot answer 'how far along is this job' — that requires the worker to report from inside the handler. The heartbeat write path already exists at exactly the right cadence, making this an instrumentation surface rather than new machinery."
    acceptance_criteria:
      - "A migration adds progress fields to jobs; long-running handlers (ingest/extract, annotate, semantic_enrich, canonicalize, backup, reextract) update them at batch boundaries without measurable throughput regression."
      - "GraphQL Job exposes progressCurrent/progressTotal/progressStage; a mid-run job shows advancing values, a completed one shows current == total."
      - "The webapp pipeline panel shows a progress bar + stage text for running jobs (graceful fallback to today's spinner when a handler reports no progress)."
      - "Progress updates are emitted on BL-122's EventSource stream when it lands, using the same event channel as status transitions."
      - "Tests cover a handler that reports progress, one that doesn't (fallback), and the API field exposure."
    dependencies: ["BL-102"]
    references:
      - "src/doc_ray/application/jobs.py"
      - "src/doc_ray/adapters/queue_postgres.py"
      - "src/doc_ray/entrypoints/api/types.py"
      - "webapp/job_view.py"
    owner:        "shared"
    source:       "Operator requirement 2026-07-12 (this session): 'the ingestion, processing, extraction, need a first class async progress indicator or eventsource full' — the same message selected SSE for BL-122. Completed 2026-07-12 with domain-level progress reporting usable from adapters, page-level PyMuPDF extraction reports, inner ingest/reextract/backup/annotation/semantic-enrichment progress stages, queue progress notifications, GraphQL/SSE exposure, and webapp progress rendering; validated locally and in the isolated Docker test stack."
    tags:         ["ops", "jobs", "progress", "observability", "feature"]

  - id:          "BL-124"
    title:        "Test suites run destructively against the live/UAT database — provision an isolated test database"
    summary:      "Local full-suite runs point at the same Postgres the webapp/UAT serves (DATABASE_URL from .env); only CI gets an ephemeral instance. Verified damage from one evening of agent runs: 19 orphaned itest fixture documents accumulated in the corpus (soft-delete semantics from BL-059 broke the old cleanup assumption; failed runs skip teardown entirely), test_queue claimed a real queued job off the shared queue and orphaned it under a test worker-id, and the backup/restore tests replace live corpus state — coinciding with an operator's fresh uploads vanishing mid-demo."
    description: |
      Confirmed live 2026-07-12: documents held 19 itest rows (all
      lifecycle_state='deleted', created 05:52-06:00 during suite runs)
      alongside 3 real documents; test_queue::test_enqueue_claim_complete
      failed by claiming a real pipeline job (claim takes the next eligible
      job globally); the restore-path tests run session_replication_role
      replica restores against whatever database they are pointed at.

      Fixed by the existing docker-compose.test.yml / scripts/test-in-docker.sh
      isolated stack plus a session-start guard in src/doc_ray/tests/_itdb.py:
      DB-backed integration tests refuse local non-test databases unless
      DOCRAY_TEST_ALLOW_LIVE_DB=1 is explicitly set, while the dedicated
      docray-test stack and CI's ephemeral database remain allowed. Direct
      integration call sites now route through _itdb.connect() or the same
      guard before creating throwaway databases.
    category:     "testing"
    type:         "infra"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "Every agent task close-out runs the full suite; with the fleet operating continuously, the shared corpus is corrupted by test fixtures and destructive tests many times per day. The cost is no longer hypothetical: an operator's uploads were destroyed mid-session and test residue polluted UAT the same night."
    acceptance_criteria:
      - "A local full-suite run creates zero rows in the operator's corpus database: fixtures run against an ephemeral database provisioned and dropped by the suite (or a dedicated compose test profile)."
      - "The suite refuses to run against a database containing non-fixture documents unless an explicit opt-in env var is set."
      - "test_queue-style claim tests cannot interact with real jobs (isolated DB makes the shared-queue race impossible)."
      - "README/docs describe the test-database setup; CI behavior is unchanged."
