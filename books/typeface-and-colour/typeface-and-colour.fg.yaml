      style: body
      type: text
      text: 'This book has tried to run the same loop on itself: its quotations audited
        against their sources, its contrast claims measured, its own pages weighed
        by the principles they teach, and its residual limits declared in the apparatus.
        Where it fails, the method — not the author''s taste — is the court of appeal.'
