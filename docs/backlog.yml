  - id:          "BL-153"
    title:        "MCP Ops Phase 3: health, readiness, rate limiting, and the token-minting runbook"
    summary:      "The MCP server ships live in production ahead of its ops surface: no liveness/readiness endpoints, no rate limiting, and no written token-minting/rotation procedure. This closes the four genuinely-open Phase-3 items of docs/mcp-service.md §4 so the MCP front door has the operational surface every other service in the stack already has."
    description: |
      New entrypoints/mcp/health.py (GET /health liveness — dependency-free, 200
      even when the upstream is down; GET /readyz readiness — 503 naming the failed
      check, ≤2s upstream probe, ~5s negative cache) and entrypoints/mcp/ratelimit.py
      (per-principal fixed-window limiter, 429 + Retry-After, fingerprint-not-token
      logging). Both probes bypass BearerAuthMiddleware and the limiter via a shared
      health.PUBLIC_PATHS. Open decision 1: reuse — the pure limiter moved to
      doc_ray.domain.rate_limit, shared with the webapp (webapp/rate_limit.py is a
      re-export shim), no second implementation. Open decision 2: in-process state
      (per container; N replicas => N×, documented). Open decision 3: 5s negative
      readiness cache. Open decision 4: generous enabled-by-default limit (120/60s)
      that only catches runaway loops, since the API has no limiter to mirror. Compose
      healthcheck upgraded from a TCP probe to GET /health. Token runbook added to
      docs/production-setup.md (mint/rotate/revoke, static vs OAuth DCR, audit trail).
      No schema change, no version bump.
    category:     "ops"
