  - id:          "BL-164"
    title:        "term_frequency reported unattested for terms the lexeme index cannot hold; search coverage never affirmed completeness"
    summary:      "The lexeme tokenizer excludes `_` and digits from word characters, but the term_frequency lookup key does not tokenize — so `shared_buffers`, `pg_stat_activity` and `COVID-19` were queried against an index that structurally could not contain them, returned 0, and were reported `attested=false` with 'a search will most likely return nothing'. Measured in production: term_frequency called shared_buffers unattested while search_sentences returned a full page of hits and tripped limit_reached. Separately, search_sentences announced itself only when it FAILED to be complete, so a zero-hit result could not be told apart from a bad query."
    description: |
      Root cause, both halves.

      (1) `doc_ray.domain.lexemes._WORD_RE` is `[^\W\d_]+(?:['’\-][^\W\d_]+)*`,
      which excludes underscores AND digits from word characters. It is the
      production tokenizer (adapters/annotation.py, application/reannotate.py),
      so no key containing either can exist in `lexemes`. But `norm_lemma` — the
      term_frequency lookup key builder — only NFC-casefolds and never
      tokenizes. The key `shared_buffers` was therefore looked up against an
      index that could not hold it: a guaranteed zero, reported as measured
      absence. Blast radius is wider than underscore compounds because of the
      digit exclusion: `COVID-19` indexes as `COVID`, `IPv6` as `IPv`, `x86_64`
      as `x`. Severity is amplified by the MCP server instructions, which tell
      agents to run term_frequency FIRST and treat `attested=false` as "the
      search will likely return nothing" — so the pre-flight actively steered
      agents off the rare, specific technical terms it exists to steer them
      toward, and contradicted search_sentences on the same string.

      (2) `shaping._search_coverage` emitted a note only on `limit_reached`.
      A result that was not truncated said nothing, so `hit_count` could not be
      distinguished from "first page of many" and an empty `hits` could not be
      distinguished from a bad query. Consumers building grounded documents have
      to state absence; silence is not a foundation for that claim, so they
      hedged or proposed sharded corpus sweeps to re-derive what one call knew.

      Fix. Terms are classified `indexable` by running the production tokenizer
      and requiring exactly one word equal to the lookup key. Unindexable terms
      return `uses`/`share`/`attested` as null with `floodRisk: "unknown"`, the
      constituent parts (and their counts) as evidence, and a note redirecting to
      search_sentences, whose literal-substring match handles them. Part counts
      ride the SAME single statement (D-024 preserved). Coverage gained
      `exhaustive`, true when the page did not fill AND no cursor preceded it;
      a zero-hit first page also gets prose, scoped to document-or-visible-corpus
      and bounded to the literal string. Paging past the end is deliberately NOT
      exhaustive.

      Not fixed here (deliberate, needs operator call): the index itself still
      cannot represent compounds. Making `shared_buffers` countable means
      changing `_WORD_RE` and re-annotating the corpus (~31.7M lexeme uses) —
      a migration-scale decision, not a pre-flight bug fix. The pre-flight is now
      honest about what it cannot answer, which is the correctness issue.
    category:     "api"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "PALS's LAW applied to our own retrieval layer: the component built to stop wasted retrieval was itself unverified, and emitted confident false negatives into agent context. A pre-flight that cannot answer must say so — a fabricated zero is worse than silence, because it is actionable and wrong."
    acceptance_criteria:
      - "term_frequency never reports attested=false for a term the lexeme index cannot hold; such terms return indexable=false with null uses/share/attested and floodRisk 'unknown'."
      - "A genuinely absent single word (index CAN hold it, zero uses) still reports attested=false with an 'unattested' note — the real signal is not blunted."
      - "Part counts for unindexable terms are fetched in the same single statement as everything else (D-024)."
      - "search_sentences reports coverage.exhaustive; a zero-hit first page states that the scan was exhaustive and bounds the claim to the literal string and the visible scope."
      - "A zero-hit continuation page (after=cursor) is NOT exhaustive and makes no absence claim."
    dependencies: []
    references:
      - "src/doc_ray/domain/term_frequency.py"
      - "src/doc_ray/domain/lexemes.py"
      - "src/doc_ray/entrypoints/mcp/shaping.py"
      - "src/doc_ray/tests/test_term_frequency.py"
      - "src/doc_ray/tests/test_search_coverage.py"
    owner:        "shared"
    source:       "Self-disclosed by a corpus-grounded field guide built from the doc-ray Postgres corpus, which recorded on its front matter that term_frequency called shared_buffers unattested while the texts use it constantly, and hedged its own pgbouncer absence claim for want of a completeness signal. Root-caused to _WORD_RE and confirmed end-to-end against the live corpus 2026-07-26 (Claude Opus 5 via Claude Code); digit half of the blast radius found during that root-cause."
    tags:         ["mcp", "retrieval", "lexemes", "false-negative", "grounding"]

