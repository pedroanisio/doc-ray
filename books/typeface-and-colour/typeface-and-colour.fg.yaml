        calico chapter issues the warning every brand-guideline PDF still repeats:
        “the pattern may appear to be very different in colour from what was intended,
        and from what it really is.” The type chapter then runs the experiment this
        book has been circling since plate 37.'
    - box:
      - 68
      - 462
      - 658
      - 150
      style: body
      type: text
      text: His protocol is startlingly modern. He separates the cases — reading “of
        some minutes'” duration from reading “of some hours'”; daylight from artificial
        light — notes that letters present “much less extent of surface than the paper
        which serves as their ground,” and even accounts for afterimage fatigue, “the
        impression of their respective complementaries,” during long reading. Then
        he ranks nine papers by eye, “commencing with those which appeared to me the
        easiest to read.”
    - box:
      - 68
      - 652
      - 658
      - 70
      style: body
      type: text
      text: The plate opposite prints his ranking — and re-measures it with the instrument
        his century did not have.
