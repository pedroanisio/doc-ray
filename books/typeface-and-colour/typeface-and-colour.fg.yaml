      type: text
      text: The pairing is the deep lesson of the chapter. Symmetry and asymmetry
        are not rival styles but two solutions of one equation — the first solved
        by mirroring, the second by weighing. A title page centred on its axis and
        a modernist spread with its heavy image high and left are obeying the same
        law with different arithmetic.
