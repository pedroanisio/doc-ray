  - id:          "BL-109"
    title:        "GraphQL write-mutation arguments lack the bounds every read resolver enforces"
    summary:      "context.py's MAX_PAGE_SIZE/page_size() clamp is applied by every query resolver, but suggestSeeds's limit argument is passed straight into the job payload with no call to page_size(), and decideSeeds's approveIds/rejectIds arrays have no length cap at all — both distinct from BL-009 (query-shape limits) and BL-063 (documents-list pagination, unrelated resolvers)."
    description: |
      Confirmed live: `mutation.py`'s `suggest_seeds(self, info, document_id,
      limit: int = 40)` forwards `limit` directly into
      `{"limit": limit}` with no bound check, which flows unbounded into
      `application/seed_suggest.py`'s raw SQL `LIMIT %s`. `decideSeeds`
      (mutation.py) accepts unbounded `list[strawberry.ID] | None` for both
      `approveIds` and `rejectIds`, forwarded to
      `seed_suggestion_store.py`'s `WHERE id = ANY(%s)` with no length
      check. A client can request an arbitrarily large `limit` or submit an
      arbitrarily large ID array in one request.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "BL-009 explicitly bounds query *shape* (depth/token count), not argument *values* on mutations — this is the gap that leaves. A resource-exhaustion vector on the worker (unbounded candidate mining per document) is a distinct concern from the generic error-envelope work BL-049 tracks."
    acceptance_criteria:
      - "suggestSeeds's limit argument is clamped through the same page_size()-style bound the read resolvers use."
      - "decideSeeds's approveIds/rejectIds arrays are capped at a documented maximum length, rejected cleanly if exceeded."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/mutation.py"
      - "src/doc_ray/entrypoints/api/context.py"
