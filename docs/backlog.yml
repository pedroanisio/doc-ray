  - id:          "BL-100"
    title:        "Worker detects crashed jobs but not hung ones — no execution timeout"
    summary:      "_start_heartbeat keeps a job's heartbeat alive for as long as the handler runs regardless of progress, and reap_stale only reclaims jobs whose heartbeat has gone stale (a dead worker process) — a handler stuck in an infinite loop, a DB deadlock, or a hanging external call (e.g. ClaudeResolver.resolve with no explicit timeout) heartbeats forever and is never reclaimed."
    description: |
      Confirmed live: `application/jobs.py`'s `_start_heartbeat` spins a
      daemon thread on a fixed interval independent of the handler's actual
      progress; `adapters/queue_postgres.py`'s `reap_stale` only reclaims
      jobs whose heartbeat timestamp has gone stale, i.e. it detects a dead
      *process*, not a live-but-stuck handler. `adapters/resolver_claude.py`
      opens an `anthropic.Anthropic()` client with no explicit request
      timeout. With the default single-`worker`-replica topology
      (docker-compose.yml), one hung job blocks the entire queue
      indefinitely — including every future scheduled backup (see BL-102's
      related starvation scenario).
    category:     "ops"
    type:         "bug"
    status:       "parked"
    complexity:   "M"
    priority:     "medium"
    rationale:    "The retry/backoff/max-attempts machinery (BL-010/011, already done) only helps once a handler *returns* an exception — it does nothing for a handler that never returns at all."
    acceptance_criteria:
      - "Each job kind has a configurable maximum execution duration; exceeding it fails the job (subject to the existing retry/backoff policy) instead of holding the queue slot forever."
      - "ClaudeResolver.resolve and any other external-call handler sets an explicit request timeout."
    dependencies: []
    references:
      - "src/doc_ray/application/jobs.py"
      - "src/doc_ray/adapters/queue_postgres.py"
      - "src/doc_ray/adapters/resolver_claude.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (worker/job-queue subsystem audit)."
    tags:         ["ops", "reliability", "bug"]

  - id:          "BL-101"
    title:        "Worker's outer poll loop has no resilience to a dropped DB connection"
    summary:      "worker.py opens one plain psycopg connection for the life of the process with no reconnect logic; queue.reap_stale and queue.claim execute outside any try/except in the outer loop (only handler exceptions are caught), so a transient Postgres blip during the reaper scan or claim query crashes the whole worker process instead of being retried on the next poll."
    description: |
      Confirmed live: `adapters/persistence.py`'s `db.connect` opens a
      single long-lived `psycopg.connect` with no reconnect wrapper.
      `worker.py`'s outer loop calls `queue.reap_stale` and `queue.claim`
      unguarded; `application/jobs.py`'s `except Exception as exc` only
      wraps the handler dispatch itself (jobs.py's inner call), not these
      outer-loop calls. A restart, network partition, or connection reset
      hitting the reaper or claim query therefore raises unhandled and kills
      the process — requiring an external process supervisor (Docker
      restart policy) to notice and recover, with the same reap-and-resume
      cost as a full crash.
    category:     "ops"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "The queue's crash-recovery story (reap_stale, retry/backoff) already assumes the worker process itself is resilient enough to keep polling — a transient DB blip shouldn't need a full process restart to recover from."
    acceptance_criteria:
      - "The outer poll loop catches connection-level exceptions from reap_stale/claim, backs off briefly, and reconnects rather than crashing the process."
      - "A test simulates a dropped connection mid-loop and asserts the worker recovers and resumes claiming jobs without process exit."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/worker.py"
      - "src/doc_ray/adapters/persistence.py"
      - "src/doc_ray/application/jobs.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (worker/job-queue subsystem audit). Completed 2026-07-11 (outer poll loop retries on psycopg.OperationalError with WORKER_RECONNECT_BACKOFF_SECONDS backoff, D-020) on branch fix/bl-097-delete-blob-leak."
    tags:         ["ops", "reliability", "bug"]

  - id:          "BL-102"
    title:        "JobStatus.CANCELED is a dead status — no code path ever sets it"
    summary:      "domain/jobs.py defines CANCELED as a valid jobs.status CHECK-constraint value, but a repo-wide grep for \"cancel\" finds only the enum member and unrelated hits — no mutation, CLI command, or queue function ever transitions a job to canceled, so operators have no way to cancel a queued or running job (e.g. an accidental resolve=true canonicalize job, or a hung backup per BL-100)."
    description: |
      Confirmed live: `domain/jobs.py` defines `CANCELED = "canceled"` and
      `db/migrations/020_jobs.sql`'s CHECK constraint on `jobs.status`
      accepts it, but nothing in the GraphQL mutation surface, the CLI, or
      `queue_postgres.py` ever writes that value. Combined with BL-100 (no
      execution timeout) and BL-103's backup-starvation scenario, this means
      a stuck job today has no operator-facing way to be stopped short of
      manual SQL surgery against the `jobs` table.
    category:     "ops"
    type:         "feature"
    status:       "parked"
    complexity:   "S"
    priority:     "low"
    rationale:    "A status value the schema already models but the application never exposes is a half-finished feature — cheaper to complete than to leave as a trap for the next person who assumes cancellation exists because the enum says it does."
    acceptance_criteria:
      - "A GraphQL mutation (admin-gated, per the BL-064 pattern) transitions a queued or running job to canceled."
      - "The worker checks for a canceled status at a safe checkpoint and stops processing rather than completing a canceled job."
    dependencies: []
    references:
      - "src/doc_ray/domain/jobs.py"
      - "db/migrations/020_jobs.sql"
      - "src/doc_ray/adapters/queue_postgres.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (worker/job-queue subsystem audit)."
    tags:         ["ops", "feature", "jobs"]

  - id:          "BL-103"
    title:        "Webapp has no CSRF protection on any state-changing form"
    summary:      "Upload, backup create/restore, and seeding approve/reject/seed are all POST forms in webapp/templates/*.html with no CSRF token, no SameSite reliance documented, and no Origin check anywhere in app.py — a logged-in operator's browser can be tricked into submitting any of these from another origin."
    description: |
      Confirmed live: grepped every `<form method="post">` in
      `webapp/templates/` (upload.html, backups.html, seeding.html) and the
      corresponding `app.py` routes — none carry or verify a CSRF token, and
      no `Flask-WTF`/`Flask-SeaSurf`-style protection is installed anywhere
      in `requirements.txt`. This is distinct from BL-070 (a future
      real-login session/cookie feature, still parked) — even without a
      login system, any admin-token-authenticated browser session
      (bookmarked token URL, per BL-107's related finding) is exposed to
      cross-site request forgery today.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "The webapp's admin-gated actions (createBackup, restoreBackup, seed approval) are exactly the operations an attacker would want to trigger via a forged cross-site request against an operator's open browser tab."
    acceptance_criteria:
      - "Every state-changing webapp form carries a per-session CSRF token, verified server-side before the action executes."
      - "A test posts to a state-changing route without a valid token and asserts it is rejected."
    dependencies: []
    references:
      - "webapp/app.py"
      - "webapp/templates/upload.html"
      - "webapp/templates/backups.html"
      - "webapp/templates/seeding.html"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (webapp security subsystem audit). Completed 2026-07-11 (a per-session CSRF token, session-cookie-backed and compared with hmac.compare_digest, is minted via a Jinja csrf_token() global and verified in a before_request hook that rejects every POST/PUT/PATCH/DELETE without a matching token; hidden field added to all 3 form templates) on branch fix/bl-103-webapp-csrf."
    tags:         ["security", "webapp", "csrf", "bug"]

  - id:          "BL-104"
    title:        "Webapp sends no security response headers (CSP, X-Frame-Options, etc.)"
    summary:      "No Content-Security-Policy, X-Frame-Options, X-Content-Type-Options, or Referrer-Policy header is set anywhere; no Flask-Talisman (or equivalent after_request hook) exists in app.py or requirements.txt."
    description: |
      Confirmed live: grepped `app.py` for `after_request`, `Talisman`,
      and each header name — zero hits. The webapp renders document text
      and metadata originating from uploaded files; a defense-in-depth CSP
      would reduce blast radius even though the current templates escape
      correctly (verified: no `|safe` filter or `{% autoescape false %}`
      exists anywhere in `webapp/templates/`).
    category:     "security"
    type:         "tech-debt"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
