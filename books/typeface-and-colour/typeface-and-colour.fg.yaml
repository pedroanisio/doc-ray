        and the design reads at a glance; scattered, every fragment is an unanswered
        attraction and the eye is pulled twenty-six ways.
    - box:
      - 68
      - 736
      - 76
      - 13
      style: labelR
      type: text
      text: PLATE 43
    - box:
      - 152
      - 736
      - 574
      - 40
      style: cap
      type: text
      text: Tone balance as distribution — an author's demonstration on Batchelder's
        principle. Ink is weight; weight wants marshalling.
    - box:
      - 68
      - 812
      - 658
      - 110
      style: body
      type: text
      text: The typographic translation is immediate. A page's blacks are its display
        sizes and its bolds; its greys are the text; its whites, the margins. A layout
        that bolds everything scatters its ink — and a reader who cannot find the
        heaviest thing has been told nothing about where to begin.
