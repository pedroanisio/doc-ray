    source:       "Session finding 2026-07-05: document-surface UX/data-management capability audit (parallel webapp-UI and GraphQL/persistence reviews against 9 claimed product gaps). Implemented 2026-07-12 with document-list multi-select controls, bulkTagDocuments/bulkArchiveDocuments GraphQL mutations, queued per-document add_document_tags/archive jobs, and worker-time tag merge history entries through the BL-058 change-history path."
