  - id:          "BL-190"
    title:        "Deterministic filename normalization with reversible apply"
    summary:      "Document filenames arrive arbitrary and nothing normalizes them; any rename done by hand is irreversible and destroys the original name, which is often the only surviving clue to where a document came from."
    description: |
      Filename normalization as a pure, idempotent function over verified
      fields, applied through a separate `apply` step that journals every
      rename against content hashes, with `revert` to undo it. Collision
      breaking uses the content hash, not a counter: a counter makes the output
      depend on directory iteration order, so two runs over the same directory
      disagree. `documents.original_filename` continues to record the
      pre-normalization name.
    category:     "extraction"
    type:         "feature"
    status:       "ready"
    complexity:   "M"
    priority:     "medium"
    rationale:    "A name derived deterministically from verified fields is reviewable and a rename journalled against content hashes is reversible; neither property survives doing it by hand."
    acceptance_criteria:
      - "normalize_name is idempotent, breaks collisions with the content hash rather than a counter, and bounds the encoded filename to 200 bytes at a separator boundary."
      - "Reserved device names, leading dots and leading hyphens are re-derived, and extension aliases (.markdown/.htm/.text) canonicalize to a still-allowlisted extension."
      - "apply refuses to run against a manifest whose recorded content hashes no longer match disk, and revert restores every original name from the journal."
      - "A file with no corroborated metadata is renamed from its own normalized stem only — no field is invented to fill the template."
    dependencies: ["BL-189"]
    references:
