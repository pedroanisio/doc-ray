  - id:          "BL-196"
    title:        "Corrupted VLM output reaches the human queue instead of being rejected mechanically"
    summary:      "About 6% of caption proposals carry leaked reasoning scaffolding — unstripped <think> blocks, <|im_start|>/<|im_end|> chat-template tokens, U+FFFD replacement characters and degenerate token runs — and are presented to a human as reviewable proposals rather than being rejected by rule."
    description: |
      Measured 2026-07-29 across 6,122 caption rows:
        starts with '<th' (truncated <think>)        364  (5.9%)
        contains <think> or </think>                 118  (1.9%)
        contains <|im_start|> / <|im_end|>            26  (0.4%)
        contains U+FFFD replacement character         48  (0.8%)
        shorter than 40 characters                   317  (5.2%)
        free of every leakage marker               5,737 (93.7%)

      One observed caption is the entire string '<th a ,'. These are mechanically
      detectable and carry no information; a human decision on them is wasted.

      Two defects sit behind this. First, the adapter does not strip the model's
      reasoning block or its chat-template sentinels before persisting the caption.
      Second, nothing rejects structurally invalid output before it is queued for a
      person. TC-DXP-001 CLM-S9 — be liberal in what the interface accepts and
      conservative in what it emits — is violated at the emit step: raw model
      scaffolding is rendered to the operator verbatim.
    category:     "nlp"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "Presenting structurally invalid model output as a reviewable proposal spends the scarcest resource in the system — operator attention — on items that can be rejected by a regular expression, and it destroys trust in every other item in the queue."
    acceptance_criteria:
      - "The caption adapter strips reasoning blocks and chat-template sentinels before persisting, and a test pins that behaviour for each known marker."
      - "Structurally invalid captions are auto-rejected with a recorded reason rather than entering status='review'."
      - "The existing 364+ corrupted rows are back-filled to 'rejected' with that reason, not silently deleted."
      - "The rejection rule is asserted by a test using real captured malformed output, not a synthetic string."
    dependencies: []
    references:
      - "Session finding 2026-07-29: leakage-marker counts over visual_caption"
      - "src/doc_ray/adapters/vlm_ollama.py, src/doc_ray/adapters/vlm_vllm.py"
      - "TC-DXP-001.product-surfaces.tc-v0.3 CLM-S9"
    owner:        "unassigned"
    source:       "Session finding 2026-07-29; operator screenshots of /review plus direct measurement of visual_caption.caption"
    tags:         ["visual-caption", "data-quality", "pals-gate"]
  - id:          "BL-197"
    title:        "The review queue has no triage: no sort, no filter, and the worst proposals surface first"
    summary:      "The visual lane returns proposals in storage order with no sort by grounding score, no filter by band, model or document, and no saved view — so an operator opening the queue meets the least useful items first and has no way to reach the items worth deciding on."
    description: |
      The lane offers a document_id scope and nothing else. There is no ordering by
      grounding_score, no band filter, no model filter (the queue mixes
      qwen3-vl:32b-instruct and nemotron-nano-12b-v2-vl output), and no way to
      exclude the structurally invalid rows described in BL-196.

      The operational consequence was observed directly: the first screen an
      operator saw contained 45.5%, 18.3%, 0.0%, 30.7% and 1.4% items, three of
      which were token soup. The reasonable conclusion drawn was that the whole
      corpus is garbage, when in fact 93.7% is well-formed prose.

      TC-DXP-001 CLM-DXP-DX-CANT-FIND holds that findability precedes usability and
      that a system whose content cannot be found has failed; CLM-T4 constrains
      breadth by what a user can visually scan, not by what fits in a page.
    category:     "webapp"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "Ordering determines what an operator believes about the corpus. An unordered queue over a skewed distribution produces a false impression of the whole from an unrepresentative head, and that misjudgement is expensive to reverse."
    acceptance_criteria:
      - "The visual lane can be sorted by grounding_score ascending and descending, and the active sort is visible."
      - "The lane can be filtered by grounding band, by model, and by document, and filters compose."
      - "The default view is ordered so the items most likely to be approved appear first."
      - "The filter state is reflected in the URL so a view can be shared and resumed."
    dependencies: ["BL-196"]
    references:
      - "webapp/review_web.py:142 _visual_lane (document_id + cursor only)"
      - "webapp/review_web.py:45 visualReview(documentId, status, limit, after)"
      - "TC-DXP-001.product-surfaces.tc-v0.3 CLM-DXP-DX-CANT-FIND, CLM-T4"
    owner:        "unassigned"
    source:       "Session finding 2026-07-29 (operator screenshots showing unordered low-grounding head)"
    tags:         ["review-queue", "ux", "visual-caption"]
  - id:          "BL-198"
    title:        "Caption proposals render as undifferentiated walls of text with no visual hierarchy"
    summary:      "Each proposal renders the full caption as a single unstyled paragraph with no truncation, no emphasis on the decision-relevant part and no separation between the model's prose and its leaked scaffolding, so proposals cannot be compared by scanning."
    description: |
      review.html emits `<p>{{ item.caption }}</p>` with no length cap, no
      structure and no distinction between a 40-character fragment and a
      600-character description. Adjacent proposals are separated only by a 1px
      top border, and the grounding pill sits below the text rather than beside the
      decision control.

      TC-DXP-001 CLM-S7 requires content chunked into visually distinct groups with
      a clear information hierarchy. The decision an operator is making is
      'is this caption true of that image' — so the image, the caption and the
      score are the decision unit, and they are currently spread across three
      loosely related blocks with the image behind a link to another page.
    category:     "webapp"
    type:         "tech-debt"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "The operator's task is comparison under repetition. Without visual hierarchy every item costs full reading effort, which multiplies directly by queue depth."
    acceptance_criteria:
      - "Long captions are clamped with an affordance to expand, so proposals occupy comparable vertical space."
      - "The grounding score, the caption and the image thumbnail form one visually bounded decision unit."
      - "The image is visible in the queue rather than only reachable via a link to another page."
      - "Proposal boundaries are unambiguous at a glance when scrolling."
    dependencies: []
    references:
      - "webapp/templates/review.html (visual lane markup and .review-item styles)"
      - "TC-DXP-001.product-surfaces.tc-v0.3 CLM-S7"
    owner:        "unassigned"
    source:       "Session finding 2026-07-29 (operator screenshots of /review visual lane)"
    tags:         ["review-queue", "ux", "visual-caption"]
  - id:          "BL-199"
    title:        "The review queue discloses a count but never progress, remaining effort, or scale"
    summary:      "The lane tab shows a raw pending count and nothing else: no page position, no total pages, no indication that the count is five thousand rather than fifty, and no sense of whether a session made progress."
    description: |
      The operator sees 'Visual captions 5851' and a page of 25. There is no
      'page N of 234', no per-session decided count, and no indication that the
      queue grows as documents are captioned. An operator cannot tell whether an
      hour of work moved the number.

      TC-DXP-001 CLM-S10 holds that people judge an experience by its emotional
      peak and its ending; a queue that gives no evidence of progress has no
      ending to design. The absence of scale disclosure is also what allows the
      queue to reach 5,851 unnoticed.
    category:     "webapp"
    type:         "feature"
    status:       "done"
    complexity:   "XS"
    priority:     "medium"
    rationale:    "Unbounded work with no progress signal is abandoned. The count alone communicates volume but not tractability, which is the thing an operator needs in order to start at all."
    acceptance_criteria:
      - "The lane shows page position and total pages for the active filter."
      - "The number of items decided in the current session is visible."
      - "The queue surfaces its growth rate or its oldest pending item, so an unattended backlog is visible before it reaches five figures."
    dependencies: ["BL-197"]
    references:
      - "webapp/templates/review.html (lane tabs and pending counts)"
      - "webapp/review_web.py:53 _pending_counts"
      - "TC-DXP-001.product-surfaces.tc-v0.3 CLM-S10"
    owner:        "unassigned"
    source:       "Session finding 2026-07-29 (operator screenshots of /review lane tabs)"
    tags:         ["review-queue", "ux"]
  - id:          "BL-200"
    title:        "Decide whether visual captions require per-item human approval at all"
    summary:      "Captions are retrieval and enrichment aids, not facts asserted into the trusted graph, yet they are gated by per-item human approval — the strictest control the system has. If their use is bounded to ranking, the review queue and every UX defect filed against it cease to exist."
    description: |
      This is the prior question behind BL-194 and BL-197: building a better queue
      for a queue that should not exist is the expensive way to avoid the decision.

      ports/text_encoder.py already documents the alternative posture for a
      different model output: embeddings are 'safe by use, not by verification',
      because a ranking signal never asserts a fact into the trusted graph and so
      needs no verification gate. Captions may or may not qualify for the same
      treatment, and that turns on where caption text is actually consumed.

      PALS's Law requires that untrusted model output be verified before it is
      trusted. It does not require that verification be a human decision per item —
      bounding the use is also a verification strategy, and is the one that scales.

      The decision is the operator's; this item is the analysis that informs it, not
      a proposal to weaken the gate.
    category:     "docs"
    type:         "research"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "Every other item in this group assumes a human-adjudicated queue is the right control. If it is not, that work is wasted, so the question must be answered before the UX work is scheduled."
    acceptance_criteria:
      - "Every consumer of visual_caption.caption is enumerated, distinguishing ranking/retrieval use from any path that presents the text as an assertion."
      - "The finding states whether captions can be bounded to ranking-only use, with the evidence."
      - "If they can, a decision is drafted for engineering_decisions.yml recording the posture and its limits, mirroring the text_encoder precedent."
      - "If they cannot, the residual assertion paths are named and the human gate is kept for those paths only."
    dependencies: []
    references:
      - "src/doc_ray/ports/text_encoder.py (safe-by-use precedent)"
      - "src/doc_ray/ports/vlm.py, src/doc_ray/ports/verification.py"
      - "CLAUDE.md — PALS's Law (LLM output verification requirement)"
      - "Session finding 2026-07-29: 5,851 pending, 31 committed corpus-wide"
    owner:        "unassigned"
    source:       "Session finding 2026-07-29; arises from the observation that the commit path is unreachable (BL-195) while the queue grows unboundedly"
    tags:         ["visual-caption", "pals-gate", "architecture"]

  - id:          "BL-201"
    title:        "Publish visual captions on write and verify them by retraction"
    summary:      "The pre-publication gate withheld captions from everyone indefinitely — 21 of 6,122 proposals were ever committed — so the human decision moves from an unworkable queue to a retraction in the reader."
    description: |
      BL-200 asked whether visual captions require per-item human approval at
      all. The measured answer was that the pre-publication gate did not work at
      corpus scale: of 6,122 proposals, 21 were ever committed while 5,851 sat
      in a queue presented 25 at a time. A control no operator can exercise is
      not a control.

      A structurally valid caption now commits on write and appears in the
      reader, labelled as a MODEL PROPOSAL carrying its originating model and
      grounding score — never as doc-ray's own assertion. A reader who can see
      the image retracts one that is wrong.

      This keeps PALS's Law by moving the human decision rather than removing
      it, and the new decision carries strictly more than the old one: the
      reviewer sees image, caption and score together, which is more context
      than the review queue offered; a retraction writes `retracted_by`,
      `retracted_at` and `retraction_reason` (migration 150), so who/when/why is
      recorded where approval recorded only who/when; and the row is never
      deleted, because it is the audit trail for a paid-for model call and for
      the human decision about it.
    category:     "nlp"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "critical"
    rationale:    "A verification gate that is never passed is not a safety control; it is an unbounded queue that converts into permanent non-adoption while the corpus shows nothing."
    acceptance_criteria:
      - "A structurally valid caption is readable immediately, labelled with its model and grounding score."
      - "Retraction records who, when, and why, and never deletes the row."
      - "Structurally invalid output is still rejected outright and reaches neither surface (BL-196)."
      - "The trade is reversible per deployment: DOCRAY_CAPTION_APPROVE_FLOOR=1.0 restores a fully pre-publication gate."
    dependencies: ["BL-200", "BL-196"]
    related_decisions: []
    references:
      - "db/migrations/150_caption_retraction.sql"
      - "src/doc_ray/application/visual_caption.py"
      - "src/doc_ray/entrypoints/api/mutation_visual_review.py (retractVisualCaption)"
      - "src/doc_ray/tests/test_caption_approve_on_write.py, test_caption_retraction.py"
      - "CLAUDE.md — PALS's Law (LLM output verification requirement)"
    owner:        "unassigned"
    source:       "Recorded retroactively from commit 8c97413 'feat: publish captions on write, verify them by retraction', which cited BL-201 across migrations 150/151, the CHANGELOG, the application layer and its tests without the backlog entry ever landing. Content sourced from that commit's own CHANGELOG entry and code, not inferred."
    tags:         ["visual-caption", "pals-gate", "review-queue"]

  - id:          "BL-202"
    title:        "Derive NLP Layers 9 (constituency) and 14 (SRL) from the dependency parse"
    summary:      "Both layers had schema since migrations 009/011 and no writer, reader, or API field; derive the deterministic subset instead of leaving them empty."
    description: |
      BL-006 audited the 20-layer target and left constituency and SRL schema-only
      on the grounds that they "require a dedicated tokenizer/parser/model/KB
      rather than a safe deterministic fallback". That holds for GOLD annotation:
      a Penn Treebank bracketing and a PropBank roleset are human-annotated
      targets, and a neural parser (benepar, AllenNLP SRL) only approximates them
      with model output that would owe a verification queue under PALS's Law.
      It does not hold for the whole layer. A dependency tree already encodes
      phrase structure implicitly — the subtree a token governs IS its phrase —
      and PropBank proto-roles map onto UD relations, so a useful subset of both
      is recoverable by construction from the parse the annotator already runs.
      Implemented as domain/syntax_derived.py (pure, no model, no new dependency),
      written by adapters/annotation_syntax_rows.py under the same annotation
      record as the other spaCy layers, and read through
      adapters/persistence_syntax_read.py, GraphQL Document.constituents /
      Document.srlFrames, and the document_syntax MCP tool.
    category:     "nlp"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "medium"
    rationale:    "Two of twenty documented layers were permanently empty; the data was derivable from a parse already being computed and discarded."
    acceptance_criteria:
      - "The repo's own worked example in docs/nlp_annotation_layers.md §9 reproduces exactly, including the PP containing its NP."
      - "The §14 frame reproduces as ARG0/ARG1/ARGM-LOC over the same sentence."
      - "Passive voice maps the surface subject to ARG1 and the by-agent to ARG0."
      - "Re-annotation replaces both layers rather than accumulating them."
      - "Both layers are reachable from GraphQL and MCP with citable char offsets."
    references:
      - "src/doc_ray/domain/syntax_derived.py"
      - "src/doc_ray/adapters/annotation_syntax_rows.py"
      - "src/doc_ray/adapters/persistence_syntax_read.py"
      - "src/doc_ray/tests/test_syntax_derived.py"
      - "docs/nlp_capability_matrix.md"
    owner:        "shared"
    source:       "Operator request 2026-07-29 to close the Layer 9/14 gap under strict TDD. Deliberate limits: the SRL frame is the predicate LEMMA (found), never a roleset (found.01), because the roleset index encodes a sense needing the PropBank frame files and Layer 15 (WSD, still schema-only); a non-projective phrase is recorded by its covering span, a superset rather than a wrong subset. A future neural parser supersedes this by writing under a different tool version."
    tags:         ["nlp", "syntax", "srl", "constituency", "derived"]
