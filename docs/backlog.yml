  - id:          "BL-191"
    title:        "Metadata enrichment from Crossref, Open Library and DataCite with per-field provenance"
    summary:      "Bibliographic metadata is derived from filenames and document content only; no external authority is consulted, and the single title suggestion that exists ('derived from the original filename') is a restatement of the filename rather than a fact about the work."
    description: |
      Identifier extraction (DOI, ISBN-10/13 with checksum validation, arXiv id)
      from embedded metadata, filename, and bounded first-pages text, routed to
      three key-free public providers: Crossref for DOIs, Open Library for
      ISBNs, DataCite for DOIs Crossref does not hold. Every field carries a
      corroboration status (identifier-exact / corroborated / single-source /
      conflicted / absent) and provider-level provenance; conflicts are recorded
      as variants and never auto-resolved. Politeness is enforced in a shared
      HTTP layer — per-provider token buckets at or below published rates, an
      on-disk response cache, backoff honouring Retry-After, and a per-run
      request ceiling. Open Library's 1 rps unidentified / 3 rps identified
      limit is the binding constraint and is why the cache is a requirement.
      OpenAlex and Google Books are second-tier and disabled by default: both
      now require an API key (OpenAlex since 2026-02-13, when its mailto polite
      pool was discontinued).
