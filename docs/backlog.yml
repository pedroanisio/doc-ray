  - id:          "BL-007"
    title:        "Verification layer for ML/LLM annotator output (PALS's Law)"
    summary:      "Any ML/LLM-based annotator must validate its output before persistence; build the shared verification stage."
    description: |
      Today's annotators are deterministic (spaCy + rule-based fallback). Planned
      ML/LLM backends (BL-002 math, BL-006 AMR/WSD/discourse) will emit untrusted,
