    summary:      "PyMuPDF fixes spacing but does not recover math; add Docling/Marker/Nougat behind the extractor field."
    description: |
      The layout extractor repairs spacing/structure but does not recover math
      notation as LaTeX (e.g. `∀M∈M …` stays mangled). Math-heavy documents
      (PALS's Law paper, the relativity papers) need an opt-in ML extraction
      backend (Docling / Marker / Nougat) selected through the existing
      `extractor` provenance field. Because the backend is ML/LLM-based, its
      output MUST pass a verification layer (PALS's Law) before persistence.
    category:     "extraction"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "medium"
    rationale:    "Formal/technical corpora lose their math, degrading every downstream NLP layer for those docs."
    acceptance_criteria:
      - "A math-heavy fixture yields recoverable LaTeX for at least its display equations."
      - "Backend is opt-in, provenance-stamped, and its output is schema-validated before write."
    dependencies: ["BL-007"]
    references:
      - "docs/BACKLOG.md"
      - "src/doc_ray/adapters/extraction.py"
    owner:        "shared"
