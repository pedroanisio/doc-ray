  - id:          "BL-036"
    title:        "Extend the reader's tooltip pattern to POS chips and status pills"
    summary:      "The word-hover-lemma tooltip is used only in the reader; POS chips, status pills, and controls have no equivalent affordance."
    description: |
      The reader's hover-for-lemma tooltip (document.html:44-47) is an excellent,
      discoverable explanation pattern, but it is not reused: POS legend chips,
      status pills, and the upload pipeline checkbox expose no on-hover
      definition. Extend the same tooltip affordance to those elements for
      consistent, discoverable explanations. This item provides the reusable
      affordance; the definitions that populate it are BL-029. The current
      reader tooltip is CSS :hover-only (document.html:44), so the extension
      must also work for keyboard and touch users.
    category:     "webapp"
    type:         "feature"
    status:       "parked"
    complexity:   "S"
    priority:     "low"
    rationale:    "A good explanation pattern exists but is applied in exactly one place; extending it improves discoverability consistently."
    acceptance_criteria:
      - "POS chips and status pills expose their definition through the shared tooltip affordance."
      - "The affordance is keyboard- and touch-accessible, not hover-only."
    references:
