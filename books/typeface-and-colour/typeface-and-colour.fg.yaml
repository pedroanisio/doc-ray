      - 574
      - 40
      style: cap
      type: text
      text: The essential forms of the capitals and of six small letters, drawn as
        single strokes. No serif, no contrast, no style — and yet every letter is
        unmistakably itself.
    - box:
      - 68
      - 812
      - 658
      - 130
      style: body
      type: text
      text: 'Two things are worth noticing. First, the capitals do not share one width:
        O and C claim a full square, E and S about half of one, M and W more than
        all of it. Proportion is part of the skeleton, not part of the styling. Second,
        the small letters are not shrunken capitals but a different system — arches,
        bowls and stems built for the speed of a writing hand.'
