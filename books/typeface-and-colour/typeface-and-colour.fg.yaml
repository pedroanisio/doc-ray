      type: text
      text: One advance width for every glyph. The i is padded, the m squeezed — a
        deliberate injustice, repaid in alignment.
    - box:
      - 68
      - 660
      - 658
      - 130
      style: body
      type: text
      text: 'The monospace surrenders Johnston''s proportion on purpose. Its reward
        is the column: figures that align without effort, code whose indentation is
        structure, tables that need no rules. This is why data belongs in a monospace
        — proportional figures wobble, tabular ones stand in ranks. Identifiers, code,
        and numbers are not prose; the change of face marks the change of register.'
