  - id:          "BL-173"
    title:       "NER corrections could fix one span but not a repeated exact surface/type error"
    summary:     "Curators had to record the same deterministic NER mistake once per span because the durable correction log had no precise, previewable surface-scoped rule."
    description: |
      The Block-A correction log now carries `reclassify_surface` and
      `reject_surface` alongside the four span actions. A surface rule has no
      fabricated offsets: `char_start`/`char_end` are NULL, while exact,
      case-sensitive `surface` + `surface_original_type` form its matcher.
      Span and surface rules replay chronologically, so the later decision wins
      and the rule continues to cover matching mentions from future annotation
      runs.

      `entitySurfaceOccurrences` previews bounded per-Document counts and
      sentence-context samples with a visible cap. `correctEntitySurface`
      accepts explicit `documentIds`, authorizes all of them before the first
      write, appends one rule per Document, and reuses `apply_corrections`.
      MCP's `correct_entity_surface` defaults to dry-run, accepts exactly one
      Document or Collection scope, and refuses a Collection when the bounded
      200-member read cannot prove complete membership.
