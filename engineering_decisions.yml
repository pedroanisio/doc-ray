            description: "pyproject.toml declares tool.mypy.strict."
            check_kind:  "toml-key"
            severity:    "error"
            context:     "workspace"
            path:        "pyproject.toml"
            key:         "tool.mypy.strict"
            expect:
              present:   true
          - check_id:    "D-012.k1.c2"
            description: "mypy passes on src."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "mypy src"
            expect:
              exit:      0

  - id:                 "D-013"
    title:              "Test coverage stays at or above 90%"
    version_introduced: "0.2.0"
    category:           "test-automation"
    decision: |
      Coverage is measured across both tests/ and src/doc_ray/tests/ and gated at
      >= 90% via [tool.coverage.report] fail_under = 90.
    rationale: |
      A hard floor keeps the new API/worker code honestly tested rather than nominally covered.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["pyproject.toml", "tests/**/*.py", "src/doc_ray/tests/**/*.py"]
    claims:
      - claim_id:    "D-013.k1"
        claim_text:  "Coverage is gated at fail_under=90 and the suite meets it."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-013.k1.c1"
            description: "pyproject.toml sets coverage fail_under."
            check_kind:  "toml-key"
            severity:    "error"
            context:     "workspace"
            path:        "pyproject.toml"
            key:         "tool.coverage.report.fail_under"
            expect:
              equals:    "90"
          - check_id:    "D-013.k1.c2"
            description: "pytest with coverage meets the 90% floor."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "pytest --cov=doc_ray --cov-fail-under=90 tests src/doc_ray/tests -q"
            expect:
              exit:      0

  - id:                 "D-014"
    title:              "Gated pre-commit runs the full quality bar"
    version_introduced: "0.2.0"
    category:           "tooling"
    decision: |
      .pre-commit-config.yaml runs ruff (lint+format), mypy, the net-LOC check, the
      coverage gate, and engineering-decisions validation, so violations are caught
      before commit/push.
    rationale: |
      Shifting the gate left keeps main green and makes CI a confirmation, not a surprise.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         [".pre-commit-config.yaml"]
    claims:
      - claim_id:    "D-014.k1"
        claim_text:  "A pre-commit config exists and wires the ruff/mypy/loc/decisions hooks."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-014.k1.c1"
            description: "The pre-commit config file is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        ".pre-commit-config.yaml"
            expect:
              present:   true
          - check_id:    "D-014.k1.c2"
            description: "The pre-commit config references ruff."
            check_kind:  "grep"
            severity:    "error"
            context:     "workspace"
            path:        ".pre-commit-config.yaml"
            pattern:     'ruff'
            expect:
              present:   true

  - id:                 "D-015"
    title:              "Every source file stays under 400 net lines of code"
    version_introduced: "0.2.0"
    category:           "code-quality"
    decision: |
      No Python source file under src/doc_ray/, webapp/, or scripts/ may exceed 400
      net lines of code (physical minus blank and comment-only lines). Vendored
      .repo/ and the proto/ prototype are out of scope.
    rationale: |
      Bounds module responsibility (SOLID/SRP) and keeps files reviewable; forces
      the persistence.py split as GraphQL read methods land.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["src/doc_ray/**/*.py", "webapp/**/*.py", "scripts/**/*.py"]
    claims:
      - claim_id:    "D-015.k1"
        claim_text:  "No in-scope Python file exceeds 400 net lines of code."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-015.k1.c1"
            description: "The net-LOC check script is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "scripts/check_file_size.py"
            expect:
              present:   true
          - check_id:    "D-015.k1.c2"
            description: "check_file_size.count_violations reports zero files over the 400 NLOC cap."
            check_kind:  "python-call"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            fn:          "scripts.check_file_size.count_violations"
            args:        ["src/doc_ray", "webapp", "scripts"]
            returns:     "int:0"

  - id:                 "D-016"
    title:              "engineering_decisions.yml is the ADR system of record"
    version_introduced: "0.2.0"
    category:           "documentation"
    decision: |
      Architectural decisions live in engineering_decisions.yml, validated by the
      vendored SHACL/YAML toolchain, and are cross-referenced from README.md so the
      decision index cannot silently drift from the records.
    rationale: |
      A validated, machine-checkable decision log beats prose ADRs that rot.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["engineering_decisions.yml", "README.md"]
    claims:
      - claim_id:    "D-016.k1"
        claim_text:  "engineering_decisions.yml exists and validates against the vendored schema."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-016.k1.c1"
            description: "The decisions record file is present."
            check_kind:  "file-exists"
            severity:    "error"
            context:     "workspace"
            path:        "engineering_decisions.yml"
            expect:
              present:   true
          - check_id:    "D-016.k1.c2"
            description: "validate_decisions.py accepts the record."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "python engineering/schema/scripts/validate_decisions.py engineering_decisions.yml"
            expect:
              exit:      0
