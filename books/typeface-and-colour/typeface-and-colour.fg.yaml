      style: folioC
      type: text
      text: '6'
    - box:
      - 68
      - 120
      - 658
      - 20
      style: kicker
      type: text
      text: PREFACE
    - box:
      - 68
      - 160
      - 658
      - 60
      style: h1
      type: text
      text: The two crafts
    - box:
      - 68
      - 236
      - 64
      - 2
      type: rect
      fill: rubric
    - box:
      - 68
      - 270
      - 658
      - 120
      style: lead
      type: text
      text: 'A page works on the reader twice. Once through its letters — the shapes
        that carry the words — and once through its colour: the black of the text,
        the white of the ground, and whatever third voice the designer admits. These
        two systems are usually taught apart. This book holds them together.'
    - box:
      - 68
      - 410
      - 658
      - 200
      style: body
      type: text
      text: 'Chapter I is about the letter. Its guide is Edward Johnston, the scribe
        who, in 1906, reduced good lettering to a short table of virtues — readableness
        first, then fitness for use, then beauty and character — and showed that every
        typeface we use is the record of a tool moving over a surface. His doctrine
        was written for the pen, but it survives translation to the screen unharmed:
        the essential form, the finishing stroke, the family likeness of letters that
        “go well together.”'
    - box:
      - 68
      - 620
      - 658
      - 200
      style: body
      type: text
      text: Chapter II is about colour, and its guide is Michel-Eugène Chevreul, the
        chemist who directed the dye-works at the Gobelins tapestry manufactory and
        found that complaints about his blacks were not failures of chemistry at all.
        Colours change one another merely by standing side by side. From that single
        law he derived a complete grammar of harmony and contrast, and it remains
        the most useful instrument a designer can hold when choosing what goes next
        to what.
    - box:
      - 68
      - 830
      - 658
      - 90
      style: body
      type: text
      text: 'Read the plates as slowly as the prose. They are drawn, not decorated:
        each one exists to make a claim visible.'
