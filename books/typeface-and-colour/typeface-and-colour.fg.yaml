      type: rect
      fill: rubric
    - box:
      - 68
      - 272
      - 658
      - 216
      style: body
      type: text
      text: 'The agreement is the headline: ranked by one careful pair of eyes in
        1839, the light papers fall in almost exactly the order that relative luminance
        assigns them today. The formula is measuring what his eye was reporting —
        tone contrast between figure and ground — which is the thesis of §2.9 arriving
        with a hundred and eighty years of corroboration. Where eye and formula part
        ways, on the crimson and the deep orange, the disagreement is itself informative:
        saturated warm grounds flatter type with hue-difference while quietly starving
        it of tone-difference. The formula refuses the flattery.'
    - box:
      - 68
      - 510
      - 658
      - 200
      style: quote
      type: text
      text: “I have every reason to believe that other eyes than mine would require
        some change in the order I have assigned to the preceding assortments.”
    - box:
      - 68
      - 614
      - 658
      - 14
      style: attr
      type: text
      text: CHEVREUL, §517 — THE FIRST REVIEWER'S CAVEAT
    - box:
      - 68
      - 658
      - 658
      - 130
      style: body
      type: text
      text: That sentence deserves framing in every design studio. The author of the
        strongest colour law of his century publishes a ranking and immediately declares
        it one observer's data, awaiting other eyes. The modern formula is those other
        eyes — millions of them, averaged into a luminance curve — and it largely
        voted with him.
    - box:
      - 68
      - 808
      - 658
      - 130
      style: body
      type: text
      text: 'One more anticipation deserves notice. Ranking by duration, he warns
        that the strongest pairing “will be more favourable in a reading of short
        duration, while it will be less so in a prolonged reading, because … it will
        fatigue the eye more” (§503). Maximum contrast is a sprinter: the whole modern
        argument over paper-white screens and reading modes, run once, by lamplight,
        in 1839.'
