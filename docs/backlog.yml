  - id:          "BL-110"
    title:        "Malformed UUID arguments leak raw Postgres exception text to GraphQL clients"
    summary:      "query.py's document(id) resolver (and lexeme/reannotate/deleteDocument/entities and others) pass the raw id straight into a uuid-typed SQL parameter with no format validation, and Strawberry's default error handling forwards str(exc) verbatim — a malformed id surfaces Postgres's raw 'invalid input syntax for type uuid' message unauthenticated; jobs(document_id) already shows the fix pattern (a defensive uuid.UUID(...) + catch), just not applied consistently."
    description: |
      Confirmed live: `query.py`'s `document(id)` calls
      `read.get_document(conn, str(id))` -> `persistence_read.py`'s
      `SELECT * FROM documents WHERE id = %s` against a `uuid`-typed
      column with no prior format check. `schema.py` has no
      `process_errors`/masking override, so Strawberry's default forwards
      the raw exception string. `query.py`'s `jobs(document_id)` resolver,
      by contrast, already wraps the id in `uuid.UUID(str(document_id))`
      inside a `try/except ValueError` — proving the defensive pattern is
      known in this codebase but not applied to `document`, `lexeme`,
      `reannotate`, `deleteDocument`, `entities`, and others.
    category:     "api"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "A concrete information-disclosure gap today (raw DB error text, not merely an inconsistent generic error shape) — distinct from and narrower than BL-049's broader structured-error-envelope proposal, so worth fixing on its own rather than waiting on that larger item."
    acceptance_criteria:
      - "Every resolver taking a document_id/id-shaped argument validates its format before querying, returning a clean not-found/invalid-argument error instead of forwarding the raw database exception."
      - "A test passes a malformed id to document() and asserts the error message contains no raw SQL/Postgres exception text."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/query.py"
      - "src/doc_ray/adapters/persistence_read.py"
      - "src/doc_ray/entrypoints/api/schema.py"
      - "src/doc_ray/entrypoints/api/mutation.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (GraphQL input-validation subsystem audit). Completed 2026-07-11 (query.py's _clean_uuid across every id-shaped read resolver, plus mutation.py's _require_document_write — named in this item's own description but missing from its original references — validating before its ::uuid cast; D-020) on branch fix/bl-097-delete-blob-leak. Backlog-vs-code audit 2026-07-11 found two resolvers the sweep missed — documentMetadataHistory (unvalidated documentId into the uuid-typed history query) and updateDocumentMetadata (enqueued with only _require_write, no id validation) — both closed the same day (_clean_uuid empty-page; _require_document_write like every sibling document-scoped mutation) with regression tests."
    tags:         ["api", "security", "information-disclosure", "bug"]

