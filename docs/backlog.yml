  - id:          "BL-178"
    title:       "term_frequency declined multi-word terms instead of measuring them"
    summary:     "The flood-risk pre-flight exists so an agent can decide a search term without spending a search call. For a multi-word phrase it answered with the rarest component's lexeme count — a `component_upper_bound` that, as the 1.51.0 changelog recorded, leaves positive adjacency unproven — so the agent still had to run the search the pre-flight was built to save."
    description: |
      Root cause. The lexeme index tokenizes on underscores and digits, so it
      structurally cannot hold a phrase. BL-164 stopped the pre-flight from
      *lying* about such terms (no more fabricated `attested: false`), and 1.51.0
      added component evidence, but neither made the tool answer the question.
      `term_frequency(["Model Context Protocol"])` could say what its rarest word
      cost and nothing about whether the words ever appear together.

      Meanwhile every building block already existed: `sentences.text` under a
      `gin_trgm_ops` index (migration 002), and the shared `match_clause` rule
      that `search_sentences` and the webapp both match on. Nothing read them at
      pre-flight time.

      Fix. A term the lexeme index cannot measure exactly is now answered by a
      BOUNDED count of the sentences containing it, through that same
      `match_clause` — so for those terms the pre-flight predicts
      `search_sentences` exactly rather than approximating it, and `attested`
      becomes a real answer. The count stops at `SENTENCE_HIGH_HITS` (2001, >10
      pages), so a corpus-flooding phrase costs the same as a rare one; a stopped
      count reports `capped: true` and is a floor, never a total. Bands are keyed
      to the page a search serves. Single words keep the lexeme-lemma path
      unchanged. Underscore compounds and alphanumerics are scanned too — the
      mechanism is identical, so excluding them would have been arbitrary.

      Two defects were found and fixed while landing it, both of which would have
      shipped silent undercounts rather than errors:

      (1) `docray_refresh_corpus_stats` is SECURITY DEFINER over tables under
      FORCE ROW LEVEL SECURITY (106). Migration 114 established that such helpers
      must run under a BYPASSRLS owner; a later `CREATE OR REPLACE` has to restate
      it, which migration 142 now does.

