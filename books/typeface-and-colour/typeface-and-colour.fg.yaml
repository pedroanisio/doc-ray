      style: body
      type: text
      text: 'Take the skeleton letters and write them with a square-cut pen — the
        reed or quill of the scribes. The pen is broad in one direction and thin in
        the other, so it gives “a thin horizontal stroke and a thick vertical stroke”
        without any decision by the writer. The moment the skeleton passes through
        that tool, the letter acquires modulation: the alternation of thick and thin
        that we now read as ‘serif type’.'
    - box:
      - 68
      - 444
      - 658
      - 128
      style: body
      type: text
      text: 'Johnston''s demonstration continues: slant the pen and the distribution
        of weight rotates with it — oblique strokes lighten, the verticals of M and
        N thin, curves gain a diagonal axis. Nearly every historical difference between
        one class of typeface and the next can be read as a change in this single
        variable: the angle, breadth and freedom of the tool.'
    - box:
      - 68
      - 592
      - 658
      - 100
      style: body
      type: text
      text: 'The plate opposite performs the experiment. The same skeleton O and I
        are passed through three tools: a pencil point, a straight pen, a slanted
        pen. Nothing else changes — and three eras of type fall out.'
