# Focused stack: Postgres (the store) + the GraphQL API (D-001), read-oriented.
#
# A slim alternative to the full docker-compose.yml — it drops MinIO, the
# bucket-init job, and the ingester. Reads need only the database. The GraphQL
# schema still exposes the ingestDocument upload mutation, so the api points at the
# full stack's MinIO on the shared `docray` network; uploads work only while that
# MinIO is running (check /readyz). Run EITHER this file OR docker-compose.yml, not
# both at once: they share the `pgdata` volume and the `docray-*` container names, so
# this reads the same "current database" the full stack writes.
#
# Usage:
#   docker compose -f docker-compose.api.yml up -d --build
#   #   GraphQL:  http://localhost:${API_PORT:-8000}/graphql
#   #   Health:   http://localhost:${API_PORT:-8000}/health
#   docker compose -f docker-compose.api.yml down          # stop (keeps data)
#   docker compose -f docker-compose.api.yml down -v        # stop + wipe data

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    container_name: docray-postgres
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${POSTGRES_PASSWORD:-}" in
          ""|docray|change-me|change-me-docray)
            echo "Refusing to start Postgres with an unset/default POSTGRES_PASSWORD" >&2
            exit 64
            ;;
        esac
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}
      POSTGRES_DB: ${POSTGRES_DB:-docray}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations run automatically on first init (empty data dir only).
      # The `migrate` service below covers existing volumes.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docray} -d ${POSTGRES_DB:-docray}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply any un-applied migrations to an existing volume (D-006).
  # Runs to completion, then the api service proceeds.
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
    entrypoint: ["python", "-m", "doc_ray.entrypoints.migrate"]

  # GraphQL API (D-001). Served at http://localhost:${API_PORT:-8000}/graphql
  api:
    build: .
    container_name: docray-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src        # api package lives under src/ (src layout)
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      # The GraphQL schema includes the ingestDocument upload mutation, which needs an
      # object store. This slim stack ships no MinIO; point at the full stack's MinIO on
      # the shared `docray` network (resolves when docker-compose.yml's minio is running).
      # Hard-coded (not ${S3_ENDPOINT}) on purpose: the in-container endpoint is minio:9000,
      # whereas a host-oriented .env S3_ENDPOINT (e.g. http://localhost:9010) would be wrong
      # here — leaking it caused the "connection refused at localhost:9000" upload failures.
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
      DOCRAY_API_POOL_MIN_SIZE: ${DOCRAY_API_POOL_MIN_SIZE:-1}
      DOCRAY_API_POOL_MAX_SIZE: ${DOCRAY_API_POOL_MAX_SIZE:-10}
      DOCRAY_API_POOL_TIMEOUT: ${DOCRAY_API_POOL_TIMEOUT:-10}
      DOCRAY_API_TOKENS: ${DOCRAY_API_TOKENS:-}
      DOCRAY_API_ALLOW_ANONYMOUS: ${DOCRAY_API_ALLOW_ANONYMOUS:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    # Liveness only (this stack may legitimately run without an object store). Query
    # /readyz for full readiness — it reports object-store reachability and returns 503
    # when the upload path is not usable.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    entrypoint:
      ["uvicorn", "doc_ray.entrypoints.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
