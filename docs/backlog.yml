    tags:         ["security", "audit", "webapp", "export"]

  - id:          "BL-076"
    title:        "Persist per-span page number and bounding box at extraction time (PDF)"
    summary:      "PyMuPDF extraction already computes per-span bounding-box and page geometry to reconstruct Markdown structure (extraction.py's _spans_of_line/_blocks_from_pages), then discards it — the Extracted dataclass returned to the ingest pipeline carries only full_text. No span, sentence, or occurrence knows what page or pixel position it came from, which blocks any feature that overlays annotations on the original document image. PDF-only: it is the one ingested format whose extractor computes this geometry at all — see BL-086/BL-087 for why docx/html/epub/pptx/svg each need a different plan, not this same one generalized."
    description: |
      Read src/doc_ray/adapters/extraction.py:186-236 and
      src/doc_ray/domain/pdf_layout.py:18-19: PyMuPDF's page.get_text("dict")
      already yields bbox (x0/x1 per span, y0/y1 per line via min/max of span
      boxes) plus a page index and page height. That geometry is consumed
      purely to classify heading/list/paragraph structure in to_markdown and
      then thrown away — extract_pdf_pymupdf's return type (the Extracted
      dataclass, extraction.py:53-65) has no field for it.

      This item extends PDF extraction to also return, for each contiguous
      run of extracted text, the page number and bounding rectangle it came
      from — without changing what text is extracted or how it is
      classified into Markdown. It is the foundational item for the
      PDF-first slice of the "overlay on the original document" feature:
      BL-077/BL-078 (schema + backfill), BL-079 (page rendering), BL-081
      (real pagination), and BL-082 (the overlay view) all need this data
      to exist before it can be persisted or displayed.

      Scope check against the actual corpus formats (confirmed live in
      extraction.py's _EXTRACTORS dispatch table): only .pdf, .txt/.md,
      .html/.htm, .epub, and .docx are ingestable today. .pptx and .svg
      have zero extraction code and aren't a dependency anywhere in the
      repo — they cannot be overlaid until format support is built first
      (BL-084, BL-085). Of the formats that ARE ingested, only PDF's
      extractor captures any geometry; extract_docx (extraction.py)
      is paragraph-text-only, and the HTML/EPUB path (extraction.py's
      _HTMLText/_html_to_text, :387-491) discards the DOM entirely, keeping
      only concatenated strings. Positional bbox extraction is therefore
      not a generalizable pattern across formats — it is a PDF-specific
      capability this item adds, deliberately scoped that way rather than
      implied to cover everything the corpus can ingest.
    category:     "extraction"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "This is the one true blocker for the PDF-first overlay slice: every downstream PDF item (BL-077..BL-079, BL-081, BL-082) needs page+bbox data that is already computed once per ingest and discarded today. Sequencing anything else first would mean re-deriving this same geometry or hand-waving the data it depends on."
    acceptance_criteria:
      - "extract_pdf_pymupdf (or a sibling function called alongside it) returns, per contiguous extracted-text run, its source page number and bounding-box rectangle, in addition to full_text."
      - "to_markdown's existing heading/list/paragraph classification is unchanged in output — this item only surfaces already-computed geometry to the caller, it does not alter what text is extracted or how it's structured."
      - "A unit test feeds a synthetic 2-page PDF through extraction and asserts distinct page numbers and non-overlapping bounding boxes for text originating on each page."
      - "No claim is made about docx/html/epub/pptx/svg — those are out of scope for this item by design (see BL-086/BL-087)."
    dependencies: []
    references:
      - "src/doc_ray/adapters/extraction.py"
      - "src/doc_ray/domain/pdf_layout.py"
    owner:        "shared"
    source:       "Feature request 2026-07-05: overlay POS/structural rendering on the original document, then corrected mid-design (the corpus also ingests docx/html and was asked to consider pptx/svg). Traced against extraction.py/pdf_layout.py, db/migrations/007_spans.sql, webapp/app.py, and a repo-wide grep for PDF-to-image and non-PDF rendering (get_pixmap/pdf2image/Pixmap/soffice/unoconv/docx2pdf/python-pptx/cairosvg: zero hits outside a PDF-only test fixture) to establish exactly what exists per format versus what each requires. Completed 2026-07-11 (Extracted.page_runs + domain.pdf_layout.page_runs_from_blocks; D-023) on branch fix/bl-097-delete-blob-leak."
    tags:         ["extraction", "pdf", "overlay", "bbox"]

  - id:          "BL-077"
    title:        "Schema: persist page number and bounding box on spans"
    summary:      "spans (db/migrations/007_spans.sql) stores only char_start/char_end into document_content.full_text — no page number, no coordinates. Once BL-076 makes that geometry available at extraction time, it needs a durable home so it survives past the ingest request that computed it."
    description: |
      db/migrations/007_spans.sql:10-18 defines spans as
      (id, document_id, char_start, char_end) — sentences and
      lexeme_occurrences were refactored to reference spans.id rather than
      keep their own offsets (docs/DATABASE.md:40). This item adds a
      durable home for BL-076's page/bbox output: either new columns
      directly on spans, or a new 1:1 child table (e.g.
      span_positions(span_id, page, x0, y0, x1, y1)) so the many read
      paths that only need char offsets aren't forced to carry overlay-only
      metadata. Evaluate both; a child table is the likely better fit since
      it keeps spans lean and makes "no position data yet" representable
      as "no row" rather than a set of nullable columns.
    category:     "persistence"
    type:         "feature"
    status:       "parked"
    complexity:   "M"
    priority:     "high"
    rationale:    "Without a persisted column or table, BL-076's geometry lives only for the duration of one ingest request — gone the moment the job finishes — so nothing downstream (backfill, page rendering, the overlay view) has anything to read back."
    acceptance_criteria:
      - "A migration adds page + bounding-box storage (new spans columns or a new span_positions table) with a docs/DATABASE.md update describing the shape and the reasoning for whichever option is chosen."
      - "Ingestion (once BL-076 lands) writes this data for every span in newly-ingested documents."
      - "Existing spans are left without position data by this migration rather than backfilled — backfill is BL-078's job, not a schema migration's."
    dependencies: ["BL-076"]
    references:
      - "db/migrations/007_spans.sql"
      - "docs/DATABASE.md"
    owner:        "shared"
    source:       "Feature request 2026-07-05: overlay rendering on the original document; see BL-076. Completed 2026-07-12 with migration 049 adding nullable page/bbox fields on spans plus document_layout_runs for future span geometry derivation; ingest and re-extract now persist Extracted.page_runs and ensure_spans projects matching geometry onto sentence/token/entity/chunk spans. Existing spans remain null until BL-078 backfill."
    tags:         ["persistence", "schema", "overlay", "bbox"]

  - id:          "BL-078"
    title:        "Backfill page/bbox for already-ingested documents via re-extraction"
    summary:      "BL-076/BL-077 only populate page/bbox for documents ingested after they land. Every document already in the corpus has no position data until it is re-extracted from its original blob — a heavier operation than the existing reannotate job, which reruns spaCy over already-extracted text and never touches the original file."
    description: |
      src/doc_ray/application/jobs.py's handle_reannotate re-runs
      annotation over text that is already in document_content — it never
      re-reads the original PDF. Backfilling BL-077's columns for the
      existing corpus needs a distinct job kind (e.g. reextract) that
      re-fetches the original blob via documents.source_uri (the same
      store.get()-then-materialize pattern handle_ingest already uses),
      reruns extraction, and reconciles the result against existing
      sentence/span rows keyed by char offsets. Extraction is expected to
      be deterministic (same bytes in, same offsets out), but that must be
      verified rather than assumed before this writes over live data.
    category:     "ops"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "medium"
    rationale:    "Otherwise the overlay feature only works for documents uploaded after this ships. Every already-ingested document would silently have no overlay available, which is confusing without an explicit per-document signal that position data is (or isn't) present."
    acceptance_criteria:
      - "A reextract job kind re-runs extraction against the stored original blob and populates BL-077's page/bbox data without duplicating or shifting existing sentence/span rows."
      - "A bulk/CLI path can enqueue this against the whole existing corpus, not just one document at a time."
      - "Documents (or their spans) expose whether position data is present, so the reader can show 'no overlay available for this document yet' rather than silently rendering an empty overlay."
    dependencies: ["BL-076", "BL-077"]
    references:
      - "src/doc_ray/application/jobs.py"
    owner:        "shared"
    source:       "Feature request 2026-07-05: overlay rendering on the original document; see BL-076. Completed 2026-07-12 with a `reextract` worker job that fetches the stored original blob, verifies re-extracted text matches the canonical stored text, and backfills document_layout_runs plus span page/bbox geometry without deleting existing annotations; `python -m doc_ray.entrypoints.reextract --enqueue-all` queues corpus-wide PDF backfill jobs, GraphQL exposes reextractDocument/reextractDocuments, and Document.hasPositionData reports geometry availability."
    tags:         ["ops", "backfill", "overlay", "reextract"]

  - id:          "BL-079"
    title:        "Route: render an original PDF page as an image (PDF)"
    summary:      "No code path anywhere renders a PDF page as a raster image — a repo-wide grep for get_pixmap/pdf2image/Pixmap returns zero hits. The overlay feature needs an actual page image to overlay highlight boxes onto, not just extracted text. PDF-only: docx/html/epub have no fixed page to rasterize this way (BL-086), and pptx/svg aren't ingestable at all yet (BL-084/BL-085)."
    description: |
      Propose a route, e.g. GET /doc/<id>/page/<n>.png, that fetches the
      original blob (materializing a temp file the same way
      handle_ingest already does via store.get()), opens it with PyMuPDF
      — already a project dependency via extraction.py — and calls
      page.get_pixmap(dpi=...) to return a PNG. Needs a caching decision
      (rendered pages are static per document version — cache in the
      object store or an in-process/Redis cache rather than re-rendering
      per request) and should explicitly inherit whatever document-level
      read scoping exists at the time it ships (see BL-064: today nothing
      enforces per-document ACLs on webapp reads either, so this route
      would start from the same gap, not a worse one).
    category:     "webapp"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "This is the rendering half of 'overlay on the original document' — without a page image to display, no amount of correct bounding-box data has anywhere to be drawn."
    acceptance_criteria:
      - "A route renders any page of any successfully-ingested PDF document as a PNG at a reasonable default DPI, and returns a clean error for out-of-range page numbers or non-PDF documents."
      - "Rendered pages are cached rather than re-rendered from the original blob on every request."
    dependencies: []
    references:
      - "webapp/app.py"
      - "src/doc_ray/adapters/object_store.py"
    owner:        "shared"
    source:       "Feature request 2026-07-05: overlay rendering on the original document; see BL-076. Completed 2026-07-12 with API GET /documents/{id}/pages/{n}.png rendering and caching original-PDF page PNGs in object storage, a webapp proxy route at /doc/{id}/page/{n}.png, and regression tests covering cache hits, cache misses, non-PDF documents, out-of-range pages, and pending originals."
    tags:         ["webapp", "pdf", "rendering", "overlay"]

  - id:          "BL-080"
    title:        "Route: stream the original uploaded file to the browser"
    summary:      "The original file is retained in the object store (documents.source_uri) but nothing serves it to a browser today — the only download route is the operator-facing full-backup archive (download_backup in webapp/app.py). Users have no way to retrieve what they originally uploaded."
    description: |
      A per-document download route, mirroring the existing
      backup-download proxy pattern: the webapp never touches storage
      directly, it streams from the store the same way the backup route
      streams from the API. Independently useful even without the overlay
      feature ("let me re-download the PDF I uploaded"), and BL-079's
      page-render route wants the same blob-fetch plumbing, so this is
      worth landing as its own small item rather than folding it invisibly
      into BL-079.
    category:     "webapp"
    type:         "feature"
    status:       "done"
    complexity:   "S"
    priority:     "low"
    rationale:    "Confirmed absent in the 2026-07-05 investigation behind this item set: source_uri exists on documents and the blob is genuinely retained, but no route streams it to a browser. Splitting it out from BL-079 keeps each item's acceptance criteria testable in isolation."
    acceptance_criteria:
      - "A route streams a document's original bytes with the correct mime_type and original_filename, mirroring download_backup's streaming proxy pattern in webapp/app.py."
      - "A clean error path exists for documents whose blob is missing or whose ingest never completed."
