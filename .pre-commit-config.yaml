# Gated pre-commit — engineering decision D-014.
# All hooks run local/system tools (from requirements-dev.txt), so no network
# fetch of hook repos is needed. Install once with: pre-commit install
minimum_pre_commit_version: "3.5.0"
default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (strict lint incl. docstrings) — D-011
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format (check) — D-011
        entry: ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy (strict) — D-012
        entry: mypy src
        language: system
        pass_filenames: false
        always_run: true

      - id: net-loc-cap
        name: net-LOC cap 400 — D-015
        entry: python scripts/check_file_size.py src/doc_ray webapp scripts
        language: system
        pass_filenames: false
        always_run: true

      - id: touch-targets
        name: controls meet the platform touch-target minimum — D-036
        entry: python scripts/check_touch_targets.py
        language: system
        pass_filenames: false
        always_run: true

      - id: doc-ray-graphql-skill-drift
        name: Doc-Ray GraphQL skill drift gate
        entry: python3 skills/doc-ray-graphql-maximizer/scripts/check_doc_ray_drift.py
        language: system
        pass_filenames: false
        always_run: true

      - id: public-docs-drift
        name: public documentation metadata, API, MCP, route, and link gate
        entry: python3 scripts/check_public_docs.py
        language: system
        pass_filenames: false
        always_run: true

      - id: markdown-link-drift
        name: repository Markdown link gate
        entry: python3 scripts/check_doc_links.py
        language: system
        pass_filenames: false
        always_run: true

      - id: documentation-quarantine-policy
        name: documentation quarantine ignore-policy gate
        entry: python3 scripts/check_doc_quarantine_policy.py
        language: system
        pass_filenames: false
        always_run: true

      - id: release-audit-tracked-ignored
        name: release audit C-1 — index agrees with ignore policy
        entry: python3 scripts/check_tracked_ignored.py
        language: system
        pass_filenames: false
        always_run: true

      - id: release-audit-private-references
        name: release audit C-2 — no private references in tracked files
        entry: python3 scripts/check_private_references.py
        language: system
        pass_filenames: false
        always_run: true

      - id: release-audit-doc-types
        name: release audit C-3 — every tracked document declares a shippable type
        entry: python3 scripts/check_doc_types.py
        language: system
        pass_filenames: false
        always_run: true

      - id: release-audit-build-context
        name: release audit C-4 — Docker context is an allow-list
        entry: python3 scripts/check_build_context.py
        language: system
        pass_filenames: false
        always_run: true

      - id: release-audit-commit-message
        name: release audit C-6 — commit message describes the change
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

      - id: release-audit-secrets
        name: release audit C-7 — no credentials, keys or oversized files
        entry: python3 scripts/check_secrets.py
        language: system
        pass_filenames: false
        always_run: true

      - id: release-audit-front-door
        name: release audit C-8 — front-door documents agree with the tree
        entry: python3 scripts/check_front_door.py
        language: system
        pass_filenames: false
        always_run: true

      - id: release-state-drift
        name: canonical version and annotated Git tag gate
        entry: python3 scripts/check_release_state.py
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-decisions
        name: engineering_decisions.yml valid — D-016
        entry: python engineering/schema/scripts/validate_decisions.py engineering_decisions.yml
        language: system
        pass_filenames: false
        always_run: true
        files: ^engineering_decisions\.yml$

      - id: version-consistency
        name: SemVer surfaces agree with doc_ray.__version__
        entry: python scripts/check_version_consistency.py
        language: system
        pass_filenames: false
        always_run: true

      - id: database-md-drift
        name: docs/DATABASE.md matches the live schema — BL-047
        entry: python scripts/gen_data_dictionary.py --check --skip-without-db
        language: system
        pass_filenames: false
        always_run: true

      - id: env-registry-drift
        name: .env.example/.env.prod.example match config/env.registry.yaml
        entry: python scripts/gen_env_samples.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: coverage-gate
        name: pytest coverage >= 90% — D-013 (pre-push)
        entry: pytest --cov=doc_ray --cov-fail-under=90 tests src/doc_ray/tests -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
