services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    container_name: docray-postgres
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${POSTGRES_PASSWORD:-}" in
          ""|docray|change-me|change-me-docray)
            echo "Refusing to start Postgres with an unset/default POSTGRES_PASSWORD" >&2
            exit 64
            ;;
        esac
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}
      POSTGRES_DB: ${POSTGRES_DB:-docray}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations run automatically on first init (empty data dir only).
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docray} -d ${POSTGRES_DB:-docray}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: docray-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: create the bucket the ingester writes to.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-documents};
      echo 'bucket ready';
      "

  # On-demand ingester. Build once, then:
  #   docker compose run --rm ingester python -m doc_ray.entrypoints.cli /data/orwell1984.pdf
  ingester:
    profiles: ["ingest"]
    build: .
    container_name: docray-ingester
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src        # ingest package lives under src/ (src layout)
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
    volumes:
      - ./:/app:ro          # source + sample PDFs available under /data via /app
      - ./:/data:ro
    # Inherits the Dockerfile ENTRYPOINT (`python -m doc_ray.entrypoints.cli`).
    # Invoke with:  docker compose run --rm ingester /data/orwell1984.pdf

  # One-shot: apply any un-applied migrations to an existing volume (D-006).
  # Mirrors createbucket's "run to completion, then dependents proceed".
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
    entrypoint: ["python", "-m", "doc_ray.entrypoints.migrate"]

  # GraphQL API (D-001): reads + enqueue/upload mutations. http://localhost:${API_PORT:-8000}/graphql
  # Depends on minio being healthy so the upload path has its object store from the start.
  api:
    build: .
    container_name: docray-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
      DOCRAY_BACKUP_ENABLED: ${DOCRAY_BACKUP_ENABLED:-false}
      DOCRAY_API_POOL_MIN_SIZE: ${DOCRAY_API_POOL_MIN_SIZE:-1}
      DOCRAY_API_POOL_MAX_SIZE: ${DOCRAY_API_POOL_MAX_SIZE:-10}
      DOCRAY_API_POOL_TIMEOUT: ${DOCRAY_API_POOL_TIMEOUT:-10}
      DOCRAY_API_TOKENS: ${DOCRAY_API_TOKENS:-}
      DOCRAY_API_ALLOW_ANONYMOUS: ${DOCRAY_API_ALLOW_ANONYMOUS:-true}
      # GraphQL introspection + the GraphiQL IDE (BL-108). Off by default —
      # in production, anonymous schema enumeration is free reconnaissance.
      # Dev/local turns it on via DOCRAY_API_DEBUG=1 in .env.
      DOCRAY_API_DEBUG: ${DOCRAY_API_DEBUG:-false}
      DOCRAY_API_JWT_SECRET: ${DOCRAY_API_JWT_SECRET:-}
      DOCRAY_API_JWT_ISSUER: ${DOCRAY_API_JWT_ISSUER:-doc-ray}
      DOCRAY_API_JWT_AUDIENCE: ${DOCRAY_API_JWT_AUDIENCE:-}
      DOCRAY_API_JWT_TTL_SECONDS: ${DOCRAY_API_JWT_TTL_SECONDS:-900}
      DOCRAY_API_REFRESH_TOKEN_TTL_SECONDS: ${DOCRAY_API_REFRESH_TOKEN_TTL_SECONDS:-86400}
      DOCRAY_AUTH_LOCAL_ENABLED: ${DOCRAY_AUTH_LOCAL_ENABLED:-false}
      DOCRAY_AUTH_REGISTRATION_ENABLED: ${DOCRAY_AUTH_REGISTRATION_ENABLED:-false}
      DOCRAY_AUTH_EXPOSE_VERIFICATION_TOKEN: ${DOCRAY_AUTH_EXPOSE_VERIFICATION_TOKEN:-false}
      DOCRAY_AUTH_EMAIL_VERIFICATION_TTL_SECONDS: ${DOCRAY_AUTH_EMAIL_VERIFICATION_TTL_SECONDS:-86400}
      # Brute-force lockout — the API login path reads these.
      DOCRAY_AUTH_MAX_FAILED_LOGINS: ${DOCRAY_AUTH_MAX_FAILED_LOGINS:-10}
      DOCRAY_AUTH_LOCKOUT_SECONDS: ${DOCRAY_AUTH_LOCKOUT_SECONDS:-900}
      # Verification-email delivery. /auth/register fail-closes 503 until BOTH
      # DOCRAY_SMTP_HOST (mailer) and DOCRAY_PUBLIC_BASE_URL (link) are set
      # (auth_routes.py delivery_configured); passed through in every environment
      # so managed prod is not silently missing them.
      DOCRAY_SMTP_HOST: ${DOCRAY_SMTP_HOST:-}
      DOCRAY_SMTP_PORT: ${DOCRAY_SMTP_PORT:-587}
      DOCRAY_SMTP_FROM: ${DOCRAY_SMTP_FROM:-}
      DOCRAY_SMTP_USERNAME: ${DOCRAY_SMTP_USERNAME:-}
      DOCRAY_SMTP_PASSWORD: ${DOCRAY_SMTP_PASSWORD:-}
      DOCRAY_SMTP_STARTTLS: ${DOCRAY_SMTP_STARTTLS:-true}
      DOCRAY_SMTP_TIMEOUT_SECONDS: ${DOCRAY_SMTP_TIMEOUT_SECONDS:-10}
      DOCRAY_PUBLIC_BASE_URL: ${DOCRAY_PUBLIC_BASE_URL:-}
      # Stripe billing: Checkout/Portal creation and signed webhook verification
      # happen in the API container, so these must be passed through in base
      # compose as well as managed overlays.
      DOCRAY_STRIPE_SECRET_KEY: ${DOCRAY_STRIPE_SECRET_KEY:-}
      DOCRAY_STRIPE_WEBHOOK_SECRET: ${DOCRAY_STRIPE_WEBHOOK_SECRET:-}
      DOCRAY_STRIPE_PRICE_ID: ${DOCRAY_STRIPE_PRICE_ID:-}
      DOCRAY_STRIPE_SUCCESS_URL: ${DOCRAY_STRIPE_SUCCESS_URL:-}
      DOCRAY_STRIPE_CANCEL_URL: ${DOCRAY_STRIPE_CANCEL_URL:-}
      DOCRAY_STRIPE_PORTAL_RETURN_URL: ${DOCRAY_STRIPE_PORTAL_RETURN_URL:-}
      DOCRAY_STRIPE_API_BASE: ${DOCRAY_STRIPE_API_BASE:-https://api.stripe.com/v1}
      DOCRAY_BILLING_ENFORCEMENT_ENABLED: ${DOCRAY_BILLING_ENFORCEMENT_ENABLED:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    # /readyz is 503 unless BOTH Postgres and the object store answer, so a
    # misconfigured/unreachable MinIO shows up here as an `unhealthy` container
    # (docker ps / orchestrator) instead of a silent failure at the first upload.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    entrypoint:
      ["uvicorn", "doc_ray.entrypoints.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  # Flask corpus browser (webapp/): the reading UI plus the thin write path
  # (upload, seeding, backups) that it forwards to the api service.
  # http://localhost:${WEBAPP_PORT:-5001} — bound to 127.0.0.1 like postgres:
  # expose it deliberately even when login is enabled because backup/restore
  # and operator workflows can mutate the live corpus.
  webapp:
    build: .
    container_name: docray-webapp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Started, not healthy: browsing needs only the database; upload/seeding
      # degrade gracefully while the api is still coming up.
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      # In-network endpoint, hard-coded on purpose (not ${DOCRAY_API_URL}): a
      # host-oriented .env value like http://localhost:8000/graphql would
      # dead-end inside the container — the same trap docker-compose.api.yml
      # documents for S3_ENDPOINT.
      DOCRAY_API_URL: http://api:8000/graphql
      # Shared JWT signing config so local/SAML logins can mint a forwardable API
      # token (webapp.api_jwt.mint_forwardable_api_jwt) the api verifies with the SAME
      # secret — without it, proxied originals/page-images fall back to the static
      # token and 401 (broken previews under local auth).
      DOCRAY_API_JWT_SECRET: ${DOCRAY_API_JWT_SECRET:-}
      DOCRAY_API_JWT_ISSUER: ${DOCRAY_API_JWT_ISSUER:-doc-ray}
      DOCRAY_API_JWT_AUDIENCE: ${DOCRAY_API_JWT_AUDIENCE:-}
      DOCRAY_WEBAPP_SECRET_KEY: ${DOCRAY_WEBAPP_SECRET_KEY:-}
      DOCRAY_WEBAPP_API_TOKEN: ${DOCRAY_WEBAPP_API_TOKEN:-}
      DOCRAY_OPERATOR_HEALTH_TOKEN: ${DOCRAY_OPERATOR_HEALTH_TOKEN:-}
      DOCRAY_BACKUP_ENABLED: ${DOCRAY_BACKUP_ENABLED:-false}
      DOCRAY_MAX_UPLOAD_MB: ${DOCRAY_MAX_UPLOAD_MB:-200}
      DOCRAY_WEBAPP_SEARCH_RATE_LIMIT_REQUESTS: ${DOCRAY_WEBAPP_SEARCH_RATE_LIMIT_REQUESTS:-60}
      DOCRAY_WEBAPP_SEARCH_RATE_LIMIT_WINDOW_SECONDS: ${DOCRAY_WEBAPP_SEARCH_RATE_LIMIT_WINDOW_SECONDS:-60}
      DOCRAY_WEBAPP_UPLOAD_RATE_LIMIT_REQUESTS: ${DOCRAY_WEBAPP_UPLOAD_RATE_LIMIT_REQUESTS:-10}
      DOCRAY_WEBAPP_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${DOCRAY_WEBAPP_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-60}
      DOCRAY_WEBAPP_SESSION_TTL_SECONDS: ${DOCRAY_WEBAPP_SESSION_TTL_SECONDS:-28800}
      DOCRAY_WEBAPP_SESSION_COOKIE_SECURE: ${DOCRAY_WEBAPP_SESSION_COOKIE_SECURE:-true}
      # Persist login sessions in Postgres (web_auth_sessions) so a webapp
      # restart or a second replica doesn't wipe them. "memory" is the in-process
      # fallback (single instance, sessions lost on restart).
      DOCRAY_WEBAPP_SESSION_STORE: ${DOCRAY_WEBAPP_SESSION_STORE:-postgres}
      DOCRAY_AUTH_LOCAL_ENABLED: ${DOCRAY_AUTH_LOCAL_ENABLED:-false}
      DOCRAY_AUTH_REGISTRATION_ENABLED: ${DOCRAY_AUTH_REGISTRATION_ENABLED:-false}
      DOCRAY_AUTH_EXPOSE_VERIFICATION_TOKEN: ${DOCRAY_AUTH_EXPOSE_VERIFICATION_TOKEN:-false}
      DOCRAY_AUTH_EMAIL_VERIFICATION_TTL_SECONDS: ${DOCRAY_AUTH_EMAIL_VERIFICATION_TTL_SECONDS:-86400}
      DOCRAY_WEBAPP_REQUIRE_AUTH: ${DOCRAY_WEBAPP_REQUIRE_AUTH:-false}
      DOCRAY_WEBAPP_OIDC_AUTHORIZATION_URL: ${DOCRAY_WEBAPP_OIDC_AUTHORIZATION_URL:-}
      DOCRAY_WEBAPP_OIDC_TOKEN_URL: ${DOCRAY_WEBAPP_OIDC_TOKEN_URL:-}
      DOCRAY_WEBAPP_OIDC_CLIENT_ID: ${DOCRAY_WEBAPP_OIDC_CLIENT_ID:-}
      DOCRAY_WEBAPP_OIDC_CLIENT_SECRET: ${DOCRAY_WEBAPP_OIDC_CLIENT_SECRET:-}
      DOCRAY_WEBAPP_OIDC_SCOPE: ${DOCRAY_WEBAPP_OIDC_SCOPE:-openid email profile}
      DOCRAY_WEBAPP_OIDC_ISSUER: ${DOCRAY_WEBAPP_OIDC_ISSUER:-}
      DOCRAY_WEBAPP_OIDC_AUDIENCE: ${DOCRAY_WEBAPP_OIDC_AUDIENCE:-}
      DOCRAY_WEBAPP_OIDC_JWKS_JSON: ${DOCRAY_WEBAPP_OIDC_JWKS_JSON:-}
      DOCRAY_WEBAPP_SAML_SSO_URL: ${DOCRAY_WEBAPP_SAML_SSO_URL:-}
      DOCRAY_WEBAPP_SAML_TENANT_ID: ${DOCRAY_WEBAPP_SAML_TENANT_ID:-}
      DOCRAY_WEBAPP_SAML_IDP_ENTITY_ID: ${DOCRAY_WEBAPP_SAML_IDP_ENTITY_ID:-}
      DOCRAY_WEBAPP_SAML_SP_ENTITY_ID: ${DOCRAY_WEBAPP_SAML_SP_ENTITY_ID:-}
      DOCRAY_WEBAPP_SAML_ALLOW_UNSIGNED_ASSERTIONS: ${DOCRAY_WEBAPP_SAML_ALLOW_UNSIGNED_ASSERTIONS:-false}
      DOCRAY_DB_ROLE: ${DOCRAY_DB_ROLE:-docray_client}
      DOCRAY_PRINCIPAL_ID: ${DOCRAY_PRINCIPAL_ID:-}
      # Account lockout — the webapp builds its LocalAuthService with these.
      DOCRAY_AUTH_MAX_FAILED_LOGINS: ${DOCRAY_AUTH_MAX_FAILED_LOGINS:-10}
      DOCRAY_AUTH_LOCKOUT_SECONDS: ${DOCRAY_AUTH_LOCKOUT_SECONDS:-900}
      # Per-client throttles on the auth POST routes (login/register/resend).
      DOCRAY_WEBAPP_LOGIN_RATE_LIMIT_REQUESTS: ${DOCRAY_WEBAPP_LOGIN_RATE_LIMIT_REQUESTS:-10}
      DOCRAY_WEBAPP_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${DOCRAY_WEBAPP_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      DOCRAY_WEBAPP_REGISTER_RATE_LIMIT_REQUESTS: ${DOCRAY_WEBAPP_REGISTER_RATE_LIMIT_REQUESTS:-5}
      DOCRAY_WEBAPP_REGISTER_RATE_LIMIT_WINDOW_SECONDS: ${DOCRAY_WEBAPP_REGISTER_RATE_LIMIT_WINDOW_SECONDS:-3600}
      DOCRAY_WEBAPP_RESEND_RATE_LIMIT_REQUESTS: ${DOCRAY_WEBAPP_RESEND_RATE_LIMIT_REQUESTS:-5}
      DOCRAY_WEBAPP_RESEND_RATE_LIMIT_WINDOW_SECONDS: ${DOCRAY_WEBAPP_RESEND_RATE_LIMIT_WINDOW_SECONDS:-3600}
      # Verification-email delivery: the webapp sends the link on registration,
      # and register_submit fail-closes 503 without a mailer (DOCRAY_SMTP_HOST).
      DOCRAY_SMTP_HOST: ${DOCRAY_SMTP_HOST:-}
      DOCRAY_SMTP_PORT: ${DOCRAY_SMTP_PORT:-587}
      DOCRAY_SMTP_FROM: ${DOCRAY_SMTP_FROM:-}
      DOCRAY_SMTP_USERNAME: ${DOCRAY_SMTP_USERNAME:-}
      DOCRAY_SMTP_PASSWORD: ${DOCRAY_SMTP_PASSWORD:-}
      DOCRAY_SMTP_STARTTLS: ${DOCRAY_SMTP_STARTTLS:-true}
      DOCRAY_SMTP_TIMEOUT_SECONDS: ${DOCRAY_SMTP_TIMEOUT_SECONDS:-10}
      DOCRAY_PUBLIC_BASE_URL: ${DOCRAY_PUBLIC_BASE_URL:-}
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-5001}:5001"
    # The index page queries Postgres, so this doubles as a DB-reachability
    # probe (same spirit as the api's /readyz check above).
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # `flask run`, NOT `python -m webapp.app`: the module path enables Flask
    # debug mode (Werkzeug debugger = remote code execution if ever exposed).
    entrypoint:
      ["flask", "--app", "webapp.app", "run", "--host", "0.0.0.0", "--port", "5001"]

  # One-shot: bootstrap a self-signed certificate into the shared certs volume
  # so the nginx front door below can start on a fresh checkout (createbucket
  # pattern). Skips itself when certs are already present, so real
  # certificates dropped into the volume are never overwritten.
  nginx-certgen:
    build: .
    volumes:
      - nginxcerts:/certs
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -s /certs/fullchain.pem ] && [ -s /certs/privkey.pem ]; then
          echo "certs present, leaving them untouched"
          exit 0
        fi
        openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
          -keyout /certs/privkey.pem -out /certs/fullchain.pem
        echo "generated self-signed certificate (CN=localhost)"

  # TLS front door: serves the webapp over HTTPS on ${NGINX_HTTPS_PORT:-443}
  # and 301-redirects plain HTTP on ${NGINX_HTTP_PORT:-80}. Binds all
  # interfaces — this is the one intentionally exposed entry point (the webapp
  # itself stays on 127.0.0.1). The webapp still has NO login of its own, so
  # do not expose this beyond a trusted network without adding auth here.
  nginx:
    image: nginx:1.27-alpine
    container_name: docray-nginx
    restart: unless-stopped
    depends_on:
      # Started (not healthy) is required, not merely tolerated: nginx resolves
      # the `webapp` upstream at config-load time and exits if the name is
      # unknown to compose DNS.
      webapp:
        condition: service_started
      nginx-certgen:
        condition: service_completed_successfully
    environment:
      # Substituted into client_max_body_size — keep in lockstep with the
      # webapp/API upload cap so nginx isn't the surprise 413 in the middle.
      NGINX_MAX_BODY: ${DOCRAY_MAX_UPLOAD_MB:-200}m
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - nginxcerts:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Background worker (D-005): claims jobs and runs the blocking work (extract/spaCy).
  # Scale out with: docker compose up --scale worker=3
  worker:
    build: .
    restart: unless-stopped
    # SIGTERM triggers a graceful drain of the in-flight job; Docker's default
    # 10s grace killed long annotates mid-run on every deploy, leaving zombie
    # 'running' rows until the reaper caught up. Give the drain a real window.
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
      DOCRAY_BACKUP_ENABLED: ${DOCRAY_BACKUP_ENABLED:-false}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-3600}
      # Large books (8k-15k sentences) legitimately exceed the 1h default while
      # annotating: a 15.5k-sentence book was terminally failed at exactly 3600s
      # (2026-07-12) despite making steady progress. Give the spaCy kinds a 4h
      # wall-clock budget; every other kind keeps the tighter default above.
      WORKER_JOB_TIMEOUT_ANNOTATE_SECONDS: ${WORKER_JOB_TIMEOUT_ANNOTATE_SECONDS:-14400}
      WORKER_JOB_TIMEOUT_REANNOTATE_SECONDS: ${WORKER_JOB_TIMEOUT_REANNOTATE_SECONDS:-14400}
      # Prism Tier-1 renders every page of visual-dominant PDFs (CPU) — give it
      # the same 4h budget as the spaCy kinds so large scanned books don't time out.
      WORKER_JOB_TIMEOUT_VISUAL_EXTRACT_SECONDS: ${WORKER_JOB_TIMEOUT_VISUAL_EXTRACT_SECONDS:-14400}
      # Learned sentence embedding loads a large model and processes whole books.
      WORKER_JOB_TIMEOUT_SEMANTIC_EMBED_SECONDS: ${WORKER_JOB_TIMEOUT_SEMANTIC_EMBED_SECONDS:-14400}
      # Tier-2 vision embedding loads OpenCLIP and may process hundreds of images.
      WORKER_JOB_TIMEOUT_VISUAL_EMBED_SECONDS: ${WORKER_JOB_TIMEOUT_VISUAL_EMBED_SECONDS:-14400}
      DOCRAY_RESOLVER_TIMEOUT_SECONDS: ${DOCRAY_RESOLVER_TIMEOUT_SECONDS:-60}
    entrypoint: ["python", "-m", "doc_ray.entrypoints.worker"]

  # Short-job lane: a reserved worker that never claims the hours-long spaCy
  # kinds, so user-facing jobs (ingest, metadata edits, backups, deletes) are
  # never starved behind them. 2026-07-12 incident: with every worker chewing
  # a book-sized reannotate, a seconds-long ingest sat queued for 25+ minutes.
  worker-fast:
    build: .
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
      DOCRAY_BACKUP_ENABLED: ${DOCRAY_BACKUP_ENABLED:-false}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-3600}
      # Heavy, model-loading jobs stay off the fast pool so light user-facing jobs
      # (ingest, metadata edits, backups) never queue behind them. semantic_embed
      # and visual_embed load large encoders and process whole documents — they
      # belong with annotate on the `worker` pool (which is also the one the GPU
      # overlay accelerates), not here.
      WORKER_EXCLUDE_KINDS: ${WORKER_FAST_EXCLUDE_KINDS:-annotate,reannotate,visual_extract,semantic_embed,visual_embed}
      DOCRAY_RESOLVER_TIMEOUT_SECONDS: ${DOCRAY_RESOLVER_TIMEOUT_SECONDS:-60}
    entrypoint: ["python", "-m", "doc_ray.entrypoints.worker"]

  # Scheduled backup trigger + retention pruning. The worker performs the
  # actual archive creation; this service only enqueues backup jobs.
  backup-scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
      DOCRAY_BACKUP_ENABLED: ${DOCRAY_BACKUP_ENABLED:-false}
      DOCRAY_BACKUP_SCHEDULE_SECONDS: ${DOCRAY_BACKUP_SCHEDULE_SECONDS:-86400}
      DOCRAY_BACKUP_RETENTION_COUNT: ${DOCRAY_BACKUP_RETENTION_COUNT:-7}
      DOCRAY_BACKUP_RETENTION_DAYS: ${DOCRAY_BACKUP_RETENTION_DAYS:-30}
    entrypoint: ["python", "-m", "doc_ray.entrypoints.backup_scheduler"]

  # Optional ops monitor: exits non-zero when db_health finds a warning/error.
  # Enable with: docker compose --profile ops up -d db-health-monitor
  db-health-monitor:
    profiles: ["ops"]
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-docray}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default secret}@postgres:5432/${POSTGRES_DB:-docray}
    entrypoint:
      [
        "python",
        "-m",
        "doc_ray.entrypoints.db_health",
        "--watch",
        "${DOCRAY_DB_HEALTH_INTERVAL_SECONDS:-300}",
      ]

volumes:
  pgdata:
  miniodata:
  nginxcerts:
