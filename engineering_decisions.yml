  # ===================== QUALITY GATES (D-011..D-016) =====================

  - id:                 "D-011"
    title:              "Ruff strict lint incl. docstrings, pinned in pyproject"
    version_introduced: "0.2.0"
    category:           "code-quality"
    decision: |
      Ruff is configured in pyproject.toml with a strict rule select that includes
      the pydocstyle (D) rules, so every public module/function is documented.
      `ruff check` gates pre-commit and CI.
    rationale: |
      One pinned, greppable lint config removes style churn from review and
      enforces full docstrings mechanically.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["pyproject.toml", "src/doc_ray/**/*.py"]
    claims:
      - claim_id:    "D-011.k1"
        claim_text:  "pyproject.toml configures a Ruff lint select that includes docstring (D) rules."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
          - check_id:    "D-011.k1.c1"
            description: "pyproject.toml declares tool.ruff.lint.select."
            check_kind:  "toml-key"
            severity:    "error"
            context:     "workspace"
            path:        "pyproject.toml"
            key:         "tool.ruff.lint.select"
            expect:
              present:   true
          - check_id:    "D-011.k1.c2"
            description: "ruff check passes on the application sources."
            check_kind:  "shell"
            severity:    "error"
            context:     "ci"
            side_effects: "reads"
            command:     "ruff check src scripts webapp"
            expect:
              exit:      0

  - id:                 "D-012"
    title:              "mypy runs in strict mode"
    version_introduced: "0.2.0"
    category:           "typing"
    decision: |
      pyproject.toml sets [tool.mypy] strict = true (with narrow per-module
      overrides only for untyped third-party libs). `mypy src` gates pre-commit/CI.
    rationale: |
      Strict typing catches contract drift across the ports/adapters seams before runtime.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["pyproject.toml", "src/doc_ray/**/*.py"]
    claims:
      - claim_id:    "D-012.k1"
        claim_text:  "pyproject.toml enables mypy strict mode and mypy passes on src."
        auditable:   true
        status:      "populated"
        declared_checks_count: 2
        checks:
