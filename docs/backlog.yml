      implemented as a provider-neutral domain/application loop. A schema-v1
      JSON manifest fixes the stage order at baseline, plan, red, prove-red,
      implementation, green, regression, regression-green, surface alignment,
      validation, and delivery. Agent actions modify local files; command exits,
      never model assertions, prove the gates. A mismatched repairable gate feeds
      bounded evidence back into the loop and exhausts honestly.

      FileRunStore provides atomic revisioned JSON checkpoints, source-event
