    owner:        "shared"
    source:       "CLAUDE.md architectural requirement (PALS's Law); enabling dependency for BL-002/BL-006/BL-019. Completed with a shared ModelOutputVerifier port, application-level verify_model_output gate, and CandidateResolutionVerifier that rejects hallucinated resolver candidates before mapping/persistence."
    tags:         ["pals-law", "verification", "architecture"]

