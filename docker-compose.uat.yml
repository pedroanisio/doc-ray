# doc-ray — UAT overlay for docker-compose.yml.
#
# The auth/SMTP/public-base-URL/lockout/rate-limit pass-throughs this overlay
# used to add now live in the BASE compose (api + webapp), so every environment
# — local, UAT, and managed prod — delivers them from its env file. This overlay
# is therefore down to its one genuinely UAT-specific concern: running a real
# worker pool by default (the base leaves worker scaling manual, driven by
# `make workers-up` / `--scale`).
#
# Run:
#   docker compose --env-file .env.uat \
#     -f docker-compose.yml -f docker-compose.uat.yml up -d
#
# Migrations are applied by the base `migrate` one-shot; run it the same way if
# a fresh volume needs bootstrapping.

services:
  # UAT runs a real worker pool by default (base leaves scaling manual).
  worker:
    deploy:
      replicas: ${DOCRAY_WORKERS:-3}
