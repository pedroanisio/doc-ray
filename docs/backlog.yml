  - id:          "BL-061"
    title:        "AI-suggested document metadata refinements (titles, tags, duplicates, grouping)"
    summary:      "The existing AI-suggestion pipeline (deterministic Wikidata pageprops matching + a Claude resolver for ambiguous cases) only ever proposes canonical entities/terms — it never suggests a document title, tags, or flags duplicates."
    description: |
      seed_suggest.py is explicitly deterministic (pins candidates to an
      exact Wikidata identity via pageprops, no fuzzy top-hit matching), and
      the Claude-based adapter (src/doc_ray/adapters/resolver_claude.py,
      model claude-opus-4-8) is invoked only by the background canonicalize
      job (src/doc_ray/application/jobs.py) to resolve ambiguous entity
      mentions against the canonical registry — never document metadata.
      Extending this proven, verification-gated pattern to document-level
      suggestions (better titles, candidate tags, near-duplicate detection,
      semantic-similarity grouping) needs BL-058's editable-metadata mutation
      as a write target, and every suggestion must pass the same PALS's-Law
      verification obligation already applied to BL-002/BL-006 before being
      shown for human review — no unverified LLM output reaches a document's
      real metadata.
    category:     "nlp"
    type:         "feature"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "The product already has a mature, non-hallucinatory suggestion architecture for entities; reusing it for document metadata is lower-risk than a bespoke feature, but only once there is an editable target (BL-058) and an explicit verification gate."
    acceptance_criteria:
      - "Document title/tag suggestions are generated and surfaced for human review, never auto-applied."
      - "Near-duplicate or semantically-similar documents are detected and surfaced."
      - "Every suggestion passes the shared ML/LLM output verification port before being shown (PALS's Law)."
      - "Low-confidence suggestions are visibly distinguished from high-confidence ones."
    dependencies:
      - "BL-058"
    references:
      - "src/doc_ray/application/seed_suggest.py"
      - "src/doc_ray/adapters/resolver_claude.py"
      - "src/doc_ray/application/term_scan.py"
    owner:        "shared"
    source:       "Session finding 2026-07-05: document-surface UX/data-management capability audit (parallel webapp-UI and GraphQL/persistence reviews against 9 claimed product gaps). Implemented 2026-07-12 with a verified document_metadata_suggestion review table, suggest_document_metadata worker job, GraphQL query/mutation surface, document-page review UI, confidence bands, and regression tests proving suggestions pass the shared verification port before persistence and are never auto-applied."
    tags:         ["nlp", "ai-suggestions", "metadata", "verification"]

