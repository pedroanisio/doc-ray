  - id:          "BL-106"
    title:        "Upload extension is client-controlled and unchecked before the blob is stored"
    summary:      "mutation.py derives the stored object's extension straight from the attacker-supplied filename and persists the blob to the object store before extraction.py's format-allowlist check ever runs; the webapp's accept= attribute is a client-side-only hint with no server-side enforcement ahead of storage."
    description: |
      Confirmed live: the extension used to build the storage key in
      `mutation.py`'s ingest path comes directly from the uploaded
      filename, with the actual format/extension allowlist only enforced
      later in `extraction.py` when the worker picks up the job — meaning
      an arbitrary file with a spoofed or unexpected extension is written
      to the object store first, and only rejected (as an unrecognized
      format, leaving an untyped orphaned blob per BL-097) afterward.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "Storing first and validating later means a rejected upload still leaves attacker-controlled bytes with an attacker-chosen name/extension sitting in the object store, and widens the surface BL-088's zip/XML hardening is trying to close (an extension mismatch could route a crafted file through the wrong parser)."
    acceptance_criteria:
      - "The upload extension/format is validated against the same allowlist extraction.py uses before the blob is uploaded to the object store, not after."
      - "A test uploads a file with an unrecognized/spoofed extension and asserts no blob is persisted."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/mutation.py"
      - "src/doc_ray/adapters/extraction.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (webapp security subsystem audit). Completed 2026-07-11 (new extraction.is_supported_extension() checked in ingestDocument before ObjectStore is even constructed; D-021) on branch fix/bl-097-delete-blob-leak."
    tags:         ["security", "upload", "bug"]

  - id:          "BL-107"
    title:        "Operator health token travels via URL query string, not a header"
    summary:      "operator_health.py accepts the operator token as request.args.get('token'), and operator_health.html itself embeds the live token in an <a href>, guaranteeing it lands in access logs, proxy logs, and browser history rather than only a request header."
    description: |
      Confirmed live: `webapp/operator_health.py`'s token check reads
      `request.args.get('token')`; `webapp/templates/operator_health.html`
      builds at least one link with the token embedded directly in the
      query string. Query-string secrets are logged by default by most
      reverse proxies, CDNs, and web server access logs, and persist in
      browser history — a materially weaker channel than an Authorization
      header for a credential that gates BL-038's operator health page.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "XS"
    priority:     "medium"
    rationale:    "A token designed to gate an admin surface shouldn't be handed a worse transport than the header-token scheme (HeaderTokenAuthenticator) the rest of the API already uses for the same purpose."
    acceptance_criteria:
      - "The operator health token is accepted via a request header (or a short-lived signed cookie set once from a query-string bootstrap link), not read from the query string on every subsequent request."
      - "operator_health.html's internal links no longer embed the raw token in href attributes."
    dependencies: []
    references:
      - "webapp/operator_health.py"
      - "webapp/templates/operator_health.html"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (webapp security subsystem audit). Completed 2026-07-11 (X-Operator-Token header accepted standalone; a query-string bootstrap now sets a signed session flag so later requests/links never need the token again; D-021) on branch fix/bl-097-delete-blob-leak."
    tags:         ["security", "webapp", "bug"]

  - id:          "BL-108"
    title:        "GraphQL introspection and GraphiQL are enabled with no production gating"
    summary:      "build_schema only registers QueryDepthLimiter/MaxTokensLimiter — no NoSchemaIntrospection extension and no env-based gating exists anywhere; GraphQLRouter is constructed with Strawberry's introspection/GraphiQL defaults left untouched, and anonymous read access is the default (DOCRAY_API_ALLOW_ANONYMOUS defaults true) — so any anonymous caller can load the interactive explorer or send a raw IntrospectionQuery and enumerate the entire schema, including admin-only mutation argument shapes, for free reconnaissance."
    description: |
      Confirmed live: `entrypoints/api/schema.py`'s `build_schema` only adds
      `QueryDepthLimiter`/`MaxTokensLimiter` to the extensions list — no
      `NoSchemaIntrospection` extension exists in the whole tree (grepped).
      `entrypoints/api/app.py`'s `GraphQLRouter(...)` construction never
      sets `graphql_ide`, leaving Strawberry's default (`'graphiql'`)
      active. `security.py`'s `ANONYMOUS` principal and
      `Config.api_allow_anonymous` (config.py, defaults `True`) mean an
      unauthenticated request is treated as a valid read-scoped principal
      by default, not rejected — so this reconnaissance requires no
      credential at all in a default deployment.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "XS"
    priority:     "high"
    rationale:    "Full schema enumeration (including exactly which mutations exist, their arguments, and by implication what BL-064's admin-gated operations look like) should not be free to an anonymous caller — this is the same reconnaissance-hardening gap most production GraphQL deployment guides treat as a baseline requirement."
    acceptance_criteria:
      - "Introspection and the GraphiQL IDE are disabled by default outside of an explicit DOCRAY_API_DEBUG-style opt-in, mirroring the existing API_MAX_DEPTH/API_MAX_TOKENS env-override pattern."
      - "A test confirms an IntrospectionQuery is rejected (or GraphiQL 404s) when the opt-in is not set."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/schema.py"
      - "src/doc_ray/entrypoints/api/app.py"
      - "src/doc_ray/entrypoints/api/security.py"
      - "src/doc_ray/config.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (GraphQL input-validation subsystem audit), re-verified directly against schema.py/security.py/config.py given severity. Completed 2026-07-11 (DOCRAY_API_DEBUG opt-in: build_schema appends DisableIntrospection unless set; app.py threads settings.api_debug into both build_schema and GraphQLRouter's graphql_ide) on branch fix/bl-064-mutation-document-acl."
    tags:         ["security", "graphql", "introspection", "bug"]

  - id:          "BL-109"
    title:        "GraphQL write-mutation arguments lack the bounds every read resolver enforces"
    summary:      "context.py's MAX_PAGE_SIZE/page_size() clamp is applied by every query resolver, but suggestSeeds's limit argument is passed straight into the job payload with no call to page_size(), and decideSeeds's approveIds/rejectIds arrays have no length cap at all — both distinct from BL-009 (query-shape limits) and BL-063 (documents-list pagination, unrelated resolvers)."
    description: |
      Confirmed live: `mutation.py`'s `suggest_seeds(self, info, document_id,
      limit: int = 40)` forwards `limit` directly into
      `{"limit": limit}` with no bound check, which flows unbounded into
      `application/seed_suggest.py`'s raw SQL `LIMIT %s`. `decideSeeds`
      (mutation.py) accepts unbounded `list[strawberry.ID] | None` for both
      `approveIds` and `rejectIds`, forwarded to
      `seed_suggestion_store.py`'s `WHERE id = ANY(%s)` with no length
      check. A client can request an arbitrarily large `limit` or submit an
      arbitrarily large ID array in one request.
    category:     "security"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "BL-009 explicitly bounds query *shape* (depth/token count), not argument *values* on mutations — this is the gap that leaves. A resource-exhaustion vector on the worker (unbounded candidate mining per document) is a distinct concern from the generic error-envelope work BL-049 tracks."
    acceptance_criteria:
      - "suggestSeeds's limit argument is clamped through the same page_size()-style bound the read resolvers use."
      - "decideSeeds's approveIds/rejectIds arrays are capped at a documented maximum length, rejected cleanly if exceeded."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/mutation.py"
      - "src/doc_ray/entrypoints/api/context.py"
      - "src/doc_ray/application/seed_suggest.py"
      - "src/doc_ray/adapters/seed_suggestion_store.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (GraphQL input-validation subsystem audit). Completed 2026-07-11 (suggestSeeds.limit clamped via ctx.page_size(); decideSeeds's approveIds/rejectIds rejected past new context.MAX_BATCH_IDS=500; D-020) on branch fix/bl-097-delete-blob-leak."
    tags:         ["security", "graphql", "dos", "bug"]

  - id:          "BL-110"
    title:        "Malformed UUID arguments leak raw Postgres exception text to GraphQL clients"
    summary:      "query.py's document(id) resolver (and lexeme/reannotate/deleteDocument/entities and others) pass the raw id straight into a uuid-typed SQL parameter with no format validation, and Strawberry's default error handling forwards str(exc) verbatim — a malformed id surfaces Postgres's raw 'invalid input syntax for type uuid' message unauthenticated; jobs(document_id) already shows the fix pattern (a defensive uuid.UUID(...) + catch), just not applied consistently."
    description: |
      Confirmed live: `query.py`'s `document(id)` calls
      `read.get_document(conn, str(id))` -> `persistence_read.py`'s
      `SELECT * FROM documents WHERE id = %s` against a `uuid`-typed
      column with no prior format check. `schema.py` has no
      `process_errors`/masking override, so Strawberry's default forwards
      the raw exception string. `query.py`'s `jobs(document_id)` resolver,
      by contrast, already wraps the id in `uuid.UUID(str(document_id))`
      inside a `try/except ValueError` — proving the defensive pattern is
      known in this codebase but not applied to `document`, `lexeme`,
      `reannotate`, `deleteDocument`, `entities`, and others.
    category:     "api"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "A concrete information-disclosure gap today (raw DB error text, not merely an inconsistent generic error shape) — distinct from and narrower than BL-049's broader structured-error-envelope proposal, so worth fixing on its own rather than waiting on that larger item."
    acceptance_criteria:
      - "Every resolver taking a document_id/id-shaped argument validates its format before querying, returning a clean not-found/invalid-argument error instead of forwarding the raw database exception."
      - "A test passes a malformed id to document() and asserts the error message contains no raw SQL/Postgres exception text."
    dependencies: []
    references:
      - "src/doc_ray/entrypoints/api/query.py"
      - "src/doc_ray/adapters/persistence_read.py"
      - "src/doc_ray/entrypoints/api/schema.py"
      - "src/doc_ray/entrypoints/api/mutation.py"
    owner:        "shared"
    source:       "Full-codebase gap-analysis 2026-07-10 (GraphQL input-validation subsystem audit). Completed 2026-07-11 (query.py's _clean_uuid across every id-shaped read resolver, plus mutation.py's _require_document_write — named in this item's own description but missing from its original references — validating before its ::uuid cast; D-020) on branch fix/bl-097-delete-blob-leak. Backlog-vs-code audit 2026-07-11 found two resolvers the sweep missed — documentMetadataHistory (unvalidated documentId into the uuid-typed history query) and updateDocumentMetadata (enqueued with only _require_write, no id validation) — both closed the same day (_clean_uuid empty-page; _require_document_write like every sibling document-scoped mutation) with regression tests."
    tags:         ["api", "security", "information-disclosure", "bug"]

