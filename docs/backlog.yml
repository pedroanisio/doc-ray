  - id:          "BL-035"
    title:        "De-emphasize raw ULIDs in user-facing tables"
    summary:      "The Lexicon 'Identity' column and job/backups views print raw ULIDs that carry no meaning for users."
    description: |
      lexemes.html:32 prints a raw ULID in the 'Identity' column, and job/backups
      surfaces show ULIDs prominently. These opaque identifiers are noise to a
