  - id:          "BL-194"
    title:        "The caption review queue cannot be worked: 5,851 proposals, 25 per page, no bulk selection"
    summary:      "visualReview paginates 25 items at a time with a checkbox per item and no select-all, no range select and no keyboard path, so clearing the 5,851 pending caption proposals means 234 sequential pages of individual clicks. The queue is not reviewable by construction, and it grows with every captioned document."
