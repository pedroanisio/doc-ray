  - id:          "BL-059"
    title:        "Document lifecycle states beyond ingestion status (archive, soft-delete, restore)"
    summary:      "documents.status only ever takes pending/extracted/failed (an ingestion-pipeline state); delete_document is a hard cascade with no per-document undo."
    description: |
      db/migrations/001_init.sql defines documents.status with values
      pending|extracted|failed, set only by the ingestion pipeline
      (src/doc_ray/... pipeline.py). handle_delete (src/doc_ray/application/
      jobs.py) performs a hard cascading DELETE; KIND_RESTORE only restores a
      whole-corpus backup archive (src/doc_ray/application/backup.py), not a
      single document. There is no draft/reviewed/archived state, and no
      per-document soft-delete-then-restore path — an accidental delete
      today is unrecoverable short of a full corpus restore. This needs new
      lifecycle states layered on top of (not replacing) the existing
      ingestion status, a soft-delete flag or archived_at timestamp, and a
      restore path scoped to one document. State transitions should log to
      the same change-history mechanism introduced by BL-058.
    category:     "persistence"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "high"
    rationale:    "Hard-delete-only with no per-document restore is a real operational risk: the only recovery path today is a full-corpus backup restore, which is disproportionate for a single accidental delete."
    acceptance_criteria:
      - "documents supports at least one lifecycle state beyond ingestion status (e.g. archived) distinct from pending/extracted/failed."
      - "A deleted document can be restored individually, without restoring the whole corpus from backup."
      - "Every lifecycle-state transition is recorded in the BL-058 change-history table."
    dependencies:
      - "BL-058"
    references:
      - "db/migrations/001_init.sql"
      - "src/doc_ray/application/jobs.py"
      - "src/doc_ray/application/backup.py"
    owner:        "shared"
    related_decisions:
      - "D-007"
      - "D-010"
    source:       "Session finding 2026-07-05: document-surface UX/data-management capability audit (parallel webapp-UI and GraphQL/persistence reviews against 9 claimed product gaps). Implemented 2026-07-12 with migrations 051/053 adding document lifecycle columns and lifecycle_state history support, migration 052 bumping schema/package version to 1.14.0, soft-delete semantics for delete jobs, archive/restore job handlers, and GraphQL lifecycle fields plus archiveDocument/restoreDocument mutations."
    tags:         ["persistence", "api", "lifecycle", "soft-delete", "restore"]

