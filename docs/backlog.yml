  - id:          "BL-044"
    title:        "No proactive autovacuum/index tuning despite two prior cascade-delete incidents"
    summary:      "027/028 fixed two dated, real production incidents (24-26+ min of 100% CPU from un-indexed FK cascade deletes on multi-million-row tables) reactively; nothing tunes autovacuum proactively for the same tables."
