    type:         "tech-debt"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "The spaCy writer stores token-level lexeme links and also writes lexeme_occurrences; without an invariant, lexical counts can drift."
    acceptance_criteria:
      - "Token lexeme counts and lexeme_occurrences counts are parity-tested."
      - "GraphQL/browser docs state whether occurrences are projections."
      - "Any migration preserves browser lexeme/KWIC behavior."
