  # ============ NLP PLATFORM COMPLETENESS (from docs/doc_ray_improvement_proposal.md, 2026-07-04) ============
  # The GraphQL/browser surface exposes only documents, sentences, lexemes,
  # entity mentions/frequencies, jobs, and seed suggestions, while the schema
  # and pipeline can persist tokens, morphology, chunks, dependencies, entity
  # mentions, shallow coreference, canonical links, lexemes, and embeddings.
  # BL-016..BL-025 close that gap; their `dependencies` fields encode the
  # phased order the proposal recommended (matrix/drift-guard first,
  # provenance/validation second, layer-aware GraphQL third, canonicalization
  # and operator surfaces fourth, evaluation/drift last).

  - id:          "BL-016"
    title:        "NLP capability matrix and drift guard"
    summary:      "Map each NLP layer to schema, writer, provenance, read adapter, GraphQL field, browser view, health signal, and tests."
    description: |
      Documentation and schema breadth can imply production-ready support that
      is not exposed or populated everywhere (DATABASE_SPEC.md describes a
      normalized NLP annotation platform; query.py/types.py expose only the
      document/sentence/lexeme/entity/job/seed-suggestion subset). Create
      docs/nlp_capability_matrix.md and a field/path existence check. The
      matrix must distinguish schema-only support from writer-backed,
      API-exposed, UI-exposed, health-checked, and tested support, plus a
      lightweight CI guard checking declared API-exposed/writer-backed rows
      against live paths. Implemented as `docs/nlp_capability_matrix.md` plus
      `src/doc_ray/tests/test_nlp_capability_matrix.py`.
    category:     "docs"
    type:         "infra"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "Documentation and schema breadth can imply production-ready support that is not exposed or populated everywhere."
    acceptance_criteria:
      - "Every documented NLP layer has a row with status and evidence."
      - "Rows marked API-exposed resolve to live GraphQL fields."
      - "Rows marked writer-backed cite a production code path and a test."
    related_decisions: ["D-001", "D-002"]
    references:
      - "docs/DATABASE_SPEC.md"
      - "docs/nlp_composition_mastery.md"
      - "docs/nlp_capability_matrix.md"
      - "src/doc_ray/entrypoints/api/query.py"
      - "src/doc_ray/adapters/annotation_spacy.py"
      - "src/doc_ray/tests/test_nlp_capability_matrix.py"
    owner:        "shared"
    source:       "docs/doc_ray_improvement_proposal.md BL-016 — implemented 2026-07-04 with matrix + static drift guard."
    tags:         ["docs", "drift", "graphql", "nlp"]

  - id:          "BL-017"
    title:        "Layer-aware GraphQL read model"
    summary:      "Expose annotation runs, tokens, morphology, syntax, coreference, canonical links, and later embeddings through bounded GraphQL fields."
    description: |
      types.py lacks token, token-feature, dependency, chunk, coreference,
      entity-link, canonical-form, and embedding GraphQL types even though the
      schema/writer paths persist several of those layers, forcing direct SQL
      or undocumented assumptions. Extend the Strawberry schema through
      read-adapter functions: annotationRuns, tokens, syntax, corefChains,
      entityLinks, canonical, canonicalForms — embedding/similarity fields
      postponed until baseline layer reads are stable.

      2026-07-05 addendum (Postgres/RDBMS domain gap-analysis): confirmed the
      pgvector side of this concretely — idx_embedding_hnsw and
      idx_canonical_embedding_hnsw (012_embeddings.sql, 021_canonical.sql) are
      both provisioned with default HNSW build parameters (m/ef_construction
      unset) and no `<=>`/`<->`/`<#>` similarity query was found anywhere
      reachable from persistence_read.py/query.py/loaders.py. When the
      embedding/similarity fields here are picked up, revisit those HNSW
      parameters against the real corpus size rather than accepting pgvector
      defaults unexamined.
    category:     "api"
    type:         "feature"
    status:       "done"
    complexity:   "L"
    priority:     "high"
    rationale:    "The GraphQL API currently exposes a narrow document/sentence/lexeme/entity slice of a richer relational NLP graph."
    acceptance_criteria:
      - "New list fields are bounded and covered by GraphQL tests."
      - "Resolvers contain no inline SQL."
      - "Query complexity/depth limits cover the new nested fields."
      - "HNSW build parameters (m/ef_construction) are reviewed against actual corpus size before the embedding/similarity fields ship, not left on pgvector defaults."
    dependencies: ["BL-016", "BL-009"]
    related_decisions: ["D-001", "D-002", "D-008"]
    references:
      - "src/doc_ray/entrypoints/api/query.py"
      - "src/doc_ray/entrypoints/api/types.py"
      - "src/doc_ray/adapters/persistence_read.py"
      - "src/doc_ray/adapters/persistence_layers_read.py"
      - "src/doc_ray/entrypoints/api/layer_types.py"
      - "db/migrations/012_embeddings.sql"
      - "db/migrations/021_canonical.sql"
    owner:        "concurrent"
    source:       "docs/doc_ray_improvement_proposal.md BL-017 — API surface did not expose persisted NLP layers, 2026-07-04. Completed 2026-07-05 for baseline annotation runs, tokens/morphology, dependency syntax, chunks, coreference chains, and entity links through bounded GraphQL fields backed by persistence_layers_read; embedding/similarity reads remain deliberately postponed per the item text and HNSW addendum."
    tags:         ["graphql", "api", "nlp", "read-model", "pgvector", "hnsw"]

