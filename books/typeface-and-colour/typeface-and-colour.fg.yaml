      text: PLATE 40
    - box:
      - 152
      - 764
      - 574
      - 54
      style: cap
      type: text
      text: The same six values twice. Hue has no natural order and not every eye
        receives it; tone has both. Encode with tone, position and label — then let
        hue sing over a structure that stands without it.
    - box:
      - 68
      - 842
      - 658
      - 116
      style: body
      type: text
      text: 'This is not a plea for beige. It is Chevreul''s own division of labour:
        hue for character, tone for structure. The page that observes it loses nothing
        when photocopied, projected badly, or read by the one reader in twelve — roughly
        one man in twelve — whose red and green are neighbours (see Sources).'
