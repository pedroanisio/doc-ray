  - id:          "BL-063"
    title:        "Paginate the main document list and add filter arguments to the documents query"
    summary:      "The main document list and /search render unbounded/hard-capped results with no pager, and the documents GraphQL query takes no doc_type/status/source/date/tag filter arguments, even though keyset pagination (BL-009/D-008) already shipped for other fields."
