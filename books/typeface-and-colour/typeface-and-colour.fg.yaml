      type: text
      text: 3.1 · THE THIRD CRAFT
    - box:
      - 68
      - 122
      - 658
      - 74
      style: h2
      type: text
      text: Pure design
    - box:
      - 68
      - 174
      - 658
      - 60
      style: lead
      type: text
      text: Letters and colours are materials. Arrangement is what is done with them
        — and it, too, has a grammar.
    - box:
      - 68
      - 248
      - 64
      - 2
      type: rect
      fill: rubric
    - box:
      - 68
      - 272
      - 658
      - 150
      style: body
      type: text
      text: The grammar came out of Harvard. Denman W. Ross, lecturing on the theory
        of design at the turn of the century, proposed that composition could be studied
        apart from any subject — as pure design. His student and colleague Ernest
        Batchelder carried the theory to working craftsmen through a printers' trade
        journal, The Inland Printer, and gathered the articles into a book in 1904.
        It is the most practical statement of the theory ever printed, and he refused
        even to copyright it.
    - box:
      - 68
      - 444
      - 658
      - 200
      style: quote
      type: text
      text: “Pure design is the composition of tones, measures, shapes, for the sake
        of rhythm, balance, harmony, the principles of order and beauty.”
    - box:
      - 68
      - 564
      - 658
      - 14
      style: attr
      type: text
      text: BATCHELDER, THE PRINCIPLES OF DESIGN (1904), AFTER ROSS
    - box:
      - 68
      - 608
      - 658
      - 150
      style: body
      type: text
      text: 'Everything in this chapter unpacks that sentence. Three terms — tones
        (light and dark), measures (large and small), shapes (this form and that)
        — are all a composition contains. Three principles — rhythm, balance, harmony
        — are all that can be done well with them. The scheme sounds austere; in use
        it is the opposite. It gives the designer what Johnston''s table gave the
        letterer and Chevreul''s law gave the colourist: a small set of names for
        what the eye already knows.'
