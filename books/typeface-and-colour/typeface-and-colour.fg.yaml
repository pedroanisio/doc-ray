- mode: page
  id: preface
  canvas:
    size:
    - 794.0
    - 1123.0
    units: px
  rendering:
    coordinate_mode: absolute
  layers:
  - id: bg
    objects:
    - box:
      - 0
      - 0
      - 794
      - 1123
      type: rect
      fill: paper
  - id: main
    objects:
    - box:
      - 0
      - 1073
      - 794
      - 14
      style: folioC
      type: text
      text: '6'
    - box:
      - 68
      - 108
      - 658
      - 20
      style: kicker
      type: text
      text: PREFACE
    - box:
      - 68
      - 146
      - 658
      - 60
      style: h1
      type: text
      text: The four crafts
    - box:
      - 68
      - 222
      - 64
      - 2
      type: rect
      fill: rubric
    - box:
      - 68
      - 252
      - 658
      - 156
      style: lead
      type: text
      text: A page works on the reader more than once. Through its letters — the shapes
        that carry the words; through its colour — the ground, the ink, whatever third
        voice the designer admits; and through its arrangement — the quiet mechanics
        of where everything sits. These crafts are usually taught apart. This book
        holds them together.
    - box:
      - 68
      - 424
      - 658
      - 168
      style: body
      type: text
      text: Chapter I is about the letter. Its guide is Edward Johnston, the scribe
        who, in 1906, reduced good lettering to a short table of virtues — readableness
        first, then fitness for use, then beauty and character — and showed that every
        typeface is the record of a tool moving over a surface. Chapter II is about
        colour, and its guide is Michel-Eugène Chevreul, the chemist of the Gobelins
        dye-works, who found that colours change one another merely by standing side
        by side, and derived from that single law a complete grammar of harmony and
        contrast.
    - box:
      - 68
      - 608
      - 658
      - 168
      style: body
      type: text
      text: 'Chapter III is about arrangement, and its guide is Ernest Batchelder,
        who carried Denman Ross''s Harvard theory of pure design to working craftsmen
        through the pages of a printers'' trade journal: composition reduced to three
        terms — tones, measures, shapes — governed by three principles — rhythm, balance,
        harmony. Chapter IV returns to Chevreul and follows the law out of the laboratory,
        into the room, the garden, the wardrobe and the printing house — and re-measures
        his oldest experiment with modern instruments.'
    - box:
      - 68
      - 800
      - 658
      - 130
      style: body
      type: text
      text: 'The first two chapters teach the materials; the last two teach their
        government and their use. Read the plates as slowly as the prose. They are
        drawn, not decorated: each one exists to make a claim visible, and several
        exist to test one.'
