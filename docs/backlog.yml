      layer is a first-class architectural requirement, not post-processing. Build
      a shared validation stage — schema conformance, span-alignment, and
      confidence/consistency checks — that every ML/LLM annotator output passes
      before it is written. Still unbuilt as of 2026-07-04: no `verif*` symbol
      exists anywhere under `application/` or `domain/`, and BL-019 (annotation
      output validation) now depends on this item too.
    category:     "nlp"
    type:         "infra"
    status:       "done"
    complexity:   "M"
    priority:     "high"
    rationale:    "CLAUDE.md declares absence of LLM-output verification an architectural omission; it must exist before ML annotators land."
