      type: rect
      fill: paper
  - id: main
    objects:
    - box:
      - 68
      - 640
      - 658
      - 60
      style: bodyS
      type: text
      text: 'This book is a study, in words and drawn plates, of two old crafts: the
        design of letters and the ordering of colour.'
    - box:
      - 68
      - 710
      - 658
      - 130
      style: bodyS
      type: text
      text: Chapter I is built on Edward Johnston's Writing & Illuminating, & Lettering
        (London, 1906), the foundation text of modern lettering education. Chapter
        II is built on M. E. Chevreul's law of the simultaneous contrast of colours
        (Paris, 1839, in its English translations). Direct quotations are attributed
        in place; everything else is the author's reading of those works.
    - box:
      - 68
      - 854
      - 658
      - 40
      style: cap
      type: text
      text: 'Quotations are verbatim from the editions named on the Sources page;
        omissions are marked by ellipses and editorial insertions by brackets. Where
        nineteenth-century spelling differs from modern use, the original is kept.
        Interpretations, orderings and all drawn plates are the author''s: every plate
        is an original drawing — either a demonstration devised for this book or a
        reconstruction after its named source.'
    - box:
      - 68
      - 932
      - 658
      - 52
      style:
        class: cap
        font_size: 10.5
      type: text
      text: Written as a visual primer for working designers — neither a history nor
        a complete manual. Set in EB Garamond, with Inter for annotation and Fira
        Mono for figures; exact designers and licences for every specimen face are
        tabled with the List of Plates.
    - box:
      - 68
      - 992
      - 658
      - 20
      style:
        class: cap
        font_size: 10.5
      type: text
      text: All plates are drawn, not photographed. Composed by Claude (Fable 5).
    - box:
      - 68
      - 1016
      - 658
      - 18
      style:
        class: cap
        font_size: 10.5
      type: text
      text: Second edition — four chapters (build 2026-07-02) — July 2026.
