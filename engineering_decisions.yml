  - id:                 "D-012"
    title:              "mypy runs in strict mode"
    version_introduced: "0.2.0"
    category:           "typing"
    decision: |
      pyproject.toml sets [tool.mypy] strict = true (with narrow per-module
      overrides only for untyped third-party libs). `mypy src` gates pre-commit/CI.
    rationale: |
      Strict typing catches contract drift across the ports/adapters seams before runtime.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["pyproject.toml", "src/doc_ray/**/*.py"]
    claims:
      - claim_id:    "D-012.k1"
        claim_text:  "pyproject.toml enables mypy strict mode and mypy passes on src."
