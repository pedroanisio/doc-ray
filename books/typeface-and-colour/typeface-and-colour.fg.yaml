    - box:
      - 218
      - 502
      - 508
      - 78
      style: bodyS
      type: text
      text: “the assemblage of tones of the same colour, thus modified. The pure colour
        is the normal tone of the scale.”
    - box:
      - 68
      - 600
      - 8
      - 54
      type: rect
      fill: rubric
    - box:
      - 94
      - 596
      - 110
      - 16
