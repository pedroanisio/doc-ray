  - id:                 "D-010"
    title:              "Access control via Postgres RLS; API sets the principal"
    version_introduced: "0.1.0"
    category:           "security"
    decision: |
      Document-level authorization is enforced in the database via Row-Level
      Security (db/migrations/018_rbac.sql): principals/roles/permissions/document_acl.
      The trusted pipeline/worker uses the superuser role (bypasses RLS). The API
      authenticates inbound bearer/API-token requests to a principal, drops every
      HTTP request to the non-superuser docray_api role, and sets
      `app.principal_id` only for authenticated principals. Anonymous requests,
      when enabled for local/single-operator use, stay RLS-scoped with no
      principal id instead of remaining on the superuser connection. App-layer
      auth remains the federation slot (bearer/OIDC -> principal).
    rationale: |
      Enforcing authorization at the data layer is stronger than app-layer checks
      and cannot be bypassed by a new read path.
    decision_status:    "accepted"
    decision_date:      "2026-07-01"
    owner:              ["pedroanisio@faz.ai"]
    scope_path:         ["db/migrations/018_rbac.sql", "src/doc_ray/entrypoints/api/security.py"]
    claims:
      - claim_id:    "D-010.k1"
        claim_text:  "Document-scoped tables enforce access with Postgres RLS; the API binds the principal."
        auditable:   true
        status:      "populated"
        declared_checks_count: 4
        checks:
