      style: body
      type: text
      text: 'Johnston defined the essential forms as “the necessary parts” — the structural
        plan of an alphabet. Draw the Roman capitals in single pencil strokes, as
        a child does learning its letters, and you have them: a circle for O, two
        slopes and a bar for A, posts and a lintel for H. These skeletons are not
        any one typeface. They are what every typeface must contain to remain that
        letter.'
    - box:
      - 68
      - 444
      - 658
      - 128
      style: body
      type: text
      text: 'The claim beneath this is quietly radical: the essential form of a letter
        is “a purely abstract form, the common property of every rational age and
        country,” and its characterisation — its weight, contrast, serifs, its voice
        — “is mainly the product of tools and materials.” Design, in other words,
        is what happens between the skeleton and the surface.'
