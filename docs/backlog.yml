      confidence/consistency checks — that every ML/LLM annotator output passes
      before it is written. Still unbuilt as of 2026-07-04: no `verif*` symbol
      exists anywhere under `application/` or `domain/`, and BL-019 (annotation
      output validation) now depends on this item too.
