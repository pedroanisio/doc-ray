# System of record for architectural & operational decisions. Validated by
# the vendored SHACL/YAML toolchain under engineering/schema/:
#   python engineering/schema/scripts/validate_decisions.py engineering_decisions.yml
#   python engineering/schema/scripts/yml_to_rdf.py engineering_decisions.yml > /tmp/ed.ttl
#   pyshacl -s engineering/schema/statics/ttl/engineering_decisions_record_shacl.ttl \
#           -s engineering/schema/statics/ttl/engineering_decisions_consequences_shacl.ttl \
#           -s engineering/schema/statics/ttl/engineering_decisions_implementation_shacl.ttl \
