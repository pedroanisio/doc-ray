  - id:          "BL-131"
    title:        "Webapp collection writes silently rolled back — created collections vanished after the redirect"
    summary:      "Operator-reported: creating a collection redirected to /collections/<id> which rendered 'Collection not found'. The BL-057 collection routes write directly through the webapp's request connection (unlike every other webapp write, which goes through the GraphQL API), get_conn() opened psycopg without autocommit, and request teardown closed the connection — rolling back the open implicit transaction. INSERT ... RETURNING id fed the redirect from inside the doomed transaction, so creation looked successful while persisting nothing. Member add/remove suffered identically."
    description: |
      Fixed: the request-scoped connection is now autocommit=True, matching
      every other psycopg connection in the codebase (worker, CLIs, test
      harness); reads are unaffected and each direct write commits at
      execute time.

      Test-harness lesson recorded for posterity: the webapp suite's
      ``client`` fixture monkeypatches ``q``/``q1`` wholesale, so the
      existing collection tests asserted SQL strings against fakes and could
      never observe transaction semantics. The regression test added here
      drives the real request/connection lifecycle (create in one request,
      read back in a second) and was verified to fail with the fix reverted.
    category:     "webapp"
    type:         "bug"
    status:       "done"
    complexity:   "XS"
    priority:     "high"
    rationale:    "A write path that reports success and persists nothing is worse than an error: the operator loses work with no signal. Every direct-write webapp route was affected."
    acceptance_criteria:
      - "Creating a collection in one request and fetching its detail page in a second request returns 200 with the collection rendered."
      - "The regression test exercises the real connection lifecycle (no q/q1 fakes) and fails when autocommit is removed."
    dependencies: []
    references:
      - "webapp/app.py"
      - "tests/test_webapp.py"
    owner:        "shared"
    source:       "Operator bug report 2026-07-12 (screenshot: Collection not found after create). Added and completed the same session."
    tags:         ["webapp", "collections", "transactions", "bug"]

  - id:          "BL-132"
    title:        "Deploy-kills burned job attempts: long annotate jobs permanently failed by consecutive fleet deploys"
    summary:      "Operator-reported via pipeline_health_check: 4 annotate jobs (8k-15k-sentence books, 45-90+ min runs) failed with 'reclaimed: stale heartbeat, attempts exhausted'. Each fleet deploy SIGTERMs the worker; the graceful drain cannot finish a long job inside stop_grace_period (120s), so Docker SIGKILLs it, the reaper reclaims the orphan, and the claim-time attempt increment counts the deploy as a job failure. Three deploys during a job's lifetime exhausted max_attempts without the job ever failing on its own."
    description: |
      Fixed (TDD, migrations 072/073, schema 1.22.0): on SIGTERM the worker's
      heartbeat thread stamps the in-flight job's new
      ``jobs.drain_requested_at`` column (``queue.request_drain``, called
      once). ``reap_stale`` now releases a stale job carrying the stamp back
      to 'queued' with the claim-time attempt refunded
      (``GREATEST(attempts - 1, 0)``, error 'released: worker shutdown
      during drain') and never fails it for attempt exhaustion — a deploy
      is an operational event, not a job failure. A crash without the stamp
      still spends its attempt, preserving the poison-message bound (D-004).

      Claiming a job now also clears the previous attempt's
      progress_current/progress_total/progress_stage and any stale drain
      stamp, so a retry no longer renders the dead attempt's percentage as
      its own (the "frozen at 43%" symptom).
    category:     "ops"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "Attempts exist to bound poison messages, not to count deploys. In a continuously-deployed environment any job longer than the deploy interval times max_attempts is guaranteed to fail permanently despite doing nothing wrong — a livelock between the fleet and the pipeline."
    acceptance_criteria:
      - "A running job whose worker stamped a drain request and then went heartbeat-stale is requeued with its claim-time attempt refunded, even at attempts == max_attempts."
      - "A stale job without the drain stamp behaves exactly as before: requeue spending the attempt, terminal failure once exhausted."
      - "run_once's heartbeat thread stamps the drain request exactly once when the worker's shutdown event is set, and never when it is not."
      - "claim() resets progress fields and the drain stamp so retries start from a clean progress row."
    dependencies: []
    references:
      - "db/migrations/072_jobs_drain_requested_at.sql"
      - "db/migrations/073_schema_version_1_22_0.sql"
      - "src/doc_ray/adapters/queue_postgres.py"
      - "src/doc_ray/application/jobs.py"
      - "src/doc_ray/entrypoints/worker.py"
      - "src/doc_ray/tests/test_queue.py"
      - "src/doc_ray/tests/test_jobs_worker.py"
    owner:        "shared"
    source:       "Operator health-check triage 2026-07-12 (4 books permanently failed, LLVM book on final attempt). Root cause: worker.py graceful drain + 120s stop grace + claim-time attempt increment. Added and completed the same session."
    tags:         ["worker", "queue", "reliability", "deploys", "bug"]

  - id:          "BL-133"
    title:        "Span-geometry backfill was O(spans x layout rows): book annotation ran for hours and hit the execution timeout"
    summary:      "Root cause of the 2026-07-12 'Registering N annotation spans' stalls: span_geometry_from_layout_rows scanned every layout row for every span (171k spans x a 303-page book's rows = tens of billions of pure-Python iterations), and the caller's JOIN against _span_stage emitted one duplicate copy of each layout row per overlapping staged span — inflating the row list by orders of magnitude and skewing the per-page overlap vote toward duplicated partial rows."
    description: |
      Fixed (TDD): rows are deduplicated and sorted once; each span visits
      only its bisected candidate window (binary search on sorted starts,
      plus a nondecreasing running-max-of-ends array to bound the window from
      the left) — O((n+m) log m). The caller now uses EXISTS instead of the
      row-multiplying JOIN. Regression tests: duplicate rows must not flip
      the page vote (red before the fix), equivalence against the original
      scan on randomized duplicate-free input, and a 12k x 12k wall-clock
      guard (44.6s before, 0.1s after; 5s budget).

      Observed impact: the color-theory book (b5d35171, 4867 sentences,
      171,494 spans) spent 34+ minutes inside phase 5/12 across attempts and
      one book was terminally failed at exactly the 3600s execution timeout
      inside this loop.
    category:     "nlp"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "Every pipeline reliability symptom chased on 2026-07-12 (timeouts, deploy-kill livelock exposure, hours-long span registration) traces back to this hot loop: jobs that should take minutes held worker slots for hours, magnifying every other failure mode."
    acceptance_criteria:
      - "span_geometry_from_layout_rows produces identical results to the original full scan on duplicate-free input."
      - "Duplicate layout rows cannot change which page wins the overlap vote."
      - "12k spans x 12k rows completes within a 5s test budget (previously 44.6s)."
      - "_update_span_geometry_from_layout fetches each overlapping layout row exactly once (EXISTS, not JOIN)."
    dependencies: []
    references:
      - "src/doc_ray/adapters/persistence.py"
      - "src/doc_ray/tests/test_span_geometry.py"
    owner:        "shared"
    source:       "Operator directive 2026-07-12: 'fully fix the ingestion of document b5d35171...' + 'fix root causes, and add regression tests when needed.' Root-caused from the JobExecutionTimeout traceback frame (persistence.py:134) and 34-minute phase-5 stalls."
    tags:         ["nlp", "performance", "extraction", "geometry", "bug"]

  - id:          "BL-134"
    title:        "Pipeline polish: janitor reap, attempt-relative started_at, reap progress hygiene"
    summary:      "Four root-cause fixes from the 2026-07-12 incident review, each regression-tested: (1) reap_stale only ran between jobs, so with all workers busy an orphaned job waited 45+ minutes for recovery; (2) claim preserved the first attempt's started_at, so retry ETA/runtime read hours of elapsed time at zero progress; (3) reap left a dead attempt's progress on queued rows; (4) the staged-span layout filter (JOIN, later EXISTS) against the unindexed _span_stage temp table degenerates to an O(rows x spans) nested loop inside the planner."
    description: |
      Janitor: a daemon thread in the worker reaps every WORKER_REAP_SECONDS
      (default 30) on fresh short-lived connections, surviving any tick
      error, so stale jobs are released/reclaimed promptly even while every
      worker slot is occupied by hours-long handlers.

      Claim now stamps started_at = now() (attempt-relative); release and
      crash-requeue reap branches clear progress fields (terminally failed
      rows keep theirs for forensics); _update_span_geometry_from_layout
      fetches the document's layout runs once (bounded by document size) and
      lets the BL-133 log-linear geometry pass discard non-overlapping rows.
    category:     "ops"
    type:         "tech-debt"
    status:       "done"
    complexity:   "S"
    priority:     "high"
    rationale:    "Each item is a residual sharp edge from the day's incidents: recovery latency, misleading operator-facing ETAs, stale progress display, and a re-introducible quadratic in SQL form."
    acceptance_criteria:
      - "A stale job is reaped within ~WORKER_REAP_SECONDS while the worker's claim loop is blocked inside a long handler, and janitor tick errors never crash the process."
      - "A re-claimed job's started_at reflects the current attempt."
      - "Released and crash-requeued rows carry no progress fields while queued."
      - "The layout fetch contains no correlated predicate against _span_stage."
    dependencies: ["BL-132", "BL-133"]
