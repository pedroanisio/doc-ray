      webapp/templates/review.html renders each proposal as an <article> with a
      single unlabelled checkbox and one shared Approve/Reject pair per page;
      webapp/review_web.py fixes PAGE_SIZE = 25 and the GraphQL query hard-codes
      limit: 25. There is no select-all, no shift-range selection, no keyboard
      affordance, and no way to act on the queue as a set.

      Measured 2026-07-29 on the production corpus: 6,122 caption rows, of which
      5,851 are status='review'. At PAGE_SIZE 25 that is 234 pages.

      TC-DXP-001 CLM-DXP-DX-CHOICE-PARALYSIS names this shape directly: too many
      options presented at once with no cue as to which matters. CLM-S5 holds that
      decision time rises logarithmically with option count, and CLM-S4 that users
      arrive with expectations built from every other product they use — bulk
      selection is the established convention for any inbox-shaped surface.
      Note this is a workflow defect, not a styling one: a visually perfect page
      still leaves 5,851 individual decisions.
