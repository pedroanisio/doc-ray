  - id:          "BL-155"
    title:        "Graceful shutdown for the migration runner: cancel in-flight statements instead of SIGKILL (exit 137)"
    summary:      "Stopping the stack while a long backfill (e.g. 040_chunk_surface_backfill.sql) was running escalated SIGTERM to SIGKILL after Docker's ~10s default grace window — the alarming triple `exit 137` on api/worker/backup-scheduler. The migration runner now cancels the in-flight statement on SIGTERM/SIGINT and exits promptly (128+signal); postgres and migrate declare an explicit stop_grace_period."
    description: |
      Two cooperating guards close the gap. (1) The `migrate` entrypoint runs the
      apply on a worker thread while the main thread stays responsive to signals,
      and its SIGTERM/SIGINT handler cancels the in-flight statement through the
      live connection (a new adapters/migrate.apply_migrations `on_connection`
      hook), so the runner unwinds and exits with 128+signal (130/143) instead of
      being SIGKILLed. The transaction rolls back and the idempotent, self-recording
      migration resumes on the next start. (2) `postgres` (300s) and `migrate`
      (120s) declare an explicit stop_grace_period so Postgres can finish its
      shutdown checkpoint and the runner can unwind before Docker escalates to
      SIGKILL. This is infrastructure/runtime behavior — there is no GraphQL/MCP
      surface for it; the CLI reference documents the exit codes.
    category:     "ops"
    type:         "bug"
    status:       "done"
    complexity:   "S"
    priority:     "medium"
    rationale:    "A routine `docker compose down` mid-migration must not hard-kill the runner: the incident was safe only because 040 is re-runnable, but any future non-restart-safe migration is at risk of being killed mid-statement, and the operator sees three alarming exit-137 lines with nothing indicating recovery is automatic."
    acceptance_criteria:
      - "SIGTERM/SIGINT during an in-flight migration cancels the statement and exits 128+signal (130/143), never SIGKILL (137)."
      - "postgres and migrate declare an explicit stop_grace_period sized to the shutdown checkpoint / cancel-and-unwind."
      - "A genuine unreachable-database run still exits 2; --dry-run is unaffected."
      - "Every migration remains idempotent and self-recording, so a canceled run resumes on the next start."
      - "TDD covers the handler wiring, exit codes, the on_connection hook, and a live subprocess reproduction that cancels a real pg_sleep migration promptly."
    references:
      - "src/doc_ray/entrypoints/migrate.py"
      - "src/doc_ray/adapters/migrate.py"
      - "docker-compose.yml"
      - "docs/public/reference/cli.md"
    owner:        "shared"
    source:       "GitHub issue #4; implemented with strict TDD (Claude Opus 4.8 (1M context) via Claude Code)."
    tags:         ["ops", "docker", "migrations", "reliability", "bug"]

  - id:          "BL-156"
    title:        "Admin Console operator-health panel: fix the JSON-parse misdiagnosis, contract drift, and misleading token copy"
    summary:      "The panel's 'Unexpected token <, <!doctype …' was a JSON.parse of nginx's SPA-shell HTML (a routing failure), but the UI blamed a missing DOCRAY_OPERATOR_HEALTH_TOKEN for every failure. Added a content-type guard in client.rest(), aligned the OperatorHealth type + dashboard to the operator-health.v1 contract, made errors cause-specific, and added contract/routing regression guards."
    description: |
      Client-side (TDD, admin-console vitest): (1) client.rest() guards the
      response content-type and raises an actionable, routing-pointed ApiError
      instead of a cryptic SyntaxError when a 2xx body is HTML (SPA-shell misroute);
      (2) the OperatorHealth type and DashboardPage follow operator-health.v1 —
      corpus.totals metrics, corpus.jobs spool, and issues (detail, not message)
      from corpus.issues + database.issues — so the panel renders real data;
      (3) fetchOperatorHealth maps a 404 to the token/authorization message and lets
      routing/parse/5xx errors keep their own message, and the dashboard drops the
      blanket token suffix. Regression guards (Python, runs in the Docker suite) tie
      the TS OperatorHealth type to webapp/health_contract.py and assert the nginx
      `location /operator/` block proxies to WEBAPP_UPSTREAM. Deployment routing
      (defect 1) is environment-side; the guard keeps the template from silently
      losing the proxy block.
    category:     "webapp"
    type:         "bug"
    status:       "done"
    complexity:   "M"
    priority:     "medium"
    rationale:    "The operator dashboard is the console's headline screen; a misdiagnosis that blames a token for a routing/contract failure sends operators down the wrong path, and the contract drift meant the panel rendered empty even once routing was fixed. Nothing guarded the REST OperatorHealth type against the v1 contract, so the drift was invisible to CI."
    acceptance_criteria:
      - "client.rest() raises an actionable ApiError (never a SyntaxError) when a 2xx response is not JSON, naming the content-type and the proxy."
      - "OperatorHealth type + dashboard render operator-health.v1: corpus.totals, corpus.jobs, and issues.detail from corpus and database."
      - "Errors are cause-specific: 404 -> token/session, content-type -> routing, 5xx -> webapp; no blanket token suffix."
      - "Regression guards tie the TS type to health_contract.py and assert the nginx /operator/ -> WEBAPP_UPSTREAM proxy block."
      - "TDD across client.test.ts, ops.test.ts, DashboardPage.test.tsx, and the Python contract guards; vitest + typecheck green."
    references:
