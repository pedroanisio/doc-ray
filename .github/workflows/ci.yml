name: ci

# Quality gates (engineering decisions D-011..D-016). Lint/type/LOC/decisions
# run without services; the coverage gate runs against ephemeral Postgres + MinIO.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"
      - name: uv.lock drift gate (BL-114)
        run: uv lock --check
      # Runtime set from the committed lock (BL-114); dev tooling from
      # requirements-dev.txt on top. Both target setup-python's interpreter so
      # every later step keeps calling ruff/mypy/pytest unchanged.
      - name: Install dependencies (locked)
        run: |
          export UV_PROJECT_ENVIRONMENT="$(python -c 'import sys; print(sys.prefix)')"
          uv sync --locked --no-install-project --no-dev
          uv pip install --system -r requirements-dev.txt
      - name: Dependency vulnerability scan (BL-113)
        run: |
          uv pip install --system pip-audit
          pip-audit --requirement requirements.txt --requirement requirements-dev.txt --strict
      - name: Ruff lint (D-011)
        run: ruff check src scripts webapp
      - name: Ruff format check (D-011)
        run: ruff format --check src scripts webapp
      - name: Mypy strict (D-012)
        run: mypy src
      - name: Net-LOC cap (D-015)
        run: python scripts/check_file_size.py src/doc_ray webapp scripts
      - name: Tracked-imports gate (no committed→uncommitted import)
        run: python scripts/check_tracked_imports.py
      - name: Doc-Ray GraphQL skill drift gate
        run: python3 skills/doc-ray-graphql-maximizer/scripts/check_doc_ray_drift.py
      - name: Public documentation drift gate
        run: python scripts/check_public_docs.py
      - name: Repository Markdown link gate
        run: python scripts/check_doc_links.py
      - name: Documentation artifact checksum gate
        run: python scripts/check_doc_artifacts.py
      - name: Documentation quarantine ignore-policy gate
        run: python scripts/check_doc_quarantine_policy.py
      - name: Canonical version and annotated Git tag gate
        run: python scripts/check_release_state.py
      - name: Validate engineering decisions (D-016)
        run: |
          python engineering/schema/scripts/validate_decisions.py engineering_decisions.yml
          python engineering/schema/scripts/yml_to_rdf.py engineering_decisions.yml > /tmp/ed.ttl
          python engineering/schema/scripts/shacl_validate.py /tmp/ed.ttl
      - name: Build production image for SBOM (BL-113)
        run: docker build -t doc-ray:${{ github.sha }} .
      - name: Generate production image SBOM (BL-113)
        uses: anchore/sbom-action@v0
        with:
          image: doc-ray:${{ github.sha }}
          format: cyclonedx-json
          output-file: doc-ray-image-sbom.cdx.json
      - name: Upload production image SBOM (BL-113)
        uses: actions/upload-artifact@v7
        with:
          name: doc-ray-image-sbom
          path: doc-ray-image-sbom.cdx.json

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docray
          POSTGRES_PASSWORD: docray
          POSTGRES_DB: docray
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docray -d docray"
          --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgresql://docray:docray@localhost:5432/docray
      S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"
      # Same locked install as the static job (BL-114).
      - name: Install dependencies (locked)
        run: |
          export UV_PROJECT_ENVIRONMENT="$(python -c 'import sys; print(sys.prefix)')"
          uv sync --locked --no-install-project --no-dev
          uv pip install --system -r requirements-dev.txt
      - name: Apply migrations
        run: python -m doc_ray.entrypoints.migrate || echo "migration runner not yet present (pre-Phase-1)"
      - name: DATABASE.md drift gate (BL-047)
        run: python scripts/gen_data_dictionary.py --check
      - name: Pytest with coverage (D-013)
        run: pytest --cov=doc_ray --cov-fail-under=90 tests src/doc_ray/tests -q
