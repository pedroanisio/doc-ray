      - 74
      style: h2
      type: text
      text: Where application began
    - box:
      - 68
      - 174
      - 658
      - 60
      style: lead
      type: text
      text: The most consequential quality complaint in the history of design was
        filed against a dye vat that was innocent.
    - box:
      - 68
      - 248
      - 64
      - 2
      type: rect
      fill: rubric
    - box:
      - 68
      - 272
      - 658
      - 170
      style: body
      type: text
      text: 'Chapter II told the story''s first half: weavers at the Gobelins manufactory
        reported that the black yarns were feeble beside the blues, and Chevreul the
        chemist found the dyes beyond reproach. The defect was optical — every colour
        tints its neighbour with its own complement — and the law of simultaneous
        contrast followed. This chapter is the second half: what Chevreul did next.
        Rather than file the law away as science, he spent five hundred pages walking
        it through every trade that puts one colour beside another.'
    - box:
      - 68
      - 464
      - 658
      - 130
      style: body
      type: text
      text: 'His own inventory of the territory: “I have thus been led to extend it
        to the arts of tapestry” — and onward through carpets, dress, gardens, apartments,
        painting and printing. The pattern is always the same, and it is the pattern
        of this chapter: the material is blameless; the neighbourhood is responsible;
        therefore design the neighbourhood.'
    - box:
      - 68
      - 616
      - 658
      - 90
      style: body
      type: text
      text: Read that way, Chevreul is not a colour theorist at all. He is the first
        design reviewer — the first professional to be handed a defect report and
        to locate the bug in perception rather than production.
